<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0c12">
<!-- Add to Home Screen. Android reads the manifest; iOS reads these three and the
     apple-touch-icon, and ignores the manifest entirely. Both want real files at
     real URLs, so all of it is inert for a page opened from a Downloads folder —
     see docs/ON-A-PHONE.md, which is about the served case. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Adventure">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Our Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking: if the font never arrives the fallback stack is fine. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body>

<div id="app">
  <!-- Creator Mode uses these two; they stay empty (and hidden) while you play. -->
  <div id="mode-strip" hidden></div>

  <main id="stage">
    <div id="screen">
      <canvas id="game-canvas" aria-label="Game screen"></canvas>
      <div id="chapter" class="overlay" hidden></div>
      <div id="dialogue" class="overlay" hidden></div>
      <div id="choice" class="overlay" hidden></div>
      <div id="pause-menu" class="overlay" hidden></div>
      <div id="toast" class="overlay" hidden></div>
      <div id="screen-title" class="overlay" hidden></div>
    </div>
    <div id="controls" class="kit-controls"></div>
  </main>

  <div id="editor" hidden></div>
</div>

<!-- The single-file build writes the world in here; empty means "use the content files". -->
<script id="project-data" type="application/json"></script>

<!-- Kit core (load order: docs/KIT-API.md) -->
<script src="js/kit/core/util.js"></script>
<script src="js/kit/core/events.js"></script>
<script src="js/kit/core/rng.js"></script>
<script src="js/kit/core/registry.js"></script>
<script src="js/kit/core/schema.js"></script>
<script src="js/kit/core/registries.js"></script>
<script src="js/kit/core/modules.js"></script>
<script src="js/kit/core/pixels.js"></script>
<script src="js/kit/core/assets.js"></script>
<script src="js/kit/core/input.js"></script>
<script src="js/kit/core/audio.js"></script>
<script src="js/kit/core/lang.js"></script>
<script src="js/kit/core/look.js"></script>
<script src="js/kit/ui/presets.js"></script>
<script src="js/kit/core/storage.js"></script>

<!-- World (document/project/tiles first: the script layer validates against them) -->
<script src="js/kit/world/document.js"></script>
<script src="js/kit/world/project.js"></script>
<script src="js/kit/world/tiles.js"></script>
<script src="js/kit/world/blueprints.js"></script>
<script src="js/kit/world/cast.js"></script>
<script src="js/kit/world/log.js"></script>
<script src="js/kit/world/rules.js"></script>
<script src="js/kit/world/timeline.js"></script>

<!-- Script language -->
<script src="js/kit/script/text.js"></script>
<script src="js/kit/script/conditions.js"></script>
<script src="js/kit/script/commands.js"></script>
<script src="js/kit/script/screenplay.js"></script>
<script src="js/kit/script/interpreter.js"></script>

<!-- The live world needs the script layer above it -->
<script src="js/kit/world/map.js"></script>
<script src="js/kit/world/entities.js"></script>
<script src="js/kit/world/world.js"></script>
<script src="js/kit/systems/index.js"></script>

<!-- Importers: outside tools -> Kit content (Creator Mode's Import panel; docs/IMPORTING.md).
     They are pure and self-contained, so they may load any time after the world. -->
<script src="js/kit/import/tiled.js"></script>
<script src="js/kit/import/rpgmaker.js"></script>
<script src="js/kit/import/aseprite.js"></script>
<script src="js/kit/import/image.js"></script>
<script src="js/kit/import/merge.js"></script>

<!-- Runtime UI -->
<script src="js/kit/render/atmosphere.js"></script>
<script src="js/kit/render/text-canvas.js"></script>
<script src="js/kit/render/renderer.js"></script>
<script src="js/kit/scenes/stack.js"></script>
<script src="js/kit/ui/parts.js"></script>
<script src="js/kit/scenes/dialogue.js"></script>
<script src="js/kit/scenes/menu.js"></script>
<script src="js/kit/scenes/title.js"></script>
<script src="js/kit/scenes/start.js"></script>
<script src="js/kit/scenes/map.js"></script>
<script src="js/kit/game.js"></script>

<!-- Art (each file registers into the kit registries; missing art is drawn as a silhouette) -->
<script src="js/art/tiles.js"></script>
<script src="js/art/tiles-nature.js"></script>
<script src="js/art/tiles-town.js"></script>
<script src="js/art/tiles-interior.js"></script>
<script src="js/art/chars.js"></script>
<script src="js/art/chars-heroes.js"></script>
<script src="js/art/chars-placeholder.js"></script>

<!-- Pokémon data and portraits (the mons module will use these) -->
<script src="js/data/types.js"></script>
<script src="js/data/moves.js"></script>
<script src="js/data/pokemon.js"></script>
<script src="js/sprites/charizard.js"></script>
<script src="js/sprites/venusaur.js"></script>
<script src="js/sprites/machamp.js"></script>
<script src="js/sprites/jynx.js"></script>
<script src="js/sprites/electabuzz.js"></script>
<script src="js/sprites/jolteon.js"></script>
<script src="js/sprites/vaporeon.js"></script>
<script src="js/sprites/pikachu.js"></script>
<script src="js/sprites/butterfree.js"></script>
<script src="js/sprites/clefable.js"></script>
<script src="js/sprites/wigglytuff.js"></script>
<script src="js/sprites/ninetales.js"></script>
<script src="js/sprites/scyther.js"></script>
<script src="js/sprites/gengar.js"></script>
<script src="js/sprites/blastoise.js"></script>

<!-- Content: the demo world. If these files are missing the game still boots (blank project). -->
<script src="js/content/demo/assets.js"></script>
<script src="js/content/demo/project.js"></script>
<script src="js/content/demo/maps/home.js"></script>
<script src="js/content/demo/maps/garden.js"></script>
<script src="js/content/demo/maps/town.js"></script>
<script src="js/content/demo/maps/lab.js"></script>
<script src="js/content/demo/maps/route.js"></script>

<script src="js/kit/editor/ops.js"></script>
<script src="js/kit/editor/editor.js"></script>
<script src="js/kit/editor/tools.js"></script>
<script src="js/kit/editor/inspector.js"></script>
<script src="js/kit/editor/panels-map.js"></script>
<script src="js/kit/editor/panels-objects.js"></script>
<script src="js/kit/editor/script-editor.js"></script>
<script src="js/kit/editor/panels-writing.js"></script>
<script src="js/kit/editor/panels-project.js"></script>
<script src="js/kit/editor/panel-cast.js"></script>
<script src="js/kit/editor/integration.js"></script>
<!-- Modules (docs/MODULES.md). The demo enables mons and home
     (project.modules); bullet is loaded so a game can switch it on, and
     dungeon is left to games made with --modules dungeon. tools/load-modules.js
     loads the same files in the same order for the demo builder and the Node
     tests.

     They load BEFORE main.js so main.js still captures the whole page as
     KIT.PRISTINE_HTML (publish rebuilds the page from that). KIT.module comes
     from js/kit/core/modules.js, loaded above, so each manifest.js declares
     its module as it loads; boot activates the ones project.modules names. -->
<script src="js/modules/mons/rules.js"></script>
<script src="js/modules/mons/strings.js"></script>
<script src="js/modules/mons/art.js"></script>
<script src="js/modules/mons/actions.js"></script>
<script src="js/modules/mons/script.js"></script>
<script src="js/modules/mons/systems.js"></script>
<script src="js/modules/mons/scenes.js"></script>
<script src="js/modules/mons/essentials.js"></script>
<script src="js/modules/mons/region.js"></script>
<script src="js/modules/mons/panel.js"></script>
<script src="js/modules/mons/manifest.js"></script>

<!-- home: decorating, jobs, moods. rules.js first — manifest.js reads KIT.home at load.
     It works with or without mons; loading it second means its roster finds mons. -->
<script src="js/modules/home/rules.js"></script>
<script src="js/modules/home/register.js"></script>
<script src="js/modules/home/scenes.js"></script>
<script src="js/modules/home/panel.js"></script>
<script src="js/modules/home/manifest.js"></script>

<!-- A bullet-hell fight: proof that a real-time battle can be written against
     the public API alone. See js/modules/bullet/README.md. -->
<script src="js/modules/bullet/rules.js"></script>
<script src="js/modules/bullet/register.js"></script>
<script src="js/modules/bullet/manifest.js"></script>

<script src="js/main.js"></script>
</body>
</html>
