    instant: false,
    state() { return fxState; },
    reset() {
      tweens = [];
      fxState.fade.alpha = 0; fxState.tint.amount = 0; fxState.flash.alpha = 0;
      fxState.shake.left = 0; fxState.shake.x = 0; fxState.shake.y = 0;
      fxState.weather.kind = 'none'; fxState.weather.power = 0;
      pics.length = 0;
    },
    update(dt) {
      for (const tw of tweens.slice()) {
        if (tw.step(dt)) { tweens.splice(tweens.indexOf(tw), 1); if (tw.done) tw.done(); }
      }
      const sh = fxState.shake;
      if (sh.left > 0) {
        sh.left -= dt * 1000;
        const p = sh.power * 2;
        sh.x = (Math.random() * 2 - 1) * p;
        sh.y = (Math.random() * 2 - 1) * p;
        if (sh.left <= 0) { sh.x = 0; sh.y = 0; }
      }
      for (const p of pics.slice()) {
        if (!p.move) continue;
        p.move.t += dt * 1000;
        const k = Math.min(1, p.move.ms ? p.move.t / p.move.ms : 1);
        p.x = p.move.fromX + (p.move.toX - p.move.fromX) * k;
        p.y = p.move.fromY + (p.move.toY - p.move.fromY) * k;
        p.opacity = p.move.fromO + (p.move.toO - p.move.fromO) * k;
        if (k >= 1) { const done = p.move.done; p.move = null; if (done) done(); }
      }
    },

    fadeOut(o) { o = o || {}; fxState.fade.color = o.color || '#000000'; return tween(() => fxState.fade.alpha, (v) => { fxState.fade.alpha = v; }, 1, o.ms == null ? 400 : o.ms); },
    fadeIn(o) { o = o || {}; return tween(() => fxState.fade.alpha, (v) => { fxState.fade.alpha = v; }, 0, o.ms == null ? 400 : o.ms); },
    tint(o) { o = o || {}; fxState.tint.color = o.color || '#000000'; return tween(() => fxState.tint.amount, (v) => { fxState.tint.amount = v; }, o.amount == null ? 0 : o.amount, o.ms == null ? 400 : o.ms); },
    flash(o) {
      o = o || {};
      fxState.flash.color = o.color || '#ffffff';
      fxState.flash.alpha = reduceMotion() ? 0.35 : 0.85;
      return tween(() => fxState.flash.alpha, (v) => { fxState.flash.alpha = v; }, 0, o.ms == null ? 200 : o.ms);
    },
    shake(o) {
      o = o || {};
      const ms = o.ms == null ? 400 : o.ms;
      if (reduceMotion() || instant()) return Promise.resolve();
      fxState.shake.power = o.power || 3;
      fxState.shake.left = ms;
      return new Promise(res => setTimeout(res, ms));
    },
    weather(o) {
      o = o || {};
      fxState.weather.kind = reduceMotion() ? 'none' : (o.kind || 'none');
      fxState.weather.power = o.power == null ? 5 : o.power;
      return Promise.resolve();
    },

    // pictures (the pictureShow/Move/Erase commands)
    pictures() { return pics; },
    show(o) {
      o = o || {};
      FX.erase({ id: o.id });
      const p = { id: o.id, image: o.image, x: o.x || 0, y: o.y || 0, anchor: o.anchor || 'topLeft', opacity: o.opacity == null ? 1 : o.opacity, zoom: o.zoom || 2, move: null };
      if (typeof o.image === 'string' && /^(data:|https?:|\.\/|\/)/.test(o.image) && typeof Image !== 'undefined') {
        const img = new Image();
        img.onload = () => { p.imageEl = img; };
        img.src = o.image;
      }
      pics.push(p);
      return Promise.resolve(p);
    },
    move(o) {
      o = o || {};
      const p = pics.find(q => q.id === o.id);
      if (!p) return Promise.resolve();
      const ms = instant() ? 0 : (o.ms == null ? 400 : o.ms);
      return new Promise((resolve) => {
        p.move = { t: 0, ms, fromX: p.x, fromY: p.y, toX: o.x == null ? p.x : o.x, toY: o.y == null ? p.y : o.y,
          fromO: p.opacity, toO: o.opacity == null ? p.opacity : o.opacity, done: resolve };
        if (!ms) { p.x = p.move.toX; p.y = p.move.toY; p.opacity = p.move.toO; p.move = null; resolve(); }
        else if (o.wait === false) resolve();
      });
    },
    erase(o) {
      const id = o && o.id;
      for (let i = pics.length - 1; i >= 0; i--) if (!id || pics[i].id === id) pics.splice(i, 1);
      return Promise.resolve();
    },
  };

  // ---- the stack --------------------------------------------------------------------
  const stack = [];
  const bus = KIT.events('scenes');

  function make(sceneOrId, params) {
    if (sceneOrId && typeof sceneOrId === 'object') return sceneOrId;
    const def = KIT.registry('scenes').get(String(sceneOrId));
    if (!def || typeof def.create !== 'function') throw new Error(`scenes: unknown scene '${sceneOrId}'`);
    const s = def.create(params || {});
    s.id = s.id || def.id;
    return s;
  }

  const SCENES = KIT.scenes = {
    events: bus,
    get stack() { return stack; },
    /** top() -> the scene that owns the input right now. */
    top() { return stack[stack.length - 1] || null; },
    /** ids() -> ['map','dialogue'] bottom to top (handy in tests). */
    ids() { return stack.map(s => s.id); },

    /** push(scene|id, params) -> scene */
    push(sceneOrId, params) {
      const scene = make(sceneOrId, params);
      scene.params = params || {};
      scene._promise = scene._promise || new Promise((resolve) => { scene._resolve = resolve; });
      scene.finish = (result) => SCENES.finish(scene, result);
      stack.push(scene);
      try { if (scene.enter) scene.enter(params || {}); }
      catch (e) { (KIT.log || console).error(`[scene ${scene.id}] enter threw`, e); }
      bus.emit('sceneChange', { id: scene.id, ids: SCENES.ids() });
      return scene;
    },
    /** run(scene|id, params) -> Promise<result> */
    run(sceneOrId, params) { return SCENES.push(sceneOrId, params)._promise; },
    /** pop(result) — close the top scene. */
    pop(result) {
      const scene = stack[stack.length - 1];
      if (!scene) return null;
      return SCENES.finish(scene, result);
    },
    /** finish(scene, result) — close this scene wherever it is in the stack. */
    finish(scene, result) {
      const i = stack.indexOf(scene);
      if (i < 0) return scene;
      stack.splice(i, 1);
      try { if (scene.exit) scene.exit(result); }
      catch (e) { (KIT.log || console).error(`[scene ${scene.id}] exit threw`, e); }
      scene.result = result;
      if (scene._resolve) scene._resolve(result);
      bus.emit('sceneChange', { id: SCENES.top() ? SCENES.top().id : null, ids: SCENES.ids() });
      return scene;
    },
    /** replace(scene|id, params) — swap the top scene (the old one resolves with null). */
    replace(sceneOrId, params) {
      const old = SCENES.top();
      if (old) SCENES.finish(old, null);
      return SCENES.push(sceneOrId, params);
    },
    clear() { while (stack.length) SCENES.finish(stack[stack.length - 1], null); },

    /** update(dt) — every scene ticks (so a map keeps animating under a message), fx last. */
    update(dt) {
      for (const s of stack.slice()) {
        if (typeof s.update !== 'function') continue;
        try { s.update(dt, s === SCENES.top()); } catch (e) { (KIT.log || console).error(`[scene ${s.id}] update threw`, e); }
      }
      FX.update(dt);
    },
    /** input(ev) — only the top scene sees it. ev = { player, key }. */
    input(ev) {
      const s = SCENES.top();
      if (!s || typeof s.input !== 'function') return false;
      try { return s.input(ev) !== false; } catch (e) { (KIT.log || console).error(`[scene ${s.id}] input threw`, e); return false; }
    },
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// ---- js/kit/scenes/dialogue.js ----
// The message scenes: dialogue (Show Text), choice, nameEntry, inputNumber,
// scrollText, chapter and toast. They are DOM overlays over the canvas (§12),
// so text is real text — selectable, scalable, and readable on a phone.
//
// Everything a message can contain comes from KIT.text: the wrap/paginate pass
// uses the real font metrics of the box, and the typewriter walks the spans so
// {pause}, {wait}, {fast}, {color:…}, {icon:…} and {shake} all work.
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const UI = KIT.ui;
  const scenes = KIT.registry('scenes');

  const SPEEDS = { slow: 22, normal: 48, fast: 96, instant: 0 };
  const LINES_PER_PAGE = 3;

  function settings() { return (KIT.storage && KIT.storage.settings) ? KIT.storage.settings() : {}; }
  function instant() { return !!(KIT.fx && KIT.fx.instant) || settings().textSpeed === 'instant'; }
  function charsPerSecond() {
    if (instant()) return 0;
    return SPEEDS[settings().textSpeed] == null ? SPEEDS.normal : SPEEDS[settings().textSpeed];
  }

  /** A measuring context that uses the element's real font, so wrapping matches what you see. */
  let measureCtx = null;
  function measurerFor(el) {
    if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
    const cs = getComputedStyle(el);
    measureCtx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const letter = parseFloat(cs.letterSpacing) || 0;
    return (s) => measureCtx.measureText(s).width + letter * s.length;
  }

  /** The dialogue box markup, built once and reused. */
  function dialogueBox() {
    const host = UI.el('dialogue');
    if (!host) return null;
    if (!host.firstChild) {
      host.innerHTML = '';
      const box = UI.make('div.kit-box');
      box.appendChild(UI.make('div.kit-facebox'));
      const wrap = UI.make('div.kit-textwrap');
      wrap.appendChild(UI.make('div.kit-name'));
      wrap.appendChild(UI.make('div.kit-text'));
      box.appendChild(wrap);
      box.appendChild(UI.make('div.kit-next', { text: '▼' }));
      host.appendChild(box);
    }
    return {
      host,
      box: host.querySelector('.kit-box'),
      face: host.querySelector('.kit-facebox'),
      name: host.querySelector('.kit-name'),
      text: host.querySelector('.kit-text'),
      next: host.querySelector('.kit-next'),
    };
  }

  function faceArt(id) {
    if (!id) return null;
    for (const regName of ['faces', 'sprites', 'icons']) {
      if (!KIT.registry.exists(regName)) continue;
      const def = KIT.registry(regName).get(id);
      if (!def) continue;
      const art = KIT.pixels.artOf(def);
      if (art) return art;
      if (def.frames && def.frames.down) return { w: def.w || 16, h: def.h || 24, palette: def.palette, rows: def.frames.down[0] };
    }
    return KIT.pixels.silhouette(24, 24, '#9aa7c7');      // missing face: a friendly blob, never an error
  }

  // ---- dialogue ------------------------------------------------------------------
  scenes.add({
    id: 'dialogue', name: 'Message',
    create() {
      let ui = null, units = [], unitIndex = 0, charIndex = 0, acc = 0, pages = [], pageIndex = 0;
      let waiting = false, complete = false, speed = 1, pauseLeft = 0;

      function layoutFor(textEl) {
        return { width: Math.max(80, textEl.clientWidth - 2), measure: measurerFor(textEl), lines: LINES_PER_PAGE };
      }

      function buildPage(page) {
        const t = ui.text;
        t.innerHTML = '';
        units = []; unitIndex = 0; charIndex = 0; acc = 0; complete = false; waiting = false; speed = 1; pauseLeft = 0;
        for (const line of page) {
          const lineEl = UI.make('div.kit-line');
          for (const span of line) {
            if (span.type === 'text') {
              const el = UI.make('span');
              if (span.color) el.style.color = span.color;
              if (span.size === 'big') el.classList.add('is-big');
              lineEl.appendChild(el);
              units.push({ type: 'text', el, text: span.text });
            } else if (span.type === 'icon') {
              const art = faceArt(span.id);
              const el = UI.make('span.kit-icon');
              el.appendChild(UI.artCanvas(art, 2));
              el.style.visibility = 'hidden';
              lineEl.appendChild(el);
              units.push({ type: 'icon', el });
            } else if (span.type === 'pause') units.push({ type: 'pause', ms: span.ms == null ? 350 : span.ms });
            else if (span.type === 'wait') units.push({ type: 'wait' });
            else if (span.type === 'speed') units.push({ type: 'speed', mode: span.mode });
            else if (span.type === 'shake') units.push({ type: 'shake' });
          }
          t.appendChild(lineEl);
        }
        if (instant()) revealAll();
        updatePrompt();
      }

      function revealAll() {
        for (let i = unitIndex; i < units.length; i++) {
          const u = units[i];
          if (u.type === 'text') u.el.textContent = u.text;
          if (u.type === 'icon') u.el.style.visibility = 'visible';
          if (u.type === 'shake' && ui.box) shakeBox();
        }
        unitIndex = units.length; charIndex = 0; complete = true; waiting = false; pauseLeft = 0;
        updatePrompt();
      }
      function shakeBox() {
        if (!ui.box) return;
        ui.box.classList.remove('is-shaking');
        void ui.box.offsetWidth;
        ui.box.classList.add('is-shaking');
      }
      function updatePrompt() {
        if (!ui.next) return;
        ui.next.classList.toggle('is-ready', complete || waiting);
        ui.next.textContent = (pageIndex < pages.length - 1 || waiting) ? '▼' : '▼';   // more to read / ready to close
      }

      return {
        id: 'dialogue', transparent: true,
        enter(params) {
          ui = dialogueBox();
          if (!ui) { this.finish(); return; }
          const p = params || {};
          ui.host.hidden = false;
          ui.host.setAttribute('data-position', p.position || 'bottom');
          ui.host.setAttribute('data-bg', p.bg || 'window');
          ui.name.textContent = p.who || '';
          ui.name.hidden = !p.who;
          ui.face.innerHTML = '';
          ui.face.hidden = !p.face;
          if (p.face) ui.face.appendChild(UI.artCanvas(faceArt(p.face), 3));
          const rendered = KIT.text.render(p.text == null ? '' : p.text, p.ctx || {}, layoutFor(ui.text));
          pages = rendered[0].pages;
          pageIndex = 0;
          buildPage(pages[0] || []);
          this._tap = () => { this.input({ key: 'a', player: 1 }); };
          ui.host.addEventListener('click', this._tap);
        },
        exit() {
          if (ui) {
            ui.host.hidden = true;
            if (this._tap) ui.host.removeEventListener('click', this._tap);
          }
        },
        update(dt) {
          if (complete || waiting || !units.length) return;
          if (pauseLeft > 0) { pauseLeft -= dt * 1000; return; }
          const cps = charsPerSecond() * speed;
          if (cps <= 0) { revealAll(); return; }
          acc += dt * cps;
          let budget = Math.floor(acc);
          if (budget <= 0) return;
          acc -= budget;
          while (budget > 0 && unitIndex < units.length) {
            const u = units[unitIndex];
            if (u.type === 'text') {
              const left = u.text.length - charIndex;
              const take = Math.min(left, budget);
              charIndex += take; budget -= take;
              u.el.textContent = u.text.slice(0, charIndex);
              if (charIndex >= u.text.length) { unitIndex++; charIndex = 0; }
            } else if (u.type === 'icon') { u.el.style.visibility = 'visible'; unitIndex++; }
            else if (u.type === 'pause') { pauseLeft = u.ms; unitIndex++; break; }
            else if (u.type === 'wait') { waiting = true; unitIndex++; break; }
            else if (u.type === 'speed') { speed = u.mode === 'instant' ? 999 : 2.5; unitIndex++; }
            else if (u.type === 'shake') { shakeBox(); unitIndex++; }
          }
          if (unitIndex >= units.length) { complete = true; }
          updatePrompt();
        },
        input(ev) {
          if (ev.key === 'a' || ev.key === 'menu') {
            if (waiting) { waiting = false; updatePrompt(); return true; }
            if (!complete) { revealAll(); return true; }
            if (pageIndex < pages.length - 1) { pageIndex++; buildPage(pages[pageIndex]); return true; }
            this.finish(true);
            return true;
          }
          if (ev.key === 'b') { if (!complete || waiting) { waiting = false; revealAll(); } return true; }
          return true;
        },
      };
    },
  });

  // ---- choice ---------------------------------------------------------------------
  scenes.add({
    id: 'choice', name: 'Choices',
    create() {
      let host = null, index = 0, options = [];
      return {
        id: 'choice', transparent: true,
        enter(params) {
          const p = params || {};
          options = p.options || [];
          index = 0;
          host = UI.el('choice');
          if (!host) { this.finish(-1); return; }
          UI.clear(host);
          host.hidden = false;
          const panel = UI.make('div.kit-panel');
          if (p.prompt) panel.appendChild(UI.make('div.kit-prompt', { text: KIT.text.plain(p.prompt, {}) }));
          const list = UI.make('div.kit-list');
          options.forEach((o, i) => {
            const b = UI.make('button.kit-option', { text: KIT.text.plain(o.text, {}) });
            b.type = 'button';
            b.setAttribute('data-index', String(i));
            b.setAttribute('data-action', 'choose');
            list.appendChild(b);
          });
          panel.appendChild(list);
          host.appendChild(panel);
          UI.select(list, index);
          this._list = list;
          this._off = UI.onAction(host, (action, el) => {
            if (action !== 'choose') return;
            index = Number(el.getAttribute('data-index')) || 0;
            pick.call(this);
          });
          const pick = function () { KIT.audio.play('select'); this.finish(index); };
          this._pick = pick;
          this._cancel = p.cancel || 'none';
        },
        exit() { if (host) { host.hidden = true; UI.clear(host); } if (this._off) this._off(); },
        input(ev) {
          if (ev.key === 'up' || ev.key === 'left') { index = (index - 1 + options.length) % options.length; UI.select(this._list, index); KIT.audio.play('blip'); return true; }
          if (ev.key === 'down' || ev.key === 'right') { index = (index + 1) % options.length; UI.select(this._list, index); KIT.audio.play('blip'); return true; }
          if (ev.key === 'a') { this._pick.call(this); return true; }
          if (ev.key === 'b' || ev.key === 'menu') {
            if (this._cancel === 'none') { KIT.audio.play('back'); return true; }
            KIT.audio.play('back');
            this.finish(-1);
            return true;
          }
          return true;
        },
      };
    },
  });

  // ---- a small modal panel shared by nameEntry and inputNumber ----------------------
  function modalPanel(title) {
    const host = UI.el('choice');
    UI.clear(host);
    host.hidden = false;
    const panel = UI.make('div.kit-panel.kit-modal');
    if (title) panel.appendChild(UI.make('div.kit-prompt', { text: title }));
    host.appendChild(panel);
    return { host, panel };
  }

  scenes.add({
    id: 'nameEntry', name: 'Name entry',
    create() {
      return {
        id: 'nameEntry', transparent: true,
        enter(params) {
          const p = params || {};
          const m = modalPanel(p.prompt || 'What is your name?');
          this._host = m.host;
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'kit-input';
          input.maxLength = p.maxLength || 8;
          input.value = p.current || '';
          input.setAttribute('data-role', 'name-entry');
          input.setAttribute('aria-label', p.prompt || 'Name');
          m.panel.appendChild(input);
          const row = UI.make('div.kit-row');
          row.appendChild(UI.button('cancel', KIT.strings.get(null, 'cancel')));
          row.appendChild(UI.button('ok', KIT.strings.get(null, 'ok'), 'is-primary'));
          m.panel.appendChild(row);
          const done = (ok) => this.finish(ok ? (input.value.trim() || p.current || null) : null);
          this._off = UI.onAction(m.host, (a) => done(a === 'ok'));
          input.addEventListener('keydown', (e) => {
            e.stopPropagation();
            if (e.key === 'Enter') done(true);
            if (e.key === 'Escape') done(false);
          });
          setTimeout(() => { try { input.focus(); input.select(); } catch (e) { /* ignore */ } }, 0);
        },
        exit() { if (this._host) { this._host.hidden = true; UI.clear(this._host); } if (this._off) this._off(); },
        input(ev) { if (ev.key === 'b') this.finish(null); return true; },
      };
    },
  });

  scenes.add({
    id: 'inputNumber', name: 'Input number',
    create() {
      return {
        id: 'inputNumber', transparent: true,
        enter(params) {
          const p = params || {};
          const max = Math.pow(10, p.digits || 3) - 1;
          const m = modalPanel(p.prompt || 'Enter a number');
          this._host = m.host;
          const input = document.createElement('input');
          input.type = 'number';
          input.className = 'kit-input';
          input.min = '0'; input.max = String(max);
          input.value = String(Math.min(max, p.current || 0));
          input.setAttribute('data-role', 'number-entry');
          m.panel.appendChild(input);
          const row = UI.make('div.kit-row');
          row.appendChild(UI.button('cancel', KIT.strings.get(null, 'cancel')));
          row.appendChild(UI.button('ok', KIT.strings.get(null, 'ok'), 'is-primary'));
          m.panel.appendChild(row);
          const done = (ok) => this.finish(ok ? Math.max(0, Math.min(max, Number(input.value) || 0)) : null);
          this._off = UI.onAction(m.host, (a) => done(a === 'ok'));
          input.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); });
          setTimeout(() => { try { input.focus(); input.select(); } catch (e) { /* ignore */ } }, 0);
        },
        exit() { if (this._host) { this._host.hidden = true; UI.clear(this._host); } if (this._off) this._off(); },
        input(ev) { if (ev.key === 'b') this.finish(null); return true; },
      };
    },
  });

  // ---- scrolling text ---------------------------------------------------------------
  scenes.add({
    id: 'scrollText', name: 'Scrolling text',
    create() {
      let y = 0, speed = 1, host = null, inner = null, fast = false;
      return {
        id: 'scrollText', transparent: true,
        enter(params) {
          const p = params || {};
          host = UI.el('dialogue');
          host.hidden = false;
          host.setAttribute('data-bg', 'dim');
          host.classList.add('is-scroll');
          UI.clear(host);
          inner = UI.make('div.kit-scroll');
          inner.textContent = KIT.text.plain(p.text || '', {});
          host.appendChild(inner);
          y = host.clientHeight;
          speed = (p.speed || 2) * 18;
          fast = false;
          this._noFast = !!p.noFast;
          inner.style.transform = `translateY(${y}px)`;
        },
        exit() { if (host) { host.hidden = true; host.classList.remove('is-scroll'); UI.clear(host); host.removeAttribute('data-bg'); } },
        update(dt) {
          if (!inner) return;
          y -= dt * speed * (fast ? 3 : 1) * (KIT.fx.instant ? 8 : 1);
          inner.style.transform = `translateY(${y}px)`;
          if (y < -inner.offsetHeight - 8) this.finish(true);
        },
        input(ev) { if ((ev.key === 'a' || ev.key === 'b') && !this._noFast) fast = true; return true; },
      };
    },
  });

  // ---- chapter card --------------------------------------------------------------------
  scenes.add({
    id: 'chapter', name: 'Chapter card',
    create() {
      let left = 0, host = null;
      return {
        id: 'chapter', transparent: true,
        enter(params) {
          const p = params || {};
          host = UI.el('chapter');
          if (!host) { this.finish(); return; }
          UI.clear(host);
          host.hidden = false;
          host.classList.add('is-in');
          const card = UI.make('div.kit-card');
          card.appendChild(UI.make('div.kit-chapter-title', { text: KIT.text.plain(p.title || '', {}) }));
          if (p.subtitle) card.appendChild(UI.make('div.kit-chapter-sub', { text: KIT.text.plain(p.subtitle, {}) }));
          host.appendChild(card);
          left = (KIT.fx && KIT.fx.instant) ? 80 : (p.ms == null ? 2000 : p.ms);
        },
        exit() { if (host) { host.hidden = true; host.classList.remove('is-in'); UI.clear(host); } },
        update(dt) { left -= dt * 1000; if (left <= 0) this.finish(true); },
        input(ev) { if (ev.key === 'a' || ev.key === 'b') this.finish(true); return true; },
      };
    },
  });

  // ---- toast ------------------------------------------------------------------------
  // A toast does not take input: it shows, the script carries on after a beat,
  // and the element fades away on its own.
  let toastTimer = null;
  KIT.toast = function (text, ms) {
    const host = UI.el('toast');
    if (!host) return Promise.resolve();
    UI.clear(host);
    host.appendChild(UI.make('div.kit-toast-pill', { text: KIT.text.plain(text || '', {}) }));
    host.hidden = false;
    host.classList.add('is-in');
    if (toastTimer) clearTimeout(toastTimer);
    const life = (KIT.fx && KIT.fx.instant) ? 200 : (ms || 1600);
    toastTimer = setTimeout(() => { host.classList.remove('is-in'); host.hidden = true; }, life);
    return new Promise(res => setTimeout(res, Math.min(life, (KIT.fx && KIT.fx.instant) ? 10 : 550)));
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
// ---- js/kit/scenes/menu.js ----
// The pause menu, the settings list, the save-slot list and the debug panel.
//
// The pause menu is built from the `menus` registry, so a module (or the
// author) adds an entry with `KIT.registry('menus').add({ id, label, order,
// open(game) })` and it appears in the right place with no core edits.
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const UI = KIT.ui;
  const scenes = KIT.registry('scenes');
  const menus = KIT.registry('menus');

  const TEXT_SPEEDS = ['slow', 'normal', 'fast', 'instant'];
  const ZOOMS = ['auto', 'small', 'normal', 'large'];

  function settings() { return KIT.storage.settings(); }
  function save(patch) { return KIT.storage.saveSettings(patch); }

  /** A list panel inside #pause-menu: rows of { label, value, action, disabled }. */
  function panel(title, rows, opts) {
    const host = UI.el('pause-menu');
    UI.clear(host);
    host.hidden = false;
    const box = UI.make('div.kit-panel.kit-pause');
    if (title) box.appendChild(UI.make('div.kit-panel-title', { text: title }));
    const list = UI.make('div.kit-menu-list');
    rows.forEach((r, i) => {
      const b = UI.make('button.kit-uibtn.kit-menu-item', {});
      b.type = 'button';
      b.setAttribute('data-action', r.action || ('row-' + i));
      b.setAttribute('data-index', String(i));
      if (r.disabled) b.disabled = true;
      b.appendChild(UI.make('span.kit-item-label', { text: r.label }));
      if (r.value != null) b.appendChild(UI.make('span.kit-item-value', { text: String(r.value) }));
      if (r.note) b.appendChild(UI.make('span.kit-item-note', { text: r.note }));
      list.appendChild(b);
    });
    box.appendChild(list);
    if (opts && opts.hint) box.appendChild(UI.make('p.kit-hint', { text: opts.hint }));
    host.appendChild(box);
    return { host, list };
  }

  /** One scene drives every list: pause, settings and save just supply rows. */
  scenes.add({
    id: 'menu', name: 'Menu',
    create() {
      let mode = 'pause', rows = [], index = 0, ui = null, game = null;

      const build = function (self) {
        if (mode === 'settings') rows = settingRows();
        else if (mode === 'save') rows = self._saveRows || [{ label: 'Loading…', disabled: true }];
        else rows = pauseRows();
        ui = panel(titleFor(), rows, { hint: KIT.input.isTouch() ? 'Tap a line · ☰ closes' : 'Arrows · Z chooses · X closes' });
        index = Math.min(index, Math.max(0, rows.length - 1));
        UI.select(ui.list, index);
        if (self._off) self._off();
        self._off = UI.onAction(ui.host, (action, el) => {
          index = Number(el.getAttribute('data-index')) || 0;
          activate.call(self);
        });
      };

      function titleFor() {
        if (mode === 'settings') return KIT.strings.get(game && game.project, 'settings');
        if (mode === 'save') return KIT.strings.get(game && game.project, 'save');
        return 'Paused';
      }

      function pauseRows() {
        const out = [{ label: 'Keep playing', action: 'close' }];
        for (const def of menus.list().slice().sort((a, b) => (a.order || 50) - (b.order || 50))) {
          if (typeof def.when === 'function' && !def.when(game)) continue;
          out.push({ label: typeof def.label === 'function' ? def.label(game) : (def.label || def.name || def.id), action: 'menu:' + def.id, value: typeof def.value === 'function' ? def.value(game) : undefined });
        }
        return out;
      }

      function settingRows() {
        const s = settings();
        return [
          { label: 'Text speed', value: s.textSpeed, action: 'cycle:textSpeed' },
          { label: 'Zoom', value: s.zoom, action: 'cycle:zoom' },
          { label: 'Sound', value: s.sound ? 'on' : 'off', action: 'toggle:sound' },
          { label: 'Music', value: s.music ? 'on' : 'off', action: 'toggle:music' },
          { label: 'Motion', value: s.reduceMotion ? 'reduced' : 'normal', action: 'toggle:reduceMotion' },
          { label: 'Back', action: 'back' },
        ];
      }

      function nudge(action, dir) {
        const s = settings();
        if (action === 'cycle:textSpeed') {
          const i = (TEXT_SPEEDS.indexOf(s.textSpeed) + (dir || 1) + TEXT_SPEEDS.length) % TEXT_SPEEDS.length;
          save({ textSpeed: TEXT_SPEEDS[i] });
        } else if (action === 'cycle:zoom') {
          const i = (ZOOMS.indexOf(s.zoom) + (dir || 1) + ZOOMS.length) % ZOOMS.length;
          save({ zoom: ZOOMS[i] });
          if (KIT.game && KIT.game.resize) KIT.game.resize();
        } else if (action === 'toggle:sound') { save({ sound: !s.sound }); KIT.audio.setEnabled(!s.sound); }
        else if (action === 'toggle:music') { save({ music: !s.music }); KIT.audio.setMusic(!s.music); if (!s.music && KIT.game && KIT.game.world) KIT.audio.music(KIT.game.world.currentMusic || null); }
        else if (action === 'toggle:reduceMotion') save({ reduceMotion: !s.reduceMotion });
        else return false;
        return true;
      }

      async function activate() {
        const row = rows[index];
        if (!row || row.disabled) return;
        const action = row.action || '';
        KIT.audio.play('select');
        if (action === 'close') { this.finish('close'); return; }
        if (action === 'back') { mode = 'pause'; index = 0; build(this); return; }
        if (action.startsWith('cycle:') || action.startsWith('toggle:')) { nudge(action, 1); build(this); return; }
        if (action.startsWith('slot:')) {
          const slot = action.slice(5);
          const ok = await game.save(slot);
          await KIT.toast(KIT.strings.get(game.project, ok ? 'saved' : 'save-failed'));
          if (ok) KIT.audio.play('save');
          mode = 'pause'; index = 0; build(this);
          return;
        }
        if (action.startsWith('menu:')) {
          const def = menus.get(action.slice(5));
          if (!def) return;
          if (def.id === 'settings') { mode = 'settings'; index = 0; build(this); return; }
          if (def.id === 'save') {
            this._saveRows = await saveRows(game);
            mode = 'save'; index = 0; build(this);
            return;
          }
          const result = await def.open(game, this);
          if (result === 'close') { this.finish('close'); return; }
          build(this);
        }
      }

      async function saveRows(g) {
        const list = await KIT.storage.listGames();
        return list.map(s => ({
          label: s.slot === 'autosave' ? 'Autosave' : 'Slot ' + s.slot,
          value: s.exists ? when(s.savedAt) : 'empty',
          note: s.exists && s.map ? s.map : '',
          action: 'slot:' + s.slot,
          disabled: s.slot === 'autosave',
        })).concat([{ label: 'Back', action: 'back' }]);
      }
      function when(iso) {
        if (!iso) return '';
        try { const d = new Date(iso); return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
        catch (e) { return iso.slice(0, 16).replace('T', ' '); }
      }

      return {
        id: 'menu', transparent: true, pausesWorld: true,
        enter(params) {
          game = (params && params.game) || KIT.game;
          mode = (params && params.mode) || 'pause';
          index = 0;
          this._saveRows = null;
          build(this);
        },
        exit() { const host = UI.el('pause-menu'); if (host) { host.hidden = true; UI.clear(host); } if (this._off) this._off(); },
        input(ev) {
          if (ev.key === 'up') { index = (index - 1 + rows.length) % rows.length; UI.select(ui.list, index); KIT.audio.play('blip'); return true; }
          if (ev.key === 'down') { index = (index + 1) % rows.length; UI.select(ui.list, index); KIT.audio.play('blip'); return true; }
          if (ev.key === 'left' || ev.key === 'right') {
            const row = rows[index];
            if (row && nudge(row.action, ev.key === 'left' ? -1 : 1)) build(this);
            return true;
          }
          if (ev.key === 'a') { activate.call(this); return true; }
          if (ev.key === 'b' || ev.key === 'menu') {
            KIT.audio.play('back');
            if (mode !== 'pause') { mode = 'pause'; index = 0; build(this); return true; }
            this.finish('close');
            return true;
          }
          return true;
        },
      };
    },
  });

  // ---- the standard pause-menu entries -------------------------------------------
  menus.addAll([
    { id: 'save', label: 'Save', order: 20, open() { return null; } },
    { id: 'coop', label: 'Two players', order: 30,
      value: (game) => (game && game.world && game.world.coop ? 'on' : 'off'),
      open(game) { game.setCoop(!(game.world && game.world.coop)); return null; } },
    { id: 'settings', label: 'Settings', order: 40, open() { return null; } },
    { id: 'debug', label: 'Debug', order: 55,
      when: (game) => !!(game && game.flags && game.flags.debug),
      async open(game) { await KIT.scenes.run('debug', { game }); return null; } },
    { id: 'creator', label: 'Creator Mode', order: 60,
      async open(game) {
        if (KIT.editor && typeof KIT.editor.open === 'function') { KIT.editor.open(game); return 'close'; }
        await KIT.toast('Creator Mode is not in this build yet.');
        return null;
      } },
    { id: 'quit', label: 'Quit to title', order: 80,
      async open(game) {
        const i = await KIT.scenes.run('choice', {
          prompt: 'Quit to the title screen?',
          options: [{ text: KIT.strings.get(game.project, 'yes'), index: 0 }, { text: KIT.strings.get(game.project, 'no'), index: 1 }],
          cancel: 'last',
        });
        if (i === 0) { game.toTitle(); return 'close'; }
        return null;
      } },
  ]);

  // ---- debug panel -------------------------------------------------------------------
  scenes.add({
    id: 'debug', name: 'Debug',
    create() {
      let host = null, timer = 0;
      function body(game) {
        const w = game && game.world;
        const lines = [];
        if (w) {
          const h = w.hero();
          lines.push(`map ${w.map ? w.map.id : '—'}  hero ${h ? `${h.x},${h.y} ${h.dir}` : '—'}  busy ${w.busy}`);
          lines.push(`scenes ${KIT.scenes.ids().join(' › ')}`);
          lines.push(`threads ${KIT.interpreter.threads().map(t => `${t.label || t.id}:${t.status}`).join(', ') || 'none'}`);
          const vars = (w.save && w.save.vars) || {};
          lines.push('vars ' + (Object.keys(vars).map(k => `${k}=${JSON.stringify(vars[k])}`).join('  ') || 'none'));
          const inv = (w.save && w.save.inventory) || {};
          lines.push('bag ' + (Object.keys(inv).map(k => `${k}×${inv[k]}`).join('  ') || 'empty'));
        }
        lines.push(`storage ${JSON.stringify(KIT.storage.info())}`);
        return lines.join('\n');
      }
      return {
        id: 'debug', transparent: true, pausesWorld: false,
        enter(params) {
          const game = (params && params.game) || KIT.game;
          host = UI.el('pause-menu');
          UI.clear(host);
          host.hidden = false;
          const box = UI.make('div.kit-panel.kit-debug');
          box.appendChild(UI.make('div.kit-panel-title', { text: 'Debug' }));
          const pre = UI.make('pre.kit-debug-body', { text: body(game) });
          box.appendChild(pre);
          const row = UI.make('div.kit-row');
          row.appendChild(UI.button('close', 'Close', 'is-primary'));
          box.appendChild(row);
          host.appendChild(box);
          this._pre = pre; this._game = game;
          this._off = UI.onAction(host, () => this.finish(true));
        },
        exit() { if (host) { host.hidden = true; UI.clear(host); } if (this._off) this._off(); },
        update(dt) { timer += dt; if (timer > 0.25) { timer = 0; if (this._pre) this._pre.textContent = body(this._game); } },
        input(ev) { if (ev.key === 'b' || ev.key === 'menu' || ev.key === 'a') this.finish(true); return true; },
      };
    },
  });

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// ---- js/kit/scenes/title.js ----
// The title scene: the project's own title and pitch, New Game / Continue /
// Settings. Continue only lights up when there is a save for this world.
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const UI = KIT.ui;
  const scenes = KIT.registry('scenes');

  scenes.add({
    id: 'title', name: 'Title',
    create() {
      let host = null, items = [], index = 0;

      function refresh() { UI.select(host.querySelector('.kit-menu-list'), index); }

      return {
        id: 'title', transparent: false,
        enter(params) {
          const project = (params && params.project) || (KIT.game && KIT.game.project) || {};
          const meta = project.meta || {};
          host = UI.el('screen-title');
          if (!host) { this.finish('new-game'); return; }
          UI.clear(host);
          host.hidden = false;

          const inner = UI.make('div.kit-title-inner');
          inner.appendChild(UI.make('h1.kit-title', { text: meta.title || 'Our Adventure' }));
          if (meta.subtitle) inner.appendChild(UI.make('p.kit-subtitle', { text: meta.subtitle }));

          const list = UI.make('div.kit-menu-list');
          items = [
            { action: 'new-game', label: KIT.strings.get(project, 'new-game') },
            { action: 'continue', label: KIT.strings.get(project, 'continue'), disabled: true },
            { action: 'settings', label: KIT.strings.get(project, 'settings') },
          ];
          items.forEach((it, i) => {
            const b = UI.make('button.kit-uibtn.kit-menu-item', { text: it.label });
            b.type = 'button';
            b.setAttribute('data-action', it.action);
            b.setAttribute('data-index', String(i));
            if (it.disabled) b.disabled = true;
            list.appendChild(b);
          });
          inner.appendChild(list);
          if (meta.pitch) inner.appendChild(UI.make('p.kit-pitch', { text: meta.pitch }));
          inner.appendChild(UI.make('p.kit-hint', { text: KIT.input.isTouch() ? 'Tap to choose' : 'Arrows to choose · Z to confirm' }));
          host.appendChild(inner);
          index = 0;
          refresh();

          // Light up Continue when a save turns up.
          Promise.resolve(KIT.storage.listGames()).then((saves) => {
            const any = (saves || []).some(s => s.exists);
            const btn = list.querySelector('[data-action="continue"]');
            if (btn && any) { btn.disabled = false; items[1].disabled = false; index = 1; refresh(); }
          }).catch(() => {});

          this._off = UI.onAction(host, (action, el) => {
            if (el.disabled) return;
            index = Number(el.getAttribute('data-index')) || 0;
            this.choose(action);
          });
          KIT.audio.music('title', { fade: 400 });
        },
        exit() { if (host) { host.hidden = true; UI.clear(host); } if (this._off) this._off(); },
        choose(action) {
          KIT.audio.play('select');
          if (action === 'settings') { KIT.scenes.run('menu', { mode: 'settings' }); return; }
          this.finish(action);
        },
        input(ev) {
          const step = (d) => {
            for (let n = 0; n < items.length; n++) {
              index = (index + d + items.length) % items.length;
              if (!items[index].disabled) break;
            }
            KIT.audio.play('blip');
            refresh();
          };
          if (ev.key === 'up' || ev.key === 'left') step(-1);
          else if (ev.key === 'down' || ev.key === 'right') step(1);
          else if (ev.key === 'a' || ev.key === 'menu') this.choose(items[index].action);
          return true;
        },
      };
    },
  });

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// ---- js/kit/scenes/map.js ----
// The map scene: the one you play in. It owns nothing — the world updates in
// the game loop and the renderer draws every frame — it only turns held
// buttons into world.move()/world.interact() calls.
//
// Walking rules (§8.5): a direction held for less than KIT.input.TAP_MS only
// turns the hero (that is how you talk to something beside you without
// stepping), anything longer walks, and holding keeps walking.
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const scenes = KIT.registry('scenes');
  const DIRS = ['up', 'down', 'left', 'right'];

  scenes.add({
    id: 'map', name: 'Map',
    create(params) {
      const game = (params && params.game) || KIT.game;

      /** Which hero this player drives: in co-op each pad has its own, otherwise everyone drives the leader. */
      function heroIndexFor(world, player) {
        if (!world.coop) return world.activeHero;
        return Math.min(world.heroes.length - 1, player - 1);
      }

      /** The inactive co-op hero stays on screen: a step that would leave the view is refused. */
      function leashed(world, hero, dir) {
        if (!world.coop || hero === world.hero()) return false;
        const r = KIT.game && KIT.game.renderer ? KIT.game.renderer.viewTiles() : { w: 16, h: 12 };
        const d = KIT.delta(dir);
        const nx = hero.x + d.dx, ny = hero.y + d.dy;
        const cam = world.camera;
        return nx < cam.x || ny < cam.y || nx > cam.x + r.w - 1 || ny > cam.y + r.h - 1;
      }

      // Per player: the direction we turned to when this press started. While
      // that press is younger than TAP_MS the hero only turns — that is how you
      // face something beside you without stepping onto it.
      const turned = [null, null];

      function poll(world) {
        if (!world || !world.map || world.busy) return;
        const players = KIT.input.players();
        for (let player = 1; player <= players; player++) {
          const state = KIT.input.state(player);
          const dir = DIRS.find(d => state[d]);
          if (!dir) { turned[player - 1] = null; continue; }
          const i = heroIndexFor(world, player);
          const hero = world.hero(i);
          if (!hero || hero.mover.moving) continue;
          if (hero.dir !== dir) { KIT.entities.tryMove(hero, dir, world.map, { turnOnly: true }); turned[player - 1] = dir; }
          if (turned[player - 1] === dir && KIT.input.heldMs(dir, player) < KIT.input.TAP_MS) continue;
          if (leashed(world, hero, dir)) continue;
          Promise.resolve(world.move(i, dir)).catch(e => (KIT.log || console).error('[map] move', e));
        }
      }

      /** A tap too short for the poll to see (a touch pad tap) still turns the hero. */
      function turnOnPress(world, ev) {
        const i = heroIndexFor(world, ev.player);
        const hero = world.hero(i);
        if (!hero || hero.mover.moving) return;
        if (hero.dir !== ev.key) { KIT.entities.tryMove(hero, ev.key, world.map, { turnOnly: true }); turned[ev.player - 1] = ev.key; }
        else turned[ev.player - 1] = null;
      }

      return {
        id: 'map', transparent: false,
        enter() { const host = KIT.ui.el('game-canvas'); if (host) host.setAttribute('data-scene', 'map'); },
        update(dt, isTop) {
          const world = game && game.world;
          if (!isTop || !world) return;
          poll(world);
        },
        input(ev) {
          const world = game && game.world;
          if (!world) return true;
          if (DIRS.includes(ev.key)) { if (!world.busy) turnOnPress(world, ev); return true; }
          if (ev.key === 'a') {
            const i = world.coop ? Math.min(world.heroes.length - 1, ev.player - 1) : world.activeHero;
            Promise.resolve(world.interact(i)).catch(e => (KIT.log || console).error('[map] interact', e));
            return true;
          }
          if (ev.key === 'menu') { game.openMenu(); return true; }
          if (ev.key === 'swap') { game.swapHero(); return true; }
          return true;
        },
      };
    },
  });

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// ---- js/kit/game.js ----
// KIT.game — boot, the loop, saves, and the ctx ports.
//
// Everything the script language can ask for (§9.1 "The ctx ports") is
// implemented here in terms of the scenes, KIT.fx, KIT.audio and the world:
// `io` opens scenes, `screen` drives KIT.fx, `map` moves characters and
// transfers between maps, `game` opens the menu and saves. The world itself
// stays headless — swap these ports for fakes and the same story runs in Node.
//
//   await KIT.game.boot({ mount: document.body, project })
//   KIT.game.warp('town', 12, 4, 'down'); KIT.game.press('a'); KIT.game.tick(300)
//
// Test hooks (§12): state project world scene() newGame warp press tick
// rngOverride loadProject — plus the URL flags ?fast=1 ?edit=1 ?test=<id>.
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const E = KIT.entities;
  const STEP = 1 / 60;

  const G = KIT.game = {
    project: null, world: null, renderer: null, ports: null,
    flags: { fast: false, edit: false, test: null, debug: false },
    rngOverride: null,
    booted: false,
  };

  let canvas = null, controls = null;
  let raf = null, last = 0, acc = 0, playtimeMs = 0;
  let cameraScroll = null;                 // { x, y } added after the camera system runs
  const commandRoutes = [];                // entities moving on a moveRoute (with their resolvers)
  let autosaveQueued = false;

  const settings = () => KIT.storage.settings();
  const wait = (ms) => new Promise(res => setTimeout(res, KIT.fx.instant ? Math.min(16, ms) : ms));

  // ---- URL flags ------------------------------------------------------------------
  function readFlags() {
    let q = {};
    try {
      const s = new URLSearchParams((root.location && root.location.search) || '');
      q = { fast: s.get('fast') === '1', edit: s.get('edit') === '1', test: s.get('test'), debug: s.get('debug') === '1' };
    } catch (e) { q = { fast: false, edit: false, test: null, debug: false }; }
    G.flags = q;
    KIT.fx.instant = !!q.fast;
    return q;
  }

  // ---- the ports (§9.1) -------------------------------------------------------------
  function buildPorts() {
    const io = {
      say: (o) => KIT.scenes.run('dialogue', o),
      choice: (o) => KIT.scenes.run('choice', o),
      nameEntry: async (o) => {
        const name = await KIT.scenes.run('nameEntry', o);
        if (name) {
          const used = (KIT.storage.meta().namesUsed || []).concat([name]).slice(-12);
          KIT.storage.saveMeta({ namesUsed: used });
        }
        return name;
      },
      inputNumber: (o) => KIT.scenes.run('inputNumber', o),
      toast: (o) => KIT.toast(o && o.text),
      chapter: (o) => KIT.scenes.run('chapter', o),
      scrollText: (o) => KIT.scenes.run('scrollText', o),
      wait: (ms) => wait(Number(ms) || 0),
    };

    const audio = {
      play: (id, o) => { KIT.audio.play(id, o); return Promise.resolve(); },
      music: (id, o) => KIT.audio.music(id, o),
      stop: (what) => KIT.audio.stop(what),
      save: () => KIT.audio.save(),
      replay: () => KIT.audio.replay(),
      jingle: (id) => KIT.audio.jingle(id),
    };

    const screen = {
      fadeOut: (o) => KIT.fx.fadeOut(o),
      fadeIn: (o) => KIT.fx.fadeIn(o),
      tint: (o) => KIT.fx.tint(o),
      flash: (o) => KIT.fx.flash(o),
      shake: (o) => KIT.fx.shake(o),
      weather: (o) => KIT.fx.weather(o),
    };

    const pictures = {
      show: (o) => KIT.fx.show(o),
      move: (o) => KIT.fx.move(o),
      erase: (o) => KIT.fx.erase(o),
    };

    /** target -> entity: self | hero | p1 | p2 | obj:<id> */
    function resolve(target, ctxEntity) {
      const w = G.world;
      if (!w) return null;
      const t = String(target || 'self');
      if (t === 'self') return ctxEntity || null;
      if (t === 'hero') return w.hero();
      if (t === 'p1') return w.heroes[0];
      if (t === 'p2') return w.heroes[1] || w.heroes[0];
      if (t.startsWith('obj:')) {
        const id = t.slice(4);
        return w.entities.find(e => e.id === id) || null;
      }
      return w.entities.find(e => e.id === t) || null;
    }
    // `self` needs the entity whose script is running. The world tracks that as
    // `world.activeEntity` for main-thread scripts; `_bindEntity` covers background
    // (tick) scripts, which the world does not mark because several can overlap.
    let boundEntity = null;
    G._bindEntity = (e) => { boundEntity = e; };
    const currentEntity = () => (G.world && G.world.activeEntity) || boundEntity;

    const map = {
      async transfer(o) {
        const w = G.world;
        if (!w) return;
        const fade = o.fade !== false;
        if (fade) await KIT.fx.fadeOut({ ms: 220 });
        await w.enterMap(o.map, o.x || 0, o.y || 0, o.dir || 'down');
        queueAutosave();
        if (fade) await KIT.fx.fadeIn({ ms: 220 });
      },
      async setLocation(o) {
        const w = G.world;
        const e = resolve(o.target, currentEntity());
        if (!e || !w) return;
        if (o.swap) {
          const other = resolve(o.swap, currentEntity());
          if (other) { const x = e.x, y = e.y; place(e, other.x, other.y); place(other, x, y); }
          return;
        }
        place(e, o.x || 0, o.y || 0);
      },
      moveRoute(o) {
        const e = resolve(o.target, currentEntity());
        if (!e) return Promise.resolve();
        E.startRoute(e, o.steps || [], { repeat: !!o.repeat, skipBlocked: o.skipBlocked !== false });
        e.data.commandRoute = true;
        if (o.wait === false || o.repeat) return Promise.resolve();
        return new Promise((resolve2) => { commandRoutes.push({ e, resolve: resolve2 }); });
      },
      scrollMap(o) {
        const dx = o.dx || 0, dy = o.dy || 0;
        const speed = Math.max(1, o.speed || 4);
        const ms = (Math.abs(dx) + Math.abs(dy)) / speed * 1000;
        cameraScroll = cameraScroll || { x: 0, y: 0 };
        const from = { x: cameraScroll.x, y: cameraScroll.y };
        const to = { x: from.x + dx, y: from.y + dy };
        return new Promise((resolve2) => {
          const t0 = nowMs();
          const tickScroll = () => {
            const k = KIT.fx.instant ? 1 : Math.min(1, (nowMs() - t0) / Math.max(1, ms));
            cameraScroll = { x: from.x + (to.x - from.x) * k, y: from.y + (to.y - from.y) * k };
            if (k >= 1) resolve2(); else setTimeout(tickScroll, 16);
          };
          tickScroll();
        });
      },
      transparency(o) { const e = resolve(o.target || 'hero', currentEntity()); if (e) e.opacity = o.on !== false ? 0 : 1; return Promise.resolve(); },
      async animation(o) {
        // No animation system yet: a sparkle and a beat is the honest placeholder.
        const e = resolve(o.target, currentEntity());
        KIT.audio.play('sparkle');
        if (e) e.data.balloon = { kind: '✦', start: nowMs(), ms: 500 };
        await wait(320);
      },
      async balloon(o) {
        const e = resolve(o.target, currentEntity());
        if (e) e.data.balloon = { kind: o.kind || '!', start: nowMs(), ms: 1100 };
        if (o.wait) await wait(1100);
      },
      erase(o) {
        const e = resolve(o.target, currentEntity());
        if (e) { e.visible = false; e.solid = false; }
        return Promise.resolve();
      },
      follow(o) {
        const w = G.world;
        if (!w) return Promise.resolve();
        const second = w.heroes[1];
        if (!second) return Promise.resolve();
        if (o.on === false) { second.visible = false; second.solid = false; second.data.trail = []; }
        else { const lead = w.hero(); second.visible = true; second.solid = !w.coop ? false : true; place(second, lead.x, lead.y); }
        return Promise.resolve();
      },
    };

    const game = {
      menu: () => KIT.scenes.run('menu', { game: G }),
      save: (o) => G.save((o && o.slot) || 'autosave'),
      title: () => { G.toTitle(); return Promise.resolve(); },
      heal: async (o) => { KIT.audio.play('heal'); await wait(200); return true; },
      debug: (o) => {
        const text = (o && o.text) || '';
        (KIT.log || console).log('[debug]', text);
        if (G.flags.debug) KIT.toast('debug: ' + text);
        return Promise.resolve();
      },
    };

    const input = { pressed: (key, hero) => KIT.input.pressed(key, hero === 'p2' ? 2 : 1) };
    return { io, audio, screen, pictures, map, game, input };
  }

  function nowMs() { return root.performance ? performance.now() : Date.now(); }
  function place(e, x, y) { e.x = x; e.y = y; e.px = x; e.py = y; e.mover.moving = false; }

  // ---- the world --------------------------------------------------------------------
  function heroDefaults(project) {
    const start = project.start || {};
    return (project.heroes || []).map(h => ({ map: start.map, x: start.x || 0, y: start.y || 0, dir: start.dir || 'down', name: h.name }));
  }

  /** A fresh save from the project's defaults (§7), optionally seeded by a test state. */
  function blankSave(project, testState) {
    const vars = {};
    for (const name of Object.keys(project.vars || {})) vars[name] = project.vars[name].default;
    const start = project.start || {};
    const save = {
      version: 2, projectId: (project.meta && project.meta.id) || 'kit', savedAt: null, playtimeMs: 0, slotLabel: null,
      heroes: heroDefaults(project), activeHero: 0,
      vars, inventory: {}, objects: {}, overlays: {}, modules: {},
      clock: { day: 1, minutes: 480, lastSeenAt: null },
      timer: { running: false, secondsLeft: 0 },
      music: { current: null, saved: null },
      steps: 0,
      seed: Math.floor(Math.random() * 1e9),
    };
    if (testState) {
      Object.assign(save.vars, testState.vars || {});
      Object.assign(save.inventory, testState.inventory || {});
      Object.assign(save.modules, testState.modules || {});
      for (const h of save.heroes) { h.map = testState.map || h.map; h.x = testState.x || 0; h.y = testState.y || 0; h.dir = testState.dir || 'down'; }
    }
    return save;
  }

  /** Build the live world for a save and wire the runtime-only hooks onto it. */
  function buildWorld(save) {
    const project = G.project;
    const rng = typeof G.rngOverride === 'function' ? G.rngOverride
      : (G.rngOverride != null ? KIT.rng(G.rngOverride) : KIT.rng(save.seed || 1));
    const world = KIT.world.create({ project, save, ports: G.ports, rng, events: KIT.events('world') });

    // `ctx.input` comes from the world's own ports; the entity binding only has to
    // cover background (tick) scripts, which the world does not mark as active.
    const baseMakeCtx = world.makeCtx;
    world.makeCtx = function (entity, heroId) {
      const ctx = baseMakeCtx(entity, heroId);
      if (entity) G._bindEntity(entity);
      return ctx;
    };

    world.coop = !!settings().coop || !!(project.settings.coop && project.settings.coop.enabled);
    world.activeHero = Math.min(save.activeHero || 0, world.heroes.length - 1);
    world.events.on('mapEnter', () => { queueAutosave(); });
    world.events.on('heal', () => KIT.audio.play('heal'));

    G.world = world;
    KIT.input.setPlayers(world.coop ? 2 : 1);
    return world;
  }

  // ---- saving ------------------------------------------------------------------------
  function snapshot() {
    const w = G.world;
    if (!w) return null;
    w.saveHeroPositions();
    w.save.activeHero = w.activeHero;
    w.save.playtimeMs = Math.round(playtimeMs);
    w.save.music = { current: KIT.audio.current(), saved: w.save.music ? w.save.music.saved : null };
    return w.save;
  }
  G.save = async function (slot) {
    const s = snapshot();
    if (!s) return false;
    return await KIT.storage.saveGame(slot || 'autosave', s);
  };
  function queueAutosave() {
    if (autosaveQueued) return;
    autosaveQueued = true;
    setTimeout(() => { autosaveQueued = false; G.save('autosave'); }, 50);
  }

  // ---- the loop -------------------------------------------------------------------------
  /** The camera clamps to what really fits on screen — `world.viewport`, never the saved project. */
  function syncViewport() {
    if (!G.renderer || !G.world) return;
    const vt = G.renderer.viewTiles();
    const vp = G.world.viewport || (G.world.viewport = { w: vt.w, h: vt.h });
    if (vp.w !== vt.w || vp.h !== vt.h) { vp.w = vt.w; vp.h = vt.h; }
  }

  function step(dt) {
    KIT.scenes.update(dt);
    const w = G.world;
    const top = KIT.scenes.top();
    syncViewport();
    if (w && w.map && !(top && top.pausesWorld)) {
      w.update(dt);
      playtimeMs += dt * 1000;
      updateCommandRoutes(dt);
      if (cameraScroll) { w.camera.x += cameraScroll.x; w.camera.y += cameraScroll.y; }
      const h = w.hero();
      if (h) KIT.audio.setListener({ map: w.map.id, x: h.x, y: h.y });
    }
  }
  function updateCommandRoutes(dt) {
    const w = G.world;
    const all = w.entities.concat(w.heroes, w.companion ? [w.companion] : []);
    for (const e of all) {
      if (!e.data.commandRoute) continue;
      if (e.route && !e.route.done) continue;      // the movement system steps it
      {
        e.data.commandRoute = false;
        for (let i = commandRoutes.length - 1; i >= 0; i--) {
          if (commandRoutes[i].e === e) { commandRoutes[i].resolve(); commandRoutes.splice(i, 1); }
        }
      }
    }
  }
  function render() {
    if (!G.renderer) return;
    if (G.world && G.world.map) G.renderer.render(G.world);
  }
  function frame(t) {
    raf = root.requestAnimationFrame(frame);
    const dt = Math.min(0.25, (t - last) / 1000 || 0);
    last = t;
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard++ < 6) { step(STEP); acc -= STEP; }
    render();
  }
  function startLoop() {
    if (raf) return;
    last = nowMs();
    raf = root.requestAnimationFrame(frame);
  }

  // ---- boot -----------------------------------------------------------------------------
  G.resize = function () {
    if (!G.renderer) return;
    G.renderer.resize();
    syncViewport();
    render();
  };

  /** boot({ mount, project }) -> Promise<KIT.game> */
  G.boot = async function (opts) {
    opts = opts || {};
    readFlags();
    await KIT.storage.ready();

    G.project = opts.project || KIT.project.blank();
    useAssets(G.project);
    KIT.storage.projectId((G.project.meta && G.project.meta.id) || 'kit');

    canvas = KIT.ui.el('game-canvas');
    controls = KIT.ui.el('controls');
    if (!canvas) throw new Error('KIT.game.boot: no #game-canvas in the page');

    const s = settings();
    KIT.audio.setEnabled(s.sound !== false);
    KIT.audio.setMusic(s.music !== false);
    KIT.audio.setVolume('sound', s.soundVolume == null ? 0.9 : s.soundVolume);
    KIT.audio.setVolume('music', s.musicVolume == null ? 0.5 : s.musicVolume);

    G.ports = buildPorts();
    G.renderer = KIT.renderer.create({ canvas, project: G.project });
    G.resize();

    KIT.input.attach(canvas);
    KIT.input.mount(controls, { players: s.coop ? 2 : 1 });
    KIT.input.onPress((ev) => {
      KIT.audio.unlock();
      KIT.scenes.input(ev);
    });
    root.addEventListener('resize', () => G.resize());
    if (typeof ResizeObserver === 'function') {          // the layout settles after the first frames
      const ro = new ResizeObserver(() => G.resize());
      ro.observe(canvas.parentNode || canvas);
    }
    root.addEventListener('orientationchange', () => setTimeout(() => G.resize(), 120));
    if (typeof document !== 'undefined') {
      document.addEventListener('visibilitychange', () => { if (!document.hidden) KIT.audio.unlock(); });
    }
    startLoop();
    G.booted = true;

    if (G.flags.edit && KIT.editor && typeof KIT.editor.open === 'function') { KIT.editor.open(G); return G; }
    if (G.flags.test) {
      const st = (G.project.testStates || []).find(t => t.id === G.flags.test);
      await G.newGame({ testState: st || null });
      return G;
    }
    titleLoop();
    return G;
  };

  /** The title runs in a loop: New Game or Continue leaves it, Settings comes back. */
  async function titleLoop() {
    for (;;) {
      const action = await KIT.scenes.run('title', { project: G.project, game: G });
      if (action === 'continue') {
        const ok = await G.continueGame();
        if (ok) return;
        await KIT.toast('No save to continue from yet.');
        continue;
      }
      await G.newGame({});
      return;
    }
  }

  G.toTitle = function () {
    KIT.scenes.clear();
    KIT.fx.reset();
    G.world = null;
    KIT.audio.music(null, { fade: 200 });
    titleLoop();
  };

  // ---- new game / continue ----------------------------------------------------------------
  G.newGame = async function (opts) {
    opts = opts || {};
    const project = G.project;
    const testState = opts.testState || null;
    const save = blankSave(project, testState);
    if (opts.names) (opts.names || []).forEach((n, i) => { if (save.heroes[i] && n) save.heroes[i].name = n; });
    playtimeMs = 0;

    const meta = KIT.storage.meta();
    await KIT.storage.saveMeta({ runs: (meta.runs || 0) + 1, firstPlayed: meta.firstPlayed || new Date().toISOString() });

    const world = buildWorld(save);
    KIT.scenes.clear();
    KIT.fx.reset();
    KIT.scenes.push('map', { game: G });
    const at = save.heroes[0];
    await world.enterMap(at.map || project.start.map, at.x, at.y, at.dir);
    await G.save('autosave');
    await KIT.interpreter.runAuto(project, world.makeCtx(null, world.hero().id));
    return world;
  };

  /** continueGame(slot) — a named slot, or (with no slot) the most recent save of any kind. */
  G.continueGame = async function (slot) {
    let save = null;
    if (slot) save = await KIT.storage.loadGame(slot);
    else {
      const list = (await KIT.storage.listGames()).filter(s => s.exists);
      list.sort((a, b) => String(b.savedAt || '').localeCompare(String(a.savedAt || '')));
      if (list[0]) save = await KIT.storage.loadGame(list[0].slot);
    }
    if (!save) return false;
    playtimeMs = save.playtimeMs || 0;
    const world = buildWorld(save);
    KIT.scenes.clear();
    KIT.fx.reset();
    KIT.scenes.push('map', { game: G });
    const at = (save.heroes && save.heroes[0]) || {};
    await world.enterMap(at.map || G.project.start.map, at.x || 0, at.y || 0, at.dir || 'down');
    if (save.music && save.music.current) KIT.audio.music(save.music.current, { fade: 300 });
    return true;
  };

  // ---- runtime controls ----------------------------------------------------------------------
  G.openMenu = function () { return KIT.scenes.run('menu', { game: G }); };
  G.openDebug = function () { return KIT.scenes.run('debug', { game: G }); };
  G.swapHero = function () {
    const w = G.world;
    if (!w || w.heroes.length < 2) return;
    w.setActiveHero((w.activeHero + 1) % w.heroes.length);
    KIT.audio.play('blip');
  };
  /** setCoop(on) — two heroes on screen, one pad each; off puts hero 2 back on the trail. */
  G.setCoop = function (on) {
    const w = G.world;
    KIT.storage.saveSettings({ coop: !!on });
    KIT.input.setPlayers(on ? 2 : 1);
    if (!w) return;
    w.coop = !!on;
    const second = w.heroes[1];
    if (second) {
      second.visible = true;
      second.solid = !!on;
      if (on) {
        const lead = w.hero(0);
        if (second.x === lead.x && second.y === lead.y) {
          for (const dir of ['left', 'right', 'down', 'up']) {
            const r = w.map.passable(lead.x, lead.y, dir, second);
            if (r.ok && r.to) { place(second, r.to.x, r.to.y); break; }
          }
        }
        w.setActiveHero(0);
      } else {
        second.data.trail = [];
      }
    }
    w.rebuildEntities();
  };

  // ---- the testability API (§12) ----------------------------------------------------------------
  Object.defineProperty(G, 'state', { get() { return G.world ? G.world.save : null; } });
  G.scene = function () { const t = KIT.scenes.top(); return t ? t.id : null; };
  G.warp = function (map, x, y, dir) { return G.ports.map.transfer({ map, x, y, dir: dir || 'down', fade: false }); };
  G.press = function (key, player, ms) { KIT.input.press(key, player || 1, ms); return G; };
  G.hold = function (key, player, down) { KIT.input.set(key, player || 1, down !== false); return G; };
  /** tick(ms) — advance the fixed-step loop by hand (tests; the rAF loop keeps running too). */
  G.tick = function (ms) {
    let left = (ms == null ? 16 : ms) / 1000;
    let guard = 0;
    while (left > 0 && guard++ < 600) { step(Math.min(STEP, left)); left -= STEP; }
    render();
    return G;
  };
  /** Register the project's imported images and start decoding them; redraw as they arrive. */
  function useAssets(project) {
    if (!KIT.assets) return;
    KIT.project.registerContent(project);          // imported tiles/sprites/faces/icons + assets
    KIT.assets.fromProject(project);
    if (!useAssets.watching && KIT.pixels.onImageLoaded) {
      useAssets.watching = KIT.pixels.onImageLoaded(() => { if (G.renderer) G.renderer.clearCaches(); });
    }
    KIT.assets.loadAll().then((r) => { if (r.ready && G.renderer) G.renderer.clearCaches(); });
  }
  G.useAssets = useAssets;

  /** loadProject(project) — swap the whole world (tests, the editor, an import). */
  G.loadProject = function (project) {
    const n = KIT.project.normalize(project);
    G.project = n.project;
    useAssets(G.project);
    KIT.storage.projectId((G.project.meta && G.project.meta.id) || 'kit');
    if (G.renderer) { G.renderer.setProject(G.project); G.resize(); }
    const top = KIT.scenes.top();
    if (top && top.id === 'title') {           // redraw the title for the new project without ending the title loop
      if (top.exit) top.exit();
      if (top.enter) top.enter({ project: G.project, game: G });
    }
    return n.problems;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<!-- Art (each file registers into the kit registries; missing art is drawn as a silhouette) -->
<script>
// ---- js/art/tiles.js ----
// Tile art registration. The art lives in tiles-nature.js / tiles-town.js /
// tiles-interior.js, which call PKMN.TILES.register([...]) with entries of the
// form { id, name, group, solid, palette, rows | frames, ... } (§6.2). Those
// calls are thin aliases that forward to the kit's 'tiles' registry — the
// registry fills the flag defaults, and a tile definition is its own art
// (KIT.pixels.artOf(def) returns it). Stamps (multi-tile brushes) are kept on
// KIT.registry('tiles').stamps. Nothing here touches pixel data.
//
// Requires the kit core (registry, schema, registries, pixels, world/tiles) to
// be loaded first.
(function (root) {
  const KIT = root.KIT;
  const PKMN = root.PKMN = root.PKMN || {};
  const reg = KIT.registry('tiles');
  const T = PKMN.TILES = PKMN.TILES || {};

  const titleCase = (id) => id.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  /** register(tiles) — forwards to KIT.registry('tiles').addAll after the legacy w/h/name/group defaults. */
  T.register = function (tiles) {
    const list = [];
    for (const t of tiles) {
      if (!t || !t.id) continue;
      if (t.w == null) t.w = 16;
      if (t.h == null) t.h = 16;
      if (t.group == null) t.group = 'nature';
      if (!t.name) t.name = titleCase(t.id);
      if (reg.has(t.id)) t.replace = true;   // art files may be re-run (tools); replacing the same id is not a warning
      list.push(t);
    }
    reg.addAll(list);
  };

  /** registerStamps(stamps) — upserts into KIT.registry('tiles').stamps ({ id, name, group, tiles:[[ids]] }). */
  T.registerStamps = function (stamps) {
    const all = reg.stamps = reg.stamps || [];
    for (const s of stamps) {
      const i = all.findIndex(x => x.id === s.id);
      if (i >= 0) all[i] = s; else all.push(s);
    }
  };

  // Legacy views over the registry (the art tools read these).
  Object.defineProperty(T, 'list', { get: () => reg.list() });
  Object.defineProperty(T, 'byId', { get: () => { const o = {}; for (const t of reg.list()) o[t.id] = t; return o; } });
  Object.defineProperty(T, 'stamps', { get: () => reg.stamps });
  T.groups = ['nature', 'town', 'interior', 'cave'];
  /** Frame to draw for an animated tile at time t (ms) — KIT.tiles.frameAt. */
  T.frameAt = (tile, t) => KIT.tiles.frameAt(tile, t);

  // The pixel helpers moved to KIT.pixels; keep the old name for the art tools.
  PKMN.Pixels = KIT.pixels;

  const house = (roof) => [
    [roof, roof, roof, roof, roof],
    [roof + '-eave', roof + '-eave', roof + '-eave', roof + '-eave', roof + '-eave'],
    ['wall', 'wall-window', 'wall', 'wall-window', 'wall'],
    ['wall', 'wall', 'door', 'wall', 'wall'],

<script>
// ---- js/art/chars.js ----
// Character sprite registration. The art lives in chars-heroes.js /
// chars-npcs.js which call PKMN.CHARS.register([...]) and
// PKMN.CHARS.registerRecolorable(id, {...}). Those are thin aliases over the
// kit's 'sprites' registry (§6.3): entries are { id, name, group, w, h,
// palette, frames:{ down, up, left } } with 3 frames [stand, stepA, stepB] per
// direction; right is the mirrored left. Recolourable parts live on
// KIT.registry('sprites').recolorable. Nothing here touches pixel data.
//
// Requires the kit core (registry, schema, registries) to be loaded first.
(function (root) {
  const KIT = root.KIT;
  const PKMN = root.PKMN = root.PKMN || {};
  const reg = KIT.registry('sprites');
  reg.recolorable = reg.recolorable || {};
  const C = PKMN.CHARS = PKMN.CHARS || {};
  const SP = KIT.sprites = KIT.sprites || {};

  const titleCase = (id) => id.replace(/-/g, ' ').replace(/\b\w/g, ch => ch.toUpperCase());

  /** register(chars) — forwards to KIT.registry('sprites').addAll after the legacy w/h/name/group defaults. */
  C.register = function (chars) {
    const list = [];
    for (const c of chars) {
      if (!c || !c.id) continue;
      if (c.w == null) c.w = 16;
      if (c.h == null) c.h = 24;
      if (!c.name) c.name = titleCase(c.id);
      if (!c.group) c.group = 'npc';
      if (reg.has(c.id)) c.replace = true;
      list.push(c);
    }
    reg.addAll(list);
  };
  /** registerRecolorable(id, parts) — parts: { hair:['h','H'], shirt:['s','S'], ... } palette keys per recolourable part. */
  C.registerRecolorable = function (id, parts) { reg.recolorable[id] = parts; };

  // Walk cycle: stand, stepA, stand, stepB  (frames array = [stand, stepA, stepB])
  SP.WALK_SEQUENCE = [0, 1, 0, 2];
  /** frame(sprite, dir, i) -> { rows, mirror } for a sprite facing `dir` at walk-cycle index `i` (0-3). */
  SP.frame = function (ch, dir, i) {
    const fi = SP.WALK_SEQUENCE[((i % 4) + 4) % 4];
    const d = dir === 'right' ? 'left' : dir;
    const frames = ch.frames[d] || ch.frames.down;
    return { rows: frames[Math.min(fi, frames.length - 1)], mirror: dir === 'right' };
  };
  SP.recolorable = reg.recolorable;

  // Legacy views over the registry.
  C.WALK_SEQUENCE = SP.WALK_SEQUENCE;
  C.frame = SP.frame;
  Object.defineProperty(C, 'list', { get: () => reg.list() });
  Object.defineProperty(C, 'byId', { get: () => { const o = {}; for (const c of reg.list()) o[c.id] = c; return o; } });
  Object.defineProperty(C, 'recolorable', { get: () => reg.recolorable });

  if (typeof module !== 'undefined' && module.exports) module.exports = PKMN;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>
// ---- js/art/chars-placeholder.js ----
// Placeholder characters. Real pixel art can replace any of these later by
// registering the same id from another file (the registry replaces by id).
// Each one is generated here from a few colours: a big head, a body, two legs
// that alternate, and a back view with no face — enough to read as a person and
// to animate while the real art is drawn.
(function (root) {
  const KIT = root.KIT;
  if (!KIT || !KIT.registry) return;
  const reg = KIT.registry('sprites');

  const W = 16, H = 24;
  // '.' transparent, 'o' outline, 's' skin, 'h' hair, 'b' body, 'p' legs, 'e' eye, 'w' white
  const BASE = [
    '................', '.....oooooo.....', '....ohhhhhho....', '...ohhhhhhhho...',
    '...ohhhhhhhho...', '...osssssssso...', '...osesssseso...', '...osssssssso...',
    '...osssssssso...', '....oossssoo....', '......oooo......', '....obbbbbbo....',
    '...obbbbbbbbo...', '...obbbbbbbbo...', '...obbbbbbbbo...', '...obbbbbbbbo...',
    '...osbbbbbbso...', '....obbbbbbo....', '.....oppppo.....', '.....oppppo.....',
    '.....op..po.....', '....oppo.oppo...', '....oooo.oooo...', '................',
  ];
  const clone = (rows) => rows.slice();
  const put = (rows, y, x, ch) => { const r = rows[y].split(''); r[x] = ch; rows[y] = r.join(''); };

  function frames(kind) {
    const stand = clone(BASE);
    if (kind === 'up') { for (const y of [6]) stand[y] = '...osssssssso...'; for (const y of [3, 4, 5, 6, 7, 8]) stand[y] = stand[y].replace(/s/g, 'h'); }
    if (kind === 'left') { put(stand, 6, 9, 's'); put(stand, 6, 10, 'e'); put(stand, 6, 4, 's'); put(stand, 6, 5, 's'); }
    const a = clone(stand), b = clone(stand);
    // step A: left leg forward, step B: right leg forward (and a 1px head bob)
    a[21] = '....oppo..oo....'; a[22] = '....oooo..oo....';
    b[21] = '....oo..oppo....'; b[22] = '....oo..oooo....';
    return [stand, a, b];
  }

  function character(id, name, group, colors) {
    const palette = { o: colors.outline || '#3a2a20', s: colors.skin || '#f8d0b0', h: colors.hair || '#5a3a1a', b: colors.shirt || '#e04040', p: colors.pants || '#3060c0', e: '#241a16', w: '#ffffff' };
    return { id, name, group: group || 'npc', w: W, h: H, palette, placeholder: true,
      frames: { down: frames('down'), up: frames('up'), left: frames('left') } };
  }

  const PEOPLE = [
    ['hero-boy', 'Hero (boy)', 'hero', { hair: '#5a3a1a', shirt: '#e04040', pants: '#3060c0' }],
    ['hero-girl', 'Hero (girl)', 'hero', { hair: '#7a4a28', shirt: '#68c0e8', pants: '#e06098' }],
    ['kid-boy', 'Kid (boy)', 'npc', { hair: '#241a16', shirt: '#58b848', pants: '#8a6a40' }],
    ['kid-girl', 'Kid (girl)', 'npc', { hair: '#f0d070', shirt: '#f08ab8', pants: '#f08ab8' }],
    ['woman', 'Woman', 'npc', { hair: '#6a4426', shirt: '#f8d878', pants: '#c06030' }],
    ['man', 'Man', 'npc', { hair: '#30241c', shirt: '#4878c0', pants: '#a08858' }],
    ['grandma', 'Grandma', 'npc', { hair: '#d8d8e0', shirt: '#a878c8', pants: '#786090' }],
    ['grandpa', 'Grandpa', 'npc', { hair: '#d8d8e0', shirt: '#8a6a40', pants: '#5a4a38' }],
    ['professor', 'Professor', 'npc', { hair: '#9a9a9a', shirt: '#f0f0f0', pants: '#585868' }],
    ['nurse', 'Nurse', 'npc', { hair: '#f090b0', shirt: '#ffffff', pants: '#f0a0c0' }],
    ['clerk', 'Clerk', 'npc', { hair: '#3a2a20', shirt: '#3a70b8', pants: '#2a4a78' }],
    ['trainer', 'Trainer', 'npc', { hair: '#d85030', shirt: '#303040', pants: '#487848' }],
  ];
  for (const [id, name, group, colors] of PEOPLE) if (!reg.has(id) || (reg.get(id) || {}).placeholder) reg.add(Object.assign(character(id, name, group, colors), { replace: true }));

  // A pokéball on a stand: a small round marker used for objects that are not people.
  if (!reg.has('pokeball')) reg.add({ id: 'pokeball', name: 'Poké Ball', group: 'object', w: 16, h: 24, placeholder: true,
    palette: { o: '#3a2a20', r: '#e04040', w: '#f8f8f8', k: '#585868' },
    frames: (function () {
      const empty = '................';
      const rows = [];
      for (let i = 0; i < 24; i++) rows.push(empty);
      const art = ['.....oooooo.....', '....orrrrrro....', '...orrrrrrrro...', '...orrrrrrrro...', '...ooookkoooo...', '...owwwkkwwwo...', '...owwwwwwwwo...', '....owwwwwwo....', '.....oooooo.....'];
      for (let i = 0; i < art.length; i++) rows[13 + i] = art[i];
      const one = rows.slice();
      return { down: [one, one, one], up: [one, one, one], left: [one, one, one] };
    })() });

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

  PKMN.effectiveness = function (moveType, defenderTypes) {
