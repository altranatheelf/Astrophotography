<script>
// ---- js/kit/world/document.js ----
// The document: the project is edited ONLY through here. Every change is an
// operation with an inverse, so undo/redo, dirty tracking, autosave, live
// re-render and validation all hang off one door.
//
//   const doc = KIT.document(project)
//   doc.apply([{ op:'set', path:['maps','town','name'], value:'Town' }], { label:'Rename' })
//   doc.transaction('Paint', () => { doc.apply(...); doc.apply(...); })   // one undo step
//   doc.undo(); doc.redo(); doc.watch(['maps','town'], fn); doc.snapshot('Before chapter 2')
(function (root) {
  const KIT = root.KIT = root.KIT || {};

  const P = KIT.path = KIT.path || {};
  P.get = function (obj, path) {
    let cur = obj;
    for (const k of path) { if (cur === null || cur === undefined) return undefined; cur = cur[k]; }
    return cur;
  };
  P.has = function (obj, path) {
    if (!path.length) return true;
    const parent = P.get(obj, path.slice(0, -1));
    const k = path[path.length - 1];
    return parent !== null && parent !== undefined && typeof parent === 'object' && (Array.isArray(parent) ? k < parent.length : Object.prototype.hasOwnProperty.call(parent, k));
  };
  P.join = (path) => path.map(k => String(k)).join('/');
  P.parse = (s) => (s === '' ? [] : String(s).split('/').map(k => (/^\d+$/.test(k) ? Number(k) : k)));
  P.isPrefix = (prefix, path) => { if (prefix.length > path.length) return false; for (let i = 0; i < prefix.length; i++) if (prefix[i] !== path[i]) return false; return true; };
  P.related = (a, b) => P.isPrefix(a, b) || P.isPrefix(b, a);

  function ensureParent(rootObj, path) {
    // Creates missing intermediate OBJECTS (never arrays). Returns the parent container.
    let cur = rootObj;
    for (let i = 0; i < path.length - 1; i++) {
      const k = path[i];
      if (cur[k] === null || cur[k] === undefined || typeof cur[k] !== 'object') cur[k] = {};
      cur = cur[k];
    }
    return cur;
  }

  KIT.document = function document(initial, opts) {
    opts = opts || {};
    let value = initial;
    const undoStack = [], redoStack = [];
    const watchers = [];
    const snapshots = [];
    let txDepth = 0, txOps = null, txInverse = null, txLabel = null;
    let dirty = false;
    let seq = 0;

    function applyOne(op) {
      // returns the inverse op
      const path = op.path;
      if (op.op === 'set') {
        if (path.length === 0) { const prev = value; value = op.value; return { op: 'set', path: [], value: prev }; }
        const parent = ensureParent(value, path);
        const k = path[path.length - 1];
        const existed = Array.isArray(parent) ? k < parent.length : Object.prototype.hasOwnProperty.call(parent, k);
        const prev = parent[k];
        parent[k] = op.value;
        return existed ? { op: 'set', path, value: prev } : { op: 'del', path };
      }
      if (op.op === 'del') {
        if (path.length === 0) throw new Error('document: cannot delete the root');
        const parent = P.get(value, path.slice(0, -1));
        const k = path[path.length - 1];
        if (parent === null || parent === undefined || typeof parent !== 'object') return null;
        if (Array.isArray(parent)) {
          if (k >= parent.length) return null;
          const removed = parent.splice(k, 1);
          return { op: 'splice', path: path.slice(0, -1), index: k, remove: 0, insert: removed };
        }
        if (!Object.prototype.hasOwnProperty.call(parent, k)) return null;
        const prev = parent[k];
        delete parent[k];
        return { op: 'set', path, value: prev };
      }
      if (op.op === 'splice') {
        const arr = P.get(value, path);
        if (!Array.isArray(arr)) throw new Error(`document: splice target is not an array at ${P.join(path)}`);
        const insert = op.insert || [];
        const removed = arr.splice(op.index, op.remove || 0, ...insert);
        return { op: 'splice', path, index: op.index, remove: insert.length, insert: removed };
      }
      throw new Error(`document: unknown op '${op.op}'`);
    }

    function notify(ops, inverse, label, kind) {
      if (!ops.length) return;
      const paths = ops.map(o => o.path);
      const change = { ops, inverse, label, kind, seq: ++seq, paths };
      for (const w of watchers.slice()) {
        if (w.prefix.length === 0 || paths.some(p => P.related(w.prefix, p))) {
          try { w.fn(change); } catch (e) { (KIT.log || console).error('[document] watcher threw', e); }
        }
      }
    }

    const doc = {
      get value() { return value; },
      get(path) { return P.get(value, path || []); },
      has(path) { return P.has(value, path); },
      get dirty() { return dirty; },
      markClean() { dirty = false; },
      get history() { return undoStack.map(e => e.label); },
      get redoHistory() { return redoStack.map(e => e.label); },
      canUndo() { return undoStack.length > 0; },
      canRedo() { return redoStack.length > 0; },
      get inTransaction() { return txDepth > 0; },

      /** apply(ops, { label }) — ops are applied in order; returns the inverse ops (in reverse order). */
      apply(ops, o) {
        o = o || {};
        if (!Array.isArray(ops)) ops = [ops];
        const inverse = [];
        for (const op of ops) {
          if (!op || !Array.isArray(op.path)) throw new Error('document: op needs a path array');
          const inv = applyOne(op);
          if (inv) inverse.unshift(inv);
        }
        if (!inverse.length) return inverse;
        dirty = true;
        if (txDepth > 0) { txOps.push(...ops); txInverse.unshift(...inverse); }
        else { undoStack.push({ label: o.label || 'Edit', ops: ops.slice(), inverse: inverse.slice() }); redoStack.length = 0; }
        notify(ops, inverse, o.label || txLabel || 'Edit', 'apply');
        return inverse;
      },
      set(path, v, o) { return doc.apply([{ op: 'set', path, value: v }], o); },
      del(path, o) { return doc.apply([{ op: 'del', path }], o); },
      splice(path, index, remove, insert, o) { return doc.apply([{ op: 'splice', path, index, remove, insert: insert || [] }], o); },
      push(path, item, o) { const arr = P.get(value, path); return doc.splice(path, Array.isArray(arr) ? arr.length : 0, 0, [item], o); },

      /** Everything applied inside fn is ONE undo step. Nested transactions flatten into the outermost. Returns fn's result. */
      transaction(label, fn) {
        if (txDepth === 0) { txOps = []; txInverse = []; txLabel = label; }
        txDepth++;
        let result;
        try { result = fn(doc); }
        finally {
          txDepth--;
          if (txDepth === 0) {
            if (txOps.length) { undoStack.push({ label: txLabel || 'Edit', ops: txOps, inverse: txInverse }); redoStack.length = 0; }
            txOps = txInverse = null; txLabel = null;
          }
        }
        return result;
      },
      undo() {
        if (txDepth > 0) throw new Error('document: cannot undo inside a transaction');
        const entry = undoStack.pop();
        if (!entry) return false;
        const inv = [];
        for (const op of entry.inverse) { const i = applyOne(op); if (i) inv.unshift(i); }
        redoStack.push({ label: entry.label, ops: entry.inverse, inverse: inv });
        dirty = true;
        notify(entry.inverse, inv, entry.label, 'undo');
        return true;
      },
      redo() {
        if (txDepth > 0) throw new Error('document: cannot redo inside a transaction');
        const entry = redoStack.pop();
        if (!entry) return false;
        const inv = [];
        for (const op of entry.inverse) { const i = applyOne(op); if (i) inv.unshift(i); }
        undoStack.push({ label: entry.label, ops: entry.inverse, inverse: inv });
        dirty = true;
        notify(entry.inverse, inv, entry.label, 'redo');
        return true;
      },
      /** watch(prefixPath, fn) — fn({ ops, inverse, label, kind, seq, paths }) when anything at/under/above the prefix changes. Returns unsubscribe. */
      watch(prefix, fn) {
        const w = { prefix: prefix || [], fn };
        watchers.push(w);
        return () => { const i = watchers.indexOf(w); if (i >= 0) watchers.splice(i, 1); };
      },
      /** Replace the whole document (one undo step). */
      replace(next, o) { return doc.apply([{ op: 'set', path: [], value: next }], Object.assign({ label: 'Replace' }, o || {})); },
      snapshot(label) {
        const id = KIT.uid('snap');
        snapshots.push({ id, label: label || `Snapshot ${snapshots.length + 1}`, value: KIT.deepClone(value), seq });
        if (opts.maxSnapshots && snapshots.length > opts.maxSnapshots) snapshots.shift();
        return id;
      },
      snapshots() { return snapshots.map(s => ({ id: s.id, label: s.label, seq: s.seq })); },
      restore(id) {
        const s = snapshots.find(x => x.id === id);
        if (!s) return false;
        doc.replace(KIT.deepClone(s.value), { label: `Restore "${s.label}"` });
        return true;
      },
      deleteSnapshot(id) { const i = snapshots.findIndex(x => x.id === id); if (i >= 0) snapshots.splice(i, 1); return i >= 0; },
      clearHistory() { undoStack.length = 0; redoStack.length = 0; },
    };
    return doc;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// ---- js/kit/world/project.js ----
// KIT.project — the project (world) format v3: schema, normalize (migrate +
// fill defaults), validate, helpers, export/import of content files.
// Contract: docs/ARCHITECTURE.md §5 (format), §4.2 (persistence), §3.2 (schema).
//
// Shapes (see the contract for the full picture):
// @typedef {{ version:3, meta:Meta, modules:string[], settings:Object, strings:Object<string,string>, heroes:Hero[], start:Start,
//             vars:Object<string,VarDecl>, items:Object<string,Item>, scripts:Object<string,Script>, fragments:Fragment[],
//             testStates:TestState[], autotiles:Object<string,AutotileSet>, terrains:Terrain[], world:World, maps:Object<string,Map>, packs:Object }} Project
// @typedef {{ id:string, title:string, subtitle:string, author:string, pitch:string, created:string }} Meta
// @typedef {{ id:string, name:string, sprite:string|null, recolor:Object }} Hero
// @typedef {{ map:string|null, x:number, y:number, dir:string }} Start
// @typedef {{ type:'number'|'bool'|'string', default:*, label:string, group:string }} VarDecl
// @typedef {{ kind:string, name:string, icon:string|null, desc:string, note:string, props:Object }} Item
// @typedef {{ label:string, trigger:'call'|'auto'|'parallel', when:Object|null, params:string[], body:Object[], note:string }} Script
// @typedef {{ id:string, name:string, width:number, height:number, kind:string, music:string|null, note:string,
//             layers:{ terrain:number[], ground:(string|null)[], deco:(string|null)[], above:(string|null)[], regions:number[] },
//             collision:(null|0|1|'n'|'s'|'e'|'w')[], objects:MapObject[], props:Object }} Map
// @typedef {{ id:string, name:string, type:string, x:number, y:number, note:string, pages:Page[] }} MapObject
// @typedef {{ when:Object|null, sprite:string|null, dir:string, layer:'same'|'below'|'above', through:boolean, dirFix:boolean, stepAnim:boolean,
//             visible:boolean, behaviour:Object, on:Object<string,Object[]>, once:boolean, needsBoth:boolean, props:Object }} Page
// @typedef {{ severity:'error'|'warn', code:string, message:string, where:{ map?:string, object?:string, page?:number, slot?:string, script?:string, path?:Array } }} Problem
// @typedef {{ map?:string, object?:string, page?:number, slot?:string, script?:string, path:Array }} Where
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const S = KIT.schema;
  const P = KIT.project = KIT.project || {};

  P.VERSION = 3;
  P.SLOTS = ['interact', 'step', 'touch', 'enter', 'tick', 'init'];
  P.LAYERS = ['terrain', 'ground', 'deco', 'above', 'regions'];
  P.GROUND_BY_KIND = { outdoor: 'grass', garden: 'grass', indoor: 'floor-wood', cave: 'cave-floor' };
  P.MAP_KINDS = ['outdoor', 'indoor', 'cave', 'garden'];
  const ID_PATTERN = '^[a-z0-9][a-z0-9-_.:]*$';
  const idField = (key) => ({ key: key || 'id', type: 'string', min: 1, pattern: ID_PATTERN, patternMessage: 'ids are lowercase letters, digits, - _ . :' });
  const titleCase = (s) => String(s || '').replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  // ---- field schemas (§5) --------------------------------------------------
  // Maps, objects, pages and slots are validated by dedicated code below (they
  // are big); everything else is a plain KIT.schema field list.
  const F = P.fields = {
    meta: [
      idField('id'), { key: 'title', type: 'string', default: 'Our Adventure' }, { key: 'subtitle', type: 'string' }, { key: 'author', type: 'string' },
      { key: 'pitch', type: 'text', doc: 'Two sentences: who the hero is and what they want.' }, { key: 'created', type: 'string', optional: true },
    ],
    settings: [
      { key: 'tileSize', type: 'number', integer: true, min: 8, max: 64, default: 16 },
      { key: 'viewport', type: 'group', fields: [{ key: 'w', type: 'number', integer: true, min: 4, default: 16 }, { key: 'h', type: 'number', integer: true, min: 4, default: 12 }] },
      { key: 'textSpeed', type: 'enum', options: ['slow', 'normal', 'fast', 'instant'], default: 'normal' },
      { key: 'zoom', type: 'enum', options: ['auto', 'small', 'normal', 'large'], default: 'auto' },
      { key: 'coop', type: 'group', fields: [{ key: 'enabled', type: 'bool', default: false }] },
      { key: 'palette', type: 'group', fields: [{ key: 'remap', type: 'strings' }, { key: 'tint', type: 'color', nullable: true, default: null }, { key: 'amount', type: 'number', min: 0, max: 1, default: 0 }] },
      { key: 'clock', type: 'group', fields: [{ key: 'enabled', type: 'bool', default: false }, { key: 'minutesPerStep', type: 'number', min: 0, default: 1 }, { key: 'minutesPerSecond', type: 'number', min: 0, default: 0 }] },
      { key: 'encounterRate', type: 'number', min: 0, max: 100, default: 12 },
    ],
    hero: [idField('id'), { key: 'name', type: 'string', default: 'Player' }, { key: 'sprite', type: 'ref:sprite' }, { key: 'recolor', type: 'strings' }],
    start: [{ key: 'map', type: 'ref:map' }, { key: 'x', type: 'number', integer: true, min: 0 }, { key: 'y', type: 'number', integer: true, min: 0 }, { key: 'dir', type: 'direction' }],
    var: [{ key: 'type', type: 'enum', options: ['number', 'bool', 'string'], default: 'number' }, { key: 'label', type: 'string' }, { key: 'group', type: 'string' }],
    asset: [
      { key: 'kind', type: 'enum', options: ['image'], default: 'image' },

      { key: 'w', type: 'number', integer: true, min: 0, default: 0 }, { key: 'h', type: 'number', integer: true, min: 0, default: 0 },
      { key: 'from', type: 'string', optional: true, doc: 'The tool and file it came from' }, { key: 'note', type: 'note', optional: true },
    ],
    item: [{ key: 'kind', type: 'string', default: 'item' }, { key: 'name', type: 'string' }, { key: 'icon', type: 'ref:icon' }, { key: 'desc', type: 'text' }, { key: 'note', type: 'note' }],

    terrain: [{ key: 'id', type: 'number', integer: true, min: 1 }, { key: 'name', type: 'string' }, { key: 'color', type: 'color', default: '#58b848' }, { key: 'base', type: 'tile', nullable: true, default: null }],

    map: [
      idField('id'), { key: 'name', type: 'string' }, { key: 'width', type: 'number', integer: true, min: 1, max: 512, default: 20 }, { key: 'height', type: 'number', integer: true, min: 1, max: 512, default: 15 },
      { key: 'kind', type: 'string', default: 'outdoor' }, { key: 'music', type: 'ref:music' }, { key: 'note', type: 'note' },
    ],
    object: [idField('id'), { key: 'name', type: 'string' }, { key: 'type', type: 'string', default: 'npc' }, { key: 'x', type: 'number', integer: true, min: 0 }, { key: 'y', type: 'number', integer: true, min: 0 }, { key: 'note', type: 'note' }],
    page: [
      { key: 'when', type: 'condition', doc: 'The LAST page whose condition passes is the active one.' }, { key: 'sprite', type: 'ref:sprite' }, { key: 'dir', type: 'direction' },
      { key: 'layer', type: 'enum', options: ['same', 'below', 'above'], default: 'same' }, { key: 'through', type: 'bool' }, { key: 'dirFix', type: 'bool' }, { key: 'stepAnim', type: 'bool' },
      { key: 'visible', type: 'bool', default: true }, { key: 'once', type: 'bool', doc: 'Sugar for self.done on interact/step/touch.' }, { key: 'needsBoth', type: 'bool' },
    ],
    behaviour: [
      { key: 'kind', type: 'enum', options: ['none', 'wander', 'look', 'route', 'approach'], default: 'none' }, { key: 'radius', type: 'number', integer: true, min: 0, max: 50, default: 3, display: 'radius', when: { field: 'kind', eq: 'wander' } },
      { key: 'speed', type: 'number', min: 0.1, max: 20, default: 1 }, { key: 'frequency', type: 'number', min: 0, max: 10, default: 2 }, { key: 'route', type: 'route', when: { field: 'kind', eq: 'route' } }, { key: 'repeat', type: 'bool', default: true },
    ],
    autotileGroup: [idField('id'), { key: 'name', type: 'string' }, { key: 'active', type: 'bool', default: true }, { key: 'terrain', type: 'number', integer: true, default: 0 }, { key: 'layer', type: 'enum', options: ['ground', 'deco'], default: 'ground' }],
    autotileRule: [
      { key: 'size', type: 'number', integer: true, min: 1, max: 7, default: 3 }, { key: 'pattern', type: 'list', of: { type: 'number', integer: true } }, { key: 'tiles', type: 'list', of: { type: 'tile' } },
      { key: 'tilesX', type: 'list', of: { type: 'tile' }, optional: true }, { key: 'tilesY', type: 'list', of: { type: 'tile' }, optional: true }, { key: 'tilesXY', type: 'list', of: { type: 'tile' }, optional: true },
      { key: 'mode', type: 'enum', options: ['single', 'stamp'], default: 'single' }, { key: 'chance', type: 'number', min: 0, max: 1, default: 1 }, { key: 'breakOnMatch', type: 'bool', default: true },
      { key: 'flip', type: 'enum', options: ['none', 'x', 'y', 'xy'], default: 'none' }, { key: 'outOfBounds', type: 'number', integer: true, nullable: true, default: null },
      { key: 'modulo', type: 'group', fields: [{ key: 'x', type: 'number', integer: true, min: 1, default: 1 }, { key: 'y', type: 'number', integer: true, min: 1, default: 1 }, { key: 'ox', type: 'number', integer: true, default: 0 }, { key: 'oy', type: 'number', integer: true, default: 0 }] },

  KIT.registry('strings').addAll([
    { id: 'got-item', default: 'Got {count} {item}!' }, { id: 'lost-item', default: 'Lost {count} {item}.' },
    { id: 'save-prompt', default: 'Save your progress?' }, { id: 'saved', default: 'Saved.' },
    { id: 'new-game', default: 'New Game' }, { id: 'continue', default: 'Continue' }, { id: 'settings', default: 'Settings' },
    { id: 'yes', default: 'Yes' }, { id: 'no', default: 'No' }, { id: 'cancel', default: 'Cancel' }, { id: 'ok', default: 'OK' },
    { id: 'name-prompt', default: 'What is your name?' }, { id: 'bag', default: 'Bag' }, { id: 'save', default: 'Save' }, { id: 'quit', default: 'Quit to title' },

  KIT.registry('objectTypes').addAll([
    { id: 'npc', name: 'NPC', doc: 'A character with a sprite that talks or moves.', tags: ['character'], icon: 'npc', toc: true, fields: [], page: {}, look: { sprite: true } },
    { id: 'sign', name: 'Sign', doc: 'A tile you can read (interact while facing it).', tags: ['furniture'], icon: 'sign', fields: [
      { key: 'look', type: 'tile', default: 'sign', doc: 'The tile drawn at the sign' },
    ], page: { layer: 'same' }, look: { tile: 'look' } },
    { id: 'item', name: 'Item on ground', doc: 'Step on it to pick it up (once).', tags: ['pickup'], icon: 'bag', fields: [
      { key: 'item', type: 'ref:item', nullable: false }, { key: 'count', type: 'number', integer: true, min: 1, default: 1 },
      { key: 'look', type: 'tile', nullable: true, default: null, doc: 'The tile drawn where the item lies (blank = the item icon)' },
    ], page: { layer: 'below', through: true, once: true }, look: { tile: 'look' } },
    { id: 'warp', name: 'Door / Warp', doc: 'Stepping here transfers the hero.', tags: ['door'], icon: 'door', fields: [
      { key: 'to', type: 'position', display: 'link', default: { map: null, x: 0, y: 0 }, doc: 'Where it leads (a tile on any map)' },

      if (!m) { prob('error', 'bad-target', tg.map == null ? `${label}: leads nowhere (no map chosen)` : `${label}: leads to missing map '${tg.map}'`, where); return; }
      if (!Number.isInteger(tg.x) || !Number.isInteger(tg.y) || tg.x < 0 || tg.y < 0 || tg.x >= m.width || tg.y >= m.height) { prob('error', 'target-out-of-bounds', `${label}: (${tg.x}, ${tg.y}) is outside map '${tg.map}'`, where); return; }
      if (P.cellSolid(m, tg.x, tg.y)) prob('warn', 'target-solid', `${label}: lands on a solid tile at (${tg.x}, ${tg.y}) on '${tg.map}'`, where);
    }
    function softLock(when, where, label, bodyPath) {
      const reads = new Set(P.conditionRefs(when, []).filter(r => r.kind === 'var' || r.kind === 'self').map(r => r.kind + ':' + r.id));
      if (!reads.size) return;
      const writes = allRefs.filter(r => r.access === 'write' && (r.kind === 'var' || r.kind === 'self') && KIT.path.isPrefix(bodyPath, r.where.path)).map(r => r.kind + ':' + r.id);
      if (!writes.some(w => reads.has(w))) prob('warn', 'soft-lock', `${label} runs while ${Array.from(reads).join(', ')} but never changes it — it will run on every entry`, Object.assign({}, where, { path: bodyPath }));
    }
    for (const id of Object.keys(project.scripts || {})) {
      const sc = project.scripts[id];
      if (sc && sc.trigger === 'auto' && sc.when) softLock(sc.when, { script: id }, `script ${id} (auto)`, ['scripts', id, 'body']);
    }

    // references
    const undeclared = new Set();
    for (const r of allRefs) {
      if (r.kind === 'var') { if (!(project.vars && Object.prototype.hasOwnProperty.call(project.vars, r.id)) && !undeclared.has(r.id)) { undeclared.add(r.id); prob('warn', 'undeclared-var', `var '${r.id}' is used but not declared in Variables`, r.where); } continue; }
      if (r.kind === 'self') continue;
      const k = P.known(r.kind, r.id, project);
      if (k === false) prob('error', `unknown-${r.kind}`, `${r.kind} '${r.id}' does not exist`, r.where);
    }

    // commands
    const cmdReg = KIT.registry.exists('commands') ? KIT.registry('commands') : null;
    const cmdsKnown = !!(cmdReg && cmdReg.size());
    P.walkCommands(project, (cmd, where) => {
      if (!isObj(cmd) || typeof cmd.t !== 'string') { prob('error', 'bad-command', 'each command needs a type (t)', where); return; }
      if (cmd.disabled) return;
      const def = cmdReg && cmdReg.get(cmd.t);
      if (!def) { if (cmdsKnown && cmd.t !== 'raw') prob('error', 'unknown-command', `unknown command '${cmd.t}'`, where); if (cmd.t === 'say' && !String(cmd.text || '').trim()) prob('warn', 'empty-text', 'this message has no text', where); return; }
      if (Array.isArray(def.fields)) {
        // commands are validated as the editor sees them: missing keys at their defaults (nested lists are walked separately)
        const plain = withoutScripts(def.fields);
        const filled = S.fill(plain, cmd);
        errors('schema', stripRefErrors(S.validate(plain, filled)), where, def.label || cmd.t);
        for (const f of S.fields(plain)) if (f.type === 'text' && !f.optional && !f.nullable && S.visible(f, filled) && !String(filled[f.key] == null ? '' : filled[f.key]).trim()) prob('warn', 'empty-text', `${def.label || cmd.t}: '${f.key}' is empty`, Object.assign({}, where, { path: where.path.concat(f.key) }));
        for (const tg of targetsOf(plain, filled, where.path)) checkTarget(tg, Object.assign({}, where, { path: tg.path }), def.label || cmd.t);
      }
      const background = where.slot === 'tick' || (where.script && project.scripts[where.script] && project.scripts[where.script].trigger === 'parallel');
      if (background && def.background === false) prob('error', 'blocking-in-background', `'${cmd.t}' cannot run in a ${where.slot === 'tick' ? "'tick' slot" : 'parallel script'} (it would block)`, where);
    });

    // registered validators (modules, content lint)
    if (KIT.registry.exists('validators')) for (const v of KIT.registry('validators').list()) {
      try { const more = v.run(project, Object.assign({}, ctx, { project })); if (Array.isArray(more)) for (const m of more) problems.push(Object.assign({ severity: 'error', code: v.id, message: '', where: {} }, m)); }
      catch (e) { prob('error', 'validator-threw', `validator '${v.id}' failed: ${e && e.message}`, {}); }
    }
    return problems;
  };

  // ---- helpers ------------------------------------------------------------------
  P.newMap = function (opts) {
    opts = opts || {};
    const id = opts.id || KIT.slug(opts.name || 'map');
    return P.fillMap({ id, name: opts.name || titleCase(id), width: opts.width || 20, height: opts.height || 15, kind: opts.kind || 'outdoor', music: opts.music || null }, id);
  };
  /** newObject({ type, id, name, x, y, props, page }) -> a normalized object with one page (props at their type defaults). */
  P.newObject = function (opts) {
    opts = opts || {};
    const type = opts.type || 'npc';
    const page = Object.assign({}, opts.page || {}, { props: Object.assign({}, (opts.page && opts.page.props) || {}, opts.props || {}) });
    return P.fillObject({ id: opts.id, name: opts.name || (objectType(type) ? objectType(type).name : titleCase(type)), type, x: opts.x | 0, y: opts.y | 0, note: opts.note || '', pages: [page] }, 0);
  };
  /** resize(map, w, h) -> a new map (anchor top-left; cells outside are dropped, new cells get defaults). Objects are kept (the validator flags any outside). */
  P.resize = function (map, w, h) {
    w = Math.max(1, w | 0); h = Math.max(1, h | 0);
    const out = KIT.deepClone(map);
    const ground = P.GROUND_BY_KIND[map.kind] || 'grass';
    const fills = { terrain: 0, ground, deco: null, above: null, regions: 0 };
    const regrid = (arr, fill) => { const o = new Array(w * h); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) o[y * w + x] = (x < map.width && y < map.height && Array.isArray(arr) && arr[y * map.width + x] !== undefined) ? arr[y * map.width + x] : fill; return o; };
    out.layers = {};
    for (const layer of P.LAYERS) out.layers[layer] = regrid((map.layers || {})[layer], fills[layer]);

  /**
   * registerContent(project) -> { assets, tiles, sprites, faces, icons }
   * A project may carry content of its own — the tables an import writes
   * (KIT.import.merge): `assets`, `tiles`, `sprites`, `faces`, `icons`, each a
   * table keyed by id. Art drawn here lives in `js/art/*.js` and registers
   * itself at load time; imported art has no such file, so the project IS the
   * file and this puts it into the registries. Called before the project is
   * normalized (storage.loadProject) so the validator sees the tiles too.
   * Safe to call twice: every definition replaces its own id.
   */
  const CONTENT_TABLES = ['tiles', 'sprites', 'faces', 'icons'];
  P.registerContent = function (project) {
    const counts = { assets: 0, tiles: 0, sprites: 0, faces: 0, icons: 0 };
    if (!isObj(project)) return counts;
    if (KIT.assets && KIT.assets.define && isObj(project.assets)) {
      for (const id of Object.keys(project.assets).sort()) {
        try { KIT.assets.define(Object.assign({ id }, project.assets[id])); counts.assets++; }
        catch (e) { (KIT.log || console).warn(`[project] asset '${id}' was not registered: ${e.message}`); }
      }
    }
    for (const name of CONTENT_TABLES) {
      const table = project[name];
      if (!isObj(table) || !KIT.registry.exists(name)) continue;
      const reg = KIT.registry(name);
      for (const id of Object.keys(table).sort()) {
        if (!isObj(table[id])) continue;
        try { reg.add(Object.assign({ id }, table[id], { replace: true })); counts[name]++; }
        catch (e) { (KIT.log || console).warn(`[project] ${name.replace(/s$/, '')} '${id}' was not registered: ${e.message}`); }
      }
    }
    return counts;
  };

  /** blank() -> a small valid project with one map. */
  P.blank = function (opts) {
    opts = opts || {};
    const mapId = opts.map || 'start';
    return P.normalize({
      version: P.VERSION,
      meta: { id: opts.id || 'new-adventure', title: opts.title || 'New Adventure', subtitle: '', author: '', pitch: opts.pitch || '' },
      start: { map: mapId, x: 5, y: 5, dir: 'down' },
      terrains: [{ id: 1, name: 'Grass', color: '#58b848', base: 'grass' }],
      maps: { [mapId]: { id: mapId, name: 'Start', width: 12, height: 10, kind: 'outdoor' } },
    }).project;
  };
  P.clone = (p) => KIT.deepClone(p);

  /** unique object id on a map: base, base-2, base-3 ... */
  P.uniqueObjectId = function (map, base) {
    const taken = new Set((map && map.objects || []).map(o => o.id));
    base = KIT.slug(base || 'object');
    if (!taken.has(base)) return base;
    for (let i = 2; ; i++) if (!taken.has(`${base}-${i}`)) return `${base}-${i}`;
  };
  /**
   * buildPreset(presetOrId, ctx) -> [{ map, object }]  ctx: { project, map, x, y, input:{ field values } }
   * Interprets a preset's `objects` templates: '$<field>' -> input value (or the field default), '$here' -> { map, x, y }.
   */
  P.buildPreset = function (presetOrId, ctx) {
    const preset = typeof presetOrId === 'string' ? KIT.registry('presets').require(presetOrId) : presetOrId;
    ctx = ctx || {};
    const input = S.fill(preset.fields || [], ctx.input || {});
    const here = { map: ctx.map, x: ctx.x | 0, y: ctx.y | 0 };
    const sub = (v) => {
      if (typeof v === 'string' && v[0] === '$') { const k = v.slice(1); return k === 'here' ? KIT.deepClone(here) : (k in input ? KIT.deepClone(input[k]) : v); }

    };

      const spec = sub(Object.assign({}, tpl));
      delete spec.at;
      const targetMap = ctx.project && ctx.project.maps ? ctx.project.maps[pos.map] : null;
      const obj = P.fillObject(Object.assign({}, spec, { id: spec.id || P.uniqueObjectId(targetMap, `${spec.name || spec.type}-${pos.x}-${pos.y}`), x: pos.x, y: pos.y }), 0);
      out.push({ map: pos.map, object: obj });
    }
    // two objects on the same map from one preset must not share an id
    const seen = new Map();
    for (const pl of out) { const key = pl.map + ':' + pl.object.id; if (seen.has(key)) pl.object.id = pl.object.id + '-' + (seen.get(key) + 1); seen.set(key, (seen.get(key) || 0) + 1); }
    return out;
  };

  // ---- content files (§4.2) -------------------------------------------------------
  // Scheme (documented in each file's header):
  //   project.js      registers everything but the maps as   KIT.content.projects[<projectId>]
  //   maps/<id>.js    registers one map as                   KIT.content.maps[<projectId>][<mapId>]
  //   KIT.project.fromContent(projectId) puts them back together; importFiles(files) parses the texts.
  // Every file is an IIFE whose last argument is the JSON payload, so the payload can be parsed
  // back without evaluating any code (it starts at the first line that is exactly "{" and ends at the
  // last line that is exactly "}" before the closing ");").
  const q = (s) => JSON.stringify(String(s));
  function rowWidth(key, parent, ancestors) {
    if (P.LAYERS.includes(key)) { const m = ancestors[ancestors.length - 2]; return m && Number.isInteger(m.width) ? m.width : 0; }
    if (key === 'collision' && parent && Number.isInteger(parent.width)) return parent.width;
    if (key === 'pattern' && parent && Number.isInteger(parent.size)) return parent.size;
    return 0;
  }
  /** stringify(value) -> pretty 2-space JSON, keys sorted, tile layers one map row per line, short primitive lists on one line. */
  P.stringify = function (value, opts) {
    const rw = (opts && opts.rowWidth) || rowWidth;
    const prim = (v) => (v === undefined ? 'null' : JSON.stringify(v));
    function fmt(v, indent, key, parent, ancestors) {
      if (v === null || typeof v !== 'object') return prim(v);
      const pad = '  '.repeat(indent + 1), end = '  '.repeat(indent);
      if (Array.isArray(v)) {
        if (!v.length) return '[]';
        const allPrim = v.every(x => x === null || typeof x !== 'object');
        const w = allPrim ? rw(key, parent, ancestors) : 0;
        if (w > 0) {
          const rows = [];
          for (let i = 0; i < v.length; i += w) rows.push(pad + v.slice(i, i + w).map(prim).join(', '));
          return '[\n' + rows.join(',\n') + '\n' + end + ']';
        }
        if (allPrim) { const line = v.map(prim).join(', '); if (line.length <= 72) return '[' + line + ']'; }
        return '[\n' + v.map(x => pad + fmt(x, indent + 1, null, v, ancestors.concat([v]))).join(',\n') + '\n' + end + ']';
      }
      const keys = Object.keys(v).filter(k => v[k] !== undefined).sort();
      if (!keys.length) return '{}';
      return '{\n' + keys.map(k => pad + JSON.stringify(k) + ': ' + fmt(v[k], indent + 1, k, v, ancestors.concat([v]))).join(',\n') + '\n' + end + '}';
    }
    return fmt(value, 0, null, null, []);
  };
  function fileHeader(kind, projectId, id, title) {
    return [
      `// ${title} — Kit content file, generated by KIT.project.exportFiles (hand edits are fine; keep it valid JSON inside).`,
      kind === 'project' || kind === 'assets' ? `// kind: ${kind}  id: ${projectId}` : `// kind: map  project: ${projectId}  id: ${id}`,
      `// project.js registers KIT.content.projects[${q(projectId)}]; each maps/<id>.js registers KIT.content.maps[${q(projectId)}][<id>].`,
      `// KIT.project.fromContent(${q(projectId)}) assembles the project again; KIT.project.importFiles({ path: text }) parses the texts.`,
    ].join('\n');
  }
  P.exportFiles = function (project) {
    const p = KIT.deepClone(project);
    const pid = (p.meta && p.meta.id) || 'project';
    const maps = p.maps || {};
    delete p.maps;
    const assets = p.assets && Object.keys(p.assets).length ? p.assets : null;
    if (assets) delete p.assets;
    if (p.meta) delete p.meta.modified;
    const files = {};
    files['project.js'] = [
      fileHeader('project', pid, pid, (p.meta && p.meta.title) || pid),
      '(function (root, data) {',
      '  var KIT = root.KIT = root.KIT || {};',
      '  var content = KIT.content = KIT.content || {};',
      `  (content.projects = content.projects || {})[${q(pid)}] = data;`,
      "})(typeof window !== 'undefined' ? window : globalThis,",
      P.stringify(p),
      ');',
      '',
    ].join('\n');
    if (assets) {
      files['assets.js'] = [
        fileHeader('assets', pid, pid, 'imported images'),
        '(function (root, data) {',
        '  var KIT = root.KIT = root.KIT || {};',
        '  var content = KIT.content = KIT.content || {};',
        `  (content.assets = content.assets || {})[${q(pid)}] = data;`,
        "})(typeof window !== 'undefined' ? window : globalThis,",
        P.stringify(assets),
        ');',
        '',
      ].join('\n');
    }
    // An imported map id can carry a namespace ('outside:town'); ':' is legal in
    // an id but not in a filename on every system, so the FILE name is tamed
    // while the id inside the file (and its header) stays exactly as it is.
    const fileName = (id) => id.replace(/[^A-Za-z0-9._-]+/g, '-');
    for (const id of Object.keys(maps).sort()) {
      files[`maps/${fileName(id)}.js`] = [
        fileHeader('map', pid, id, (maps[id].name || id) + ' (map)'),
        '(function (root, data) {',
        '  var KIT = root.KIT = root.KIT || {};',
        '  var content = KIT.content = KIT.content || {};',
        '  var maps = content.maps = content.maps || {};',
        `  (maps[${q(pid)}] = maps[${q(pid)}] || {})[${q(id)}] = data;`,
        "})(typeof window !== 'undefined' ? window : globalThis,",
        P.stringify(maps[id]),
        ');',
        '',
      ].join('\n');
    }
    return files;
  };
  /** parseFile(text) -> { kind:'project'|'map', projectId, id, data } or null when the text is not a Kit content file. */
  P.parseFile = function (text) {
    const m = /^\/\/ kind: (project|map|assets)(?:  project: (\S+))?  id: (\S+)$/m.exec(text);
    if (!m) return null;
    const start = text.indexOf('\n{\n');
    const stop = text.lastIndexOf('\n}\n);');
    if (start < 0 || stop < 0) return null;
    const data = JSON.parse(text.slice(start + 1, stop + 2));
    return { kind: m[1], projectId: m[1] === 'project' || m[1] === 'assets' ? m[3] : m[2], id: m[3], data };
  };
  /** importFiles({ 'project.js': text, 'maps/<id>.js': text, ... }) -> project (not normalized; maps re-attached by id). */
  P.importFiles = function (files) {
    let project = null, assets = null;
    const maps = {};
    for (const name of Object.keys(files || {})) {
      const parsed = P.parseFile(files[name]);
      if (!parsed) continue;
      if (parsed.kind === 'project') project = parsed.data;
      else if (parsed.kind === 'assets') assets = parsed.data;
      else maps[parsed.data.id || parsed.id] = parsed.data;
    }
    if (!project) throw new Error('importFiles: no project.js among the files');
    project.maps = Object.assign({}, project.maps || {}, maps);
    if (assets) project.assets = Object.assign({}, project.assets || {}, assets);
    return project;
  };
  /** fromContent(projectId?) -> project assembled from loaded content files (KIT.content), or null. Without an id, the only loaded project. */
  P.fromContent = function (projectId) {
    const c = KIT.content;
    if (!c || !c.projects) return null;
    const id = projectId || (Object.keys(c.projects).length === 1 ? Object.keys(c.projects)[0] : null);
    if (!id || !c.projects[id]) return null;
    const p = KIT.deepClone(c.projects[id]);
    p.maps = Object.assign({}, p.maps || {}, KIT.deepClone((c.maps && c.maps[id]) || {}));
    if (c.assets && c.assets[id]) p.assets = Object.assign({}, p.assets || {}, KIT.deepClone(c.assets[id]));
    return p;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// ---- js/kit/world/tiles.js ----
// KIT.tiles — tile flags, edge passage and autotile baking (all pure).
// Contract: docs/ARCHITECTURE.md §5 (autotiles/terrains), §6.2 (tile entry).
//
// Autotiles follow LDtk's auto-layer semantics, adapted to named tile ids:
//   * `map.layers.terrain` is the IntGrid: 0 = "no terrain" (hand-painted cell),
//     any other int is a terrain id from `project.terrains`.
//   * A rule group is evaluated top-down per cell; a matching rule paints its
//     tile and, when `breakOnMatch` is true, stops the group for that cell.
//   * Pattern cells (size×size, row-major, centred on the cell):
//       0            ignore
//       +v           the neighbour must BE terrain v
//       -v           the neighbour must NOT be terrain v
//       1000001      any terrain (not 0)      -1000001   empty (terrain 0)
//   * `flip:'x'|'y'|'xy'` also tries the pattern mirrored horizontally /
//     vertically / both. A mirrored match paints `tilesX` / `tilesY` /
//     `tilesXY` when the rule provides them, otherwise `tiles` (named tiles
//     cannot be flipped as pixels, so the author names the mirrored tile).
//   * `modulo:{ x, y, ox, oy }` — the rule only applies where
//     ((cx - ox) mod x) == 0 and ((cy - oy) mod y) == 0.
//   * `outOfBounds:null` — a pattern cell that falls outside the map never
//     matches, so edge/corner rules do not fire along the map border and a path
//     continues seamlessly into the neighbouring map; `outOfBounds:v` — cells
//     outside the map count as terrain v (set it to the surrounding terrain to
//     get edges along the border).
//   * `chance` (0..1) and `mode:'single'` picks (random by per-cell rng);
//     `mode:'stamp'` treats `tiles` as a size×size block painted around the cell.
//   * `terrains[].base` is painted on the ground layer when no rule paints it.
//   * Deco results: a deco cell is only rewritten when a rule paints it or when
//     the tile currently there is one some deco rule can paint ("owned" by the
//     autotiles); hand-placed deco (trees, signs) survives a re-bake.
//   Per-cell randomness: KIT.rng(KIT.hash(seed, groupId, x, y)) — so bakes are
//   deterministic and local (a cell's result depends only on its neighbourhood).
//
// @typedef {{ id:string, name?:string, active?:boolean, terrain?:number, layer?:'ground'|'deco', rules:AutoRule[] }} AutoGroup
// @typedef {{ size:number, pattern:number[], tiles:(string|null)[], tilesX?:string[], tilesY?:string[], tilesXY?:string[],
//             mode?:'single'|'stamp', chance?:number, breakOnMatch?:boolean, flip?:'none'|'x'|'y'|'xy',
//             outOfBounds?:number|null, modulo?:{x:number,y:number,ox:number,oy:number}, layer?:'ground'|'deco', active?:boolean }} AutoRule
// @typedef {{ id:number, name:string, color:string, base:string|null }} Terrain
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const T = KIT.tiles = KIT.tiles || {};

  const ANY = 1000001, EMPTY = -1000001;
  T.ANY = ANY; T.EMPTY = EMPTY;

  const DIR_KEY = { n: 'n', s: 's', e: 'e', w: 'w', up: 'n', down: 's', right: 'e', left: 'w', north: 'n', south: 's', east: 'e', west: 'w' };

  /** Defaults every tile has (a missing/unknown tile is walkable ground). */
  T.DEFAULTS = Object.freeze({ solid: false, passage: Object.freeze({ n: true, s: true, e: true, w: true }), bush: false, counter: false, ledge: null, warpLook: false, encounter: false, terrainTag: 0, probability: 1, animMs: 500 });

  function registry() { return KIT.registry.exists('tiles') ? KIT.registry('tiles') : null; }
  T.def = function (tileOrId) {
    if (tileOrId && typeof tileOrId === 'object') return tileOrId;
    const r = registry();
    return r && typeof tileOrId === 'string' ? (r.get(tileOrId) || null) : null;
  };

  /**
   * flags(tileOrId) -> { id, exists, solid, passage:{n,s,e,w}, bush, counter, ledge, warpLook, encounter, terrainTag, probability, animMs, animated }
   * Registry flags merged over the defaults. Unknown ids are walkable with exists:false.
   */
  T.flags = function (tileOrId) {
    const d = T.def(tileOrId);
    const out = Object.assign({ id: d ? d.id : (typeof tileOrId === 'string' ? tileOrId : null), exists: !!d }, T.DEFAULTS);
    if (d) {
      for (const k of Object.keys(T.DEFAULTS)) if (d[k] != null && k !== 'passage') out[k] = d[k];
      out.passage = Object.assign({}, T.DEFAULTS.passage, d.passage || {});
      out.animated = Array.isArray(d.frames) ? d.frames.length > 1 : Array.isArray(d.art && d.art.frames) && d.art.frames.length > 1;
    } else out.animated = false;
    return out;
  };

  /** passage(tileOrId, dir) -> can an entity cross this tile's `dir` edge? dir: n|s|e|w or up|down|left|right. Solid tiles never pass. */
  T.passage = function (tileOrId, dir) {
    const f = T.flags(tileOrId);
    if (f.solid) return false;
    const k = DIR_KEY[dir];
    if (!k) return true;

  const V = (KIT.script = KIT.script || {}).values = {};

<script>
// ---- js/kit/script/conditions.js ----
// Conditions: the 'conditions' registry, every baseline kind (§9.3), the rich
// 'condition' schema type, and the condition text format used by Screenplay
// (`chapter >= 2 and item.berry >= 1`). Pure: test() reads the ctx only.
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const S = KIT.schema;
  const V = KIT.script.values;
  const C = KIT.conditions = KIT.conditions || {};
  const reg = KIT.registry('conditions');
  // Workaround (core issue): registries.js validates ids lowercase-only; §11 names module kinds in camelCase (dexCount).
  for (const f of reg.opts.fields || []) if (f.key === 'id' && f.pattern) f.pattern = '^[a-zA-Z0-9][a-zA-Z0-9-_.:]*$';

  /**
   * @typedef {Object} ConditionCtx  The minimal world view a condition reads. Tests use plain objects.
   * @property {Object} world
   * @property {Object} world.save            save data (§7): { vars, inventory, objects, timer, clock, meta, heroes }
   * @property {Object} [world.map]           current map view: { id, region(x,y), tileAt(layer,x,y) } (or a raw map with layers/width)
   * @property {Array|Object} [world.entities]  live entities by id ('p1', 'p2', object ids): { id, x, y, dir }
   * @property {Object} [world.meta]          meta record (survives New Game); save.meta is read first
   * @property {string|null} [self]           the current object's save key ('town:mom')
   * @property {string|Object} [hero]         the triggering hero: id ('p1') or entity { id }
   * @property {boolean} [coop]               co-op active (falls back to project.settings.coop.enabled)
   * @property {Object} [project]             the project (var defaults, item names, heroes)
   * @property {{pressed:function(string, string):boolean}} [input]  button state: pressed(key, heroId)
   */
  /**
   * @typedef {Object} Condition  { kind, ...fields of that kind }. null = always true.
   * Targets (facing/region/...): 'self' | 'hero' | 'p1' | 'p2' | 'obj:<objectId>'.
   */
  /** Control signal is not returned by conditions; see commands.js. */

  const has = (o, k) => o !== null && o !== undefined && Object.prototype.hasOwnProperty.call(o, k);
  const save = (ctx) => (ctx && ctx.world && ctx.world.save) || {};
  const OPS = ['==', '!=', '<', '<=', '>', '>='];
  const SYM = { '==': '=', '!=': '≠', '<': '<', '<=': '≤', '>': '>', '>=': '≥' };

  // ---- reading state ---------------------------------------------------------

  /** The triggering hero's id ('p1' by default). */
  C.heroId = function (ctx) {
    const h = ctx && ctx.hero;
    if (typeof h === 'string' && h) return h;
    if (h && typeof h === 'object' && h.id) return h.id;
    if (typeof h === 'number') { const p = ctx.project && ctx.project.heroes && ctx.project.heroes[h]; return p ? p.id : `p${h + 1}`; }
    return 'p1';
  };
  C.heroIndex = function (ctx, id) {
    const heroes = (ctx && ctx.project && ctx.project.heroes) || [];
    const i = heroes.findIndex(h => h.id === id);
    if (i >= 0) return i;
    const m = /^p(\d+)$/.exec(id || '');
    return m ? Number(m[1]) - 1 : 0;
  };
  /** A var's value, falling back to its declared default. */
  C.getVar = function (ctx, name) {
    const vars = save(ctx).vars || {};
    if (has(vars, name)) return vars[name];
    const decl = ctx && ctx.project && ctx.project.vars && ctx.project.vars[name];
    return decl && decl.default !== undefined ? decl.default : undefined;
  };
  C.getSelf = function (ctx, key, objectKey) {
    const objs = save(ctx).objects || {};
    const o = objs[objectKey || (ctx && ctx.self)];
    return o && o.self ? o.self[key] : undefined;
  };
  C.count = (ctx, id) => Number((save(ctx).inventory || {})[id]) || 0;
  C.meta = (ctx) => save(ctx).meta || (ctx && ctx.world && ctx.world.meta) || {};

  /** compare(a, op, b): tolerant of undefined (reads as 0/false/'') and numeric strings. */
  C.compare = function (a, op, b) {
    op = op || '==';
    if (a === undefined || a === null) a = typeof b === 'number' ? 0 : typeof b === 'boolean' ? false : '';
    if (b === undefined || b === null) b = typeof a === 'number' ? 0 : typeof a === 'boolean' ? false : '';
    if (typeof a !== typeof b) {
      const na = Number(a), nb = Number(b);
      if (a !== '' && b !== '' && Number.isFinite(na) && Number.isFinite(nb)) { a = na; b = nb; }
      else { a = String(a); b = String(b); }
    }

      case '==': return a === b;
      case '!=': return a !== b;
      case '<': return a < b;
      case '<=': return a <= b;
      case '>': return a > b;
      case '>=': return a >= b;
      default: return false;
    }
  };

  /** objectId('town:mom') -> 'mom' (the id part of a save key). */
  C.objectId = (key) => { const s = String(key || ''); const i = s.indexOf(':'); return i >= 0 ? s.slice(i + 1) : s; };
  /** objectKey(ctx, id) -> 'map:id' using the current map. */
  C.objectKey = function (ctx, id) {
    const map = ctx && ctx.world && ctx.world.map;
    const mapId = map && map.id;
    return mapId ? `${mapId}:${id}` : String(id);
  };
  function findEntity(ctx, id, key) {
    const ents = ctx && ctx.world && ctx.world.entities;
    if (!ents) return null;
    if (Array.isArray(ents)) return ents.find(e => e && (e.id === id || (key && e.key === key))) || null;
    return ents[id] || (key ? ents[key] : null) || null;
  }
  /**
   * target(ctx, target) -> { id, key, isHero, entity, x, y, dir }  resolves 'self' | 'hero' | 'p1' | 'p2' | 'obj:id'.
   * Position/direction come from the live entity when present, else from the save.
   */
  C.target = function (ctx, target) {
    let t = target == null || target === '' ? 'hero' : String(target);
    let id, key = null, isHero = false;
    if (t === 'self') { key = ctx && ctx.self ? String(ctx.self) : null; id = key ? C.objectId(key) : null; }
    else if (t === 'hero' || t === 'p') { id = C.heroId(ctx); isHero = true; }
    else if (/^p\d+$/.test(t)) { id = t; isHero = true; }
    else { id = t.startsWith('obj:') ? t.slice(4) : t; key = C.objectKey(ctx, id); }
    const entity = id ? findEntity(ctx, id, key) : null;
    let x, y, dir;
    if (entity) { x = entity.x; y = entity.y; dir = entity.dir; }
    else if (isHero) { const h = (save(ctx).heroes || [])[C.heroIndex(ctx, id)]; if (h) { x = h.x; y = h.y; dir = h.dir; } }
    else if (key) { const o = (save(ctx).objects || {})[key]; if (o) { x = o.x; y = o.y; dir = o.dir; } }
    return { id, key, isHero, entity, x, y, dir };
  };
  C.targetLabel = function (target) {
    const t = target == null || target === '' ? 'hero' : String(target);
    if (t === 'self') return 'this object';
    if (t === 'hero' || t === 'p') return 'the hero';
    if (/^p\d+$/.test(t)) return t.toUpperCase();
    return t.startsWith('obj:') ? t.slice(4) : t;
  };
  /** Reference extraction for target strings: 'obj:id' is a read of that object. Shared with commands.js. */
  C.targetRefs = function (v, path, out) {
    if (typeof v === 'string' && v.startsWith('obj:') && v.length > 4) out.push({ kind: 'object', id: v.slice(4), path: path.slice(), access: 'read' });
  };

  function regionAt(map, x, y) {
    if (!map) return undefined;
    if (typeof map.region === 'function') return map.region(x, y);
    const r = map.layers && map.layers.regions;
    if (r && map.width != null && x >= 0 && y >= 0 && x < map.width) return r[y * map.width + x];
    return undefined;
  }
  function tileAt(map, layer, x, y) {
    if (!map) return undefined;
    if (typeof map.tileAt === 'function') return map.tileAt(layer, x, y);
    const l = map.layers && map.layers[layer];
    if (l && map.width != null && x >= 0 && y >= 0 && x < map.width) return l[y * map.width + x];
    return undefined;
  }
  const itemName = (ctx, id) => { const it = ctx && ctx.project && ctx.project.items && ctx.project.items[id]; return it && it.name ? it.name : id; };
  const fmtValue = (v) => (typeof v === 'string' ? JSON.stringify(v) : String(v));
  const opField = (def) => ({ key: 'op', type: 'enum', options: OPS, default: def || '==', label: 'Compare' });
  const targetField = (def) => ({ key: 'target', type: 'string', default: def, target: true, doc: "self, hero, p1, p2 or obj:<id>" });

  // ---- baseline kinds ---------------------------------------------------------

  reg.addAll([
    {
      id: 'var', label: 'Variable', group: 'Progress', doc: 'Compare a game variable with a value or another variable.',
      fields: [
        { key: 'name', type: 'ref:var', nullable: false, label: 'Variable' }, opField('=='),
        { key: 'value', type: 'scalar', default: 0 },
        { key: 'var', type: 'ref:var', label: 'Or variable', doc: 'When set, compare with this variable instead of the value' },
      ],
      test(c, ctx) { return C.compare(C.getVar(ctx, c.name), c.op, c.var ? C.getVar(ctx, c.var) : c.value); },
      describe(c) { return `${c.name} ${SYM[c.op] || c.op || '='} ${c.var ? c.var : fmtValue(c.value)}`; },
    },
    {
      id: 'self', label: 'Self state', group: 'Progress', doc: "Compare one of this object's self state keys.",
      fields: [{ key: 'key', type: 'string', min: 1 }, opField('=='), { key: 'value', type: 'scalar', default: true }],
      test(c, ctx) { return C.compare(C.getSelf(ctx, c.key), c.op, c.value); },
      describe(c) { return `self.${c.key} ${SYM[c.op] || c.op || '='} ${fmtValue(c.value)}`; },
    },
    {
      id: 'item', label: 'Item', group: 'Party', doc: 'How many of an item the party holds.',
      fields: [{ key: 'id', type: 'ref:item', nullable: false, label: 'Item' }, opField('>='), { key: 'count', type: 'number', integer: true, min: 0, default: 1 }],
      test(c, ctx) { return C.compare(C.count(ctx, c.id), c.op || '>=', c.count == null ? 1 : c.count); },
      describe(c, ctx) {
        const name = itemName(ctx, c.id), op = c.op || '>=', n = c.count == null ? 1 : c.count;
        if (op === '>=' && n === 1) return `has ${name}`;
        if ((op === '<' && n === 1) || (op === '==' && n === 0)) return `no ${name}`;
        return `${name} × ${SYM[op] || op} ${n}`;
      },
    },
    {
      id: 'facing', label: 'Facing', group: 'Map', doc: 'A character faces a direction.',
      fields: [targetField('self'), { key: 'dir', type: 'direction', default: 'down' }],
      test(c, ctx) { return C.target(ctx, c.target).dir === c.dir; },
      describe(c) { return `${C.targetLabel(c.target)} faces ${c.dir}`; },
    },
    {
      id: 'button', label: 'Button', group: 'Input', doc: 'A button is held by the triggering player.',
      fields: [{ key: 'key', type: 'string', default: 'A', doc: 'A, B, up, down, left, right, menu' }],
      test(c, ctx) { return !!(ctx && ctx.input && typeof ctx.input.pressed === 'function' && ctx.input.pressed(c.key, C.heroId(ctx))); },
      describe(c) { return `${c.key} pressed`; },
    },
    {
      id: 'timer', label: 'Timer', group: 'Progress', doc: 'The timer is running and its remaining seconds compare so.',
      fields: [opField('<='), { key: 'seconds', type: 'number', min: 0, default: 0 }],
      test(c, ctx) { const t = save(ctx).timer || {}; return !!t.running && C.compare(Number(t.secondsLeft) || 0, c.op || '<=', c.seconds || 0); },
      describe(c) { return `timer ${SYM[c.op] || c.op || '≤'} ${c.seconds || 0}s`; },
    },
    {
      id: 'region', label: 'Region', group: 'Map', doc: 'A character stands in a region.',
      fields: [{ key: 'id', type: 'region', default: 1 }, targetField('hero')],
      test(c, ctx) { const t = C.target(ctx, c.target); return t.x != null && regionAt(ctx.world && ctx.world.map, t.x, t.y) === c.id; },
      describe(c) { return `${C.targetLabel(c.target)} in region ${c.id}`; },
    },
    {
      id: 'tile', label: 'Tile', group: 'Map', doc: 'The tile on a layer at a position (default: under the hero).',
      fields: [{ key: 'layer', type: 'enum', options: ['ground', 'deco', 'above'], default: 'ground' }, { key: 'id', type: 'ref:tile', nullable: false, label: 'Tile' }, { key: 'at', type: 'position', optional: true, nullable: true, display: 'point' }],
      test(c, ctx) {
        const p = c.at || C.target(ctx, 'hero');
        return p.x != null && tileAt(ctx.world && ctx.world.map, c.layer || 'ground', p.x, p.y) === c.id;
      },
      describe(c) { return `${c.layer || 'ground'} ${c.at ? `at ${c.at.x},${c.at.y}` : 'under the hero'} is ${c.id}`; },
    },
    {
      id: 'meta', label: 'Meta', group: 'Progress', doc: 'Compare a meta value (survives New Game: runs, endingsSeen…).',
      fields: [{ key: 'key', type: 'string', min: 1 }, opField('>='), { key: 'value', type: 'scalar', default: 1 }],
      test(c, ctx) { return C.compare(C.meta(ctx)[c.key], c.op, c.value); },
      describe(c) { return `meta.${c.key} ${SYM[c.op] || c.op || '='} ${fmtValue(c.value)}`; },
    },
    {
      id: 'clock', label: 'Time of day', group: 'World', doc: 'In-game minute of the day is within from..to (wraps past midnight).',
      fields: [{ key: 'from', type: 'number', integer: true, min: 0, max: 1439, default: 0 }, { key: 'to', type: 'number', integer: true, min: 0, max: 1439, default: 1439 }],
      test(c, ctx) {
        const m = ((Number((save(ctx).clock || {}).minutes) || 0) % 1440 + 1440) % 1440;
        const from = c.from || 0, to = c.to == null ? 1439 : c.to;

      describe(c) { const hm = (n) => `${String(Math.floor((n || 0) / 60)).padStart(2, '0')}:${String((n || 0) % 60).padStart(2, '0')}`; return `between ${hm(c.from)} and ${hm(c.to == null ? 1439 : c.to)}`; },
    },

      id: 'coop', label: 'Co-op', group: 'Input', doc: 'Two players are active.',
      fields: [],

        const s = ctx && ctx.project && ctx.project.settings && ctx.project.settings.coop;
        return !!(s && s.enabled);
      },
      describe() { return 'co-op'; },
    },
    {
      id: 'all', label: 'All of', group: 'Logic', doc: 'Every listed condition passes.',
      fields: [{ key: 'of', type: 'list', of: { type: 'condition' }, default: [] }],
      test(c, ctx) { return (c.of || []).every(x => C.test(x, ctx)); },
      describe(c, ctx) { return (c.of || []).map(x => wrapDesc(x, ctx)).join(' and ') || 'always'; },
    },
    {
      id: 'any', label: 'Any of', group: 'Logic', doc: 'At least one listed condition passes.',
      fields: [{ key: 'of', type: 'list', of: { type: 'condition' }, default: [] }],
      test(c, ctx) { return (c.of || []).some(x => C.test(x, ctx)); },
      describe(c, ctx) { return (c.of || []).map(x => wrapDesc(x, ctx)).join(' or ') || 'never'; },
    },
    {
      id: 'not', label: 'Not', group: 'Logic', doc: 'The condition fails.',
      fields: [{ key: 'of', type: 'condition' }],
      test(c, ctx) { return !C.test(c.of, ctx); },
      describe(c, ctx) { return `not ${wrapDesc(c.of, ctx)}`; },
    },
  ]);
  const wrapDesc = (c, ctx) => (c && (c.kind === 'all' || c.kind === 'any') && (c.of || []).length > 1 ? `(${C.describe(c, ctx)})` : C.describe(c, ctx));

  // ---- API -------------------------------------------------------------------

  const warned = new Set();
  /** test(cond, ctx) -> boolean. null/undefined = true. Unknown kinds are false (warned once). */
  C.test = function (cond, ctx) {
    if (cond === null || cond === undefined) return true;
    if (!KIT.isObject(cond) || typeof cond.kind !== 'string') return false;
    const def = reg.get(cond.kind);
    if (!def || typeof def.test !== 'function') {

      return false;

  C.describe = function (cond, ctx) {
    if (cond === null || cond === undefined) return 'always';
    if (!KIT.isObject(cond) || typeof cond.kind !== 'string') return '(invalid)';
    const def = reg.get(cond.kind);
    if (!def) return `(unknown: ${cond.kind})`;
    if (typeof def.describe === 'function') return def.describe(cond, ctx || {});
    return def.label || cond.kind;
  };
  /** withDefaults(fields, value) -> a copy where missing keys take their defaults, except defaults that are null (so 'required' still reports). */
  C.withDefaults = function (fields, value) {

    for (const k of Object.keys(filled)) if (!has(value, k) && filled[k] === null) delete filled[k];

  };
  /** normalize(cond) -> a copy with the kind's defaults filled (nested too). */
  C.normalize = function (cond) {
    if (cond === null || cond === undefined) return null;
    const def = KIT.isObject(cond) && reg.get(cond.kind);
    return def ? S.fill(def.fields || [], cond) : cond;
  };
  /** validate(cond, ctx) -> [{ path, message, code }] */
  C.validate = function (cond, ctx) { return S.validateValue({ key: 'when', type: 'condition' }, cond, ctx); };
  /** refs(cond, ctx) -> [{ kind, id, path, access:'read' }] */
  C.refs = function (cond, ctx) { const out = []; S._refsField({ key: 'when', type: 'condition' }, cond, ctx || {}, [], out); return out; };

  // ---- schema: 'scalar' (string | number | bool | null) and the rich 'condition' type ----

  S.defineType('scalar', {
    validate(f, v, ctx, path, errors) {
      if (v !== null && typeof v !== 'string' && typeof v !== 'number' && typeof v !== 'boolean') errors.push({ path: path.slice(), message: 'must be text, a number or true/false', code: 'type' });
      else if (typeof v === 'number' && !Number.isFinite(v)) errors.push({ path: path.slice(), message: 'must be a finite number', code: 'type' });
    },
    default(f) { return f.default !== undefined ? f.default : null; },
  });

  S.defineType('condition', {
    validate(f, v, ctx, path, errors) {
      if (v === null || v === undefined) return;
      if (!KIT.isObject(v) || typeof v.kind !== 'string') return errors.push({ path: path.slice(), message: 'must be a condition or empty', code: 'type' });
      const def = reg.get(v.kind);
      if (!def) return errors.push({ path: path.slice(), message: `unknown condition kind '${v.kind}'`, code: 'unknown' });
      S._validateFields(def.fields || [], C.withDefaults(def.fields, v), ctx || {}, path, errors);
    },
    default() { return null; },
    refs(f, v, ctx, path, out) {
      if (!KIT.isObject(v)) return;
      const def = reg.get(v.kind);
      if (!def) return;
      S._refsFields(def.fields || [], v, ctx || {}, path, out);
      for (const fld of S.fields(def.fields || [])) if (fld.target) C.targetRefs(v[fld.key], path.concat(fld.key), out);
    },
    fill(f, v) { return C.normalize(v); },
  });

  // ---- text format (lossless; used by Screenplay) ----------------------------
  // expr := or ; or := and ('or' and)* ; and := not ('and' not)* ; not := 'not' not | primary
  // primary := '(' expr ')' | 'always' | 'never' | {json} | ident op value | kind '(' key=value, ... ')'
  // ident := name (var) | self.key | item.id | meta.key ; value := number | true | false | "text" | word | var:name

  const wrapText = (c) => (c && (c.kind === 'all' || c.kind === 'any') && (c.of || []).length > 1 ? `(${C.toText(c)})` : C.toText(c));
  const word = (s) => typeof s === 'string' && V.WORD.test(s) && !['and', 'or', 'not', 'always', 'never', 'true', 'false', 'null'].includes(s);
  const valText = (v) => V.format(v, { bare: V.WORD });

  /** toText(cond) -> string. Kinds without sugar use `kind(key=value, …)`; anything else falls back to JSON. */
  C.toText = function (cond) {
    if (cond === null || cond === undefined) return 'always';
    if (!KIT.isObject(cond) || typeof cond.kind !== 'string') return JSON.stringify(cond);
    const c = cond, k = c.kind;
    if (k === 'var' && word(c.name) && (c.var == null || word(c.var))) return `${c.name} ${c.op || '=='} ${c.var ? 'var:' + c.var : valText(c.value)}`;
    if (k === 'self' && word(c.key)) return `self.${c.key} ${c.op || '=='} ${valText(c.value)}`;
    if (k === 'item' && word(c.id)) return `item.${c.id} ${c.op || '>='} ${valText(c.count == null ? 1 : c.count)}`;
    if (k === 'meta' && word(c.key)) return `meta.${c.key} ${c.op || '=='} ${valText(c.value)}`;
    if (k === 'all' || k === 'any') {
      const parts = (c.of || []);
      if (!parts.length) return `${k}()`;
      if (parts.length === 1) return `${k}(${C.toText(parts[0])})`;
      return parts.map(wrapText).join(k === 'all' ? ' and ' : ' or ');
    }
    if (k === 'not') return `not ${wrapText(c.of)}`;
    const def = reg.get(k);
    if (def) {
      const fields = S.fields(def.fields || []);
      const simple = fields.every(f => f.type !== 'condition' && !(f.type === 'list' && f.of && f.of.type === 'condition'));
      const extra = Object.keys(c).filter(key => key !== 'kind' && !fields.some(f => f.key === key));
      if (simple && !extra.length && /^[a-z][\w-]*$/i.test(k)) {
        const args = fields.filter(f => c[f.key] !== undefined).map(f => `${f.key}=${V.format(c[f.key], { bare: V.WORD })}`);
        return `${k}(${args.join(', ')})`;
      }
    }
    return JSON.stringify(c);
  };

  function lex(str) {
    const toks = [];
    let i = 0;
    const s = String(str);
    while (i < s.length) {
      const c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (c === '(' || c === ')' || c === ',') { toks.push({ t: c, i }); i++; continue; }
      const op = /^(==|!=|<=|>=|<|>|=)/.exec(s.slice(i));
      if (op) { toks.push({ t: 'op', v: op[1] === '=' ? '==' : op[1], i }); i += op[1].length; continue; }
      if (c === '"' || c === '{' || c === '[') {
        const r = V.scan(s, i, ',)');
        if (!r || r.error) throw new Error(`condition: bad value at ${i}`);
        toks.push({ t: 'value', v: r.value, i, raw: r.raw }); i = r.end; continue;
      }
      const m = /^-?\d+(\.\d+)?(?![\w.-])/.exec(s.slice(i));
      if (m) { toks.push({ t: 'value', v: Number(m[0]), i, raw: m[0] }); i += m[0].length; continue; }
      const w = /^[^\s(),=<>!"]+/.exec(s.slice(i));
      if (!w) throw new Error(`condition: unexpected '${c}' at ${i}`);
      toks.push({ t: 'word', v: w[0], i }); i += w[0].length;
    }
    return toks;
  }

  /** parseText(str) -> Condition | null ('always'). Throws Error('condition: …') on bad input. */
  C.parseText = function (str) {
    const toks = lex(str == null ? '' : str);
    let p = 0;
    const peek = () => toks[p];
    const next = () => toks[p++];
    const expect = (t) => { const k = next(); if (!k || k.t !== t) throw new Error(`condition: expected '${t}'${k ? ` at ${k.i}` : ' at end'}`); return k; };
    const isWord = (w) => peek() && peek().t === 'word' && peek().v === w;
    function value() {
      const k = next();
      if (!k) throw new Error('condition: expected a value at end');
      if (k.t === 'value') return { value: k.v };
      if (k.t === 'word') {
        if (k.v.startsWith('var:')) return { var: k.v.slice(4) };
        return { value: V.parseBare(k.v) };
      }
      throw new Error(`condition: expected a value at ${k.i}`);
    }
    function primary() {
      const k = next();
      if (!k) throw new Error('condition: unexpected end');
      if (k.t === '(') { const e = or(); expect(')'); return e; }
      if (k.t === 'value' && KIT.isObject(k.v)) return k.v;      // raw JSON condition
      if (k.t !== 'word') throw new Error(`condition: unexpected '${k.raw || k.v || k.t}' at ${k.i}`);
      if (k.v === 'always') return null;
      if (k.v === 'never') return { kind: 'any', of: [] };
      if (peek() && peek().t === '(') {
        next();
        if (k.v === 'all' || k.v === 'any') {                    // all(a, b) / any()
          const of = [];
          while (peek() && peek().t !== ')') { of.push(or()); if (peek() && peek().t === ',') next(); }
          expect(')');
          return { kind: k.v, of };
        }
        const c = { kind: k.v };                                  // kind(key=value, …)
        while (peek() && peek().t !== ')') {
          const key = expect('word').v;
          const eq = expect('op'); if (eq.v !== '==') throw new Error(`condition: expected '=' at ${eq.i}`);
          const v = value(); if (v.var !== undefined) throw new Error(`condition: var: is not allowed here`);
          c[key] = v.value;
          if (peek() && peek().t === ',') next();
        }
        expect(')');
        return C.normalize(c);
      }
      const opTok = expect('op');
      const v = value();
      if (k.v.startsWith('self.')) { if (v.var !== undefined) throw new Error('condition: self cannot compare to a var'); return { kind: 'self', key: k.v.slice(5), op: opTok.v, value: v.value }; }
      if (k.v.startsWith('item.')) { if (typeof v.value !== 'number') throw new Error('condition: item count must be a number'); return { kind: 'item', id: k.v.slice(5), op: opTok.v, count: v.value }; }
      if (k.v.startsWith('meta.')) { if (v.var !== undefined) throw new Error('condition: meta cannot compare to a var'); return { kind: 'meta', key: k.v.slice(5), op: opTok.v, value: v.value }; }
      const out = { kind: 'var', name: k.v, op: opTok.v, value: v.var !== undefined ? 0 : v.value, var: v.var !== undefined ? v.var : null };
      return out;
    }
    function notExpr() { if (isWord('not')) { next(); return { kind: 'not', of: notExpr() }; } return primary(); }
    function and() { const parts = [notExpr()]; while (isWord('and')) { next(); parts.push(notExpr()); } return parts.length === 1 ? parts[0] : { kind: 'all', of: parts }; }
    function or() { const parts = [and()]; while (isWord('or')) { next(); parts.push(and()); } return parts.length === 1 ? parts[0] : { kind: 'any', of: parts }; }
    if (!toks.length) return null;
    const result = or();
    if (p < toks.length) throw new Error(`condition: unexpected '${toks[p].raw || toks[p].v || toks[p].t}' at ${toks[p].i}`);
    return C.normalize(result);
  };
  /** tryParseText(str) -> Condition | null | undefined (undefined = parse error). */
  C.tryParseText = function (str) { try { return C.parseText(str); } catch (e) { return undefined; } };

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);
