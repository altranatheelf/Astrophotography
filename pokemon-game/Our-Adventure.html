<script>
// ---- js/kit/script/commands.js ----
// Commands: the 'commands' registry, every baseline command (§9.2) as a
// definition { fields, run(ctx, cmd), summary, text sugar }, the rich 'script'
// schema type, the generic `@id key=value` line form shared with Screenplay,
// and the kit's default Terms (strings). run() touches the world ONLY through
// the ports on ctx (documented below); the runtime implements them, tests fake them.
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const S = KIT.schema;
  const V = KIT.script.values;
  const T = KIT.text;
  const C = KIT.conditions;
  const CMD = KIT.commands = KIT.commands || {};
  const reg = KIT.registry('commands');
  // Workaround (core issue): registries.js validates every id against a lowercase-only pattern, but §9.2 names
  // commands in camelCase (setVar, inputNumber, moveRoute…). Widen the pattern on this registry's definition schema.
  for (const f of reg.opts.fields || []) if (f.key === 'id' && f.pattern) f.pattern = '^[a-zA-Z0-9][a-zA-Z0-9-_.:]*$';

  // ---- the ctx port contract -------------------------------------------------
  /**
   * @typedef {Object} RunCtx  What a command's run(ctx, cmd) may use. The interpreter builds it; the runtime (Phase 2) implements the ports.
   * @property {Object} project                 the project (read-only)
   * @property {Object} world                   { save, map, entities, events } — commands read/write `save` directly (vars, inventory, objects, timer, heroes[i].name) and emit events for every change
   * @property {string|null} self               the current object's save key ('town:mom') or null
   * @property {string} hero                    the triggering hero id ('p1' | 'p2')
   * @property {Object} [thread]                { id, background, cancelled, ... } (§9.6)
   * @property {function} rng                   KIT.rng — every random decision
   * @property {Object<string,*>} [args]        call arguments ({arg:name})
   * @property {function(string, Object)} emit  emit(event, payload) on the world bus: varChanged, selfChanged, itemChanged, objectStateChanged, timerChanged, heroRenamed, heal, debug
   * @property {RunIo} io
   * @property {RunAudio} audio
   * @property {RunScreen} screen
   * @property {RunPictures} pictures
   * @property {RunMap} map
   * @property {RunGame} game
   */
  /**
   * @typedef {Object} RunIo  main-thread scenes; all return promises
   * @property {function({who:string, face:string|null, text:string, position:string, bg:string, raw:string}):Promise} say
   * @property {function({prompt:string, options:Array<{text:string, index:number}>, cancel:string}):Promise<number>} choice  resolves the chosen option index (into the given list) or -1 on cancel
   * @property {function({hero:string, prompt:string, maxLength:number, current:string}):Promise<string|null>} nameEntry
   * @property {function({prompt:string, digits:number, current:number}):Promise<number|null>} inputNumber
   * @property {function({text:string}):Promise} toast
   * @property {function({title:string, subtitle:string, ms:number}):Promise} chapter
   * @property {function({text:string, speed:number, noFast:boolean}):Promise} scrollText
   * @property {function(number):Promise} wait   wait(ms)
   */
  /**
   * @typedef {Object} RunAudio
   * @property {function(string, {volume:number}):Promise} play        a sound effect
   * @property {function(string|null, {fade:number, volume:number}):Promise} music   start (or null = stop) the music
   * @property {function(string):Promise} stop     stop('sound' | 'music')
   * @property {function():Promise} save           remember the current music
   * @property {function():Promise} replay         resume the remembered music
   * @property {function(string):Promise} jingle   play a short piece, then resume the music
   */
  /**
   * @typedef {Object} RunScreen
   * @property {function({ms:number, color:string}):Promise} fadeOut
   * @property {function({ms:number}):Promise} fadeIn
   * @property {function({color:string, amount:number, ms:number}):Promise} tint
   * @property {function({color:string, ms:number}):Promise} flash
   * @property {function({power:number, ms:number}):Promise} shake
   * @property {function({kind:string, power:number, ms:number}):Promise} weather
   */
  /**
   * @typedef {Object} RunPictures
   * @property {function({id:string, image:string, x:number, y:number, anchor:string, opacity:number}):Promise} show
   * @property {function({id:string, x:number, y:number, opacity:number, ms:number, wait:boolean}):Promise} move
   * @property {function({id:string}):Promise} erase
   */
  /**
   * @typedef {Object} RunMap   `target` is 'self' | 'hero' | 'p1' | 'p2' | 'obj:<id>'
   * @property {function({map:string, x:number, y:number, dir:string, fade:boolean}):Promise} transfer
   * @property {function({target:string, x:number, y:number, swap:string|null}):Promise} setLocation
   * @property {function({target:string, steps:string[], wait:boolean, skipBlocked:boolean, repeat:boolean}):Promise} moveRoute
   * @property {function({dx:number, dy:number, speed:number}):Promise} scrollMap
   * @property {function({target:string, on:boolean}):Promise} transparency
   * @property {function({target:string, id:string}):Promise} animation
   * @property {function({target:string, kind:string, wait:boolean}):Promise} balloon
   * @property {function({target:string, persistent:boolean}):Promise} erase
   * @property {function({on:boolean}):Promise} follow
   */
  /**
   * @typedef {Object} RunGame
   * @property {function():Promise} menu
   * @property {function({slot:string}):Promise<boolean>} save
   * @property {function():Promise} title
   * @property {function({hero:string}):Promise} heal
   * @property {function({text:string}):void} debug
   */
  /**
   * @typedef {Object} ControlSignal  What flow commands return for the interpreter (other commands return undefined).
   *   { kind:'block', body:Command[], loop?:true }   run the nested list (again and again when loop)
   *   { kind:'break' } | { kind:'jump', label } | { kind:'exit' } | { kind:'call', script, args }
   */
  /** @typedef {Object} Command  { t, disabled?, ...fields of the command }; { t:'raw', line } is a line Screenplay could not parse. */

  // ---- helpers ---------------------------------------------------------------

  const has = (o, k) => o !== null && o !== undefined && Object.prototype.hasOwnProperty.call(o, k);
  const save = (ctx) => { const w = ctx.world || (ctx.world = {}); return w.save || (w.save = {}); };
  const emit = (ctx, event, payload) => {
    if (typeof ctx.emit === 'function') ctx.emit(event, payload);
    else if (ctx.world && ctx.world.events && typeof ctx.world.events.emit === 'function') ctx.world.events.emit(event, payload);
  };
  const port = (ctx, group, name) => {
    const g = ctx[group];
    if (!g || typeof g[name] !== 'function') throw new Error(`commands: ctx.${group}.${name} is not available`);
    return (...args) => g[name](...args);
  };
  const strings = (ctx, key, vars) => KIT.strings.get(ctx.project, key, vars);
  const itemName = (ctx, id) => { const it = ctx && ctx.project && ctx.project.items && ctx.project.items[id]; return it && it.name ? it.name : String(id); };
  const plain = (str, ctx) => T.plain(str, ctx);
  const short = (s, n) => { s = String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); return s.length > (n || 40) ? s.slice(0, (n || 40) - 1) + '…' : s; };
  const targetField = (def) => ({ key: 'target', type: 'string', default: def, target: true, doc: 'self, hero, p1, p2 or obj:<id>' });
  const heroField = (def, opts) => ({ key: 'hero', type: 'enum', options: opts || ['hero', 'p1', 'p2'], default: def || 'hero' });
  const heroIdFor = (ctx, sel) => (!sel || sel === 'hero' ? C.heroId(ctx) : sel);

  /** State helpers (shared with the interpreter and systems): every write emits its event. */
  const STATE = CMD.state = {
    getVar: (ctx, name) => C.getVar(ctx, name),
    setVar(ctx, name, value) {
      const s = save(ctx); s.vars = s.vars || {};
      const old = s.vars[name];
      s.vars[name] = value;
      emit(ctx, 'varChanged', { name, old, value });
      return value;
    },
    getSelf: (ctx, key, objectKey) => C.getSelf(ctx, key, objectKey),
    setSelf(ctx, key, value, objectKey) {
      const k = objectKey || ctx.self;
      if (!k) throw new Error('commands: setSelf needs a current object (ctx.self)');
      const s = save(ctx); s.objects = s.objects || {};
      const o = s.objects[k] || (s.objects[k] = { self: {} });
      o.self = o.self || {};
      const old = o.self[key];
      o.self[key] = value;
      emit(ctx, 'selfChanged', { objectKey: k, key, old, value });
      return value;
    },
    count: (ctx, id) => C.count(ctx, id),
    give(ctx, id, delta) {
      const s = save(ctx); s.inventory = s.inventory || {};
      const before = Number(s.inventory[id]) || 0;
      const after = Math.max(0, before + delta);
      if (after === 0) delete s.inventory[id]; else s.inventory[id] = after;
      emit(ctx, 'itemChanged', { id, delta: after - before, count: after });
      return after;
    },
    heroName(ctx, heroId) {
      const i = C.heroIndex(ctx, heroId);
      const s = save(ctx);
      const h = (s.heroes || [])[i];
      if (h && h.name != null) return h.name;
      const p = ((ctx.project && ctx.project.heroes) || [])[i];
      return p ? p.name : heroId;
    },
    setHeroName(ctx, heroId, name) {
      const i = C.heroIndex(ctx, heroId);
      const s = save(ctx); s.heroes = s.heroes || [];
      while (s.heroes.length <= i) s.heroes.push({});
      const old = s.heroes[i].name;
      s.heroes[i].name = name;
      emit(ctx, 'heroRenamed', { hero: heroId, old, name });
      return name;
    },
  };

  // ---- default Terms -----------------------------------------------------------
  // The keys commands read. project.js registers the shared table; only missing keys are added here (no replace warnings in either load order).
  const STRINGS = KIT.registry('strings');
  for (const d of [
    { id: 'got-item', default: 'Got {count} {item}!', doc: 'give with notify' },
    { id: 'lost-item', default: 'Lost {count} {item}.', doc: 'take with notify' },
    { id: 'save-prompt', default: 'Save your progress?' },
    { id: 'saved', default: 'Saved.' },
    { id: 'save-failed', default: 'Could not save.' },
    { id: 'yes', default: 'Yes' }, { id: 'no', default: 'No' }, { id: 'ok', default: 'OK' }, { id: 'cancel', default: 'Cancel' }, { id: 'continue', default: 'Continue' },
    { id: 'name-prompt', default: 'What is your name?' },
    { id: 'number-prompt', default: 'Enter a number' },
    { id: 'timer-up', default: 'Time is up!' },
  ]) if (!STRINGS.has(d.id)) STRINGS.add(d);

  // ---- line-form helpers (sugar) ----------------------------------------------

  const ESC = (s) => String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n');
  const UNESC = (s) => String(s).replace(/\\(.)/g, (m, c) => (c === 'n' ? '\n' : c));
  const ESCQ = (s) => ESC(s).replace(/"/g, '\\"');
  /** Non-default keys of cmd (in field order) as `key=value` text; `skip` keys are omitted. */
  function pairsOf(def, cmd, skip) {
    const keys = keysFor(def, cmd).filter(k => !skip.includes(k));
    return keys.map(k => `${k}=${V.format(cmd[k])}`).join(' ');
  }
  /** '(a=1, b=x)' style option group. */
  const parenPairs = (def, cmd, keys) => { const ks = keysFor(def, cmd).filter(k => keys.includes(k)); return ks.length ? `(${ks.map(k => `${k}=${V.format(cmd[k])}`).join(', ')})` : ''; };
  const parseParens = (s) => { const o = {}; for (const tk of V.tokenize(s || '', { separators: ',' })) if (tk.key) o[tk.key] = tk.value; return o; };

  /** positional(def, keys) -> text sugar `@id v1 v2 … key=value` for the listed keys in order (only leading ones that are set). */
  function positional(id, keys) {
    return {
      toLine(cmd) {
        const def = reg.get(cmd.t);
        const words = [];
        for (const k of keys) { if (cmd[k] === undefined || cmd[k] === null) break; words.push(V.format(cmd[k])); }
        const used = keys.slice(0, words.length);
        const rest = pairsOf(def, cmd, used);
        return `@${id}${words.length ? ' ' + words.join(' ') : ''}${rest ? ' ' + rest : ''}`;
      },
      fromLine(line) {
        const m = new RegExp(`^@${id}(?:\\s+(.*))?$`).exec(line.trim());
        if (!m) return null;
        const cmd = { t: id };
        let pos = 0;
        for (const tk of V.tokenize(m[1] || '')) {
          if (tk.key) cmd[tk.key] = tk.value;
          else { if (pos >= keys.length) return null; cmd[keys[pos++]] = tk.value; }
        }
        return cmd;
      },
    };
  }

  const SAY_LINE = /^([^\s@?#":\-\[][^:(\n]*?)\s*(?:\(([^)]*)\))?:\s?(.*)$/;
  const SAY_WHO = /^[^\s@?#":\-\[][^:(\n]*$/;
  const NARRATION_LINE = /^"((?:[^"\\]|\\.)*)"\s*(?:\(([^)]*)\))?\s*$/;

  function applyOp(op, cur, v) {

      case 'sub': return n - m;

  // Audio
  defs.push({

    fields: [{ key: 'id', type: 'ref:music', label: 'Track', doc: 'Empty = stop the music' }, { key: 'fade', type: 'number', min: 0, default: 0, label: 'Fade ms' }, { key: 'volume', type: 'number', min: 0, max: 1, default: 1 }],

  reg.addAll(defs);

  // ---- structure helpers -----------------------------------------------------

  /** blockFields(def) -> keys holding nested command lists directly ('then', 'else', 'body') or via option groups ('options'). */
  CMD.blockFields = function (def) {
    const out = [];
    for (const f of S.fields((def && def.fields) || [])) {
      if (f.type === 'script') out.push(f.key);
      else if (f.type === 'list' && f.of && f.of.type === 'group' && (f.of.fields || []).some(g => g.type === 'script')) out.push(f.key);
    }
    return out;
  };
  /** nested(cmd) -> [{ key, path, list }] every nested command list of cmd with its path relative to cmd. */
  CMD.nested = function (cmd) {
    const def = reg.get(cmd && cmd.t);
    const out = [];
    if (!def) return out;
    for (const f of S.fields(def.fields || [])) {
      if (f.type === 'script' && Array.isArray(cmd[f.key])) out.push({ key: f.key, path: [f.key], list: cmd[f.key] });
      else if (f.type === 'list' && f.of && f.of.type === 'group' && Array.isArray(cmd[f.key])) {
        const scriptKeys = (f.of.fields || []).filter(g => g.type === 'script').map(g => g.key);
        cmd[f.key].forEach((item, i) => { for (const k of scriptKeys) if (item && Array.isArray(item[k])) out.push({ key: f.key, path: [f.key, i, k], list: item[k] }); });
      }
    }
    return out;
  };
  /** walk(cmds, fn(cmd, path)) — depth-first, path = [index, 'then', index, ...]. Return false from fn to skip a command's children. */
  CMD.walk = function (cmds, fn, path) {
    path = path || [];
    (cmds || []).forEach((cmd, i) => {
      const p = path.concat(i);
      if (fn(cmd, p) === false) return;
      for (const n of CMD.nested(cmd)) CMD.walk(n.list, fn, p.concat(n.path));
    });
  };
  /** normalize(cmd) -> a copy with the command's defaults filled (nested lists too). Raw/unknown commands pass through. */
  CMD.normalize = function (cmd) {
    if (!KIT.isObject(cmd)) return cmd;
    const def = reg.get(cmd.t);
    if (!def) return cmd;
    return S.fill(def.fields || [], cmd);
  };
  CMD.normalizeAll = (cmds) => (cmds || []).map(CMD.normalize);
  /** Keys of cmd worth writing: fields (in order) whose value differs from the default, then extra keys (sorted). Never 't'. */
  function keysFor(def, cmd) {
    const out = [];
    const fields = def ? S.fields(def.fields || []) : [];
    const blocks = def ? CMD.blockFields(def) : [];
    for (const f of fields) {
      if (blocks.includes(f.key) || cmd[f.key] === undefined) continue;
      if (cmd[f.key] === null && (f.nullable || f.optional)) continue;
      if (!S.visible(f, cmd)) continue;
      if (KIT.deepEqual(cmd[f.key], S.defaultFor(f))) continue;
      out.push(f.key);
    }
    const known = fields.map(f => f.key);
    for (const k of Object.keys(cmd).sort()) if (k !== 't' && !known.includes(k) && !out.includes(k) && cmd[k] !== undefined && !(k === 'disabled' && cmd[k] === false)) out.push(k);
    return out;
  }
  CMD.keysFor = keysFor;

  // ---- line form -------------------------------------------------------------

  /** genericToLine(cmd) -> '@id key=value …' (nested block lists are left to Screenplay's indentation). */
  CMD.genericToLine = function (cmd) {
    const def = reg.get(cmd.t);
    const pairs = keysFor(def, cmd).map(k => `${k}=${V.format(cmd[k])}`);
    return `@${cmd.t}${pairs.length ? ' ' + pairs.join(' ') : ''}`;
  };
  /** genericFromLine(line) -> cmd | null. Only `key=value` pairs are accepted (positional words make it null). */
  CMD.genericFromLine = function (line) {
    const m = /^@([A-Za-z_][\w-]*)(?:\s+(.*))?$/.exec(String(line).trim());
    if (!m) return null;
    const cmd = { t: m[1] };
    for (const tk of V.tokenize(m[2] || '')) {
      if (!tk.key || tk.error) return null;
      cmd[tk.key] = tk.value;
    }
    return cmd;
  };
  /** Lines Screenplay owns (block structure); fromLine never turns them into commands. */
  CMD.reservedLines = ['@else', '@end'];
  /** toLine(cmd) -> the canonical Screenplay line: the command's sugar when it can express the command, else the generic form. A disabled command always uses the generic form (`disabled=true`). */
  CMD.toLine = function (cmd) {
    if (!KIT.isObject(cmd)) return '';
    if (cmd.t === 'raw') return String(cmd.line == null ? '' : cmd.line);
    const def = reg.get(cmd.t);
    if (!cmd.disabled && def && def.text && typeof def.text.toLine === 'function') {
      const line = def.text.toLine(cmd);
      if (typeof line === 'string') return line;
    }
    return CMD.genericToLine(cmd);
  };
  /** fromLine(line) -> normalized cmd | null. Tries every command's sugar, then the generic form. Nested lists come back empty. */
  CMD.fromLine = function (line) {
    const s = String(line == null ? '' : line);
    if (!s.trim() || CMD.reservedLines.includes(s.trim())) return null;
    for (const def of reg.list()) {
      if (!def.text || typeof def.text.fromLine !== 'function') continue;
      let cmd = null;
      try { cmd = def.text.fromLine(s); } catch (e) { cmd = null; }
      if (cmd) return CMD.normalize(cmd);
    }
    const g = CMD.genericFromLine(s);
    return g ? CMD.normalize(g) : null;
  };

  // ---- summaries, validation, refs, execution -------------------------------

  /** summary(cmd, ctx) -> one line for the command card. */
  CMD.summary = function (cmd, ctx) {
    if (!KIT.isObject(cmd)) return '';
    if (cmd.t === 'raw') return `Unparsed: ${short(cmd.line, 50)}`;
    const def = reg.get(cmd.t);
    let s;
    if (!def) s = `Unknown command '${cmd.t}'`;
    else if (typeof def.summary === 'function') { try { s = def.summary(cmd, ctx || {}); } catch (e) { s = def.label || cmd.t; } }
    else s = def.label || cmd.t;
    return cmd.disabled ? `(off) ${s}` : s;
  };
  /**
   * validateScript(cmds, ctx) -> [{ path, message, code }]. ctx: { project, map, background:true for tick/parallel threads }.
   */
  CMD.validateScript = function (cmds, ctx) { return S.validateValue({ key: 'script', type: 'script' }, cmds, ctx); };
  /** refs(cmds, ctx) -> [{ kind, id, path, access:'read'|'write' }] */
  CMD.refs = function (cmds, ctx) { const out = []; S._refsField({ key: 'script', type: 'script' }, cmds, ctx || {}, [], out); return out; };
  /** exec(ctx, cmd) -> Promise<ControlSignal|undefined>: skips disabled/raw/unknown commands (unknown ones warn once). */
  const warned = new Set();
  CMD.exec = async function (ctx, cmd) {
    if (!KIT.isObject(cmd) || cmd.disabled || cmd.t === 'raw') return undefined;
    const def = reg.get(cmd.t);
    if (!def || typeof def.run !== 'function') {
      if (!warned.has(cmd.t)) { warned.add(cmd.t); (KIT.log || console).warn(`[commands] unknown command '${cmd.t}' skipped`); }
      return undefined;
    }
    if (ctx && ctx.thread && ctx.thread.background && def.background === false) throw new Error(`commands: '${cmd.t}' cannot run on a background thread`);
    return def.run(ctx, cmd);
  };
  CMD.get = (id) => reg.get(id);
  CMD.list = () => reg.list();
  CMD.ids = () => reg.ids();

  // ---- schema: the rich 'script' type ---------------------------------------
  S.defineType('script', {
    validate(f, v, ctx, path, errors) {
      if (!Array.isArray(v)) return errors.push({ path: path.slice(), message: 'must be a list of commands', code: 'type' });
      v.forEach((c, i) => {
        const p = path.concat(i);
        if (!KIT.isObject(c) || typeof c.t !== 'string') return errors.push({ path: p, message: 'each command needs a type (t)', code: 'type' });
        if (c.t === 'raw') { if (typeof c.line !== 'string') errors.push({ path: p.concat('line'), message: 'a raw line needs text', code: 'type' }); return; }
        const def = reg.get(c.t);
        if (!def) return errors.push({ path: p, message: `unknown command '${c.t}'`, code: 'unknown' });
        if (ctx && ctx.background && def.background === false) errors.push({ path: p, message: `'${c.t}' cannot run on a background (tick/parallel) thread`, code: 'background' });
        if (has(c, 'disabled') && typeof c.disabled !== 'boolean') errors.push({ path: p.concat('disabled'), message: 'must be true or false', code: 'type' });
        S._validateFields(def.fields || [], C.withDefaults(def.fields, c), ctx || {}, p, errors);   // missing keys mean "the default"; only defaults of null stay required
      });
    },
    default() { return []; },
    refs(f, v, ctx, path, out) {
      if (!Array.isArray(v)) return;
      v.forEach((c, i) => {
        const def = KIT.isObject(c) && reg.get(c.t);
        if (!def) return;
        const p = path.concat(i);
        S._refsFields(def.fields || [], c, ctx || {}, p, out);
        for (const fld of S.fields(def.fields || [])) if (fld.target) C.targetRefs(c[fld.key], p.concat(fld.key), out);
      });
    },
    fill(f, v) { return Array.isArray(v) ? v.map(CMD.normalize) : v; },
  });

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
// ---- js/kit/script/screenplay.js ----
// Screenplay: the plain-text view of a script (§9.5). Lossless by
// construction — the JSON command list is the truth, this is a rendering of
// it that parses back to the same list. Anything that cannot be parsed becomes
// { t:'raw', line } (never dropped) and is reported as a problem.
//
//   KIT.screenplay.serialize(commands) -> text
//   KIT.screenplay.parse(text) -> { commands, problems:[{ line, message, raw }] }
//   KIT.screenplay.serializeDocument(sections) / parseDocument(text)   (":: id [tags] when: …" sections)
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const CMD = KIT.commands;
  const C = KIT.conditions;
  const V = KIT.script.values;
  const reg = KIT.registry('commands');
  const SP = KIT.screenplay = KIT.screenplay || {};

  SP.INDENT = '    ';
  const pad = (level) => SP.INDENT.repeat(level);

    if (cmd.t === 'choice') return 'choice';
    const def = reg.get(cmd.t);
    if (!def) return null;
    const blocks = CMD.blockFields(def);
    if (!blocks.length) return null;
    const fields = KIT.schema.fields(def.fields || []);
    if (blocks.length === 1) {

  };

  // ---- serialize ---------------------------------------------------------------
  function commandLine(cmd) {
    const layout = SP.layout(cmd);
    if (layout === 'inline') {
      // Generic form plus the nested lists as JSON pairs (keysFor skips block fields).
      const def = reg.get(cmd.t);
      const blocks = CMD.blockFields(def);
      const base = CMD.genericToLine(cmd);
      const pairs = blocks.filter(k => cmd[k] !== undefined).map(k => `${k}=${JSON.stringify(cmd[k])}`);

      if (cmd.t === 'raw') { out.push(pad(level) + String(cmd.line == null ? '' : cmd.line).replace(/\r?\n/g, ' ')); continue; }
      const layout = SP.layout(cmd);
      out.push(pad(level) + commandLine(cmd));

        writeList(cmd.then, level + 1, out);
        if (Array.isArray(cmd.else) && cmd.else.length) { out.push(pad(level) + '@else'); writeList(cmd.else, level + 1, out); }

      const cmds = [];
      while (pos < items.length) {
        const it = peek();
        if (it.level < level) break;
        if (it.level > level) { problem(it, 'unexpected indentation'); cmds.push(rawCmd(it)); pos++; continue; }
        if (isEnd(it.body) || isElse(it.body)) { problem(it, `stray ${it.body}`); cmds.push(rawCmd(it)); pos++; continue; }
        if (OPTION.test(it.body)) { problem(it, 'a choice option (- …) outside a choice'); cmds.push(rawCmd(it)); pos++; continue; }
        let cmd = null;
        try { cmd = CMD.fromLine(it.body); } catch (e) { cmd = null; problem(it, e && e.message ? e.message : 'could not read this line'); }
        if (!cmd) { if (!problems.some(p => p.line === it.n)) problem(it, 'could not read this line'); cmds.push(rawCmd(it)); pos++; continue; }
        pos++;

          cmd.options = [];
          while (atLevel(level, (b) => OPTION.test(b))) {
            const optItem = peek();
            let opt = null;
            try { opt = CMD.option.fromLine(optItem.body); } catch (e) { problem(optItem, e && e.message ? e.message : 'bad option'); }
            pos++;
            if (!opt) { opt = { text: optItem.body.replace(OPTION, ''), when: null, then: [] }; }
            opt.then = parseList(level + 1);
            cmd.options.push(opt);
          }
          if (!cmd.options.length) problem(it, 'a choice needs at least one - option');
        } else if (layout && layout.body) {
          cmd[layout.body] = parseList(level + 1);
          if (atLevel(level, isEnd)) pos++; else problem(it, `missing @end for @${cmd.t} on line ${it.n}`);
        }
        cmds.push(CMD.normalize(cmd));
      }
      return cmds;
    }

  // ---- documents (many scripts in one text) ---------------------------------------
  const HEADER = /^::\s+(\S+)(?:\s+\[([^\]]*)\])?(?:\s+when:\s*(.*?))?\s*$/;
  const TRIGGERS = ['call', 'auto', 'parallel'];

  SP.serializeDocument = function (sections) {
    return (sections || []).map(sec => {

      for (const t of sec.tags || []) if (!tags.includes(t)) tags.push(t);
      let head = `:: ${sec.id}`;
      if (tags.length) head += ` [${tags.join(' ')}]`;
      if (sec.when) head += ` when: ${C.toText(sec.when)}`;

  SP.parseDocument = function (text) {
    const lines = String(text == null ? '' : text).split(/\r?\n/);
    const problems = [];
    const sections = [];
    let cur = { id: null, trigger: 'call', tags: [], when: null, lines: [], line: 1 };
    lines.forEach((raw, i) => {
      const m = HEADER.exec(raw);
      if (m) {
        if (cur.id !== null || cur.lines.some(l => l.trim())) sections.push(cur);
        const tags = (m[2] || '').split(/\s+/).filter(Boolean);
        const trigger = tags.find(t => TRIGGERS.includes(t)) || 'call';
        let when = null;
        if (m[3] != null && m[3] !== '') {
          try { when = C.parseText(m[3]); } catch (e) { problems.push({ line: i + 1, message: `bad when: ${e.message}`, raw }); }
        }
        cur = { id: m[1], trigger, tags: tags.filter(t => !TRIGGERS.includes(t)), when, lines: [], line: i + 1 };
      } else cur.lines.push(raw);
    });
    if (cur.id !== null || cur.lines.some(l => l.trim())) sections.push(cur);
    for (const sec of sections) {
      const r = SP.parse(sec.lines.join('\n'));
      sec.commands = r.commands;
      for (const p of r.problems) problems.push({ line: p.line + sec.line, message: p.message, raw: p.raw, section: sec.id });

    }
    return { sections, problems };
  };

<script>
// ---- js/kit/script/interpreter.js ----
// Interpreter (§9.6): runs command lists on threads. The MAIN thread is
// exclusive (a second main run waits its turn; input is locked by the runtime
// while one runs); BACKGROUND threads run `tick`/`parallel` scripts and may not
// use commands that need the main thread. Every random decision goes through
// ctx.rng, so a run is reproducible.
//
//   await KIT.interpreter.run(commands, ctx, { kind:'main'|'background' }) -> { status:'done'|'exit'|'cancelled', thread }
//   KIT.interpreter.fakeCtx({ answers:[1,0], vars:{…} })   a recording ctx for tests and headless play
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const CMD = KIT.commands;
  const C = KIT.conditions;
  const P = KIT.path;
  const I = KIT.interpreter = KIT.interpreter || {};

  class Cancelled extends Error { constructor() { super('cancelled'); this.name = 'Cancelled'; } }
  I.Cancelled = Cancelled;
  const threads = new Map();
  let nextId = 1;
  let mainChain = Promise.resolve();
  let mainActive = 0;

  function makeThread(kind, label) {
    const t = {
      id: nextId++, kind, label: label || '', background: kind === 'background', status: 'queued',
      cancelled: false, paused: false, stepping: false, breakpoints: new Set(), current: null, steps: 0,
      _wake: null,
      wake() { const w = t._wake; t._wake = null; if (w) w(); },
      pause() { t.paused = true; },
      resume() { t.paused = false; t.stepping = false; t.wake(); },
      step() { t.stepping = true; t.paused = false; t.wake(); },
      cancel() { t.cancelled = true; t.wake(); },
      async checkpoint(cmd, path, ctx) {
        t.current = { cmd, path };
        t.steps++;
        if (t.cancelled) throw new Cancelled();
        if (t.breakpoints.has(P.join(path)) || t.stepping) { t.paused = true; t.stepping = false; }
        if (typeof ctx.onStep === 'function') ctx.onStep(cmd, path, t);
        if (t.cancelled) throw new Cancelled();          // a cancel from the hook applies before this command runs
        while (t.paused) {
          await new Promise(res => { t._wake = res; });
          if (t.cancelled) throw new Cancelled();
        }
      },
    };
    return t;
  }

  /** The nested list `body` of `cmd` as a debugger path (by identity), e.g. [3,'then'] or [3,'options',1,'then']. */
  function blockPath(cmd, body, path) {
    for (const n of CMD.nested(cmd)) if (n.list === body) return path.concat(n.path);
    return path.concat('block');
  }

  async function execList(cmds, ctx, path, loop) {
    const labels = {};
    (cmds || []).forEach((c, i) => { if (KIT.isObject(c) && c.t === 'label' && !c.disabled && c.name) labels[c.name] = i; });
    let pc = 0;
    for (;;) {
      if (pc >= cmds.length) {
        if (loop && cmds.length) { pc = 0; continue; }
        return { kind: 'done' };
      }
      const cmd = cmds[pc];
      const p = path.concat(pc);
      await ctx.thread.checkpoint(cmd, p, ctx);
      const signal = await CMD.exec(ctx, cmd);
      if (signal && signal.kind) {
        if (signal.kind === 'block') {
          const r = await execList(signal.body || [], ctx, blockPath(cmd, signal.body, p), !!signal.loop);
          if (r.kind === 'break') { if (signal.loop) { pc++; continue; } return r; }
          if (r.kind === 'jump') { if (labels[r.label] != null) { pc = labels[r.label]; continue; } return r; }
          if (r.kind === 'exit') return r;
          pc++; continue;
        }
        if (signal.kind === 'break' || signal.kind === 'exit') return signal;
        if (signal.kind === 'jump') { if (labels[signal.label] != null) { pc = labels[signal.label]; continue; } return signal; }
        if (signal.kind === 'call') { await I.callScript(ctx, signal.script, signal.args, p); pc++; continue; }
      }
      pc++;
    }
  }

  /** callScript(ctx, id, args, path) — runs project.scripts[id].body on the SAME thread. `exit`/`break`/`jump` inside end only that script. */
  I.callScript = async function (ctx, id, args, path) {
    const script = ctx.project && ctx.project.scripts && ctx.project.scripts[id];
    if (!script) { (KIT.log || console).warn(`[interpreter] unknown script '${id}'`); return { kind: 'done' }; }

  /**
   * run(commands, ctx, { kind:'main'|'background', label, path, breakpoints:['2/then/0'] }) -> Promise<{ status, thread, signal }>

  I.run = function (cmds, ctx, opts) {

    }
    thread.promise = exec();

  I.cancelAll = () => { for (const t of threads.values()) t.cancel(); };
  I.cancel = (thread) => { if (thread) thread.cancel(); };

  // ---- common events -------------------------------------------------------------
  I.runScript = function (project, id, ctx, opts) {
    const script = project && project.scripts && project.scripts[id];
    if (!script) return Promise.resolve({ status: 'done', missing: true });

  };
  /** runAuto(project, ctx) -> Promise<string[]> ids run (in order); each waits for the previous. */
  I.runAuto = async function (project, ctx) {

  I.runParallel = function (project, ctx) {

      if (!C.test(s.when, Object.assign({}, ctx, { project }))) continue;
      const promise = I.runScript(project, id, ctx, { kind: 'background' });

    }

  };

  // ---- fake ctx -----------------------------------------------------------------
  /**
   * fakeCtx({ project, save, self, hero, seed, answers, names, numbers, onSay }) -> ctx

    const save = Object.assign({ vars: {}, inventory: {}, objects: {}, heroes: [{}, {}], timer: { running: false, secondsLeft: 0 }, meta: {} }, options.save || {});
    const events = KIT.events('fake');
    const log = [];
    const answers = (options.answers || []).slice();
    const names = (options.names || []).slice();
    const numbers = (options.numbers || []).slice();
    const rec = (port, name) => (...args) => { log.push({ port, name, args }); return Promise.resolve(); };
    const ctx = {
      project, world: { save, map: options.map || { id: 'test', objects: [] }, entities: [], events },
      self: options.self === undefined ? null : options.self, hero: options.hero || 'p1', coop: !!options.coop,
      rng: KIT.rng(options.seed == null ? 1 : options.seed),
      log, answers, names, numbers,
      emit(event, payload) { log.push({ port: 'emit', name: event, args: [payload] }); events.emit(event, payload); },
      io: {
        say(o) { log.push({ port: 'io', name: 'say', args: [o] }); if (options.onSay) options.onSay(o); return Promise.resolve(); },
        choice(o) {
          log.push({ port: 'io', name: 'choice', args: [o] });
          let a = answers.length ? answers.shift() : 0;
          if (typeof a === 'string') { const i = o.options.findIndex(x => x.text === a); a = i; }
          return Promise.resolve(a);
        },
        nameEntry(o) { log.push({ port: 'io', name: 'nameEntry', args: [o] }); return Promise.resolve(names.length ? names.shift() : 'Name'); },
        inputNumber(o) { log.push({ port: 'io', name: 'inputNumber', args: [o] }); return Promise.resolve(numbers.length ? numbers.shift() : 0); },
        toast: rec('io', 'toast'), chapter: rec('io', 'chapter'), scrollText: rec('io', 'scrollText'), wait: rec('io', 'wait'),
      },
      audio: { play: rec('audio', 'play'), music: rec('audio', 'music'), stop: rec('audio', 'stop'), save: rec('audio', 'save'), replay: rec('audio', 'replay'), jingle: rec('audio', 'jingle') },
      screen: { fadeOut: rec('screen', 'fadeOut'), fadeIn: rec('screen', 'fadeIn'), tint: rec('screen', 'tint'), flash: rec('screen', 'flash'), shake: rec('screen', 'shake'), weather: rec('screen', 'weather') },
      pictures: { show: rec('pictures', 'show'), move: rec('pictures', 'move'), erase: rec('pictures', 'erase') },
      map: { transfer: rec('map', 'transfer'), setLocation: rec('map', 'setLocation'), moveRoute: rec('map', 'moveRoute'), scrollMap: rec('map', 'scrollMap'), transparency: rec('map', 'transparency'), animation: rec('map', 'animation'), balloon: rec('map', 'balloon'), erase: rec('map', 'erase'), follow: rec('map', 'follow') },
      game: { menu: rec('game', 'menu'), save(o) { log.push({ port: 'game', name: 'save', args: [o] }); return Promise.resolve(true); }, title: rec('game', 'title'), heal: rec('game', 'heal'), debug(o) { log.push({ port: 'game', name: 'debug', args: [o] }); } },

// ---- js/kit/world/map.js ----
// MapView (§8.2): the map as the runtime sees it — the authored map composed
// with the save's overlay (player-made changes), plus every spatial question
// the systems ask: what is here, can I walk there, which page of this object is
// active. Pure: no DOM, no canvas. The renderer and the systems read it.
//
//   const view = KIT.mapView(project, save, 'town')
//   view.passable(4, 5, 'down', hero) -> { ok, reason, hop:{x,y}, connection }
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const T = KIT.tiles;

  const DIRS = { up: { dx: 0, dy: -1, edge: 'n' }, down: { dx: 0, dy: 1, edge: 's' }, left: { dx: -1, dy: 0, edge: 'w' }, right: { dx: 1, dy: 0, edge: 'e' } };
  const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };
  const EDGE_OPPOSITE = { n: 's', s: 'n', e: 'w', w: 'e' };
  const SIDE_OF = { up: 'n', down: 's', left: 'w', right: 'e' };
  KIT.DIRS = DIRS; KIT.OPPOSITE = OPPOSITE;
  /** delta(dir) -> { dx, dy } */
  KIT.delta = (dir) => DIRS[dir] || { dx: 0, dy: 0 };

  const isObj = KIT.isObject;
  const LAYERS = ['ground', 'deco', 'above'];

  /**
   * mapView(project, save, mapId) -> view
   * `save` may be null (editor preview): then there is no overlay and no object state.
   */
  KIT.mapView = function mapView(project, save, mapId) {
    const map = project && project.maps ? project.maps[mapId] : null;
    if (!map) throw new Error(`mapView: unknown map '${mapId}'`);
    const overlay = (save && save.overlays && save.overlays[mapId]) || null;
    const objectState = (save && save.objects) || {};
    const width = map.width, height = map.height;

    const index = (x, y) => y * width + x;
    const inBounds = (x, y) => x >= 0 && y >= 0 && x < width && y < height;
    const overlayCell = (x, y) => (overlay && overlay.tiles ? overlay.tiles[`${x},${y}`] : null);

    /** The tile id on a layer, overlay first. `null` = nothing on that layer. */
    function tileAt(layer, x, y) {
      if (!inBounds(x, y)) return null;
      const o = overlayCell(x, y);
      if (o && Object.prototype.hasOwnProperty.call(o, layer)) return o[layer];
      const arr = map.layers && map.layers[layer];
      return arr ? (arr[index(x, y)] == null ? null : arr[index(x, y)]) : null;
    }
    function terrainAt(x, y) { return inBounds(x, y) ? ((map.layers.terrain && map.layers.terrain[index(x, y)]) || 0) : 0; }
    function region(x, y) { return inBounds(x, y) ? ((map.layers.regions && map.layers.regions[index(x, y)]) || 0) : 0; }

      if (!inBounds(x, y)) return null;

      if (o && Object.prototype.hasOwnProperty.call(o, 'collision')) return o.collision;

    /** Merged tile flags for a cell: any solid layer makes it solid; passage closes if any layer closes it; bush/counter/encounter/ledge from any layer. */
    function flagsAt(x, y) {
      const out = { solid: false, bush: false, counter: false, encounter: false, ledge: null, warpLook: false, terrainTag: 0, passage: { n: true, s: true, e: true, w: true }, tiles: [] };
      if (!inBounds(x, y)) { out.solid = true; return out; }
      for (const layer of LAYERS) {
        const id = tileAt(layer, x, y);
        if (id == null) continue;
        const f = T.flags(id);
        out.tiles.push(id);
        if (f.solid) out.solid = true;
        if (f.bush) out.bush = true;
        if (f.counter) out.counter = true;
        if (f.encounter) out.encounter = true;
        if (f.ledge) out.ledge = f.ledge;
        if (f.warpLook) out.warpLook = true;
        if (f.terrainTag) out.terrainTag = f.terrainTag;
        for (const e of ['n', 's', 'e', 'w']) if (f.passage && f.passage[e] === false) out.passage[e] = false;

      if (c === 1) out.solid = true;
      else if (c === 0) { out.solid = false; out.passage = { n: true, s: true, e: true, w: true }; }

    function connectionAt(x, y, dir) {
      const conns = (project.world && project.world.connections) || [];
      const side = SIDE_OF[dir];
      if (!side) return null;
      const atEdge = (side === 'n' && y === 0) || (side === 's' && y === height - 1) || (side === 'w' && x === 0) || (side === 'e' && x === width - 1);

      for (const c of conns) {

        if (c.a === mapId && c.side === side) { other = c.b; otherSide = EDGE_OPPOSITE[side]; }

        const om = project.maps[other];
        if (!om) continue;
        // The same offset along the shared edge; `offset` shifts the neighbour.
        let nx, ny;
        if (side === 'n' || side === 's') { nx = x - offset; ny = otherSide === 'n' ? 0 : om.height - 1; }
        else { ny = y - offset; nx = otherSide === 'w' ? 0 : om.width - 1; }
        if (nx < 0 || ny < 0 || nx >= om.width || ny >= om.height) continue;

    const objects = (map.objects || []).concat((overlay && overlay.objects) || []);
    const key = (objOrId) => `${mapId}:${typeof objOrId === 'string' ? objOrId : objOrId.id}`;
    const stateOf = (objOrId) => objectState[key(objOrId)] || null;
    const isHidden = (obj) => { const s = stateOf(obj); return !!(s && s.hidden); };
    /** Where the object is right now (a moved object remembers its place in the save). */
    function positionOf(obj) {

    function activePage(obj, ctx) {

      const c = Object.assign({}, ctx || {}, { self: key(obj), world: (ctx && ctx.world) || { save: save || {} } });

    }

    // ---- passability ---------------------------------------------------------
    /**
     * passable(x, y, dir, who) -> { ok, reason, to:{x,y}, hop, connection }
     * Asks "may `who` step from (x, y) in `dir`?" — the answer includes a ledge hop
     * or a map connection when that is what happens instead of a plain step.
     */
    function passable(x, y, dir, who) {
      const d = DIRS[dir];
      if (!d) return { ok: false, reason: 'direction' };
      const nx = x + d.dx, ny = y + d.dy;
      const through = !!(who && who.through);
      if (!inBounds(nx, ny)) {
        const conn = connectionAt(x, y, dir);
        if (conn) return { ok: true, reason: 'connection', to: { x: nx, y: ny }, connection: conn };
        return { ok: false, reason: 'edge' };
      }
      if (through) return { ok: true, reason: 'through', to: { x: nx, y: ny } };
      const here = flagsAt(x, y), there = flagsAt(nx, ny);
      if (here.passage[d.edge] === false) return { ok: false, reason: 'edge-out' };
      if (there.passage[EDGE_OPPOSITE[d.edge]] === false) return { ok: false, reason: 'edge-in' };
      // Ledges: a 'down' ledge may only be entered from the north, and then you hop over it.
      if (there.ledge) {
        if (there.ledge !== dir) return { ok: false, reason: 'ledge' };
        const hx = nx + d.dx, hy = ny + d.dy;
        if (!inBounds(hx, hy) || flagsAt(hx, hy).solid) return { ok: false, reason: 'ledge-blocked' };
        if (blockedByEntity(hx, hy, who)) return { ok: false, reason: 'entity' };
        return { ok: true, reason: 'hop', to: { x: nx, y: ny }, hop: { x: hx, y: hy } };
      }
      if (there.solid) return { ok: false, reason: 'tile' };
      if (blockedByEntity(nx, ny, who)) return { ok: false, reason: 'entity' };
      return { ok: true, reason: 'step', to: { x: nx, y: ny } };
    }
    /** Solid entities (set by the world each tick) block movement. */
    let blockers = [];
    function blockedByEntity(x, y, who) {
      for (const e of blockers) {
        if (e === who || !e.solid || e.through || e.visible === false) continue;
        if (e.x === x && e.y === y) return true;
        if (e.mover && e.mover.moving && e.mover.toX === x && e.mover.toY === y) return true;   // reserve the tile being walked into
      }
      return false;
    }
    function hopTarget(x, y, dir) { const r = passable(x, y, dir, null); return r.hop || null; }

    /** The tile a hero facing `dir` at (x,y) interacts with — one step ahead, or two across a counter. */
    function interactTarget(x, y, dir) {
      const d = DIRS[dir];
      if (!d) return null;
      const first = { x: x + d.dx, y: y + d.dy };
      if (!inBounds(first.x, first.y)) return null;
      if (flagsAt(first.x, first.y).counter) {
        const second = { x: first.x + d.dx, y: first.y + d.dy };
        if (inBounds(second.x, second.y)) return { first, second, across: true };
      }
      return { first, second: null, across: false };
    }

    return {
      id: mapId, map, project, save, width, height, kind: map.kind, music: map.music,
      index, inBounds, tileAt, terrainAt, region, collisionAt, flagsAt, passable, hopTarget, connectionAt, interactTarget,
      objects, objectsAt, objectKey: key, objectState: stateOf, isHidden, activePage, positionOf,
      setBlockers(list) { blockers = list || []; },
      get blockers() { return blockers; },
      /** Cells whose drawn tiles changed since the map was authored (for the renderer's cache). */
      overlayCells() { return overlay && overlay.tiles ? Object.keys(overlay.tiles).map(k => { const [x, y] = k.split(',').map(Number); return { x, y }; }) : []; },

})(typeof window !== 'undefined' ? window : globalThis);

<script>
// ---- js/kit/world/entities.js ----
// Entities (§8.2): heroes, NPCs, decorations and companions as plain objects,
// with grid movement, interpolation, the walk cycle, move routes and the
// companion trail. Pure logic — the renderer reads px/py, nothing here draws.
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const E = KIT.entities = KIT.entities || {};
  const DIRS = { up: { dx: 0, dy: -1 }, down: { dx: 0, dy: 1 }, left: { dx: -1, dy: 0 }, right: { dx: 1, dy: 0 } };
  const DIR_LIST = ['up', 'down', 'left', 'right'];
  const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

  E.DEFAULT_SPEED = 6;          // tiles per second
  E.TURN_MS = 90;               // a tap shorter than this only turns in place

  /** create(spec) -> entity. Everything optional but `id`. */
  E.create = function (spec) {
    const s = spec || {};
    const e = {
      id: s.id || KIT.uid('ent'), kind: s.kind || 'npc', objectKey: s.objectKey || null, pageIndex: s.pageIndex == null ? null : s.pageIndex,
      x: s.x || 0, y: s.y || 0, dir: s.dir || 'down',
      px: s.x || 0, py: s.y || 0,                    // interpolated position, in tiles
      sprite: s.sprite || null, art: s.art || null, look: s.look || null,
      layer: s.layer || 'same', through: !!s.through, solid: s.solid !== undefined ? !!s.solid : (s.kind !== 'look'),
      visible: s.visible !== false, dirFix: !!s.dirFix, stepAnim: !!s.stepAnim, opacity: s.opacity == null ? 1 : s.opacity,
      speed: s.speed || E.DEFAULT_SPEED, behaviour: s.behaviour || { kind: 'none' }, home: { x: s.x || 0, y: s.y || 0 },
      mover: { moving: false, fromX: s.x || 0, fromY: s.y || 0, toX: s.x || 0, toY: s.y || 0, t: 0, duration: 0, hop: false },
      walkFrame: 0, stepCount: 0, animT: 0, blocked: false, route: null, wait: 0, data: s.data || {},
    };
    return e;
  };

  E.facingTile = (e) => { const d = DIRS[e.dir] || DIRS.down; return { x: e.x + d.dx, y: e.y + d.dy }; };
  E.at = (e, x, y) => e.x === x && e.y === y;
  E.adjacent = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y) === 1;
  E.dirToward = function (from, to) {
    const dx = to.x - from.x, dy = to.y - from.y;
    if (Math.abs(dx) >= Math.abs(dy)) return dx === 0 ? (dy > 0 ? 'down' : 'up') : (dx > 0 ? 'right' : 'left');
    return dy > 0 ? 'down' : 'up';

  E.faceToward = function (e, target) { if (!e.dirFix) e.dir = E.dirToward(e, target); return e.dir; };

   * tryMove(entity, dir, view, opts) -> { ok, reason, connection }

   * opts.turnOnly turns without moving; opts.ignoreBlocked reports but does not set `blocked`.
   */
  E.tryMove = function (e, dir, view, opts) {
    opts = opts || {};
    if (!DIRS[dir]) return { ok: false, reason: 'direction' };
    if (e.mover.moving) return { ok: false, reason: 'busy' };
    if (!e.dirFix) e.dir = dir;
    if (opts.turnOnly) return { ok: false, reason: 'turn' };
    const r = view ? view.passable(e.x, e.y, dir, e) : { ok: true, reason: 'step', to: { x: e.x + DIRS[dir].dx, y: e.y + DIRS[dir].dy } };
    if (!r.ok) { if (!opts.ignoreBlocked) e.blocked = true; return r; }
    if (r.reason === 'connection') return r;                       // the world handles the map change
    const to = r.hop || r.to;
    e.mover = { moving: true, fromX: e.x, fromY: e.y, toX: to.x, toY: to.y, t: 0, duration: (r.hop ? 2 : 1) / Math.max(0.1, e.speed), hop: !!r.hop };
    e.x = to.x; e.y = to.y;                                         // logical position updates immediately; px/py catch up
    e.blocked = false;

  E.update = function (e, dt) {

      m.t += dt;
      const k = m.duration > 0 ? Math.min(1, m.t / m.duration) : 1;
      e.px = m.fromX + (m.toX - m.fromX) * k;
      e.py = m.fromY + (m.toY - m.fromY) * k;

      e.px = e.x; e.py = e.y;

  E.frame = function (e) {

    // left row is mirrored, which is how hand-drawn Kit art is made.
    const drawn = (e.dir === 'right' && !def.frames.right) ? 'left' : e.dir;
    const mirror = e.dir === 'right' && !def.frames.right;
    const frames = def.frames[drawn] || def.frames.down;
    if (!frames) return null;

  };

  /**
   * startRoute(entity, steps, { wait, skipBlocked, repeat }) — a small state machine
   * stepped by E.updateRoute(entity, dt, view, ports). `entity.route.done` flips when finished.

  E.startRoute = function (e, steps, opts) {
    opts = opts || {};

    return e.route;
  };
  E.stopRoute = function (e) { if (e.route) e.route.done = true; e.route = null; };

  /** One route step. `ports` may provide { sound(id), rng } and `world` the hero for towardHero/faceHero. */
  function applyStep(e, step, view, ports) {
    const [cmd, argRaw] = String(step).split(':');
    const arg = argRaw == null ? '' : argRaw;
    const hero = ports && ports.hero;
    const rng = (ports && ports.rng) || Math.random;
    switch (cmd) {
      case 'up': case 'down': case 'left': case 'right': return E.tryMove(e, cmd, view, { ignoreBlocked: true });
      case 'randomStep': return E.tryMove(e, DIR_LIST[Math.floor((rng.int ? rng.int(4) / 4 : rng()) * 4) % 4], view, { ignoreBlocked: true });
      case 'towardHero': return hero ? E.tryMove(e, E.dirToward(e, hero), view, { ignoreBlocked: true }) : { ok: false, reason: 'no-hero' };
      case 'awayHero': return hero ? E.tryMove(e, OPPOSITE[E.dirToward(e, hero)], view, { ignoreBlocked: true }) : { ok: false, reason: 'no-hero' };
      case 'face': if (DIRS[arg]) e.dir = arg; return { ok: true, reason: 'face' };
      case 'faceHero': if (hero) e.dir = E.dirToward(e, hero); return { ok: true, reason: 'face' };
      case 'turnRandom': e.dir = DIR_LIST[Math.floor((rng.int ? rng.int(4) / 4 : rng()) * 4) % 4]; return { ok: true, reason: 'face' };
      case 'jump': {
        const [jx, jy] = arg.split(',').map(Number);
        const tx = e.x + (jx || 0), ty = e.y + (jy || 0);
        e.mover = { moving: true, fromX: e.x, fromY: e.y, toX: tx, toY: ty, t: 0, duration: Math.max(0.2, Math.hypot(jx || 0, jy || 0) / Math.max(0.1, e.speed)), hop: true };
        e.x = tx; e.y = ty;

      }
      case 'wait': e.wait = (Number(arg) || 0) / 1000; return { ok: true, reason: 'wait' };
      case 'sprite': e.sprite = arg; return { ok: true, reason: 'sprite' };
      case 'speed': e.speed = Math.max(0.5, Number(arg) || E.DEFAULT_SPEED); return { ok: true, reason: 'speed' };
      case 'through': e.through = arg === 'on'; return { ok: true, reason: 'through' };
      case 'visible': e.visible = arg === 'on'; return { ok: true, reason: 'visible' };
      case 'dirFix': e.dirFix = arg === 'on'; return { ok: true, reason: 'dirFix' };

    if (e.mover.moving || e.wait > 0) return false;
    if (r.i >= r.steps.length) {
      if (r.repeat && r.steps.length) r.i = 0;
      else { r.done = true; e.route = null; return true; }
    }
    const step = r.steps[r.i];
    const res = applyStep(e, step, view, ports);
    const isMove = ['up', 'down', 'left', 'right', 'randomStep', 'towardHero', 'awayHero'].includes(String(step).split(':')[0]);

      else { r.stuck++; if (r.stuck > 240) { r.done = true; e.route = null; return true; } }
      return false;
    }
    r.stuck = 0;
    r.i++;
    return false;
  };

  // ---- companion trail --------------------------------------------------------
  /**
   * A companion walks the leader's path one tile behind (HGSS style).
   * Call E.noteLeaderStep(companion, leader) whenever the leader finishes a step.
   */
  E.noteLeaderStep = function (comp, leader) {
    comp.data.trail = comp.data.trail || [];
    comp.data.trail.push({ x: leader.mover.fromX, y: leader.mover.fromY, dir: leader.dir });

  E.updateCompanion = function (comp, leader, dt, view) {
    if (comp.mover.moving) return;

    if (Math.abs(target.x - comp.x) + Math.abs(target.y - comp.y) > 3) {   // teleport if left far behind (a warp)
      comp.x = target.x; comp.y = target.y; comp.px = comp.x; comp.py = comp.y; trail.shift(); return;

  };

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;

// ---- js/kit/world/world.js ----
// World (§8.2-§8.4): the live game — project + save + the current map view +
// entities + the event bus + the systems that run each tick. Headless: it talks
// to the outside only through the `ports` it is given (the same ports commands
// use), so a whole session can be played in Node with fake ports.
//
//   const world = KIT.world.create({ project, save, ports })
//   await world.enterMap('town', 5, 6, 'down')
//   world.update(1/60); world.interact(0)
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const E = KIT.entities;
  const I = KIT.interpreter;
  const C = KIT.conditions;
  const W = KIT.world = KIT.world || {};

  const SLOT_EVENTS = { interact: 'interact', step: 'step', touch: 'touch', enter: 'enter', tick: 'tick', init: 'init' };

  /** create({ project, save, ports, rng, events }) -> world */

    const project = opts.project;

    const ports = opts.ports || {};
    const events = opts.events || KIT.events('world');
    const rng = opts.rng || KIT.rng(save.seed || 1);

    const world = {
      project, save, events, rng, ports,
      map: null, entities: [], heroes: [], companion: null,
      viewport: Object.assign({ w: 16, h: 12 }, (project.settings && project.settings.viewport) || {}),   // live tiles on screen; the renderer updates it, the project is not touched
      activeEntity: null,          // the object whose script is running (ports read it to resolve target 'self')
      activeHero: 0, coop: !!(project.settings && project.settings.coop && project.settings.coop.enabled),
      busy: false,                 // a main-thread script is running: input is locked
      time: 0, systems: [],
      initDone: {},                // 'map:obj' -> true for this visit
      camera: { x: 0, y: 0 },
    };

    // ---- heroes ---------------------------------------------------------------
    function makeHeroes() {
      world.heroes = (project.heroes || []).map((h, i) => {
        const st = (save.heroes || [])[i] || {};
        return E.create({ id: h.id || `p${i + 1}`, kind: 'hero', x: st.x || 0, y: st.y || 0, dir: st.dir || 'down', sprite: h.sprite, speed: E.DEFAULT_SPEED, solid: true });
      });
    }
    makeHeroes();
    world.hero = (i) => world.heroes[i == null ? world.activeHero : i];
    world.heroById = (id) => world.heroes.find(h => h.id === id) || world.heroes[0];
    world.setActiveHero = (i) => { world.activeHero = KIT.clamp(i, 0, world.heroes.length - 1); events.emit('activeHero', { index: world.activeHero }); };

    // ---- map entry -------------------------------------------------------------
    /** Build the entity list for the current map from each object's active page. */
    function buildEntities() {
      const view = world.map;
      const list = [];
      for (const obj of view.objects) {
        if (view.isHidden(obj)) continue;
        const active = view.activePage(obj, world.ctxBase());
        if (!active) continue;
        const page = active.page;
        const pos = view.positionOf(obj);
        const e = E.create({
          id: obj.id, kind: obj.type === 'npc' ? 'npc' : 'look', objectKey: view.objectKey(obj), pageIndex: active.index,
          x: pos.x, y: pos.y, dir: pos.dir || page.dir, sprite: page.sprite, look: (page.props && page.props.look) || null,
          layer: page.layer, through: page.through, dirFix: page.dirFix, stepAnim: page.stepAnim, visible: page.visible,
          solid: page.layer === 'same' && !page.through, behaviour: page.behaviour || { kind: 'none' },
        });
        e.object = obj; e.page = page;
        list.push(e);
      }
      world.entities = list;
      refreshBlockers();
    }
    function refreshBlockers() {
      if (world.map) world.map.setBlockers(world.entities.concat(world.heroes.filter(h => h.visible)));
    }
    world.rebuildEntities = buildEntities;

    /** Re-evaluate every object's active page (after a var/self change) without losing positions. */
    function refreshPages() {
      const view = world.map;
      if (!view) return;
      let changed = false;
      const kept = [];
      for (const obj of view.objects) {
        const existing = world.entities.find(e => e.object === obj);
        if (view.isHidden(obj)) { if (existing) changed = true; continue; }
        const active = view.activePage(obj, world.ctxBase());
        if (!active) { if (existing) changed = true; continue; }
        if (existing && existing.pageIndex === active.index) { kept.push(existing); continue; }
        changed = true;
        const pos = existing ? { x: existing.x, y: existing.y, dir: existing.dir } : view.positionOf(obj);
        const page = active.page;
        const e = E.create({ id: obj.id, kind: obj.type === 'npc' ? 'npc' : 'look', objectKey: view.objectKey(obj), pageIndex: active.index,
          x: pos.x, y: pos.y, dir: pos.dir || page.dir, sprite: page.sprite, look: (page.props && page.props.look) || null,
          layer: page.layer, through: page.through, dirFix: page.dirFix, stepAnim: page.stepAnim, visible: page.visible,
          solid: page.layer === 'same' && !page.through, behaviour: page.behaviour || { kind: 'none' } });
        e.object = obj; e.page = page;
        kept.push(e);
      }
      if (changed) { world.entities = kept; refreshBlockers(); }
    }
    world.refreshPages = refreshPages;

    /** enterMap(id, x, y, dir) -> Promise: swaps the map, places the heroes, runs init/enter slots. */
    world.enterMap = async function (mapId, x, y, dir, opts) {
      const from = world.map ? world.map.id : null;
      if (from) { for (const s of world.systems) if (s.onMapLeave) s.onMapLeave(world); events.emit('mapLeave', { map: from }); }
      world.map = KIT.mapView(project, save, mapId);
      world.initDone = {};
      const places = (opts && opts.heroes) || null;    // restoring a save may put each hero back on its own tile
      world.heroes.forEach((h, i) => {
        const at = places && places[i] ? places[i] : { x, y, dir };
        h.x = at.x; h.y = at.y; h.px = at.x; h.py = at.y; h.dir = at.dir || dir || h.dir; h.mover.moving = false;
      });
      if (world.heroes[1]) { world.heroes[1].data.trail = []; }
      if (world.companion) { world.companion.x = x; world.companion.y = y; world.companion.px = x; world.companion.py = y; world.companion.data.trail = []; }
      buildEntities();
      saveHeroPositions();
      for (const s of world.systems) if (s.onMapEnter) s.onMapEnter(world);
      events.emit('mapEnter', { map: mapId, from });
      if (ports.audio && project.maps[mapId] && project.maps[mapId].music !== undefined) {
        const track = project.maps[mapId].music;
        if (track && world.currentMusic !== track) { world.currentMusic = track; ports.audio.music(track, { fade: 300 }); }
      }
      await runSlotsForMap('init');
      await runSlotsForMap('enter');
      return world.map;
    };

    function saveHeroPositions() {
      save.heroes = world.heroes.map((h, i) => Object.assign({}, (save.heroes || [])[i] || {}, { map: world.map ? world.map.id : null, x: h.x, y: h.y, dir: h.dir }));
    }
    world.saveHeroPositions = saveHeroPositions;

    // ---- scripts ---------------------------------------------------------------
    /** The base ctx for conditions (no object bound). */
    world.ctxBase = () => ({ world, project, save, hero: world.hero() ? world.hero().id : 'p1', coop: world.coop, input: ports.input || { pressed: () => false } });
    /** makeCtx(entity, heroId) -> the RunCtx commands use (§9.1). */
    world.makeCtx = function (entity, heroId) {
      const ctx = {
        project, world, save, rng: world.rng,
        self: entity && entity.objectKey ? entity.objectKey : null,
        hero: heroId || (world.hero() ? world.hero().id : 'p1'),
        entity: entity || null,
        emit(event, payload) { events.emit(event, payload); },
      };
      for (const group of ['io', 'audio', 'screen', 'pictures', 'map', 'game']) ctx[group] = ports[group] || {};
      ctx.input = ports.input || { pressed: () => false };      // the `button` condition kind
      return ctx;
    };

    /** runSlot(entity, slot, heroId) -> Promise. Main-thread slots lock input; `tick` runs in the background. */
    world.runSlot = async function (entity, slot, heroId) {
      const page = entity && entity.page;
      if (!page || !page.on || !Array.isArray(page.on[slot]) || !page.on[slot].length) return null;
      const key = entity.objectKey;
      if (page.once && slot !== 'tick' && slot !== 'init') {
        const st = save.objects && save.objects[key];
        if (st && st.self && st.self.done) return null;
      }
      if (page.needsBoth && !bothHeroesAdjacent(entity)) {
        events.emit('needsBoth', { object: key });
        if (ports.io && ports.io.toast) await ports.io.toast({ text: KIT.strings.get(project, 'needs-both') });
        return null;
      }
      const ctx = world.makeCtx(entity, heroId);
      const background = slot === 'tick';
      const previousActive = world.activeEntity;
      if (!background) {
        if (world.busy) return null;
        world.busy = true;
        world.activeEntity = entity;          // ports resolve target 'self' through this
        if (entity.kind === 'npc' && !entity.dirFix && slot === 'interact') {
          const h = world.heroById(ctx.hero);
          entity.data.resumeDir = entity.dir;
          E.faceToward(entity, h);
        }
      }
      try {
        const r = await I.run(page.on[slot], ctx, { kind: background ? 'background' : 'main', label: `${key}:${slot}`, path: [key, slot] });
        if (page.once && slot !== 'tick' && slot !== 'init') KIT.commands.state.setSelf(ctx, 'done', true, key);
        return r;
      } finally {
        if (!background) {
          world.busy = false;
          world.activeEntity = previousActive;
          if (entity.data.resumeDir) { entity.dir = entity.data.resumeDir; entity.data.resumeDir = null; }
          refreshPages();
        }
      }
    };
    function bothHeroesAdjacent(entity) {
      if (!world.coop || world.heroes.length < 2) return true;
      return world.heroes.every(h => Math.abs(h.x - entity.x) + Math.abs(h.y - entity.y) <= 1);
    }

    async function runSlotsForMap(slot) {
      for (const e of world.entities.slice()) {
        if (slot === 'init') {
          const k = `${world.map.id}:${e.id}`;
          if (world.initDone[k]) continue;
          world.initDone[k] = true;
        }
        await world.runSlot(e, slot, world.hero() ? world.hero().id : 'p1');
      }
    }
    world.runSlotsForMap = runSlotsForMap;

    /** interact(heroIndex) -> Promise<boolean> — the A button. */
    world.interact = async function (heroIndex) {
      if (world.busy) return false;
      const h = world.hero(heroIndex);
      if (!h || h.mover.moving) return false;
      const t = world.map.interactTarget(h.x, h.y, h.dir);
      if (!t) return false;
      const spots = [t.first].concat(t.second ? [t.second] : []);
      for (const spot of spots) {
        const hit = world.entities.find(e => e.x === spot.x && e.y === spot.y && e.page && e.page.on && e.page.on.interact);   // invisible events still react (MV transparency)
        if (hit) { await world.runSlot(hit, 'interact', h.id); return true; }
      }
      // an object under the hero's own feet (a sign mat, an item) may also react
      const under = world.entities.find(e => e.x === h.x && e.y === h.y && e.layer === 'below' && e.page && e.page.on && e.page.on.interact);
      if (under) { await world.runSlot(under, 'interact', h.id); return true; }
      return false;
    };

    /** move(heroIndex, dir, opts) -> Promise<result> — the d-pad. Handles step triggers, connections and warps. */
    world.move = async function (heroIndex, dir, opts) {
      if (world.busy) return { ok: false, reason: 'busy' };
      const h = world.hero(heroIndex);
      if (!h || h.mover.moving) return { ok: false, reason: 'busy' };
      const r = E.tryMove(h, dir, world.map, opts || {});
      if (r.reason === 'connection') {
        const c = r.connection;
        await world.enterMap(c.map, c.x, c.y, dir);
        return r;
      }
      if (!r.ok) { if (ports.audio && ports.audio.play && r.reason !== 'turn') ports.audio.play('bump'); return r; }
      if (world.companion) E.noteLeaderStep(world.companion, h);
      if (world.heroes[1] && heroIndex === world.activeHero && !world.coop) E.noteLeaderStep(world.heroes[1], h);
      refreshBlockers();
      saveHeroPositions();
      save.steps = (save.steps || 0) + 1;
      const flags = world.map.flagsAt(h.x, h.y);
      events.emit('step', { hero: h.id, heroIndex: heroIndex == null ? world.activeHero : heroIndex, x: h.x, y: h.y, map: world.map.id, tile: flags, region: world.map.region(h.x, h.y) });
      await world.stepTriggers(h);
      return r;
    };

    /** Fires `step` slots for whatever the hero landed on, and the built-in behaviour of warp/item objects. */
    world.stepTriggers = async function (h) {
      const hits = world.entities.filter(e => e.x === h.x && e.y === h.y);
      for (const e of hits) {
        const type = e.object && e.object.type;
        if (type === 'warp') { if (await world.doWarp(e, h)) return; }
        else if (type === 'item') await world.doPickup(e, h);
        if (e.page && e.page.on && e.page.on.step) await world.runSlot(e, 'step', h.id);
      }
    };
    /** A `warp` object carries its destination in props.to — no script needed. */
    world.doWarp = async function (e, h) {
      const to = e.page && e.page.props && e.page.props.to;
      if (!to || !to.map || !project.maps[to.map]) return false;
      if (ports.audio && ports.audio.play && e.page.props.sound !== null) ports.audio.play(e.page.props.sound || 'door');
      if (ports.map && ports.map.transfer) await ports.map.transfer({ map: to.map, x: to.x || 0, y: to.y || 0, dir: to.dir || h.dir, fade: e.page.props.fade !== false });
      else await world.enterMap(to.map, to.x || 0, to.y || 0, to.dir || h.dir);
      return true;
    };
    /** An `item` object gives its item once and disappears for good. */
    world.doPickup = async function (e, h) {
      const props = (e.page && e.page.props) || {};
      if (!props.item) return false;
      const st = save.objects && save.objects[e.objectKey];
      if (st && st.self && st.self.done) return false;
      const ctx = world.makeCtx(e, h.id);
      const count = props.count == null ? 1 : props.count;
      KIT.commands.state.give(ctx, props.item, count);
      KIT.commands.state.setSelf(ctx, 'done', true, e.objectKey);
      if (ports.audio && ports.audio.play) ports.audio.play('item');
      if (ports.io && ports.io.toast) await ports.io.toast({ text: KIT.strings.get(project, 'got-item', { count, item: (project.items[props.item] && project.items[props.item].name) || props.item }) });
      save.objects[e.objectKey].hidden = true;
      events.emit('objectStateChanged', { objectKey: e.objectKey });
      return true;
    };

    // ---- systems ---------------------------------------------------------------
    world.systems = (KIT.registry.exists('systems') ? KIT.registry('systems').list() : []).slice().sort((a, b) => (a.order || 50) - (b.order || 50));
    world.update = function (dt) {
      world.time += dt;
      for (const s of world.systems) { try { s.update(world, dt); } catch (e) { (KIT.log || console).error(`[system ${s.id}]`, e); } }
    };

    // Keep pages fresh when the story state changes.
    events.on('varChanged', refreshPages);
    events.on('selfChanged', refreshPages);
    events.on('objectStateChanged', () => { buildEntities(); });

    return world;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// ---- js/kit/systems/index.js ----
// The standard systems (§8.3): they run every tick in `order`. Each is a
// registry entry so a module can add its own (encounters, weather, jobs...).
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const E = KIT.entities;
  const reg = KIT.registry('systems');

  // --- 10 movement: interpolation, arrivals, hero touch checks -------------------
  const routePorts = (world) => ({ hero: world.hero(), rng: world.rng, sound: (id) => world.ports.audio && world.ports.audio.play && world.ports.audio.play(id) });
  reg.add({ id: 'movement', order: 10, update(world, dt) {
    for (const h of world.heroes) { E.update(h, dt); if (h.route) E.updateRoute(h, dt, world.map, routePorts(world)); }
    if (world.companion) E.update(world.companion, dt);
    for (const e of world.entities) {
      const arrived = E.update(e, dt);
      if (e.route) E.updateRoute(e, dt, world.map, routePorts(world));   // routes started by the moveRoute command or a behaviour
      if (arrived && e.kind === 'npc') {
        const hit = world.heroes.find(h => h.x === e.x && h.y === e.y);
        if (hit && e.page && e.page.on && e.page.on.touch && !world.busy) world.runSlot(e, 'touch', hit.id);
      }
    }
  } });

  // --- 20 behaviours: autonomous movement ---------------------------------------
  const bhv = KIT.registry('behaviours');
  bhv.add({ id: 'none', label: 'Stay put', fields: [], update() {} });
  bhv.add({ id: 'look', label: 'Look around', fields: [{ key: 'frequency', type: 'number', min: 1, max: 9, default: 3 }],
    update(e, world, dt) {
      e.data.timer = (e.data.timer || 0) - dt;
      if (e.data.timer > 0) return;
      e.data.timer = 1 + world.rng() * (10 - (e.behaviour.frequency || 3));
      if (!e.dirFix) e.dir = ['up', 'down', 'left', 'right'][world.rng.int(4)];
    } });
  bhv.add({ id: 'wander', label: 'Wander', fields: [{ key: 'radius', type: 'number', min: 1, max: 12, default: 3 }, { key: 'frequency', type: 'number', min: 1, max: 9, default: 3 }],
    update(e, world, dt) {
      if (e.mover.moving) return;
      e.data.timer = (e.data.timer || 0) - dt;
      if (e.data.timer > 0) return;
      e.data.timer = 0.8 + world.rng() * (10 - (e.behaviour.frequency || 3)) * 0.3;
      const radius = e.behaviour.radius == null ? 3 : e.behaviour.radius;
      const dir = ['up', 'down', 'left', 'right'][world.rng.int(4)];
      const d = KIT.delta(dir);
      if (Math.abs(e.home.x - (e.x + d.dx)) > radius || Math.abs(e.home.y - (e.y + d.dy)) > radius) { if (!e.dirFix) e.dir = dir; return; }
      E.tryMove(e, dir, world.map, { ignoreBlocked: true });
    } });
  bhv.add({ id: 'route', label: 'Follow a route', fields: [{ key: 'route', type: 'route', default: [] }, { key: 'repeat', type: 'bool', default: true }],
    update(e, world, dt) {
      if (!e.route && !e.data.routeDone) E.startRoute(e, e.behaviour.route || [], { repeat: e.behaviour.repeat !== false, skipBlocked: true });
      // the movement system steps it
    } });
  bhv.add({ id: 'approach', label: 'Approach the player', fields: [{ key: 'frequency', type: 'number', min: 1, max: 9, default: 5 }],
    update(e, world, dt) {
      if (e.mover.moving) return;
      e.data.timer = (e.data.timer || 0) - dt;
      if (e.data.timer > 0) return;
      e.data.timer = 0.5 + world.rng() * 0.5;
      const h = world.hero();
      if (!h) return;
      E.tryMove(e, E.dirToward(e, h), world.map, { ignoreBlocked: true });
    } });
  reg.add({ id: 'behaviours', order: 20, update(world, dt) {
    if (world.busy) return;
    for (const e of world.entities) {
      const kind = (e.behaviour && e.behaviour.kind) || 'none';
      const def = bhv.get(kind);
      if (def && def.update) { try { def.update(e, world, dt); } catch (err) { (KIT.log || console).error(`[behaviour ${kind}]`, err); } }
    }
  } });

  // --- 30 triggers: tick slots (background threads), throttled per object ---------
  reg.add({ id: 'triggers', order: 30, update(world) {
    for (const e of world.entities) {
      if (!e.page || !e.page.on || !Array.isArray(e.page.on.tick) || !e.page.on.tick.length) continue;
      if (e.data.tickRunning) continue;
      e.data.tickRunning = true;
      Promise.resolve(world.runSlot(e, 'tick', world.hero() ? world.hero().id : 'p1'))
        .catch(err => (KIT.log || console).error('[tick]', err))
        .then(() => { e.data.tickRunning = false; });
    }
  } });

  // --- 40 companions -------------------------------------------------------------
  reg.add({ id: 'companions', order: 40, update(world, dt) {
    const lead = world.hero();
    if (world.companion && lead) E.updateCompanion(world.companion, lead, dt, world.map);
    if (!world.coop && world.heroes[1] && lead && world.heroes[1] !== lead) E.updateCompanion(world.heroes[1], lead, dt, world.map);
  } });

  // --- 50 clock -------------------------------------------------------------------
  reg.add({ id: 'clock', order: 50, update(world, dt) {
    const s = (world.project.settings && world.project.settings.clock) || {};
    if (!s.enabled) return;
    const save = world.save;
    save.clock = save.clock || { day: 1, minutes: 480, lastSeenAt: null };
    const perSecond = s.minutesPerSecond || 0;
    if (!perSecond) return;
    world._clockAcc = (world._clockAcc || 0) + dt * perSecond;
    if (world._clockAcc >= 1) {
      const add = Math.floor(world._clockAcc);
      world._clockAcc -= add;
      save.clock.minutes += add;
      while (save.clock.minutes >= 1440) { save.clock.minutes -= 1440; save.clock.day++; }
      world.events.emit('clockTick', { minutes: save.clock.minutes, day: save.clock.day });
    }
  } });

  // --- 90 camera -------------------------------------------------------------------
  KIT.camera = {
    /** Centre on an entity, clamped to the map; smaller maps are centred. */
    update(world) {
      const view = world.map;
      if (!view) return world.camera;
      const vp = world.viewport || (world.project.settings && world.project.settings.viewport) || { w: 16, h: 12 };
      const h = world.hero();
      let cx = (h ? h.px : 0) + 0.5 - vp.w / 2;
      let cy = (h ? h.py : 0) + 0.5 - vp.h / 2;
      cx = view.width <= vp.w ? (view.width - vp.w) / 2 : KIT.clamp(cx, 0, view.width - vp.w);
      cy = view.height <= vp.h ? (view.height - vp.h) / 2 : KIT.clamp(cy, 0, view.height - vp.h);
      world.camera.x = cx; world.camera.y = cy;
      return world.camera;
    },
  };
  reg.add({ id: 'camera', order: 90, update(world) { KIT.camera.update(world); } });

  KIT.registry('strings').add({ id: 'needs-both', default: 'This needs both of you!' });

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<!-- Importers: outside tools -> Kit content (Creator Mode's Import panel; docs/IMPORTING.md).
     They are pure and self-contained, so they may load any time after the world. -->
<script>
// ---- js/kit/import/tiled.js ----
// KIT.import.tiled — Tiled (mapeditor.org) maps and tilesets -> Kit content.
//
// Contract: docs/IMPORT-CONTRACT.md (the Result shape, ids, images, tile flags).
// Target data model: ARCHITECTURE §5 (project/map/object/page), §6 (art), §9 (script).
//
// Pure: no fs, no DOM, no network. The caller hands over already-read data
// (a parsed object, a JSON/TMX/TSX string, or an ArrayBuffer) plus resolvers:
//   opts.asset(src) -> { id, src, w, h }     images (path -> copied file / data URI)
//   opts.tilesets    { '<source>': tsj|tsx } external tilesets a map refers to
//   opts.templates   { '<source>': tj|tx }   object templates
//   opts.inflate(bytes, 'gzip'|'zlib'|'zstd') -> Uint8Array  (optional; Node's zlib is used when present)
//   opts.prefix      id prefix ('outside' -> 'outside:grass')
//   opts.id/opts.name  the source file name, used for the map / tileset id
//   opts.mapId(name) -> id                   a warp's target map name -> a Kit map id
//
// Sources read while writing this (fetched 2026-09):
//   https://doc.mapeditor.org/en/stable/reference/json-map-format/   (.tmj/.tsj: Map, Layer, Chunk, Object, Tileset, Tile, Frame, WangSet, Property)
//   https://doc.mapeditor.org/en/stable/reference/tmx-map-format/    (.tmx/.tsx XML: elements, attributes, <data> encodings, <chunk>, <wangtile wangid>)
//   https://doc.mapeditor.org/en/stable/reference/global-tile-ids/   (GID flags 0x80000000 / 0x40000000 / 0x20000000 / 0x10000000, firstgid lookup)
//   https://doc.mapeditor.org/en/stable/manual/custom-properties/    (typed properties; Custom Types: enums + classes; tile -> tile-object inheritance)
//   https://doc.mapeditor.org/en/stable/manual/objects/              (rectangles have their origin top-left; tile objects are bottom-left aligned unless objectalignment says otherwise)
//   https://doc.mapeditor.org/en/stable/manual/using-infinite-maps/  (infinite maps; their chunk storage is in the two format references above)
//   https://doc.mapeditor.org/en/stable/manual/terrain/              (wang sets / terrain sets: corner, edge, mixed)
//
// Problem codes produced here (severity in brackets):
//   anim-multi-image[warn] anim-uneven[info] asset-unresolved[warn] bad-encoding[error]
//   collision-approx[info] compressed-unsupported[error] custom-type[info] duplicate-id[warn]
//   external-tileset-missing[warn] flipped-tile[warn] group-flattened[info] imagelayer-skipped[info]
//   infinite-bounds[info] item-without-item[warn] layer-guess[info] layer-overflow[warn]
//   object-alignment[warn] object-out-of-bounds[warn] object-rotation[warn] orientation[warn]
//   region-range[warn] screenplay-partial[info] shape-unsupported[info] template-unresolved[warn]
//   text-object-skipped[info] tile-without-image[warn] unknown-gid[warn] wangset-partial[info]
//   warp-target-unresolved[warn] xml-embedded-image[warn]
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const IMP = KIT.import = KIT.import || {};
  const T = IMP.tiled = IMP.tiled || {};

  // ---- small helpers ---------------------------------------------------------
  const isObj = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
  const num = (v, d) => (Number.isFinite(Number(v)) ? Number(v) : (d || 0));
