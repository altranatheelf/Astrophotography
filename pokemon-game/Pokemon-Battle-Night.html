<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Our Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking: if the font never arrives the fallback stack is fine. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" media="print" onload="this.media='all'">
<style>
/* css/kit.css */
/* Kit runtime styling: a handheld in a dark room.
   The canvas is the screen, the overlays are real DOM text on top of it, and
   the touch pads sit under the screen on a phone / beside it on a desktop.
   Nothing here scrolls or zooms while you play. */

:root {
  --ink: #23233a;
  --paper: #fdfdfb;
  --shell: #191b26;
  --shell-2: #23263a;
  --edge: #0b0c12;
  --accent: #ffcb3d;
  --accent-2: #6fd3ff;
  --font-ui: "Press Start 2P", ui-monospace, "Courier New", monospace;
  --font-text: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --pad: clamp(8px, 2vw, 16px);
}

* { box-sizing: border-box; }
/* The overlays set their own display, so `hidden` needs to win over the id rules. */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  background: radial-gradient(circle at 50% 0%, #1b1f2e 0%, #0b0c12 70%);
  color: #e8e9f2;
  font-family: var(--font-text);
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}
body { overflow: hidden; }

#app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

#kit-banner {
  position: fixed; inset: 0 0 auto 0; z-index: 99;
  background: #a3182a; color: #fff;
  font: 600 13px/1.4 var(--font-text);
  padding: 10px 14px;
}

/* ---- stage --------------------------------------------------------------- */
#stage {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--pad);
  padding: var(--pad);
}

#screen {
  position: relative;
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
  background: #0a0b10;
  border: 3px solid #2f3450;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .55), inset 0 0 0 2px #0a0b10;
  overflow: hidden;
}
#game-canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  touch-action: none;
}

.overlay { position: absolute; inset: 0; }
#toast, #chapter { pointer-events: none; }

/* ---- dialogue ------------------------------------------------------------- */
#dialogue {
  display: flex;
  align-items: flex-end;
  padding: 10px;
  pointer-events: auto;
}
#dialogue[data-position="top"] { align-items: flex-start; }
#dialogue[data-position="middle"] { align-items: center; }
#dialogue[data-bg="dim"] { background: rgba(8, 9, 15, .55); }

.kit-box {
  position: relative;
  width: 100%;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: var(--paper);
  color: var(--ink);
  border: 3px solid #2b2b3a;
  border-radius: 10px;
  padding: 10px 14px 12px;
  box-shadow: inset 0 0 0 2px #dfe3ef, 0 5px 0 rgba(0, 0, 0, .35);
}
#dialogue[data-bg="none"] .kit-box { background: rgba(10, 11, 16, .75); color: #fff; border-color: transparent; box-shadow: none; }

.kit-facebox { flex: 0 0 auto; line-height: 0; border: 2px solid #2b2b3a; border-radius: 6px; background: #eef1f8; padding: 2px; }
.kit-facebox canvas { image-rendering: pixelated; }
.kit-textwrap { flex: 1 1 auto; min-width: 0; }
.kit-name { font-family: var(--font-ui); font-size: clamp(9px, 2.4vw, 11px); color: #3b4b8a; margin-bottom: 6px; }
.kit-text { font-size: clamp(15px, 3.6vw, 18px); line-height: 1.45; min-height: 3.2em; }
.kit-line { min-height: 1.45em; white-space: pre-wrap; }
.kit-text .is-big { font-size: 1.3em; }
.kit-icon { display: inline-block; vertical-align: -2px; line-height: 0; }
.kit-next {
  position: absolute; right: 10px; bottom: 4px;
  color: #3b4b8a; opacity: 0; font-size: 14px;
}
.kit-next.is-ready { opacity: 1; animation: kit-bob .9s infinite; }
@keyframes kit-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
.kit-box.is-shaking { animation: kit-shake .32s; }
@keyframes kit-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

#dialogue.is-scroll { align-items: flex-start; overflow: hidden; }
.kit-scroll { width: 100%; padding: 16px; font-size: clamp(16px, 4vw, 20px); line-height: 1.6; text-align: center; white-space: pre-wrap; }

/* ---- panels: choices, menus, modals ---------------------------------------- */
#choice, #pause-menu {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  background: rgba(8, 9, 15, .5);
  pointer-events: auto;
}
#choice { align-items: flex-end; justify-content: flex-end; background: none; padding-bottom: 96px; }

.kit-panel {
  background: var(--paper);
  color: var(--ink);
  border: 3px solid #2b2b3a;
  border-radius: 10px;
  box-shadow: inset 0 0 0 2px #dfe3ef, 0 6px 0 rgba(0, 0, 0, .35);
  padding: 10px;
  min-width: min(260px, 82vw);
  max-width: min(420px, 92vw);
  max-height: 84%;
  overflow: auto;
}
.kit-panel-title { font-family: var(--font-ui); font-size: 11px; color: #3b4b8a; padding: 4px 6px 10px; }
.kit-prompt { font-size: 16px; padding: 4px 6px 10px; }
.kit-list, .kit-menu-list { display: flex; flex-direction: column; gap: 4px; }

.kit-uibtn, .kit-option {
  font: inherit;
  font-size: 16px;
  text-align: left;
  background: transparent;
  color: var(--ink);
  border: 2px solid transparent;
  border-radius: 8px;
  padding: 10px 12px;
  min-height: 44px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
}
.kit-option::before, .kit-menu-item::before { content: "▶"; opacity: 0; font-size: 11px; color: #3b4b8a; }
.kit-option.is-selected, .kit-menu-item.is-selected { background: #eaf0ff; border-color: #3b4b8a; }
.kit-option.is-selected::before, .kit-menu-item.is-selected::before { opacity: 1; }
.kit-uibtn:disabled { opacity: .45; cursor: default; }
.kit-uibtn.is-primary { background: #3b4b8a; color: #fff; justify-content: center; }
.kit-item-label { flex: 1 1 auto; }
.kit-item-value { font-family: var(--font-ui); font-size: 10px; color: #3b4b8a; }
.kit-item-note { font-size: 12px; opacity: .6; }
.kit-row { display: flex; gap: 8px; justify-content: flex-end; padding-top: 8px; }
.kit-row .kit-uibtn { justify-content: center; }
.kit-input {
  font: inherit; font-size: 18px; width: 100%;
  padding: 10px 12px; margin: 4px 0;
  border: 2px solid #3b4b8a; border-radius: 8px; background: #fff; color: var(--ink);
}
.kit-debug-body { font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }

/* ---- title, chapter card, toast --------------------------------------------- */
#screen-title {
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #1a2240 0%, #101526 60%, #0a0b10 100%);
  pointer-events: auto;
}
.kit-title-inner { width: min(420px, 88%); text-align: center; }
.kit-title { font-family: var(--font-ui); font-size: clamp(16px, 5.2vw, 26px); line-height: 1.5; color: var(--accent); margin: 0 0 10px; text-shadow: 0 3px 0 #7a4a00; }
.kit-subtitle { font-family: var(--font-ui); font-size: clamp(8px, 2.6vw, 11px); color: var(--accent-2); margin: 0 0 22px; }
.kit-pitch { font-size: 13px; opacity: .72; line-height: 1.5; margin: 18px 0 0; }
.kit-hint { font-size: 12px; opacity: .55; margin: 12px 0 0; text-align: center; }
#screen-title .kit-menu-list { gap: 8px; }
#screen-title .kit-menu-item {
  justify-content: center;
  background: rgba(255, 255, 255, .06);
  color: #fff;
  border-color: rgba(255, 255, 255, .14);
  font-family: var(--font-ui);
  font-size: clamp(10px, 2.8vw, 12px);
  min-height: 52px;
}
#screen-title .kit-menu-item.is-selected { background: var(--accent); color: #2a1d00; border-color: #fff; }
#screen-title .kit-menu-item::before { color: #2a1d00; }

#chapter { display: flex; align-items: center; justify-content: center; background: rgba(6, 7, 12, .82); }
#chapter.is-in .kit-card { animation: kit-fade .5s ease-out; }
.kit-card { text-align: center; padding: 18px 26px; }
.kit-chapter-title { font-family: var(--font-ui); font-size: clamp(14px, 4.6vw, 22px); color: #fff; line-height: 1.5; }
.kit-chapter-sub { font-size: clamp(12px, 3.2vw, 15px); color: var(--accent); margin-top: 12px; }
@keyframes kit-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

#toast {
  display: flex; align-items: flex-start; justify-content: center;
  padding-top: 14px;
}
.kit-toast-pill {
  background: rgba(12, 14, 22, .92);
  border: 2px solid #3a4160;
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 15px;
  color: #fff;
  box-shadow: 0 4px 0 rgba(0, 0, 0, .4);
}
#toast.is-in .kit-toast-pill { animation: kit-fade .25s ease-out; }

/* ---- touch controls ----------------------------------------------------------- */
#controls {
  flex: 0 0 auto;
  width: 100%;
  display: flex;
  justify-content: space-around;
  align-items: flex-end;
  gap: 12px;
  padding: 4px 6px 8px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.kit-pad {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 460px;
  touch-action: none;
}
/* Two players on a phone: the pads stack so every button stays a real 56px target. */
#controls[data-players="2"] { flex-direction: column; align-items: center; gap: 8px; }
#controls[data-players="2"] .kit-pad { max-width: 440px; }
#controls[data-players="2"] .kit-pad[data-player="2"] .kit-btn { border-color: #5a4a72; }

.kit-dpad {
  display: grid;
  grid-template-columns: repeat(3, 56px);
  grid-template-rows: repeat(3, 56px);
  gap: 2px;
}
.kit-dir-up { grid-area: 1 / 2; }
.kit-dir-left { grid-area: 2 / 1; }
.kit-dir-right { grid-area: 2 / 3; }
.kit-dir-down { grid-area: 3 / 2; }

.kit-btn {
  font: inherit;
  min-width: 56px;
  min-height: 56px;
  border-radius: 12px;
  border: 2px solid #3a4160;
  background: linear-gradient(180deg, var(--shell-2), var(--shell));
  color: #cfd6f5;
  font-size: 16px;
  box-shadow: 0 3px 0 #0a0c14;
  touch-action: none;
  cursor: pointer;
}
.kit-btn:active, .kit-btn.is-down { transform: translateY(2px); box-shadow: 0 1px 0 #0a0c14; background: #2e3450; }
.kit-face { display: flex; gap: 10px; align-items: center; }
.kit-a { background: linear-gradient(180deg, #4a6ad8, #32499e); color: #fff; border-color: #6d87e6; border-radius: 50%; }
.kit-b { background: linear-gradient(180deg, #d85a6a, #9e3244); color: #fff; border-color: #e68191; border-radius: 50%; }
.kit-extra { display: flex; flex-direction: column; gap: 8px; }
.kit-menu, .kit-swap { min-width: 56px; min-height: 44px; font-size: 14px; }

/* ---- wide screens: pads beside the screen -------------------------------------- */
@media (min-width: 900px) {
  #stage {
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 28px;
    padding: 24px;
  }
  #screen {
    flex: 0 1 auto;
    width: min(70vw, 1000px);
    height: min(82vh, 760px);
  }
  #controls {
    width: auto;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .kit-pad { width: auto; grid-template-columns: auto; justify-items: center; gap: 14px; }
  #controls[data-players="2"] { flex-direction: column; gap: 22px; }
  #controls[data-players="2"] .kit-pad { max-width: none; }
  .kit-extra { flex-direction: row; }
  #choice { padding-bottom: 120px; }
}

/* ---- respect a quieter screen ----------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  .kit-next.is-ready { animation: none; }
  .kit-box.is-shaking { animation: none; }
  #chapter.is-in .kit-card, #toast.is-in { animation: none; }
}

</style>
</head>
<body>

<div id="app">
  <!-- Creator Mode uses these two; they stay empty (and hidden) while you play. -->
  <div id="mode-strip" hidden></div>

  <main id="stage">
    <div id="screen">
      <canvas id="game-canvas" aria-label="Game screen"></canvas>
      <div id="chapter" class="overlay" hidden></div>
      <div id="dialogue" class="overlay" hidden></div>
      <div id="choice" class="overlay" hidden></div>
      <div id="pause-menu" class="overlay" hidden></div>
      <div id="toast" class="overlay" hidden></div>
      <div id="screen-title" class="overlay" hidden></div>
    </div>
    <div id="controls" class="kit-controls"></div>
  </main>

  <div id="editor" hidden></div>
</div>

<!-- The single-file build writes the world in here; empty means "use the content files". -->
<script id="project-data" type="application/json"></script>

<!-- Kit core (load order: docs/KIT-API.md) -->
<script>
// ---- js/kit/core/util.js ----
// Small shared helpers. Everything here is pure and JSON-oriented.
(function (root) {
  const KIT = root.KIT = root.KIT || {};

  /** Deep clone of JSON-safe data (objects, arrays, primitives). */
  KIT.deepClone = function deepClone(v) {
    if (v === null || typeof v !== 'object') return v;
    if (Array.isArray(v)) return v.map(deepClone);
    const out = {};
    for (const k of Object.keys(v)) out[k] = deepClone(v[k]);
    return out;
  };

  /** Structural equality for JSON-safe data. */
  KIT.deepEqual = function deepEqual(a, b) {
    if (a === b) return true;
    if (a === null || b === null || typeof a !== 'object' || typeof b !== 'object') return a !== a && b !== b; // NaN
    if (Array.isArray(a) !== Array.isArray(b)) return false;
    if (Array.isArray(a)) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) if (!deepEqual(a[i], b[i])) return false;
      return true;
    }
    const ka = Object.keys(a), kb = Object.keys(b);
    if (ka.length !== kb.length) return false;
    for (const k of ka) if (!Object.prototype.hasOwnProperty.call(b, k) || !deepEqual(a[k], b[k])) return false;
    return true;
  };

  /** JSON with sorted object keys (stable, git-friendly). `indent` as in JSON.stringify. */
  KIT.stableStringify = function (value, indent) {
    const sort = (v) => {
      if (v === null || typeof v !== 'object') return v;
      if (Array.isArray(v)) return v.map(sort);
      const out = {};
      for (const k of Object.keys(v).sort()) out[k] = sort(v[k]);
      return out;
    };
    return JSON.stringify(sort(value), null, indent);
  };

  let counter = 0;
  /** Short unique id with a prefix: 'obj-k3f9a'. Deterministic when KIT.uid.seed is set (tests). */
  KIT.uid = function (prefix) {
    counter++;
    const rand = KIT.uid.seed != null ? (KIT.uid.seed + counter).toString(36) : Math.random().toString(36).slice(2, 7);
    return `${prefix || 'id'}-${rand}${counter.toString(36)}`;
  };
  KIT.uid.seed = null;

  /** 'Mom's House!' -> 'moms-house' */
  KIT.slug = function (s) {
    return String(s || '').toLowerCase().normalize('NFKD')
      .replace(/[\u0300-\u036f]/g, '').replace(/['\u2019]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'x';
  };

  KIT.clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  KIT.isObject = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;

</script>
<script>
// ---- js/kit/core/events.js ----
// Event bus. One per world (and one global KIT.bus for editor/game plumbing).
// Listeners are isolated: one throwing never stops the others.
(function (root) {
  const KIT = root.KIT = root.KIT || {};

  KIT.events = function events(name) {
    const listeners = new Map(); // event -> [{ fn, once }]
    const bus = {
      name: name || 'bus',
      on(event, fn) {
        if (!listeners.has(event)) listeners.set(event, []);
        const entry = { fn, once: false };
        listeners.get(event).push(entry);
        return () => bus.off(event, fn);
      },
      once(event, fn) {
        const off = bus.on(event, (...args) => { off(); fn(...args); });
        return off;
      },
      off(event, fn) {
        const list = listeners.get(event);
        if (!list) return;
        const i = list.findIndex(e => e.fn === fn);
        if (i >= 0) list.splice(i, 1);
      },
      /** emit(event, payload) -> number of listeners called. '*' listeners get (event, payload). */
      emit(event, payload) {
        let n = 0;
        const run = (list, args) => {
          for (const entry of list.slice()) {
            try { entry.fn(...args); n++; }
            catch (err) { (KIT.log || console).error(`[events:${bus.name}] listener for '${event}' threw`, err); }
          }
        };
        if (listeners.has(event)) run(listeners.get(event), [payload]);
        if (listeners.has('*')) run(listeners.get('*'), [event, payload]);
        return n;
      },
      count(event) { return (listeners.get(event) || []).length; },
      clear() { listeners.clear(); },
    };
    return bus;
  };

  KIT.bus = KIT.bus || KIT.events('kit');

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// ---- js/kit/core/rng.js ----
// Deterministic randomness. Every random decision in the kit goes through one
// of these so tests and autotile bakes are reproducible.
(function (root) {
  const KIT = root.KIT = root.KIT || {};

  /** 32-bit mixing hash of any number of numbers/strings -> uint32. */
  KIT.hash = function hash() {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < arguments.length; i++) {
      const a = arguments[i];
      const s = typeof a === 'string' ? a : String(a);
      for (let j = 0; j < s.length; j++) {
        h ^= s.charCodeAt(j);
        h = Math.imul(h, 16777619) >>> 0;
      }
      h ^= 0x9e3779b9; h = Math.imul(h ^ (h >>> 15), 0x85ebca6b) >>> 0;
    }
    h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35) >>> 0; h ^= h >>> 16;
    return h >>> 0;
  };

  /**
   * KIT.rng(seed) -> fn() in [0,1) with helpers:
   *   r.int(n) 0..n-1 | r.range(a,b) a..b inclusive | r.pick(arr) | r.chance(p) | r.weighted([{weight}]) -> index | r.shuffle(arr) (copy)
   * mulberry32; `seed` may be a number or string.
   */
  KIT.rng = function rng(seed) {
    let a = (typeof seed === 'number' ? seed : KIT.hash(seed == null ? 'seed' : seed)) >>> 0;
    const r = function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.seed = seed;
    r.int = (n) => Math.floor(r() * n);
    r.range = (lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.weighted = (items, key) => {
      const k = key || 'weight';
      let total = 0;
      for (const it of items) total += Math.max(0, Number(it[k]) || 0);
      if (total <= 0) return -1;
      let x = r() * total;
      for (let i = 0; i < items.length; i++) { x -= Math.max(0, Number(items[i][k]) || 0); if (x < 0) return i; }
      return items.length - 1;
    };
    r.shuffle = (arr) => { const c = arr.slice(); for (let i = c.length - 1; i > 0; i--) { const j = r.int(i + 1); [c[i], c[j]] = [c[j], c[i]]; } return c; };

</script>
<script>
// ---- js/kit/core/registry.js ----
// Registries: the one extension mechanism. Kit, modules and content register
// definitions (tiles, commands, object types, panels, ...) by string id.
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const registries = new Map();

  /**
   * defineRegistry(name, { fields, onAdd, onRemove, doc }) -> registry
   * `fields` is a schema (see schema.js) that every definition is validated against
   * (only when KIT.schema is loaded). Idempotent: defining twice returns the same registry.
   */
  KIT.defineRegistry = function (name, opts) {
    if (registries.has(name)) return registries.get(name);
    opts = opts || {};
    const items = new Map();
    const listeners = { add: [], remove: [] };
    const reg = {
      name, opts,
      add(def) {
        if (!def || typeof def.id !== 'string' || !def.id) throw new Error(`registry '${name}': a definition needs a string id`);
        if (opts.fields && KIT.schema) {

          const errs = KIT.schema.validate(opts.fields, def);

// ---- js/kit/core/schema.js ----
// Schema: typed field declarations. One declaration drives the editor form,

    if (!f || typeof f.key !== 'string') throw new Error('schema field needs a key');
    if (!f.type) throw new Error(`schema field '${f.key}' needs a type`);

    if (out.label == null) out.label = f.key.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/[-_]/g, ' ').replace(/^\w/, c => c.toUpperCase());

    if ('eq' in w) return v === w.eq;
    if ('neq' in w) return v !== w.neq;

  /** walk(fields, value, fn(field, value, path)) — visits every field (depth-first). */

<script>
// ---- js/kit/core/pixels.js ----
// KIT.pixels — pixel-string art → canvas (contract: docs/ARCHITECTURE.md §6.1)
//
// Art format: { w, h, palette: { char: '#hex' }, rows: ['....', ...] } or
// { frames: [rows, rows, ...] } for multi-frame art. Pokémon portraits use
// `size: 32` instead of w/h. '.' is transparent.
//
// canvas() / draw() need a browser (document.createElement('canvas')).
// validate() / downscale() / silhouette() / rowsOf() / dims() are pure and
// also work in Node, so tests can require() this file.
//
// This file used to live at js/core/pixels.js under the Pokémon namespace; the
// art registry files (js/art/tiles.js) keep that old name as an alias so the
// art tools keep working. Nothing here depends on any art file (icons.js may
// not exist yet) and nothing here references content or modules.
(function (root) {
  const KIT = root.KIT = root.KIT || {};

  const HEX = /^#[0-9a-fA-F]{6}$/;
  // WeakMap<art, Map<optionKey, canvas>> — the art object is the identity, so
  // an art object that is edited in place (Creator Mode) should call
  // KIT.pixels.invalidate(art) to drop its cached canvases.
  const cache = new WeakMap();

  function hasDocument() {
    return typeof document !== 'undefined' && typeof document.createElement === 'function';
  }

  // Width/height of an art object (handles `size`, `w/h`, or infers from rows).
  function dims(art) {
    if (!art) return { w: 0, h: 0 };
    const rows = rowsOf(art, 0);
    let w = art.w != null ? art.w : art.size;
    let h = art.h != null ? art.h : art.size;
    if (w == null) w = rows && rows[0] ? rows[0].length : 0;
    if (h == null) h = rows ? rows.length : 0;
    return { w: w | 0, h: h | 0 };
  }

  // The row strings for frame `frame` (0-based). Returns null when missing.
  function rowsOf(art, frame) {
    if (!art) return null;
    if (Array.isArray(art.frames) && art.frames.length) {
      const f = ((frame | 0) % art.frames.length + art.frames.length) % art.frames.length;
      const rows = art.frames[f];
      return Array.isArray(rows) ? rows : null;
    }
    return Array.isArray(art.rows) ? art.rows : null;
  }

  function frameCount(art) {
    if (!art) return 0;
    if (Array.isArray(art.frames)) return art.frames.length;
    return Array.isArray(art.rows) ? 1 : 0;
  }

  // Returns a list of readable problems; [] means the art is valid.
  function validate(art) {
    const errors = [];
    if (!art || typeof art !== 'object') return ['art is not an object'];
    const palette = art.palette;
    if (!palette || typeof palette !== 'object') errors.push('missing palette');
    const frames = Array.isArray(art.frames) ? art.frames : (Array.isArray(art.rows) ? [art.rows] : null);
    if (!frames || !frames.length) { errors.push('missing rows/frames'); return errors; }
    const { w, h } = dims(art);
    if (!(w > 0) || !(h > 0)) errors.push('width/height must be positive (w/h or size)');
    if (palette && typeof palette === 'object') {
      for (const key of Object.keys(palette)) {
        if (key.length !== 1) errors.push('palette key "' + key + '" must be a single character');
        if (key === '.') errors.push('palette must not define "." (transparent)');
        if (typeof palette[key] !== 'string' || !HEX.test(palette[key])) errors.push('palette["' + key + '"] is not a #rrggbb colour');
      }
    }
    const used = new Set();
    frames.forEach((rows, fi) => {
      const where = frames.length > 1 ? 'frame ' + fi + ' ' : '';
      if (!Array.isArray(rows)) { errors.push(where + 'rows is not an array'); return; }
      if (h > 0 && rows.length !== h) errors.push(where + 'has ' + rows.length + ' rows, expected ' + h);
      rows.forEach((row, ri) => {
        if (typeof row !== 'string') { errors.push(where + 'row ' + ri + ' is not a string'); return; }
        if (w > 0 && row.length !== w) errors.push(where + 'row ' + ri + ' has ' + row.length + ' chars, expected ' + w);
        for (const ch of row) {
          if (ch === '.') continue;
          used.add(ch);
          if (palette && !Object.prototype.hasOwnProperty.call(palette, ch)) {
            errors.push(where + 'row ' + ri + ' uses "' + ch + '" which is not in the palette');
          }
        }
      });
    });
    if (palette && typeof palette === 'object') {
      for (const key of Object.keys(palette)) if (!used.has(key)) errors.push('palette key "' + key + '" is never used');
    }
    // De-duplicate identical messages (a bad char repeats per row).
    return Array.from(new Set(errors));
  }

  // Nearest-neighbour downscale (e.g. 32×32 portrait → 16×16 overworld icon).
  // Keeps the palette (dropping keys that are no longer used) and never
  // returns '.' where the source block had any opaque pixel: the most common
  // opaque colour in each block wins, so thin outlines survive.
  function downscale(art, size) {
    const target = size | 0 || 16;
    const src = dims(art);
    const rows = rowsOf(art, 0);
    if (!rows || !src.w || !src.h) return silhouette(target, target, '#888888');
    const fx = src.w / target, fy = src.h / target;
    const out = [];
    const used = new Set();
    for (let y = 0; y < target; y++) {
      let line = '';
      const y0 = Math.floor(y * fy), y1 = Math.max(y0 + 1, Math.floor((y + 1) * fy));
      for (let x = 0; x < target; x++) {
        const x0 = Math.floor(x * fx), x1 = Math.max(x0 + 1, Math.floor((x + 1) * fx));
        const counts = {};
        let best = '.', bestN = 0;
        for (let yy = y0; yy < y1; yy++) {
          const r = rows[yy] || '';
          for (let xx = x0; xx < x1; xx++) {
            const ch = r[xx];
            if (!ch || ch === '.') continue;
            counts[ch] = (counts[ch] || 0) + 1;
            if (counts[ch] > bestN) { bestN = counts[ch]; best = ch; }
          }
        }
        if (best !== '.') used.add(best);
        line += best;
      }
      out.push(line);
    }
    const palette = {};
    const srcPal = art.palette || {};
    for (const k of Object.keys(srcPal)) if (used.has(k)) palette[k] = srcPal[k];
    for (const k of used) if (!palette[k]) palette[k] = '#888888';
    return { w: target, h: target, palette, rows: out };
  }

  // A rounded blob placeholder so missing art is visible but never a crash.
  function silhouette(w, h, color) {
    w = Math.max(1, w | 0 || 16); h = Math.max(1, h | 0 || 16);
    const c = (typeof color === 'string' && HEX.test(color)) ? color : '#8a8a9a';
    const rows = [];
    const cx = (w - 1) / 2, cy = (h - 1) / 2;
    const rx = w / 2 - 0.5, ry = h / 2 - 0.5;
    for (let y = 0; y < h; y++) {
      let line = '';
      for (let x = 0; x < w; x++) {
        const dx = (x - cx) / Math.max(rx, 0.5), dy = (y - cy) / Math.max(ry, 0.5);
        line += (dx * dx + dy * dy <= 1.05) ? 's' : '.';
      }
      rows.push(line);
    }
    // Always at least one opaque pixel so the palette key is used.
    if (!rows.some(r => r.indexOf('s') >= 0)) rows[Math.floor(h / 2)] = 's'.padEnd(w, '.');
    return { w, h, palette: { s: c }, rows };
  }

  function normalizeHex(hex) {
    return (typeof hex === 'string' ? hex : '').toLowerCase();
  }

  // Build a { char: colour } lookup with recolouring applied.
  //  recolor: { from:'#hex', to:'#hex' }  → every pixel of colour `from` becomes `to`
  //  recolor: { key:'#hex' }              → palette key `key` becomes that colour  (any number of keys)
  //  recolor may also be an array of the above.
  function paletteWith(art, recolor) {
    const out = Object.assign({}, art.palette || {});
    if (!recolor) return out;
    const list = Array.isArray(recolor) ? recolor : [recolor];
    for (const rc of list) {
      if (!rc || typeof rc !== 'object') continue;
      if (rc.from && rc.to) {
        const from = normalizeHex(rc.from);
        for (const k of Object.keys(out)) if (normalizeHex(out[k]) === from) out[k] = rc.to;
      }
      for (const k of Object.keys(rc)) {
        if (k === 'from' || k === 'to') continue;
        if (k.length === 1 && typeof rc[k] === 'string' && Object.prototype.hasOwnProperty.call(out, k)) out[k] = rc[k];
      }
    }
    return out;
  }

  function optionKey(opts) {
    const o = opts || {};
    let rc = '';
    if (o.recolor) { try { rc = JSON.stringify(o.recolor); } catch (e) { rc = String(o.recolor); } }
    return [o.scale || 1, o.mirror ? 1 : 0, o.frame | 0, rc].join('|');
  }

  // Paint art onto a fresh canvas (no caching). Used by canvas().
  function render(art, opts) {
    const o = opts || {};
    const scale = Math.max(1, o.scale | 0 || 1);
    const { w, h } = dims(art);
    const rows = rowsOf(art, o.frame | 0) || [];
    const pal = paletteWith(art, o.recolor);
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, w * scale);
    cv.height = Math.max(1, h * scale);
    const ctx = cv.getContext('2d');
    if (!ctx) return cv;
    ctx.imageSmoothingEnabled = false;
    for (let y = 0; y < h; y++) {
      const row = rows[y] || '';
      for (let x = 0; x < w; x++) {
        const ch = row[x];
        if (!ch || ch === '.') continue;
        const col = pal[ch];
        if (!col) continue;
        ctx.fillStyle = col;
        const px = o.mirror ? (w - 1 - x) : x;
        ctx.fillRect(px * scale, y * scale, scale, scale);
      }
    }
    return cv;
  }

  // Memoised canvas for `art` with the given options. Missing/invalid art
  // falls back to a silhouette so callers never crash.
  function canvas(art, opts) {
    if (!hasDocument()) throw new Error('KIT.pixels.canvas needs a browser document');
    let a = art;
    if (!a || typeof a !== 'object' || !rowsOf(a, 0)) {
      const d = dims(a);
      a = silhouette(d.w || 16, d.h || 16, '#8a8a9a');
    }
    let perArt = cache.get(a);
    if (!perArt) { perArt = new Map(); cache.set(a, perArt); }
    const key = optionKey(opts);
    let cv = perArt.get(key);
    if (!cv) { cv = render(a, opts); perArt.set(key, cv); }
    return cv;
  }

  // Draw the cached canvas at integer coordinates.
  function draw(ctx, art, x, y, opts) {
    if (!ctx) return;
    const cv = canvas(art, opts);
    ctx.drawImage(cv, Math.round(x), Math.round(y));
    return cv;
  }

  // Drop cached canvases for an art object (after editing it in place).
  function invalidate(art) {
    if (art) cache.delete(art);
  }

  /** The art object of a registry entry: tiles/sprites carry rows/palette on the definition itself or under `art`. */
  function artOf(def) {
    if (!def || typeof def !== 'object') return null;
    if (def.art && typeof def.art === 'object') return def.art;
    return (Array.isArray(def.rows) || Array.isArray(def.frames)) ? def : null;
  }

  KIT.pixels = {
    canvas, draw, downscale, silhouette, validate,
    dims, rowsOf, frameCount, paletteWith, invalidate, artOf,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

// ---- js/kit/core/input.js ----
// KIT.input (§8.5): one place that answers "is this player holding a
// direction?" and "did they just press A?", whatever the hardware is —
// keyboard, on-screen pads, or a swipe across the canvas.
//
// Players are 1-based (player 1 = hero 0). Buttons are the seven names in KEYS.
//   KIT.input.attach(canvas)              // keyboard + swipe
//   KIT.input.mount(el, { players: 2 })   // on-screen d-pad + A/B/menu per player
//   KIT.input.state(1).left               // held right now (poll every frame)
//   const off = KIT.input.onPress(ev => …) // ev = { player, key }: one edge per press
//
// Repeat-safe by design: holding a direction keeps `state().left` true, and the
// map scene decides that a press shorter than TAP_MS only turns the hero.
(function (root) {
  const KIT = root.KIT = root.KIT || {};

  const KEYS = ['up', 'down', 'left', 'right', 'a', 'b', 'menu'];
  const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

  // event.code -> button, per player. Tab is handled separately (swap heroes).
  const KEYMAP = [
    { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', KeyZ: 'a', Enter: 'a', NumpadEnter: 'a', Space: 'a', KeyX: 'b', Backspace: 'b', Escape: 'menu' },
    { KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right', KeyF: 'a', KeyG: 'b' },
  ];

  const TAP_MS = 90;                    // a direction held for less than this only turns
  const SWIPE_PX = 22;                  // finger travel that counts as a swipe
  const SWIPE_HOLD_MS = 160;            // how long a swipe keeps the direction held

  function blankState() { const s = {}; for (const k of KEYS) s[k] = false; return s; }

  const pads = [blankState(), blankState()];      // held, by player index
  const since = [{}, {}];                          // ms timestamp of the last press, per button
  const listeners = [];
  const edges = [new Set(), new Set()];            // pressed-this-frame, cleared by consume()
  let players = 1;
  let attached = null;                             // the element swipes are read from
  let mountEl = null;
  let releaseTimers = [];

  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
  const idx = (player) => {
    if (player === 'p2' || player === 2) return 1;
    if (player && player.id === 'p2') return 1;
    return 0;
  };

  /** Fire the press edge: listeners + the queue read by consume(). */
  function firePress(player, key) {
    edges[player].add(key);
    for (const fn of listeners.slice()) {
      try { fn({ player: player + 1, key }); } catch (e) { (KIT.log || console).error('[input] listener threw', e); }
    }
  }

  function setKey(player, key, down) {
    // Player 2's buttons stay live even with one pad on screen: with co-op off
    // the map scene simply points them at whoever is leading.
    const pad = pads[player];
    if (!pad || !KEYS.includes(key)) return;
    if (down) {
      if (pad[key]) return;                                       // ignore auto-repeat: it is already held
      pad[key] = true;
      since[player][key] = now();
      if (key !== OPPOSITE[key]) pad[OPPOSITE[key]] = false;       // never hold two opposite directions
      firePress(player, key);
    } else {
      pad[key] = false;
    }
  }

  // ---- keyboard ---------------------------------------------------------------
  function typingInto(el) {
    if (!el) return false;
    const tag = el.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
  }

  function onKeyDown(e) {
    if (typingInto(e.target)) return;
    if (e.code === 'Tab') { e.preventDefault(); firePress(0, 'swap'); return; }
    for (let p = 0; p < KEYMAP.length; p++) {
      const key = KEYMAP[p][e.code];
      if (!key) continue;
      if (e.repeat) return;                                       // held: the state is already true
      e.preventDefault();
      setKey(p, key, true);
      return;
    }
  }
  function onKeyUp(e) {
    if (typingInto(e.target)) return;
    for (let p = 0; p < KEYMAP.length; p++) {
      const key = KEYMAP[p][e.code];
      if (key) { setKey(p, key, false); return; }
    }
  }
  function onBlur() { for (let p = 0; p < pads.length; p++) for (const k of KEYS) pads[p][k] = false; }

  // ---- swipe / tap on the canvas ----------------------------------------------
  let swipe = null;
  function onPointerDown(e) {
    if (e.button != null && e.button > 0) return;
    swipe = { id: e.pointerId, x: e.clientX, y: e.clientY, t: now(), fired: false };
  }
  function onPointerMove(e) {
    if (!swipe || e.pointerId !== swipe.id || swipe.fired) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (Math.hypot(dx, dy) < SWIPE_PX) return;
    const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    swipe.fired = true;
    hold(dir, 1, SWIPE_HOLD_MS);
  }
  function onPointerUp(e) {
    if (!swipe || e.pointerId !== swipe.id) return;
    const quick = now() - swipe.t < 400;
    const moved = Math.hypot(e.clientX - swipe.x, e.clientY - swipe.y) >= SWIPE_PX;
    if (!moved && quick) { hold('a', 1, 60); }                    // a tap on the map is the A button
    swipe = null;
  }

  /** hold(key, player, ms) — press a button now and release it after `ms` (swipes, taps, tests). */
  function hold(key, player, ms) {
    const p = idx(player);
    setKey(p, key, true);
    const t = setTimeout(() => { setKey(p, key, false); }, Math.max(16, ms || 120));
    releaseTimers.push(t);
    if (releaseTimers.length > 64) releaseTimers = releaseTimers.slice(-32);
    return t;
  }

  // ---- on-screen controls -----------------------------------------------------
  function button(key, player, label, cls) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'kit-btn ' + (cls || '');
    b.setAttribute('data-btn', key);
    b.setAttribute('data-player', String(player));
    b.setAttribute('aria-label', label || key);
    b.textContent = label || '';
    return b;
  }

  /**
   * mount(el, { players }) — build the touch controls inside `el`.
   * One pointer per pad: the d-pad follows a single finger (you can slide from
   * left to up without lifting); A/B/menu are their own buttons.
   */
  function mount(el, opts) {
    if (!el) return;
    opts = opts || {};
    if (opts.players) players = Math.max(1, Math.min(2, opts.players | 0));
    mountEl = el;
    el.innerHTML = '';
    el.classList.add('kit-controls');
    el.setAttribute('data-players', String(players));
    for (let p = 1; p <= players; p++) el.appendChild(buildPad(p));
  }

  function buildPad(player) {
    const pad = document.createElement('div');
    pad.className = 'kit-pad';
    pad.setAttribute('data-player', String(player));

    const dpad = document.createElement('div');
    dpad.className = 'kit-dpad';
    const dirs = [['up', '▲'], ['left', '◀'], ['right', '▶'], ['down', '▼']];
    for (const [key, label] of dirs) {
      const b = button(key, player, label, 'kit-dir kit-dir-' + key);
      dpad.appendChild(b);
    }

    const face = document.createElement('div');
    face.className = 'kit-face';
    face.appendChild(button('b', player, 'B', 'kit-b'));
    face.appendChild(button('a', player, 'A', 'kit-a'));

    const extra = document.createElement('div');
    extra.className = 'kit-extra';
    if (player === 1) {
      extra.appendChild(button('menu', player, '☰', 'kit-menu'));
      const swap = document.createElement('button');
      swap.type = 'button';
      swap.className = 'kit-btn kit-swap';
      swap.setAttribute('data-btn', 'swap');
      swap.setAttribute('data-player', '1');
      swap.setAttribute('aria-label', 'Swap heroes');
      swap.textContent = '⇄';
      extra.appendChild(swap);
    } else {
      extra.appendChild(button('menu', player, '☰', 'kit-menu'));
    }

    pad.appendChild(dpad);
    pad.appendChild(extra);
    pad.appendChild(face);
    wirePad(pad, player, dpad);
    return pad;
  }

  function wirePad(pad, player, dpad) {
    const p = idx(player);
    let padPointer = null;          // one finger per pad
    const held = new Set();

    const releaseAll = () => { for (const k of held) setKey(p, k, false); held.clear(); };
    const keyAt = (clientX, clientY) => {
      const el = document.elementFromPoint(clientX, clientY);
      const btn = el && el.closest ? el.closest('[data-btn]') : null;
      if (!btn || !pad.contains(btn)) return null;
      return btn.getAttribute('data-btn');
    };
    const apply = (key) => {
      for (const k of Array.from(held)) if (k !== key) { setKey(p, k, false); held.delete(k); }
      if (key && key !== 'swap' && !held.has(key)) { setKey(p, key, true); held.add(key); }
      if (key === 'swap') firePress(0, 'swap');
    };

    pad.addEventListener('pointerdown', (e) => {
      if (padPointer !== null) return;                    // ignore a second finger on this pad
      const key = keyAt(e.clientX, e.clientY);
      if (!key) return;
      padPointer = e.pointerId;
      e.preventDefault();
      try { pad.setPointerCapture(e.pointerId); } catch (err) { /* not captureable: fine */ }
      apply(key);
    });
    pad.addEventListener('pointermove', (e) => {
      if (e.pointerId !== padPointer) return;
      e.preventDefault();
      const key = keyAt(e.clientX, e.clientY);
      if (key === 'swap') return;                         // sliding onto swap does nothing
      // Sliding around the d-pad changes direction; sliding off releases.
      if (key && dpad.contains(document.elementFromPoint(e.clientX, e.clientY))) apply(key);
      else if (!key) releaseAll();
    });
    const end = (e) => {
      if (e.pointerId !== padPointer) return;
      padPointer = null;
      releaseAll();
      try { pad.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    };
    pad.addEventListener('pointerup', end);
    pad.addEventListener('pointercancel', end);
    pad.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  // ---- public API --------------------------------------------------------------
  const INPUT = KIT.input = {
    KEYS, TAP_MS,

    /** attach(target) — keyboard on the window, swipe/tap on `target` (the canvas). */
    attach(target) {
      if (typeof window === 'undefined') return INPUT;
      INPUT.detach();
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);
      window.addEventListener('blur', onBlur);
      attached = target || null;
      if (attached) {
        attached.style.touchAction = 'none';
        attached.addEventListener('pointerdown', onPointerDown);
        attached.addEventListener('pointermove', onPointerMove);
        attached.addEventListener('pointerup', onPointerUp);
        attached.addEventListener('pointercancel', onPointerUp);
      }
      return INPUT;
    },
    detach() {
      if (typeof window === 'undefined') return INPUT;
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
      window.removeEventListener('blur', onBlur);
      if (attached) {
        attached.removeEventListener('pointerdown', onPointerDown);
        attached.removeEventListener('pointermove', onPointerMove);
        attached.removeEventListener('pointerup', onPointerUp);
        attached.removeEventListener('pointercancel', onPointerUp);
        attached = null;
      }
      onBlur();
      return INPUT;
    },

    mount,
    /** setPlayers(n) — 1 or 2 pads; re-mounts the controls if they are on screen. */
    setPlayers(n) {
      players = Math.max(1, Math.min(2, n | 0 || 1));
      if (mountEl) mount(mountEl, { players });
      return players;
    },
    players() { return players; },

    /** state(player) -> { up, down, left, right, a, b, menu } — what is held right now. */
    state(player) { return pads[idx(player)] || blankState(); },
    /** pressed(key, player) — for the `button` condition (ctx.input.pressed). */
    pressed(key, player) { const s = pads[idx(player)]; return !!(s && s[String(key || '').toLowerCase()]); },
    /** heldMs(key, player) — how long this button has been down (0 when it is up). */
    heldMs(key, player) {
      const p = idx(player);
      if (!pads[p][key]) return 0;
      return now() - (since[p][key] || now());
    },

    /** onPress(fn) -> off. fn({ player, key }) once per press (never on auto-repeat). `key` may also be 'swap'. */
    onPress(fn) {
      listeners.push(fn);
      return () => { const i = listeners.indexOf(fn); if (i >= 0) listeners.splice(i, 1); };
    },
    /** consume() — forget the presses seen this frame (a scene that handled them calls this). */
    consume() { edges[0].clear(); edges[1].clear(); return INPUT; },
    /** justPressed(key, player) — true until consume() is called. */
    justPressed(key, player) { return edges[idx(player)].has(key); },

    /** press(key, player, ms) — synthesise a press (tests, on-screen swap button, KIT.game.press). */
    press(key, player, ms) { hold(key, player, ms == null ? 120 : ms); return INPUT; },
    /** set(key, player, down) — hold or release a button explicitly. */
    set(key, player, down) { setKey(idx(player), key, !!down); return INPUT; },
    releaseAll: onBlur,

    isTouch() {
      if (typeof window === 'undefined') return false;
      const coarse = typeof window.matchMedia === 'function' && window.matchMedia('(hover: none), (pointer: coarse)').matches;
      return !!(coarse || (typeof navigator !== 'undefined' && navigator.maxTouchPoints > 0));
    },
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
// ---- js/kit/core/audio.js ----
// KIT.audio (§6.3, §8.5): a tiny chiptune synth. No files ship with the kit —
// every sound and every music track is a recipe played on WebAudio oscillators,
// so the whole game stays one page. A registry entry may still be
// `{ kind:'file', src }`; then an <audio> element plays it.
//
//   KIT.audio.init()                  // safe before the first gesture (see unlock())
//   KIT.audio.play('blip')
//   KIT.audio.music('town', { fade: 300 })
//   KIT.audio.jingle('heal')          // pauses the music, plays, resumes
//
// Sound recipe:  { kind:'synth', wave, gain, notes:[[freqOrNote, ms, delayMs?]…], slide }
// Music recipe:  { kind:'synth', tempo, wave, bassWave, lead:[steps], bass:[steps], drum:[steps], gain }
//   A step is a note name ('c4', 'f#3'), '-' (rest) or '~' (hold the last note).
// Nothing here throws when there is no AudioContext: every call becomes a no-op.
(function (root) {
  const KIT = root.KIT = root.KIT || {};

  const NOTES = { c: 0, 'c#': 1, db: 1, d: 2, 'd#': 3, eb: 3, e: 4, f: 5, 'f#': 6, gb: 6, g: 7, 'g#': 8, ab: 8, a: 9, 'a#': 10, bb: 10, b: 11 };
  /** freq('a4') -> 440. Numbers pass through. */
  function freq(note) {
    if (typeof note === 'number') return note;
    const m = /^([a-gA-G][#b]?)(-?\d)$/.exec(String(note || '').trim());
    if (!m) return 0;
    const semi = NOTES[m[1].toLowerCase()];
    if (semi == null) return 0;
    const octave = Number(m[2]);
    return 440 * Math.pow(2, (semi - 9) / 12 + (octave - 4));
  }

  let ctx = null;             // AudioContext (null until init() succeeds)
  let master = null, sfxBus = null, musicBus = null;
  let enabled = true, musicOn = true;
  let volumes = { master: 0.8, sound: 0.9, music: 0.5 };
  let current = null;         // { id, def, stopAt } the playing track
  let saved = null;           // saveMusic()/replayMusic()
  let schedTimer = null, schedStep = 0, schedTime = 0;
  let fileNodes = [];         // <audio> elements in flight
  let listener = null;        // { map, x, y } for playAt()

  const reg = (name) => (KIT.registry.exists(name) ? KIT.registry(name) : null);
  const defOf = (name, id) => { const r = reg(name); return r && id ? r.get(id) : null; };

  /** init() — create the AudioContext if the browser allows it. Safe to call at any time, any number of times. */
  function init() {
    if (ctx) return ctx;
    try {
      const AC = root.AudioContext || root.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = volumes.master; master.connect(ctx.destination);
      sfxBus = ctx.createGain(); sfxBus.gain.value = volumes.sound; sfxBus.connect(master);
      musicBus = ctx.createGain(); musicBus.gain.value = volumes.music; musicBus.connect(master);
    } catch (e) {
      ctx = null;
    }
    return ctx;
  }
  /** unlock() — resume after a user gesture (browsers start the context suspended). */
  function unlock() {
    const c = init();
    if (!c) return Promise.resolve(false);
    if (c.state === 'suspended') { try { return c.resume().then(() => true, () => false); } catch (e) { return Promise.resolve(false); } }
    return Promise.resolve(true);
  }

  // ---- one-shot sounds ---------------------------------------------------------
  /** A single enveloped tone on the sfx bus. */
  function tone(opts) {
    if (!ctx) return;
    const at = opts.at == null ? ctx.currentTime : opts.at;
    const ms = Math.max(10, opts.ms || 120);
    const dur = ms / 1000;
    const g = ctx.createGain();
    const peak = Math.max(0.0001, (opts.gain == null ? 0.3 : opts.gain));
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(peak, at + Math.min(0.02, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    g.connect(opts.bus || sfxBus);
    if (opts.wave === 'noise') {
      const buf = noiseBuffer();
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass'; filter.frequency.value = Math.max(120, opts.freq || 800); filter.Q.value = 1.2;
      src.connect(filter); filter.connect(g);
      src.start(at); src.stop(at + dur);
      return;
    }
    const osc = ctx.createOscillator();
    osc.type = opts.wave || 'square';
    osc.frequency.setValueAtTime(Math.max(20, opts.freq || 440), at);
    if (opts.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opts.slide), at + dur);
    osc.connect(g);
    osc.start(at);
    osc.stop(at + dur + 0.02);
  }
  let noiseBuf = null;
  function noiseBuffer() {
    if (noiseBuf) return noiseBuf;
    const n = ctx.sampleRate * 0.4;
    noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }

  function playFile(def, volume, loop) {
    try {
      const el = new Audio(def.src);
      el.volume = Math.max(0, Math.min(1, (volume == null ? 1 : volume) * volumes.master * (loop ? volumes.music : volumes.sound)));
      el.loop = !!loop;
      el.play().catch(() => {});
      fileNodes.push(el);
      if (fileNodes.length > 8) fileNodes = fileNodes.slice(-8);
      return el;
    } catch (e) { return null; }
  }

  /** play(id, { volume }) — a sound from the `sounds` registry. Unknown ids are ignored. */
  function play(id, opts) {
    if (!enabled || !id) return;
    const def = defOf('sounds', id);
    if (!def) return;
    if (def.kind === 'file') { playFile(def, (opts && opts.volume) || 1, false); return; }
    if (!init()) return;
    unlock();
    const vol = (opts && opts.volume == null ? 1 : (opts && opts.volume)) || 1;
    const base = (def.gain == null ? 0.3 : def.gain) * vol;
    const at0 = ctx.currentTime + 0.001;
    let cursor = 0;
    for (const note of def.notes || []) {
      const f = freq(note[0]);
      const ms = note[1] == null ? 90 : note[1];
      const delay = note[2] == null ? cursor : note[2];
      tone({ freq: f, ms, at: at0 + delay / 1000, wave: def.wave || 'square', gain: base, slide: note[3] ? freq(note[3]) : (def.slide ? f * def.slide : 0) });
      cursor = delay + ms;
    }
  }

  /** playAt(id, { map, x, y }) — diegetic: quieter the further it is from the listener, silent on another map. */
  function playAt(id, where) {
    if (!where || !listener) return play(id);
    if (where.map && listener.map && where.map !== listener.map) return;
    const d = Math.hypot((where.x || 0) - (listener.x || 0), (where.y || 0) - (listener.y || 0));
    const vol = Math.max(0, 1 - d / 14);
    if (vol <= 0.02) return;
    return play(id, { volume: vol });
  }

  // ---- music -------------------------------------------------------------------
  function stopSchedule() {
    if (schedTimer) { clearInterval(schedTimer); schedTimer = null; }
  }

  /** The scheduler: every 60 ms it books the next steps of the loop a little ahead of the clock. */
  function startSchedule(def) {
    stopSchedule();
    if (!init()) return;
    const tempo = def.tempo || 120;
    const stepDur = 30 / tempo;                       // an eighth note
    schedStep = 0;
    schedTime = ctx.currentTime + 0.08;
    const lead = def.lead || [], bass = def.bass || [], drum = def.drum || [];
    const length = Math.max(lead.length, bass.length, drum.length, 1);
    let lastLead = null, lastBass = null;
    const bookStep = (i, when) => {
      const gain = (def.gain == null ? 0.22 : def.gain);
      const l = lead[i % lead.length];
      if (lead.length) {
        if (l === '~' && lastLead) { /* hold: nothing new */ }
        else if (l && l !== '-') { lastLead = l; tone({ freq: freq(l), ms: stepDur * 1000 * 0.9, at: when, wave: def.wave || 'square', gain, bus: musicBus }); }
        else lastLead = null;
      }
      if (bass.length) {
        const b = bass[i % bass.length];
        if (b && b !== '-' && b !== '~') { lastBass = b; tone({ freq: freq(b), ms: stepDur * 1000 * 1.6, at: when, wave: def.bassWave || 'triangle', gain: gain * 0.9, bus: musicBus }); }
      }
      if (drum.length) {
        const d = drum[i % drum.length];
        if (d && d !== '-') tone({ freq: d === 'k' ? 90 : 1800, ms: d === 'k' ? 90 : 40, at: when, wave: d === 'k' ? 'sine' : 'noise', gain: gain * (d === 'k' ? 0.9 : 0.4), bus: musicBus });
      }
    };
    const pump = () => {
      if (!ctx || !current) return;
      const horizon = ctx.currentTime + 0.35;
      let guard = 0;
      while (schedTime < horizon && guard++ < 64) {
        bookStep(schedStep % length, schedTime);
        schedStep++;
        schedTime += stepDur;
      }
    };
    pump();
    schedTimer = setInterval(pump, 60);
  }

  /** music(id|null, { fade, volume }) — start, swap or stop the track. Re-playing the same id does nothing. */
  function music(id, opts) {
    opts = opts || {};
    if (!musicOn || !enabled) { current = id ? { id, def: defOf('music', id) } : null; stopSchedule(); return Promise.resolve(); }
    if (id && current && current.id === id) return Promise.resolve();
    stopSchedule();
    stopFiles(true);
    if (!id) { current = null; if (musicBus && ctx) fadeBus(musicBus, 0, opts.fade || 0, () => { musicBus.gain.value = volumes.music; }); return Promise.resolve(); }
    const def = defOf('music', id);
    current = { id, def };
    if (!def) return Promise.resolve();
    if (def.kind === 'file') { current.el = playFile(def, opts.volume, true); return Promise.resolve(); }
    if (!init()) return Promise.resolve();
    unlock();
    musicBus.gain.value = volumes.music * (opts.volume == null ? 1 : opts.volume);
    if (opts.fade) {
      musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
      musicBus.gain.exponentialRampToValueAtTime(Math.max(0.0001, volumes.music), ctx.currentTime + opts.fade / 1000);
    }
    startSchedule(def);
    return Promise.resolve();
  }
  function fadeBus(bus, to, ms, done) {
    if (!ctx) { if (done) done(); return; }
    try {
      const t = ctx.currentTime;
      bus.gain.cancelScheduledValues(t);
      bus.gain.setValueAtTime(Math.max(0.0001, bus.gain.value), t);
      bus.gain.exponentialRampToValueAtTime(Math.max(0.0001, to), t + Math.max(0.01, (ms || 0) / 1000));
    } catch (e) { /* ignore */ }
    if (done) setTimeout(done, (ms || 0) + 20);
  }
  function stopFiles(musicOnly) {
    for (const el of fileNodes.slice()) {
      if (musicOnly && !el.loop) continue;
      try { el.pause(); } catch (e) { /* ignore */ }
    }
    fileNodes = fileNodes.filter(el => !el.paused);
  }

  /** stop('sound'|'music'|'all') */
  function stop(what) {
    const w = what || 'all';
    if (w === 'music' || w === 'all') { stopSchedule(); current = null; stopFiles(true); }
    if (w === 'sound' || w === 'all') stopFiles(false);
    return Promise.resolve();
  }

  /** jingle(id) — pause the music, play a short fanfare from `music` (or `sounds`), then resume. */
  function jingle(id) {
    const def = defOf('music', id) || defOf('sounds', id);
    if (!def) return Promise.resolve();
    const before = current;
    stopSchedule();
    current = null;
    const notes = def.notes || (def.lead || []).map(n => [n, 160]);
    if (init() && enabled) {
      unlock();
      const at0 = ctx.currentTime + 0.01;
      let cursor = 0;
      for (const n of notes) {
        const ms = n[1] == null ? 160 : n[1];
        tone({ freq: freq(n[0]), ms, at: at0 + cursor / 1000, wave: def.wave || 'square', gain: (def.gain == null ? 0.3 : def.gain), bus: musicBus });
        cursor += ms;
      }
      return new Promise(res => setTimeout(() => { if (before) music(before.id); res(); }, cursor + 120));
    }
    if (before) music(before.id);
    return Promise.resolve();
  }

  const AUDIO = KIT.audio = {
    freq, init, unlock,
    play, playAt, music, stop, jingle,
    /** save()/replay() — the saveMusic/replayMusic commands. */
    save() { saved = current ? current.id : null; return Promise.resolve(); },
    replay() { return music(saved); },
    current() { return current ? current.id : null; },
    /** setListener({ map, x, y }) — where playAt() measures distance from (the active hero). */
    setListener(where) { listener = where; },
    setVolume(kind, v) {
      const val = Math.max(0, Math.min(1, Number(v) || 0));
      if (kind === 'sound' || kind === 'music' || kind === 'master') volumes[kind] = val;
      if (!ctx) return volumes;
      if (master) master.gain.value = volumes.master;
      if (sfxBus) sfxBus.gain.value = volumes.sound;
      if (musicBus) musicBus.gain.value = volumes.music;
      return volumes;
    },
    volumes() { return Object.assign({}, volumes); },
    setEnabled(on) {
      enabled = !!on;
      if (!enabled) stop('all');
      else if (musicOn && current) music(current.id);
      return enabled;
    },
    setMusic(on) {
      musicOn = !!on;
      if (!musicOn) { const id = current && current.id; stopSchedule(); stopFiles(true); current = id ? { id, def: defOf('music', id) } : null; }
      else if (current) { const id = current.id; current = null; music(id); }
      return musicOn;
    },
    isEnabled() { return enabled; },
    isMusic() { return musicOn; },
    context() { return ctx; },
  };

  // ---- the standard sounds and tracks ------------------------------------------
  // Registered here so a project always has something to play; a module or the
  // author can replace any id with their own recipe (or a file).
  if (KIT.registry && KIT.registry.exists('sounds')) {
    KIT.registry('sounds').addAll([
      { id: 'blip', name: 'Blip', group: 'ui', kind: 'synth', wave: 'square', gain: 0.18, notes: [['c5', 40]] },
      { id: 'select', name: 'Select', group: 'ui', kind: 'synth', wave: 'square', gain: 0.22, notes: [['e5', 45], ['a5', 70]] },
      { id: 'back', name: 'Back', group: 'ui', kind: 'synth', wave: 'square', gain: 0.2, notes: [['a4', 50], ['e4', 70]] },
      { id: 'bump', name: 'Bump', group: 'world', kind: 'synth', wave: 'triangle', gain: 0.22, notes: [['e3', 70]] },
      { id: 'door', name: 'Door', group: 'world', kind: 'synth', wave: 'triangle', gain: 0.25, notes: [['g3', 70], ['c4', 90]] },
      { id: 'item', name: 'Item', group: 'world', kind: 'synth', wave: 'square', gain: 0.24, notes: [['c5', 60], ['e5', 60], ['g5', 110]] },
      { id: 'sparkle', name: 'Sparkle', group: 'world', kind: 'synth', wave: 'sine', gain: 0.2, notes: [['e6', 50], ['a6', 50], ['c7', 90]] },
      { id: 'heal', name: 'Heal', group: 'world', kind: 'synth', wave: 'sine', gain: 0.22, notes: [['c5', 90], ['e5', 90], ['g5', 90], ['c6', 160]] },
      { id: 'save', name: 'Save', group: 'ui', kind: 'synth', wave: 'square', gain: 0.22, notes: [['g4', 70], ['c5', 70], ['e5', 120]] },
      { id: 'notify', name: 'Notify', group: 'ui', kind: 'synth', wave: 'square', gain: 0.2, notes: [['a5', 60], ['f5', 90]] },
      { id: 'hop', name: 'Hop', group: 'world', kind: 'synth', wave: 'triangle', gain: 0.22, notes: [['c4', 60, 0, 'g4']] },
    ]);
  }
  if (KIT.registry && KIT.registry.exists('music')) {
    KIT.registry('music').addAll([
      { id: 'title', name: 'Title', kind: 'synth', tempo: 96, wave: 'triangle', gain: 0.2,
        lead: ['c5', '~', 'e5', '~', 'g5', '~', 'e5', '~', 'f5', '~', 'a5', '~', 'g5', '~', '~', '-'],
        bass: ['c3', '-', '-', '-', 'g2', '-', '-', '-', 'f2', '-', '-', '-', 'g2', '-', '-', '-'] },
      { id: 'town', name: 'Town', kind: 'synth', tempo: 132, wave: 'square', gain: 0.18,
        lead: ['f4', 'a4', 'c5', 'a4', 'g4', 'bb4', 'd5', 'bb4', 'a4', 'c5', 'f5', 'c5', 'g4', 'e4', 'f4', '-'],
        bass: ['f2', '-', 'c3', '-', 'g2', '-', 'd3', '-', 'a2', '-', 'f2', '-', 'c3', '-', 'f2', '-'],
        drum: ['k', '-', 'h', '-', 'k', '-', 'h', '-', 'k', '-', 'h', '-', 'k', '-', 'h', 'h'] },
      { id: 'route', name: 'Route', kind: 'synth', tempo: 148, wave: 'square', gain: 0.17,
        lead: ['g4', 'b4', 'd5', 'b4', 'c5', 'e5', 'g5', 'e5', 'd5', 'b4', 'g4', 'b4', 'a4', 'd5', 'b4', '-'],
        bass: ['g2', '-', 'd3', '-', 'c3', '-', 'g2', '-', 'd3', '-', 'g2', '-', 'a2', '-', 'd3', '-'],
        drum: ['k', 'h', 'h', '-', 'k', 'h', 'h', '-', 'k', 'h', 'h', '-', 'k', 'h', 'k', 'h'] },
      { id: 'house', name: 'House', kind: 'synth', tempo: 88, wave: 'triangle', gain: 0.18,
        lead: ['c5', '~', 'a4', '~', 'f4', '~', 'g4', '~', 'a4', '~', 'c5', '~', 'g4', '~', '~', '-'],
        bass: ['f2', '-', '-', '-', 'c3', '-', '-', '-', 'f2', '-', '-', '-', 'g2', '-', '-', '-'] },
      { id: 'cave', name: 'Cave', kind: 'synth', tempo: 76, wave: 'sine', gain: 0.2,
        lead: ['a4', '~', '~', 'c5', '~', '~', 'b4', '~', 'g4', '~', '~', 'e4', '~', '~', '~', '-'],
        bass: ['a2', '-', '-', '-', 'e2', '-', '-', '-', 'f2', '-', '-', '-', 'e2', '-', '-', '-'] },
      { id: 'garden', name: 'Garden', kind: 'synth', tempo: 104, wave: 'sine', gain: 0.18,
        lead: ['d5', '~', 'f#5', '~', 'a5', '~', 'f#5', '~', 'e5', '~', 'g5', '~', 'd5', '~', '~', '-'],
        bass: ['d3', '-', '-', 'a2', '-', '-', 'b2', '-', '-', 'g2', '-', '-', 'd3', '-', '-', '-'] },
    ]);
  }

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

// ---- js/kit/core/storage.js ----
// KIT.storage (§4.3): everything that outlives a page load — the editor draft,
// save slots, settings, the meta record that survives New Game — plus the
// export / download / publish plumbing.
//
// Adapters are tried in order: IndexedDB → localStorage → memory. Every access

      case 'move': return { t: 'moveRoute', target: c.target || 'self', steps: (c.path || []).slice(), wait: c.wait !== false };

        const where = { path: ['autotiles', setId, 'groups', gi, 'rules', ri] };

        if (r && Array.isArray(r.pattern) && r.pattern.length !== (r.size || 3) * (r.size || 3)) prob('error', 'bad-pattern', `autotile rule ${g.id}/${ri + 1}: pattern needs ${(r.size || 3) * (r.size || 3)} cells`, { path: where.path.concat('pattern') });

    });

    // world
    const world = isObj(project.world) ? project.world : { maps: {}, connections: [] };
    if (!mapIds.length) prob('error', 'no-maps', 'the project has no maps', { path: ['maps'] });
    if (!project.start || !project.start.map || !maps[project.start.map]) prob('error', 'bad-start', `start map '${project.start && project.start.map}' does not exist`, { path: ['start', 'map'] });
    else {
      const m = maps[project.start.map];
      if (project.start.x >= m.width || project.start.y >= m.height || project.start.x < 0 || project.start.y < 0) prob('error', 'target-out-of-bounds', `start position (${project.start.x}, ${project.start.y}) is outside '${m.id}'`, { map: m.id, path: ['start'] });
      else if (P.cellSolid(m, project.start.x, project.start.y)) prob('warn', 'target-solid', `start position (${project.start.x}, ${project.start.y}) on '${m.id}' is solid`, { map: m.id, path: ['start'] });
    }
    for (const id of Object.keys(world.maps || {})) if (!maps[id]) prob('warn', 'unknown-map', `world layout mentions missing map '${id}'`, { path: ['world', 'maps', id] });
    (world.connections || []).forEach((c, i) => {
      const where = { path: ['world', 'connections', i] };
      errors('schema', stripRefErrors(S.validate(F.connection, c)), where, 'connection');
      const a = maps[c && c.a], b = maps[c && c.b];
      if (!a || !b) { prob('error', 'bad-connection', `connection ${i + 1}: map '${!a ? c && c.a : c && c.b}' does not exist`, where); return; }
      const side = c.side, off = c.offset | 0;
      if (!['n', 's', 'e', 'w'].includes(side)) return;
      const vertical = side === 'n' || side === 's';
      const lenA = vertical ? a.width : a.height, lenB = vertical ? b.width : b.height;
      let mismatch = 0, open = 0, pairs = 0;
      for (let k = 0; k < lenA; k++) {
        const kb = k - off;
        if (kb < 0 || kb >= lenB) continue;
        pairs++;
        const ca = vertical ? [k, side === 's' ? a.height - 1 : 0] : [side === 'e' ? a.width - 1 : 0, k];
        const cb = vertical ? [kb, side === 's' ? 0 : b.height - 1] : [side === 'e' ? 0 : b.width - 1, kb];
        const sa = P.cellSolid(a, ca[0], ca[1]), sb = P.cellSolid(b, cb[0], cb[1]);
        if (sa !== sb) mismatch++;
        if (!sa && !sb) open++;

      if (!pairs) prob('error', 'bad-connection', `connection ${a.id} ${side} ${b.id}: the edges do not touch (offset ${off})`, where);
      else if (!open) prob('warn', 'connection-blocked', `connection ${a.id} ${side} ${b.id}: no walkable tile leads across`, where);
      else if (mismatch) prob('warn', 'connection-mismatch', `connection ${a.id} ${side} ${b.id}: ${mismatch} edge tile(s) are walkable on one side and solid on the other`, where);
    });

    // maps, objects, pages
    const allRefs = P.collect(project).refs;
    const checkTiles = tilesKnown();
    const seenUnknownTile = new Set();
    for (const mapId of mapIds) {
      const m = maps[mapId];
      const mwhere = { map: mapId, path: ['maps', mapId] };
      errors('schema', stripRefErrors(S.validate(F.map, m)), mwhere, `map ${mapId}`);
      if (m.id !== mapId) prob('error', 'bad-map-id', `map '${mapId}' has id '${m.id}'`, { map: mapId, path: ['maps', mapId, 'id'] });

      for (const layer of P.LAYERS) {
        const arr = L[layer];
        if (!Array.isArray(arr) || arr.length !== n) { prob('error', 'bad-layer', `map ${mapId}: layer '${layer}' must have ${n} cells`, { map: mapId, path: ['maps', mapId, 'layers', layer] }); continue; }
        if (layer === 'terrain') { const seen = new Set(); arr.forEach((v, i) => { if (v && !terrainIds.has(v) && !seen.has(v)) { seen.add(v); prob('warn', 'unknown-terrain', `map ${mapId}: terrain ${v} at cell ${i} is not defined`, { map: mapId, path: ['maps', mapId, 'layers', 'terrain', i] }); } }); }

          const counts = new Map();

      const ids = new Map();
      let ticks = 0;
      const typeCounts = new Map();
      (m.objects || []).forEach((o, oi) => {

          if (!pg) return;
          errors('schema', S.validate(F.behaviour, pg.behaviour || {}), { map: mapId, object: o.id, page: pi, path: pwhere.path.concat('behaviour') }, `${o.id} page ${pi + 1} behaviour`);
          if (t && t.fields) errors('schema', stripRefErrors(S.validate(t.fields, pg.props || {})), { map: mapId, object: o.id, page: pi, path: pwhere.path.concat('props') }, `${o.id} page ${pi + 1}`);
          const on = pg.on || {};
          for (const slot of Object.keys(on)) if (!P.SLOTS.includes(slot)) prob('warn', 'unknown-slot', `${o.id} page ${pi + 1}: unknown slot '${slot}'`, { map: mapId, object: o.id, page: pi, slot, path: pwhere.path.concat('on', slot) });

      if (!reads.size) return;
      const writes = allRefs.filter(r => r.access === 'write' && (r.kind === 'var' || r.kind === 'self') && KIT.path.isPrefix(bodyPath, r.where.path)).map(r => r.kind + ':' + r.id);
      if (!writes.some(w => reads.has(w))) prob('warn', 'soft-lock', `${label} runs while ${Array.from(reads).join(', ')} but never changes it — it will run on every entry`, Object.assign({}, where, { path: bodyPath }));

      try { const more = v.run(project, Object.assign({}, ctx, { project })); if (Array.isArray(more)) for (const m of more) problems.push(Object.assign({ severity: 'error', code: v.id, message: '', where: {} }, m)); }

  };

  // ---- helpers ------------------------------------------------------------------
  P.newMap = function (opts) {
    opts = opts || {};
    const id = opts.id || KIT.slug(opts.name || 'map');
    return P.fillMap({ id, name: opts.name || titleCase(id), width: opts.width || 20, height: opts.height || 15, kind: opts.kind || 'outdoor', music: opts.music || null }, id);
  };
  /** newObject({ type, id, name, x, y, props, page }) -> a normalized object with one page (props at their type defaults). */
  P.newObject = function (opts) {
    opts = opts || {};
    const type = opts.type || 'npc';
    const page = Object.assign({}, opts.page || {}, { props: Object.assign({}, (opts.page && opts.page.props) || {}, opts.props || {}) });
    return P.fillObject({ id: opts.id, name: opts.name || (objectType(type) ? objectType(type).name : titleCase(type)), type, x: opts.x | 0, y: opts.y | 0, note: opts.note || '', pages: [page] }, 0);
  };
  /** resize(map, w, h) -> a new map (anchor top-left; cells outside are dropped, new cells get defaults). Objects are kept (the validator flags any outside). */
  P.resize = function (map, w, h) {
    w = Math.max(1, w | 0); h = Math.max(1, h | 0);

    const ground = P.GROUND_BY_KIND[map.kind] || 'grass';
    const fills = { terrain: 0, ground, deco: null, above: null, regions: 0 };
    const regrid = (arr, fill) => { const o = new Array(w * h); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) o[y * w + x] = (x < map.width && y < map.height && Array.isArray(arr) && arr[y * map.width + x] !== undefined) ? arr[y * map.width + x] : fill; return o; };
    out.layers = {};
    for (const layer of P.LAYERS) out.layers[layer] = regrid((map.layers || {})[layer], fills[layer]);
    out.collision = regrid(map.collision, null);

  };
  /** blank() -> a small valid project with one map. */
  P.blank = function (opts) {
    opts = opts || {};
    const mapId = opts.map || 'start';
    return P.normalize({
      version: P.VERSION,
      meta: { id: opts.id || 'new-adventure', title: opts.title || 'New Adventure', subtitle: '', author: '', pitch: opts.pitch || '' },
      start: { map: mapId, x: 5, y: 5, dir: 'down' },
      terrains: [{ id: 1, name: 'Grass', color: '#58b848', base: 'grass' }],
      maps: { [mapId]: { id: mapId, name: 'Start', width: 12, height: 10, kind: 'outdoor' } },
    }).project;
  };
  P.clone = (p) => KIT.deepClone(p);

  /** unique object id on a map: base, base-2, base-3 ... */
  P.uniqueObjectId = function (map, base) {
    const taken = new Set((map && map.objects || []).map(o => o.id));
    base = KIT.slug(base || 'object');
    if (!taken.has(base)) return base;
    for (let i = 2; ; i++) if (!taken.has(`${base}-${i}`)) return `${base}-${i}`;
  };
  /**
   * buildPreset(presetOrId, ctx) -> [{ map, object }]  ctx: { project, map, x, y, input:{ field values } }
   * Interprets a preset's `objects` templates: '$<field>' -> input value (or the field default), '$here' -> { map, x, y }.
   */
  P.buildPreset = function (presetOrId, ctx) {
    const preset = typeof presetOrId === 'string' ? KIT.registry('presets').require(presetOrId) : presetOrId;
    ctx = ctx || {};
    const input = S.fill(preset.fields || [], ctx.input || {});
    const here = { map: ctx.map, x: ctx.x | 0, y: ctx.y | 0 };
    const sub = (v) => {
      if (typeof v === 'string' && v[0] === '$') { const k = v.slice(1); return k === 'here' ? KIT.deepClone(here) : (k in input ? KIT.deepClone(input[k]) : v); }
      if (Array.isArray(v)) return v.map(sub);
      if (isObj(v)) { const o = {}; for (const k of Object.keys(v)) o[k] = sub(v[k]); return o; }
      return v;
    };
    const out = [];
    for (const tpl of preset.objects || []) {
      const at = tpl.at || 'here';
      const pos = at === 'here' ? here : (isObj(input[at]) ? { map: input[at].map || here.map, x: input[at].x | 0, y: input[at].y | 0 } : here);
      const spec = sub(Object.assign({}, tpl));
      delete spec.at;
      const targetMap = ctx.project && ctx.project.maps ? ctx.project.maps[pos.map] : null;
      const obj = P.fillObject(Object.assign({}, spec, { id: spec.id || P.uniqueObjectId(targetMap, `${spec.name || spec.type}-${pos.x}-${pos.y}`), x: pos.x, y: pos.y }), 0);

    }
    // two objects on the same map from one preset must not share an id
    const seen = new Map();
    for (const pl of out) { const key = pl.map + ':' + pl.object.id; if (seen.has(key)) pl.object.id = pl.object.id + '-' + (seen.get(key) + 1); seen.set(key, (seen.get(key) || 0) + 1); }

  };

  // ---- content files (§4.2) -------------------------------------------------------
  // Scheme (documented in each file's header):
  //   project.js      registers everything but the maps as   KIT.content.projects[<projectId>]
  //   maps/<id>.js    registers one map as                   KIT.content.maps[<projectId>][<mapId>]
  //   KIT.project.fromContent(projectId) puts them back together; importFiles(files) parses the texts.
  // Every file is an IIFE whose last argument is the JSON payload, so the payload can be parsed

  // last line that is exactly "}" before the closing ");").

    if (key === 'pattern' && parent && Number.isInteger(parent.size)) return parent.size;

  }
  /** stringify(value) -> pretty 2-space JSON, keys sorted, tile layers one map row per line, short primitive lists on one line. */
  P.stringify = function (value, opts) {

          return '[\n' + rows.join(',\n') + '\n' + end + ']';
        }
        if (allPrim) { const line = v.map(prim).join(', '); if (line.length <= 72) return '[' + line + ']'; }
        return '[\n' + v.map(x => pad + fmt(x, indent + 1, null, v, ancestors.concat([v]))).join(',\n') + '\n' + end + ']';
      }
      const keys = Object.keys(v).filter(k => v[k] !== undefined).sort();
      if (!keys.length) return '{}';
      return '{\n' + keys.map(k => pad + JSON.stringify(k) + ': ' + fmt(v[k], indent + 1, k, v, ancestors.concat([v]))).join(',\n') + '\n' + end + '}';
    }
    return fmt(value, 0, null, null, []);
  };
  function fileHeader(kind, projectId, id, title) {
    return [
      `// ${title} — Kit content file, generated by KIT.project.exportFiles (hand edits are fine; keep it valid JSON inside).`,
      kind === 'project' ? `// kind: project  id: ${projectId}` : `// kind: map  project: ${projectId}  id: ${id}`,
      `// project.js registers KIT.content.projects[${q(projectId)}]; each maps/<id>.js registers KIT.content.maps[${q(projectId)}][<id>].`,
      `// KIT.project.fromContent(${q(projectId)}) assembles the project again; KIT.project.importFiles({ path: text }) parses the texts.`,
    ].join('\n');
  }
  P.exportFiles = function (project) {
    const p = KIT.deepClone(project);
    const pid = (p.meta && p.meta.id) || 'project';
    const maps = p.maps || {};
    delete p.maps;
    if (p.meta) delete p.meta.modified;
    const files = {};
    files['project.js'] = [
      fileHeader('project', pid, pid, (p.meta && p.meta.title) || pid),
      '(function (root, data) {',
      '  var KIT = root.KIT = root.KIT || {};',
      '  var content = KIT.content = KIT.content || {};',
      `  (content.projects = content.projects || {})[${q(pid)}] = data;`,
      "})(typeof window !== 'undefined' ? window : globalThis,",
      P.stringify(p),
      ');',
      '',
    ].join('\n');
    for (const id of Object.keys(maps).sort()) {
      files[`maps/${id}.js`] = [
        fileHeader('map', pid, id, (maps[id].name || id) + ' (map)'),
        '(function (root, data) {',
        '  var KIT = root.KIT = root.KIT || {};',
        '  var content = KIT.content = KIT.content || {};',
        '  var maps = content.maps = content.maps || {};',
        `  (maps[${q(pid)}] = maps[${q(pid)}] || {})[${q(id)}] = data;`,
        "})(typeof window !== 'undefined' ? window : globalThis,",
        P.stringify(maps[id]),
        ');',
        '',
      ].join('\n');
    }
    return files;
  };
  /** parseFile(text) -> { kind:'project'|'map', projectId, id, data } or null when the text is not a Kit content file. */
  P.parseFile = function (text) {
    const m = /^\/\/ kind: (project|map)(?:  project: (\S+))?  id: (\S+)$/m.exec(text);
    if (!m) return null;
    const start = text.indexOf('\n{\n');
    const stop = text.lastIndexOf('\n}\n);');
    if (start < 0 || stop < 0) return null;
    const data = JSON.parse(text.slice(start + 1, stop + 2));
    return { kind: m[1], projectId: m[1] === 'project' ? m[3] : m[2], id: m[3], data };
  };
  /** importFiles({ 'project.js': text, 'maps/<id>.js': text, ... }) -> project (not normalized; maps re-attached by id). */
  P.importFiles = function (files) {
    let project = null;
    const maps = {};
    for (const name of Object.keys(files || {})) {
      const parsed = P.parseFile(files[name]);
      if (!parsed) continue;
      if (parsed.kind === 'project') project = parsed.data;
      else maps[parsed.data.id || parsed.id] = parsed.data;
    }
    if (!project) throw new Error('importFiles: no project.js among the files');
    project.maps = Object.assign({}, project.maps || {}, maps);
    return project;
  };
  /** fromContent(projectId?) -> project assembled from loaded content files (KIT.content), or null. Without an id, the only loaded project. */
  P.fromContent = function (projectId) {
    const c = KIT.content;
    if (!c || !c.projects) return null;
    const id = projectId || (Object.keys(c.projects).length === 1 ? Object.keys(c.projects)[0] : null);
    if (!id || !c.projects[id]) return null;
    const p = KIT.deepClone(c.projects[id]);
    p.maps = Object.assign({}, p.maps || {}, KIT.deepClone((c.maps && c.maps[id]) || {}));
    return p;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);
