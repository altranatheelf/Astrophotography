<script>
// ---- js/kit/game.js ----
// KIT.game — boot, the loop, saves, and the ctx ports.
//
// Everything the script language can ask for (§9.1 "The ctx ports") is
// implemented here in terms of the scenes, KIT.fx, KIT.audio and the world:
// `io` opens scenes, `screen` drives KIT.fx, `map` moves characters and
// transfers between maps, `game` opens the menu and saves. The world itself
// stays headless — swap these ports for fakes and the same story runs in Node.
//
//   await KIT.game.boot({ mount: document.body, project })
//   KIT.game.warp('town', 12, 4, 'down'); KIT.game.press('a'); KIT.game.tick(300)
//
// Test hooks (§12): state project world scene() newGame warp press tick
// rngOverride loadProject — plus the URL flags ?fast=1 ?edit=1 ?test=<id>.
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const E = KIT.entities;
  const STEP = 1 / 60;

  const G = KIT.game = {
    project: null, world: null, renderer: null, ports: null,
    flags: { fast: false, edit: false, test: null, debug: false },
    rngOverride: null,
    booted: false,
  };

  let canvas = null, controls = null;
  let raf = null, last = 0, acc = 0, playtimeMs = 0;
  let cameraScroll = null;                 // { x, y } added after the camera system runs
  const commandRoutes = [];                // entities moving on a moveRoute (with their resolvers)
  let autosaveQueued = false;

  const settings = () => KIT.storage.settings();
  const wait = (ms) => new Promise(res => setTimeout(res, KIT.fx.instant ? Math.min(16, ms) : ms));

  // ---- URL flags ------------------------------------------------------------------
  function readFlags() {
    let q = {};
    try {
      const s = new URLSearchParams((root.location && root.location.search) || '');
      q = { fast: s.get('fast') === '1', edit: s.get('edit') === '1', test: s.get('test'), debug: s.get('debug') === '1' };
    } catch (e) { q = { fast: false, edit: false, test: null, debug: false }; }
    G.flags = q;
    KIT.fx.instant = !!q.fast;
    return q;
  }

  // ---- the ports (§9.1) -------------------------------------------------------------
  function buildPorts() {
    const io = {
      say: (o) => KIT.scenes.run('dialogue', o),
      choice: (o) => KIT.scenes.run('choice', o),
      nameEntry: async (o) => {
        const name = await KIT.scenes.run('nameEntry', o);
        if (name) {
          const used = (KIT.storage.meta().namesUsed || []).concat([name]).slice(-12);
          KIT.storage.saveMeta({ namesUsed: used });
        }
        return name;
      },
      inputNumber: (o) => KIT.scenes.run('inputNumber', o),
      toast: (o) => KIT.toast(o && o.text),
      chapter: (o) => KIT.scenes.run('chapter', o),
      scrollText: (o) => KIT.scenes.run('scrollText', o),
      wait: (ms) => wait(Number(ms) || 0),
    };

    const audio = {
      play: (id, o) => { KIT.audio.play(id, o); return Promise.resolve(); },
      music: (id, o) => KIT.audio.music(id, o),
      stop: (what) => KIT.audio.stop(what),
      save: () => KIT.audio.save(),
      replay: () => KIT.audio.replay(),
      jingle: (id) => KIT.audio.jingle(id),
    };

    const screen = {
      fadeOut: (o) => KIT.fx.fadeOut(o),
      fadeIn: (o) => KIT.fx.fadeIn(o),
      tint: (o) => KIT.fx.tint(o),
      flash: (o) => KIT.fx.flash(o),
      shake: (o) => KIT.fx.shake(o),
      weather: (o) => KIT.fx.weather(o),
    };

    const pictures = {
      show: (o) => KIT.fx.show(o),
      move: (o) => KIT.fx.move(o),
      erase: (o) => KIT.fx.erase(o),
    };

    /** target -> entity: self | hero | p1 | p2 | obj:<id> */
    function resolve(target, ctxEntity) {
      const w = G.world;
      if (!w) return null;
      const t = String(target || 'self');
      if (t === 'self') return ctxEntity || null;
      if (t === 'hero') return w.hero();
      if (t === 'p1') return w.heroes[0];
      if (t === 'p2') return w.heroes[1] || w.heroes[0];
      if (t.startsWith('obj:')) {
        const id = t.slice(4);
        return w.entities.find(e => e.id === id) || null;
      }
      return w.entities.find(e => e.id === t) || null;
    }
    // `self` needs the entity whose script is running. The world tracks that as
    // `world.activeEntity` for main-thread scripts; `_bindEntity` covers background
    // (tick) scripts, which the world does not mark because several can overlap.
    let boundEntity = null;
    G._bindEntity = (e) => { boundEntity = e; };
    const currentEntity = () => (G.world && G.world.activeEntity) || boundEntity;

    const map = {
      async transfer(o) {
        const w = G.world;
        if (!w) return;
        const fade = o.fade !== false;
        if (fade) await KIT.fx.fadeOut({ ms: 220 });
        await w.enterMap(o.map, o.x || 0, o.y || 0, o.dir || 'down');
        queueAutosave();
        if (fade) await KIT.fx.fadeIn({ ms: 220 });
      },
      async setLocation(o) {
        const w = G.world;
        const e = resolve(o.target, currentEntity());
        if (!e || !w) return;
        if (o.swap) {
          const other = resolve(o.swap, currentEntity());
          if (other) { const x = e.x, y = e.y; place(e, other.x, other.y); place(other, x, y); }
          return;
        }
        place(e, o.x || 0, o.y || 0);
      },
      moveRoute(o) {
        const e = resolve(o.target, currentEntity());
        if (!e) return Promise.resolve();
        E.startRoute(e, o.steps || [], { repeat: !!o.repeat, skipBlocked: o.skipBlocked !== false });
        e.data.commandRoute = true;
        if (o.wait === false || o.repeat) return Promise.resolve();
        return new Promise((resolve2) => { commandRoutes.push({ e, resolve: resolve2 }); });
      },
      scrollMap(o) {
        const dx = o.dx || 0, dy = o.dy || 0;
        const speed = Math.max(1, o.speed || 4);
        const ms = (Math.abs(dx) + Math.abs(dy)) / speed * 1000;
        cameraScroll = cameraScroll || { x: 0, y: 0 };
        const from = { x: cameraScroll.x, y: cameraScroll.y };
        const to = { x: from.x + dx, y: from.y + dy };
        return new Promise((resolve2) => {
          const t0 = nowMs();
          const tickScroll = () => {
            const k = KIT.fx.instant ? 1 : Math.min(1, (nowMs() - t0) / Math.max(1, ms));
            cameraScroll = { x: from.x + (to.x - from.x) * k, y: from.y + (to.y - from.y) * k };
            if (k >= 1) resolve2(); else setTimeout(tickScroll, 16);
          };
          tickScroll();
        });
      },
      transparency(o) { const e = resolve(o.target || 'hero', currentEntity()); if (e) e.opacity = o.on !== false ? 0 : 1; return Promise.resolve(); },
      async animation(o) {
        // No animation system yet: a sparkle and a beat is the honest placeholder.
        const e = resolve(o.target, currentEntity());
        KIT.audio.play('sparkle');
        if (e) e.data.balloon = { kind: '✦', start: nowMs(), ms: 500 };
        await wait(320);
      },
      async balloon(o) {
        const e = resolve(o.target, currentEntity());
        if (e) e.data.balloon = { kind: o.kind || '!', start: nowMs(), ms: 1100 };
        if (o.wait) await wait(1100);
      },
      erase(o) {
        const e = resolve(o.target, currentEntity());
        if (e) { e.visible = false; e.solid = false; }
        return Promise.resolve();
      },
      follow(o) {
        const w = G.world;
        if (!w) return Promise.resolve();
        const second = w.heroes[1];
        if (!second) return Promise.resolve();
        if (o.on === false) { second.visible = false; second.solid = false; second.data.trail = []; }
        else { const lead = w.hero(); second.visible = true; second.solid = !w.coop ? false : true; place(second, lead.x, lead.y); }
        return Promise.resolve();
      },
    };

    const game = {
      menu: () => KIT.scenes.run('menu', { game: G }),
      save: (o) => G.save((o && o.slot) || 'autosave'),
      title: () => { G.toTitle(); return Promise.resolve(); },
      heal: async (o) => { KIT.audio.play('heal'); await wait(200); return true; },
      debug: (o) => {
        const text = (o && o.text) || '';
        (KIT.log || console).log('[debug]', text);
        if (G.flags.debug) KIT.toast('debug: ' + text);
        return Promise.resolve();
      },
    };

    const input = { pressed: (key, hero) => KIT.input.pressed(key, hero === 'p2' ? 2 : 1) };
    return { io, audio, screen, pictures, map, game, input };
  }

  function nowMs() { return root.performance ? performance.now() : Date.now(); }
  function place(e, x, y) { e.x = x; e.y = y; e.px = x; e.py = y; e.mover.moving = false; }

  // ---- the world --------------------------------------------------------------------
  function heroDefaults(project) {
    const start = project.start || {};
    return (project.heroes || []).map(h => ({ map: start.map, x: start.x || 0, y: start.y || 0, dir: start.dir || 'down', name: h.name }));
  }

  /** A fresh save from the project's defaults (§7), optionally seeded by a test state. */
  function blankSave(project, testState) {
    const vars = {};
    for (const name of Object.keys(project.vars || {})) vars[name] = project.vars[name].default;
    const start = project.start || {};
    const save = {
      version: 2, projectId: (project.meta && project.meta.id) || 'kit', savedAt: null, playtimeMs: 0, slotLabel: null,
      heroes: heroDefaults(project), activeHero: 0,
      vars, inventory: {}, objects: {}, overlays: {}, modules: {},
      clock: { day: 1, minutes: 480, lastSeenAt: null },
      timer: { running: false, secondsLeft: 0 },
      music: { current: null, saved: null },
      steps: 0,
      seed: Math.floor(Math.random() * 1e9),
    };
    if (testState) {
      Object.assign(save.vars, testState.vars || {});
      Object.assign(save.inventory, testState.inventory || {});
      Object.assign(save.modules, testState.modules || {});
      for (const h of save.heroes) { h.map = testState.map || h.map; h.x = testState.x || 0; h.y = testState.y || 0; h.dir = testState.dir || 'down'; }
    }
    return save;
  }

  /** Build the live world for a save and wire the runtime-only hooks onto it. */
  function buildWorld(save) {
    const project = G.project;
    const rng = typeof G.rngOverride === 'function' ? G.rngOverride
      : (G.rngOverride != null ? KIT.rng(G.rngOverride) : KIT.rng(save.seed || 1));
    const world = KIT.world.create({ project, save, ports: G.ports, rng, events: KIT.events('world') });

    // `ctx.input` comes from the world's own ports; the entity binding only has to
    // cover background (tick) scripts, which the world does not mark as active.
    const baseMakeCtx = world.makeCtx;
    world.makeCtx = function (entity, heroId) {
      const ctx = baseMakeCtx(entity, heroId);
      if (entity) G._bindEntity(entity);
      return ctx;
    };

    world.coop = !!settings().coop || !!(project.settings.coop && project.settings.coop.enabled);
    world.activeHero = Math.min(save.activeHero || 0, world.heroes.length - 1);
    world.events.on('mapEnter', () => { queueAutosave(); });
    world.events.on('heal', () => KIT.audio.play('heal'));

    G.world = world;
    KIT.input.setPlayers(world.coop ? 2 : 1);
    return world;
  }

  // ---- saving ------------------------------------------------------------------------
  function snapshot() {
    const w = G.world;
    if (!w) return null;
    w.saveHeroPositions();
    w.save.activeHero = w.activeHero;
    w.save.playtimeMs = Math.round(playtimeMs);
    w.save.music = { current: KIT.audio.current(), saved: w.save.music ? w.save.music.saved : null };
    return w.save;
  }
  G.save = async function (slot) {
    const s = snapshot();
    if (!s) return false;
    return await KIT.storage.saveGame(slot || 'autosave', s);
  };
  function queueAutosave() {
    if (autosaveQueued) return;
    autosaveQueued = true;
    setTimeout(() => { autosaveQueued = false; G.save('autosave'); }, 50);
  }

  // ---- the loop -------------------------------------------------------------------------
  /** The camera clamps to what really fits on screen — `world.viewport`, never the saved project. */
  function syncViewport() {
    if (!G.renderer || !G.world) return;
    const vt = G.renderer.viewTiles();
    const vp = G.world.viewport || (G.world.viewport = { w: vt.w, h: vt.h });
    if (vp.w !== vt.w || vp.h !== vt.h) { vp.w = vt.w; vp.h = vt.h; }
  }

  function step(dt) {
    KIT.scenes.update(dt);
    const w = G.world;
    const top = KIT.scenes.top();
    syncViewport();
    if (w && w.map && !(top && top.pausesWorld)) {
      w.update(dt);
      playtimeMs += dt * 1000;
      updateCommandRoutes(dt);
      if (cameraScroll) { w.camera.x += cameraScroll.x; w.camera.y += cameraScroll.y; }
      const h = w.hero();
      if (h) KIT.audio.setListener({ map: w.map.id, x: h.x, y: h.y });
    }
  }
  function updateCommandRoutes(dt) {
    const w = G.world;
    const all = w.entities.concat(w.heroes, w.companion ? [w.companion] : []);
    for (const e of all) {
      if (!e.data.commandRoute) continue;
      if (e.route && !e.route.done) continue;      // the movement system steps it
      {
        e.data.commandRoute = false;
        for (let i = commandRoutes.length - 1; i >= 0; i--) {
          if (commandRoutes[i].e === e) { commandRoutes[i].resolve(); commandRoutes.splice(i, 1); }
        }
      }
    }
  }
  function render() {
    if (!G.renderer) return;
    if (G.world && G.world.map) G.renderer.render(G.world);
  }
  function frame(t) {
    raf = root.requestAnimationFrame(frame);
    const dt = Math.min(0.25, (t - last) / 1000 || 0);
    last = t;
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard++ < 6) { step(STEP); acc -= STEP; }
    render();
  }
  function startLoop() {
    if (raf) return;
    last = nowMs();
    raf = root.requestAnimationFrame(frame);
  }

  // ---- boot -----------------------------------------------------------------------------
  G.resize = function () {
    if (!G.renderer) return;
    G.renderer.resize();
    syncViewport();
    render();
  };

  /** boot({ mount, project }) -> Promise<KIT.game> */
  G.boot = async function (opts) {
    opts = opts || {};
    readFlags();
    await KIT.storage.ready();

    G.project = opts.project || KIT.project.blank();
    KIT.storage.projectId((G.project.meta && G.project.meta.id) || 'kit');

    canvas = KIT.ui.el('game-canvas');
    controls = KIT.ui.el('controls');
    if (!canvas) throw new Error('KIT.game.boot: no #game-canvas in the page');

    const s = settings();
    KIT.audio.setEnabled(s.sound !== false);
    KIT.audio.setMusic(s.music !== false);
    KIT.audio.setVolume('sound', s.soundVolume == null ? 0.9 : s.soundVolume);
    KIT.audio.setVolume('music', s.musicVolume == null ? 0.5 : s.musicVolume);

    G.ports = buildPorts();
    G.renderer = KIT.renderer.create({ canvas, project: G.project });
    G.resize();

    KIT.input.attach(canvas);
    KIT.input.mount(controls, { players: s.coop ? 2 : 1 });
    KIT.input.onPress((ev) => {
      KIT.audio.unlock();
      KIT.scenes.input(ev);
    });
    root.addEventListener('resize', () => G.resize());
    if (typeof ResizeObserver === 'function') {          // the layout settles after the first frames
      const ro = new ResizeObserver(() => G.resize());
      ro.observe(canvas.parentNode || canvas);
    }
    root.addEventListener('orientationchange', () => setTimeout(() => G.resize(), 120));
    if (typeof document !== 'undefined') {
      document.addEventListener('visibilitychange', () => { if (!document.hidden) KIT.audio.unlock(); });
    }
    startLoop();
    G.booted = true;

    if (G.flags.edit && KIT.editor && typeof KIT.editor.open === 'function') { KIT.editor.open(G); return G; }
    if (G.flags.test) {
      const st = (G.project.testStates || []).find(t => t.id === G.flags.test);
      await G.newGame({ testState: st || null });
      return G;
    }
    titleLoop();
    return G;
  };

  /** The title runs in a loop: New Game or Continue leaves it, Settings comes back. */
  async function titleLoop() {
    for (;;) {
      const action = await KIT.scenes.run('title', { project: G.project, game: G });
      if (action === 'continue') {
        const ok = await G.continueGame();
        if (ok) return;
        await KIT.toast('No save to continue from yet.');
        continue;
      }
      await G.newGame({});
      return;
    }
  }

  G.toTitle = function () {
    KIT.scenes.clear();
    KIT.fx.reset();
    G.world = null;
    KIT.audio.music(null, { fade: 200 });
    titleLoop();
  };

  // ---- new game / continue ----------------------------------------------------------------
  G.newGame = async function (opts) {
    opts = opts || {};
    const project = G.project;
    const testState = opts.testState || null;
    const save = blankSave(project, testState);
    if (opts.names) (opts.names || []).forEach((n, i) => { if (save.heroes[i] && n) save.heroes[i].name = n; });
    playtimeMs = 0;

    const meta = KIT.storage.meta();
    await KIT.storage.saveMeta({ runs: (meta.runs || 0) + 1, firstPlayed: meta.firstPlayed || new Date().toISOString() });

    const world = buildWorld(save);
    KIT.scenes.clear();
    KIT.fx.reset();
    KIT.scenes.push('map', { game: G });
    const at = save.heroes[0];
    await world.enterMap(at.map || project.start.map, at.x, at.y, at.dir);
    await G.save('autosave');
    await KIT.interpreter.runAuto(project, world.makeCtx(null, world.hero().id));
    return world;
  };

  /** continueGame(slot) — a named slot, or (with no slot) the most recent save of any kind. */
  G.continueGame = async function (slot) {
    let save = null;
    if (slot) save = await KIT.storage.loadGame(slot);
    else {
      const list = (await KIT.storage.listGames()).filter(s => s.exists);
      list.sort((a, b) => String(b.savedAt || '').localeCompare(String(a.savedAt || '')));
      if (list[0]) save = await KIT.storage.loadGame(list[0].slot);
    }
    if (!save) return false;
    playtimeMs = save.playtimeMs || 0;
    const world = buildWorld(save);
    KIT.scenes.clear();
    KIT.fx.reset();
    KIT.scenes.push('map', { game: G });
    const at = (save.heroes && save.heroes[0]) || {};
    await world.enterMap(at.map || G.project.start.map, at.x || 0, at.y || 0, at.dir || 'down');
    if (save.music && save.music.current) KIT.audio.music(save.music.current, { fade: 300 });
    return true;
  };

  // ---- runtime controls ----------------------------------------------------------------------
  G.openMenu = function () { return KIT.scenes.run('menu', { game: G }); };
  G.openDebug = function () { return KIT.scenes.run('debug', { game: G }); };
  G.swapHero = function () {
    const w = G.world;
    if (!w || w.heroes.length < 2) return;
    w.setActiveHero((w.activeHero + 1) % w.heroes.length);
    KIT.audio.play('blip');
  };
  /** setCoop(on) — two heroes on screen, one pad each; off puts hero 2 back on the trail. */
  G.setCoop = function (on) {
    const w = G.world;
    KIT.storage.saveSettings({ coop: !!on });
    KIT.input.setPlayers(on ? 2 : 1);
    if (!w) return;
    w.coop = !!on;
    const second = w.heroes[1];
    if (second) {
      second.visible = true;
      second.solid = !!on;
      if (on) {
        const lead = w.hero(0);
        if (second.x === lead.x && second.y === lead.y) {
          for (const dir of ['left', 'right', 'down', 'up']) {
            const r = w.map.passable(lead.x, lead.y, dir, second);
            if (r.ok && r.to) { place(second, r.to.x, r.to.y); break; }
          }
        }
        w.setActiveHero(0);
      } else {
        second.data.trail = [];
      }
    }
    w.rebuildEntities();
  };

  // ---- the testability API (§12) ----------------------------------------------------------------
  Object.defineProperty(G, 'state', { get() { return G.world ? G.world.save : null; } });
  G.scene = function () { const t = KIT.scenes.top(); return t ? t.id : null; };
  G.warp = function (map, x, y, dir) { return G.ports.map.transfer({ map, x, y, dir: dir || 'down', fade: false }); };
  G.press = function (key, player, ms) { KIT.input.press(key, player || 1, ms); return G; };
  G.hold = function (key, player, down) { KIT.input.set(key, player || 1, down !== false); return G; };
  /** tick(ms) — advance the fixed-step loop by hand (tests; the rAF loop keeps running too). */
  G.tick = function (ms) {
    let left = (ms == null ? 16 : ms) / 1000;
    let guard = 0;
    while (left > 0 && guard++ < 600) { step(Math.min(STEP, left)); left -= STEP; }
    render();
    return G;
  };
  /** loadProject(project) — swap the whole world (tests, the editor, an import). */
  G.loadProject = function (project) {
    const n = KIT.project.normalize(project);
    G.project = n.project;
    KIT.storage.projectId((G.project.meta && G.project.meta.id) || 'kit');
    if (G.renderer) { G.renderer.setProject(G.project); G.resize(); }
    const top = KIT.scenes.top();
    if (top && top.id === 'title') {           // redraw the title for the new project without ending the title loop
      if (top.exit) top.exit();
      if (top.enter) top.enter({ project: G.project, game: G });
    }
    return n.problems;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;

<script>
// ---- js/art/tiles.js ----
// Tile art registration. The art lives in tiles-nature.js / tiles-town.js /
// tiles-interior.js, which call PKMN.TILES.register([...]) with entries of the
// form { id, name, group, solid, palette, rows | frames, ... } (§6.2). Those
// calls are thin aliases that forward to the kit's 'tiles' registry — the
// registry fills the flag defaults, and a tile definition is its own art
// (KIT.pixels.artOf(def) returns it). Stamps (multi-tile brushes) are kept on
// KIT.registry('tiles').stamps. Nothing here touches pixel data.
//
// Requires the kit core (registry, schema, registries, pixels, world/tiles) to
// be loaded first.
(function (root) {
  const KIT = root.KIT;
  const PKMN = root.PKMN = root.PKMN || {};
  const reg = KIT.registry('tiles');
  const T = PKMN.TILES = PKMN.TILES || {};

  const titleCase = (id) => id.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  /** register(tiles) — forwards to KIT.registry('tiles').addAll after the legacy w/h/name/group defaults. */
  T.register = function (tiles) {
    const list = [];
    for (const t of tiles) {
      if (!t || !t.id) continue;
      if (t.w == null) t.w = 16;
      if (t.h == null) t.h = 16;
      if (t.group == null) t.group = 'nature';
      if (!t.name) t.name = titleCase(t.id);
      if (reg.has(t.id)) t.replace = true;   // art files may be re-run (tools); replacing the same id is not a warning
      list.push(t);
    }
    reg.addAll(list);
  };

  /** registerStamps(stamps) — upserts into KIT.registry('tiles').stamps ({ id, name, group, tiles:[[ids]] }). */
  T.registerStamps = function (stamps) {
    const all = reg.stamps = reg.stamps || [];
    for (const s of stamps) {
      const i = all.findIndex(x => x.id === s.id);
      if (i >= 0) all[i] = s; else all.push(s);
    }
  };

  // Legacy views over the registry (the art tools read these).
  Object.defineProperty(T, 'list', { get: () => reg.list() });
  Object.defineProperty(T, 'byId', { get: () => { const o = {}; for (const t of reg.list()) o[t.id] = t; return o; } });
  Object.defineProperty(T, 'stamps', { get: () => reg.stamps });
  T.groups = ['nature', 'town', 'interior', 'cave'];
  /** Frame to draw for an animated tile at time t (ms) — KIT.tiles.frameAt. */
  T.frameAt = (tile, t) => KIT.tiles.frameAt(tile, t);

  // The pixel helpers moved to KIT.pixels; keep the old name for the art tools.
  PKMN.Pixels = KIT.pixels;

  const house = (roof) => [
    [roof, roof, roof, roof, roof],
    [roof + '-eave', roof + '-eave', roof + '-eave', roof + '-eave', roof + '-eave'],
    ['wall', 'wall-window', 'wall', 'wall-window', 'wall'],
    ['wall', 'wall', 'door', 'wall', 'wall'],
  ];
  T.registerStamps([
    { id: 'big-tree', name: 'Big tree', group: 'nature', tiles: [['tree-tl', 'tree-tr'], ['tree-bl', 'tree-br']] },
    { id: 'house-red', name: 'Red house', group: 'town', tiles: house('roof-red') },
    { id: 'house-blue', name: 'Blue house', group: 'town', tiles: house('roof-blue') },
    { id: 'house-green', name: 'Green house', group: 'town', tiles: house('roof-green') },
    { id: 'lab', name: 'Lab', group: 'town', tiles: [
      ['roof-blue', 'roof-blue', 'roof-blue', 'roof-blue', 'roof-blue', 'roof-blue', 'roof-blue'],
      ['roof-blue-eave', 'roof-blue-eave', 'roof-blue-eave', 'roof-blue-eave', 'roof-blue-eave', 'roof-blue-eave', 'roof-blue-eave'],
      ['lab-wall', 'lab-window', 'lab-wall', 'lab-window', 'lab-wall', 'lab-window', 'lab-wall'],
      ['lab-wall', 'lab-wall', 'lab-wall', 'lab-door', 'lab-wall', 'lab-wall', 'lab-wall'],
    ] },
    { id: 'bed', name: 'Bed', group: 'interior', tiles: [['bed-top'], ['bed-bottom']] },
    { id: 'pond', name: 'Pond (3×3)', group: 'nature', tiles: [['water', 'water', 'water'], ['water', 'water-lily', 'water'], ['water', 'water', 'water']] },
  ]);

  if (typeof module !== 'undefined' && module.exports) module.exports = PKMN;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
// ---- js/art/chars.js ----
// Character sprite registration. The art lives in chars-heroes.js /
// chars-npcs.js which call PKMN.CHARS.register([...]) and
// PKMN.CHARS.registerRecolorable(id, {...}). Those are thin aliases over the
// kit's 'sprites' registry (§6.3): entries are { id, name, group, w, h,
// palette, frames:{ down, up, left } } with 3 frames [stand, stepA, stepB] per
// direction; right is the mirrored left. Recolourable parts live on
// KIT.registry('sprites').recolorable. Nothing here touches pixel data.
//
// Requires the kit core (registry, schema, registries) to be loaded first.
(function (root) {
  const KIT = root.KIT;
  const PKMN = root.PKMN = root.PKMN || {};
  const reg = KIT.registry('sprites');
  reg.recolorable = reg.recolorable || {};
  const C = PKMN.CHARS = PKMN.CHARS || {};
  const SP = KIT.sprites = KIT.sprites || {};

  const titleCase = (id) => id.replace(/-/g, ' ').replace(/\b\w/g, ch => ch.toUpperCase());

  /** register(chars) — forwards to KIT.registry('sprites').addAll after the legacy w/h/name/group defaults. */
  C.register = function (chars) {
    const list = [];
    for (const c of chars) {
      if (!c || !c.id) continue;
      if (c.w == null) c.w = 16;
      if (c.h == null) c.h = 24;
      if (!c.name) c.name = titleCase(c.id);
      if (!c.group) c.group = 'npc';
      if (reg.has(c.id)) c.replace = true;
      list.push(c);
    }
    reg.addAll(list);
  };
  /** registerRecolorable(id, parts) — parts: { hair:['h','H'], shirt:['s','S'], ... } palette keys per recolourable part. */
  C.registerRecolorable = function (id, parts) { reg.recolorable[id] = parts; };

  // Walk cycle: stand, stepA, stand, stepB  (frames array = [stand, stepA, stepB])
  SP.WALK_SEQUENCE = [0, 1, 0, 2];
  /** frame(sprite, dir, i) -> { rows, mirror } for a sprite facing `dir` at walk-cycle index `i` (0-3). */
  SP.frame = function (ch, dir, i) {
    const fi = SP.WALK_SEQUENCE[((i % 4) + 4) % 4];
    const d = dir === 'right' ? 'left' : dir;
    const frames = ch.frames[d] || ch.frames.down;
    return { rows: frames[Math.min(fi, frames.length - 1)], mirror: dir === 'right' };
  };
  SP.recolorable = reg.recolorable;

  // Legacy views over the registry.
  C.WALK_SEQUENCE = SP.WALK_SEQUENCE;
  C.frame = SP.frame;
  Object.defineProperty(C, 'list', { get: () => reg.list() });
  Object.defineProperty(C, 'byId', { get: () => { const o = {}; for (const c of reg.list()) o[c.id] = c; return o; } });
  Object.defineProperty(C, 'recolorable', { get: () => reg.recolorable });

  if (typeof module !== 'undefined' && module.exports) module.exports = PKMN;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>
// ---- js/art/chars-placeholder.js ----
// Placeholder characters. Real pixel art can replace any of these later by
// registering the same id from another file (the registry replaces by id).
// Each one is generated here from a few colours: a big head, a body, two legs
// that alternate, and a back view with no face — enough to read as a person and
// to animate while the real art is drawn.
(function (root) {
  const KIT = root.KIT;
  if (!KIT || !KIT.registry) return;
  const reg = KIT.registry('sprites');

  const W = 16, H = 24;
  // '.' transparent, 'o' outline, 's' skin, 'h' hair, 'b' body, 'p' legs, 'e' eye, 'w' white
  const BASE = [
    '................', '.....oooooo.....', '....ohhhhhho....', '...ohhhhhhhho...',
    '...ohhhhhhhho...', '...osssssssso...', '...osesssseso...', '...osssssssso...',
    '...osssssssso...', '....oossssoo....', '......oooo......', '....obbbbbbo....',
    '...obbbbbbbbo...', '...obbbbbbbbo...', '...obbbbbbbbo...', '...obbbbbbbbo...',
    '...osbbbbbbso...', '....obbbbbbo....', '.....oppppo.....', '.....oppppo.....',
    '.....op..po.....', '....oppo.oppo...', '....oooo.oooo...', '................',
  ];
  const clone = (rows) => rows.slice();
  const put = (rows, y, x, ch) => { const r = rows[y].split(''); r[x] = ch; rows[y] = r.join(''); };

  function frames(kind) {
    const stand = clone(BASE);
    if (kind === 'up') { for (const y of [6]) stand[y] = '...osssssssso...'; for (const y of [3, 4, 5, 6, 7, 8]) stand[y] = stand[y].replace(/s/g, 'h'); }
    if (kind === 'left') { put(stand, 6, 9, 's'); put(stand, 6, 10, 'e'); put(stand, 6, 4, 's'); put(stand, 6, 5, 's'); }
    const a = clone(stand), b = clone(stand);
    // step A: left leg forward, step B: right leg forward (and a 1px head bob)
    a[21] = '....oppo..oo....'; a[22] = '....oooo..oo....';
    b[21] = '....oo..oppo....'; b[22] = '....oo..oooo....';
    return [stand, a, b];
  }

  function character(id, name, group, colors) {
    const palette = { o: colors.outline || '#3a2a20', s: colors.skin || '#f8d0b0', h: colors.hair || '#5a3a1a', b: colors.shirt || '#e04040', p: colors.pants || '#3060c0', e: '#241a16', w: '#ffffff' };
    return { id, name, group: group || 'npc', w: W, h: H, palette, placeholder: true,
      frames: { down: frames('down'), up: frames('up'), left: frames('left') } };
  }

  const PEOPLE = [
    ['hero-boy', 'Hero (boy)', 'hero', { hair: '#5a3a1a', shirt: '#e04040', pants: '#3060c0' }],
    ['hero-girl', 'Hero (girl)', 'hero', { hair: '#7a4a28', shirt: '#68c0e8', pants: '#e06098' }],
    ['kid-boy', 'Kid (boy)', 'npc', { hair: '#241a16', shirt: '#58b848', pants: '#8a6a40' }],
    ['kid-girl', 'Kid (girl)', 'npc', { hair: '#f0d070', shirt: '#f08ab8', pants: '#f08ab8' }],
    ['woman', 'Woman', 'npc', { hair: '#6a4426', shirt: '#f8d878', pants: '#c06030' }],
    ['man', 'Man', 'npc', { hair: '#30241c', shirt: '#4878c0', pants: '#a08858' }],
    ['grandma', 'Grandma', 'npc', { hair: '#d8d8e0', shirt: '#a878c8', pants: '#786090' }],
    ['grandpa', 'Grandpa', 'npc', { hair: '#d8d8e0', shirt: '#8a6a40', pants: '#5a4a38' }],
    ['professor', 'Professor', 'npc', { hair: '#9a9a9a', shirt: '#f0f0f0', pants: '#585868' }],
    ['nurse', 'Nurse', 'npc', { hair: '#f090b0', shirt: '#ffffff', pants: '#f0a0c0' }],
    ['clerk', 'Clerk', 'npc', { hair: '#3a2a20', shirt: '#3a70b8', pants: '#2a4a78' }],
    ['trainer', 'Trainer', 'npc', { hair: '#d85030', shirt: '#303040', pants: '#487848' }],
  ];
  for (const [id, name, group, colors] of PEOPLE) if (!reg.has(id) || (reg.get(id) || {}).placeholder) reg.add(Object.assign(character(id, name, group, colors), { replace: true }));

  // A pokéball on a stand: a small round marker used for objects that are not people.
  if (!reg.has('pokeball')) reg.add({ id: 'pokeball', name: 'Poké Ball', group: 'object', w: 16, h: 24, placeholder: true,
    palette: { o: '#3a2a20', r: '#e04040', w: '#f8f8f8', k: '#585868' },
    frames: (function () {
      const empty = '................';
      const rows = [];
      for (let i = 0; i < 24; i++) rows.push(empty);
      const art = ['.....oooooo.....', '....orrrrrro....', '...orrrrrrrro...', '...orrrrrrrro...', '...ooookkoooo...', '...owwwkkwwwo...', '...owwwwwwwwo...', '....owwwwwwo....', '.....oooooo.....'];
      for (let i = 0; i < art.length; i++) rows[13 + i] = art[i];
      const one = rows.slice();
      return { down: [one, one, one], up: [one, one, one], left: [one, one, one] };
    })() });

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>
// ---- js/main.js ----
// The entry point. Three jobs, in this order:
//
//  1. capture the page exactly as it was authored (KIT.PRISTINE_HTML) — publish
//     rebuilds from this, never from the live DOM;
//  2. provide KIT.module() / KIT.modules so module manifests can register
//     themselves, sorted by their `requires` (a missing one is a loud banner);
//  3. load the project (draft → embedded → content files → blank) and boot.
//
// Module manifests may be loaded before or after this file: KIT.module() is
// defined as soon as this script runs, and boot waits for DOMContentLoaded.
(function (root) {
  const KIT = root.KIT = root.KIT || {};

  // ---- 1. the pristine page ---------------------------------------------------
  try {
    if (typeof document !== 'undefined' && document.documentElement) {
      KIT.PRISTINE_HTML = '<!doctype html>\n' + document.documentElement.outerHTML;
    }
  } catch (e) { KIT.PRISTINE_HTML = null; }

  // ---- 2. modules -------------------------------------------------------------
  const defs = [];
  const loaded = [];

  /** KIT.module({ id, version, requires, register, save, content }) — called by a manifest at load time. */
  KIT.module = function (def) {
    if (!def || !def.id) throw new Error('KIT.module: a module needs an id');
    const i = defs.findIndex(d => d.id === def.id);
    if (i >= 0) defs[i] = def; else defs.push(def);
    return def;
  };

  KIT.modules = {
    /** all() -> every manifest seen, in load order. */
    all() { return defs.slice(); },
    /** loaded() -> the ones whose register() ran, in dependency order. */
    loaded() { return loaded.slice(); },
    get(id) { return defs.find(d => d.id === id) || null; },
    has(id) { return loaded.some(d => d.id === id); },
    /**
     * order(ids) -> { order, missing, cycles } — a topological sort of the manifests.
     * Pure, so the module test can check it without a page.
     */
    order(ids) {
      const wanted = ids ? defs.filter(d => ids.includes(d.id)) : defs.slice();
      const byId = new Map(wanted.map(d => [d.id, d]));
      const order = [], missing = [], cycles = [];
      const state = new Map();                 // id -> 'visiting' | 'done'
      const visit = (def, trail) => {
        if (state.get(def.id) === 'done') return;
        if (state.get(def.id) === 'visiting') { cycles.push(trail.concat(def.id).join(' → ')); return; }
        state.set(def.id, 'visiting');
        for (const req of def.requires || []) {
          const dep = byId.get(req);
          if (!dep) { missing.push({ module: def.id, requires: req }); continue; }
          visit(dep, trail.concat(def.id));
        }
        state.set(def.id, 'done');
        order.push(def);
      };
      for (const d of wanted) visit(d, []);
      return { order, missing, cycles };
    },
    /** activate(project) — register the modules this project enables, in dependency order. */
    activate(project) {
      const enabled = project && Array.isArray(project.modules) ? project.modules : defs.map(d => d.id);
      const { order, missing, cycles } = KIT.modules.order(enabled);
      for (const m of missing) banner(`The module “${m.module}” needs “${m.requires}”, which is not loaded.`);
      for (const c of cycles) banner(`The modules ${c} require each other in a circle.`);
      for (const def of order) {
        try {
          if (typeof def.register === 'function') def.register(KIT);
          loaded.push(def);
        } catch (e) {
          (KIT.log || console).error(`[module ${def.id}] register threw`, e);
          banner(`The module “${def.id}” failed to start: ${e.message}`);
        }
      }
      return loaded.slice();
    },
  };

  /** A banner nobody can miss: modules and boot failures must not fail silently. */
  function banner(text) {
    (KIT.log || console).error('[kit] ' + text);
    try {
      if (typeof document === 'undefined' || !document.body) return;
      let el = document.getElementById('kit-banner');
      if (!el) {
        el = document.createElement('div');
        el.id = 'kit-banner';
        el.setAttribute('role', 'alert');
        document.body.insertBefore(el, document.body.firstChild);
      }
      const line = document.createElement('div');
      line.textContent = text;
      el.appendChild(line);
    } catch (e) { /* the console warning already happened */ }
  }
  KIT.banner = banner;

  // ---- 3. load and boot --------------------------------------------------------
  async function start() {
    try {
      const { project, source, problems } = await KIT.storage.loadProject();
      (KIT.log || console).info(`[kit] project “${(project.meta && project.meta.title) || '?'}” from ${source}` +
        (KIT.storage.info().adapter ? ` · storage: ${KIT.storage.info().adapter}` : ''));
      for (const p of (problems || []).filter(p2 => p2.severity === 'error').slice(0, 3)) {
        (KIT.log || console).warn('[project]', p.code, p.message, p.where);
      }
      if (KIT.storage.warning) banner(KIT.storage.warning);
      KIT.modules.activate(project);
      await KIT.game.boot({ mount: document.getElementById('app') || document.body, project });
    } catch (e) {
      (KIT.log || console).error('[kit] boot failed', e);
      banner('The game could not start: ' + (e && e.message ? e.message : e));
    }
  }

  if (typeof document === 'undefined') return;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
