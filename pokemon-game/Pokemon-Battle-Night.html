<script>
// ---- js/kit/script/interpreter.js ----
// Interpreter (§9.6): runs command lists on threads. The MAIN thread is
// exclusive (a second main run waits its turn; input is locked by the runtime
// while one runs); BACKGROUND threads run `tick`/`parallel` scripts and may not
// use commands that need the main thread. Every random decision goes through
// ctx.rng, so a run is reproducible.
//
//   await KIT.interpreter.run(commands, ctx, { kind:'main'|'background' }) -> { status:'done'|'exit'|'cancelled', thread }
//   KIT.interpreter.fakeCtx({ answers:[1,0], vars:{…} })   a recording ctx for tests and headless play
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const CMD = KIT.commands;
  const C = KIT.conditions;
  const P = KIT.path;
  const I = KIT.interpreter = KIT.interpreter || {};

  class Cancelled extends Error { constructor() { super('cancelled'); this.name = 'Cancelled'; } }
  I.Cancelled = Cancelled;
  const threads = new Map();
  let nextId = 1;
  let mainChain = Promise.resolve();
  let mainActive = 0;

  function makeThread(kind, label) {
    const t = {
      id: nextId++, kind, label: label || '', background: kind === 'background', status: 'queued',
      cancelled: false, paused: false, stepping: false, breakpoints: new Set(), current: null, steps: 0,
      _wake: null,
      wake() { const w = t._wake; t._wake = null; if (w) w(); },
      pause() { t.paused = true; },
      resume() { t.paused = false; t.stepping = false; t.wake(); },
      step() { t.stepping = true; t.paused = false; t.wake(); },
      cancel() { t.cancelled = true; t.wake(); },
      async checkpoint(cmd, path, ctx) {
        t.current = { cmd, path };
        t.steps++;
        if (t.cancelled) throw new Cancelled();
        if (t.breakpoints.has(P.join(path)) || t.stepping) { t.paused = true; t.stepping = false; }
        if (typeof ctx.onStep === 'function') ctx.onStep(cmd, path, t);
        if (t.cancelled) throw new Cancelled();          // a cancel from the hook applies before this command runs
        while (t.paused) {
          await new Promise(res => { t._wake = res; });
          if (t.cancelled) throw new Cancelled();
        }
      },
    };
    return t;
  }

  /** The nested list `body` of `cmd` as a debugger path (by identity), e.g. [3,'then'] or [3,'options',1,'then']. */
  function blockPath(cmd, body, path) {
    for (const n of CMD.nested(cmd)) if (n.list === body) return path.concat(n.path);
    return path.concat('block');
  }

  async function execList(cmds, ctx, path, loop) {
    const labels = {};
    (cmds || []).forEach((c, i) => { if (KIT.isObject(c) && c.t === 'label' && !c.disabled && c.name) labels[c.name] = i; });
    let pc = 0;
    for (;;) {
      if (pc >= cmds.length) {
        if (loop && cmds.length) { pc = 0; continue; }
        return { kind: 'done' };
      }
      const cmd = cmds[pc];
      const p = path.concat(pc);
      await ctx.thread.checkpoint(cmd, p, ctx);
      const signal = await CMD.exec(ctx, cmd);
      if (signal && signal.kind) {
        if (signal.kind === 'block') {
          const r = await execList(signal.body || [], ctx, blockPath(cmd, signal.body, p), !!signal.loop);
          if (r.kind === 'break') { if (signal.loop) { pc++; continue; } return r; }
          if (r.kind === 'jump') { if (labels[r.label] != null) { pc = labels[r.label]; continue; } return r; }
          if (r.kind === 'exit') return r;
          pc++; continue;
        }
        if (signal.kind === 'break' || signal.kind === 'exit') return signal;
        if (signal.kind === 'jump') { if (labels[signal.label] != null) { pc = labels[signal.label]; continue; } return signal; }
        if (signal.kind === 'call') { await I.callScript(ctx, signal.script, signal.args, p); pc++; continue; }
      }
      pc++;
    }
  }

  /** callScript(ctx, id, args, path) — runs project.scripts[id].body on the SAME thread. `exit`/`break`/`jump` inside end only that script. */
  I.callScript = async function (ctx, id, args, path) {
    const script = ctx.project && ctx.project.scripts && ctx.project.scripts[id];
    if (!script) { (KIT.log || console).warn(`[interpreter] unknown script '${id}'`); return { kind: 'done' }; }
    const depth = (ctx.callDepth || 0) + 1;
    if (depth > 32) throw new Error(`interpreter: call depth exceeded at script '${id}'`);
    const merged = {};
    for (const name of script.params || []) merged[name] = args && args[name] !== undefined ? args[name] : null;
    Object.assign(merged, args || {});
    const child = Object.assign({}, ctx, { args: merged, scriptId: id, callDepth: depth });
    return execList(script.body || [], child, (path || []).concat('call:' + id));
  };

  /**
   * run(commands, ctx, { kind:'main'|'background', label, path, breakpoints:['2/then/0'] }) -> Promise<{ status, thread, signal }>
   * Main runs are serialised: a new main run starts when the previous one has ended.
   */
  I.run = function (cmds, ctx, opts) {
    opts = opts || {};
    const kind = opts.kind === 'background' ? 'background' : 'main';
    const thread = makeThread(kind, opts.label);
    for (const b of opts.breakpoints || []) thread.breakpoints.add(Array.isArray(b) ? P.join(b) : String(b));
    threads.set(thread.id, thread);
    const tctx = Object.assign({}, ctx || {}, { thread });
    const exec = async () => {
      if (thread.cancelled) { thread.status = 'cancelled'; threads.delete(thread.id); return { status: 'cancelled', thread }; }
      thread.status = 'running';
      if (kind === 'main') mainActive++;
      try {
        const r = await execList(cmds || [], tctx, opts.path || [], false);
        thread.status = 'done';

<script>
// ---- js/kit/world/map.js ----
// MapView (§8.2): the map as the runtime sees it — the authored map composed
// with the save's overlay (player-made changes), plus every spatial question
// the systems ask: what is here, can I walk there, which page of this object is
// active. Pure: no DOM, no canvas. The renderer and the systems read it.
//
//   const view = KIT.mapView(project, save, 'town')
//   view.passable(4, 5, 'down', hero) -> { ok, reason, hop:{x,y}, connection }
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const T = KIT.tiles;

  const DIRS = { up: { dx: 0, dy: -1, edge: 'n' }, down: { dx: 0, dy: 1, edge: 's' }, left: { dx: -1, dy: 0, edge: 'w' }, right: { dx: 1, dy: 0, edge: 'e' } };
  const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };
  const EDGE_OPPOSITE = { n: 's', s: 'n', e: 'w', w: 'e' };

  const LAYERS = ['ground', 'deco', 'above'];

   * mapView(project, save, mapId) -> view

  KIT.mapView = function mapView(project, save, mapId) {
    const map = project && project.maps ? project.maps[mapId] : null;
    if (!map) throw new Error(`mapView: unknown map '${mapId}'`);

    const objectState = (save && save.objects) || {};

    const index = (x, y) => y * width + x;

    /** The tile id on a layer, overlay first. `null` = nothing on that layer. */

    function blockedByEntity(x, y, who) {

      return { first, second: null, across: false };

// ---- js/kit/world/entities.js ----
// Entities (§8.2): heroes, NPCs, decorations and companions as plain objects,

  const KIT = root.KIT = root.KIT || {};

  const DIR_LIST = ['up', 'down', 'left', 'right'];

    if (!cached || cached.def !== def) {
      cached = { def, rows: frames[Math.min(seq, frames.length - 1)], palette: def.palette, mirror: e.dir === 'right', w: def.w || 16, h: def.h || 24 };
      frameCache.set(key, cached);
    }
    return cached;
  };
  E.clearFrameCache = () => frameCache.clear();

  // ---- move routes (§9.2) -----------------------------------------------------
  /**
   * startRoute(entity, steps, { wait, skipBlocked, repeat }) — a small state machine
   * stepped by E.updateRoute(entity, dt, view, ports). `entity.route.done` flips when finished.
   */
  E.startRoute = function (e, steps, opts) {
    opts = opts || {};
    e.route = { steps: (steps || []).slice(), i: 0, repeat: !!opts.repeat, skipBlocked: opts.skipBlocked !== false, done: false, wait: 0, stuck: 0 };
    return e.route;
  };
  E.stopRoute = function (e) { if (e.route) e.route.done = true; e.route = null; };

  /** One route step. `ports` may provide { sound(id), rng } and `world` the hero for towardHero/faceHero. */
  function applyStep(e, step, view, ports) {
    const [cmd, argRaw] = String(step).split(':');
    const arg = argRaw == null ? '' : argRaw;
    const hero = ports && ports.hero;
    const rng = (ports && ports.rng) || Math.random;
    switch (cmd) {
      case 'up': case 'down': case 'left': case 'right': return E.tryMove(e, cmd, view, { ignoreBlocked: true });
      case 'randomStep': return E.tryMove(e, DIR_LIST[Math.floor((rng.int ? rng.int(4) / 4 : rng()) * 4) % 4], view, { ignoreBlocked: true });
      case 'towardHero': return hero ? E.tryMove(e, E.dirToward(e, hero), view, { ignoreBlocked: true }) : { ok: false, reason: 'no-hero' };
      case 'awayHero': return hero ? E.tryMove(e, OPPOSITE[E.dirToward(e, hero)], view, { ignoreBlocked: true }) : { ok: false, reason: 'no-hero' };
      case 'face': if (DIRS[arg]) e.dir = arg; return { ok: true, reason: 'face' };
      case 'faceHero': if (hero) e.dir = E.dirToward(e, hero); return { ok: true, reason: 'face' };
      case 'turnRandom': e.dir = DIR_LIST[Math.floor((rng.int ? rng.int(4) / 4 : rng()) * 4) % 4]; return { ok: true, reason: 'face' };
      case 'jump': {
        const [jx, jy] = arg.split(',').map(Number);
        const tx = e.x + (jx || 0), ty = e.y + (jy || 0);
        e.mover = { moving: true, fromX: e.x, fromY: e.y, toX: tx, toY: ty, t: 0, duration: Math.max(0.2, Math.hypot(jx || 0, jy || 0) / Math.max(0.1, e.speed)), hop: true };
        e.x = tx; e.y = ty;
        return { ok: true, reason: 'jump' };
      }
      case 'wait': e.wait = (Number(arg) || 0) / 1000; return { ok: true, reason: 'wait' };
      case 'sprite': e.sprite = arg; return { ok: true, reason: 'sprite' };
      case 'speed': e.speed = Math.max(0.5, Number(arg) || E.DEFAULT_SPEED); return { ok: true, reason: 'speed' };
      case 'through': e.through = arg === 'on'; return { ok: true, reason: 'through' };
      case 'visible': e.visible = arg === 'on'; return { ok: true, reason: 'visible' };
      case 'dirFix': e.dirFix = arg === 'on'; return { ok: true, reason: 'dirFix' };
      case 'stepAnim': e.stepAnim = arg === 'on'; return { ok: true, reason: 'stepAnim' };
      case 'sound': if (ports && ports.sound) ports.sound(arg); return { ok: true, reason: 'sound' };
      default: return { ok: false, reason: 'unknown-step' };
    }
  }
  E.applyStep = applyStep;

  /** updateRoute(entity, dt, view, ports) -> true when the route finished this tick. */
  E.updateRoute = function (e, dt, view, ports) {
    const r = e.route;
    if (!r || r.done) return false;
    if (e.mover.moving || e.wait > 0) return false;
    if (r.i >= r.steps.length) {
      if (r.repeat && r.steps.length) r.i = 0;
      else { r.done = true; e.route = null; return true; }
    }
    const step = r.steps[r.i];
    const res = applyStep(e, step, view, ports);
    const isMove = ['up', 'down', 'left', 'right', 'randomStep', 'towardHero', 'awayHero'].includes(String(step).split(':')[0]);
    if (isMove && !res.ok) {
      if (r.skipBlocked) r.i++;                                    // skip it and carry on
      else { r.stuck++; if (r.stuck > 240) { r.done = true; e.route = null; return true; } }
      return false;
    }
    r.stuck = 0;
    r.i++;
    return false;
  };

  // ---- companion trail --------------------------------------------------------
  /**
   * A companion walks the leader's path one tile behind (HGSS style).
   * Call E.noteLeaderStep(companion, leader) whenever the leader finishes a step.
   */
  E.noteLeaderStep = function (comp, leader) {
    comp.data.trail = comp.data.trail || [];
    comp.data.trail.push({ x: leader.mover.fromX, y: leader.mover.fromY, dir: leader.dir });
    if (comp.data.trail.length > 8) comp.data.trail.shift();
  };
  /** updateCompanion(comp, leader, dt, view) — steps the companion toward the oldest trail tile. */
  E.updateCompanion = function (comp, leader, dt, view) {
    if (comp.mover.moving) return;
    const trail = comp.data.trail || [];
    while (trail.length && trail[0].x === comp.x && trail[0].y === comp.y) trail.shift();
    if (!trail.length) return;
    const target = trail[0];
    if (Math.abs(target.x - comp.x) + Math.abs(target.y - comp.y) > 3) {   // teleport if left far behind (a warp)
      comp.x = target.x; comp.y = target.y; comp.px = comp.x; comp.py = comp.y; trail.shift(); return;
    }
    const dir = E.dirToward(comp, target);
    const r = E.tryMove(comp, dir, view, { ignoreBlocked: true });
    if (!r.ok && !comp.through) { comp.through = true; E.tryMove(comp, dir, view, { ignoreBlocked: true }); comp.through = false; }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// ---- js/kit/world/world.js ----
// World (§8.2-§8.4): the live game — project + save + the current map view +
// entities + the event bus + the systems that run each tick. Headless: it talks
// to the outside only through the `ports` it is given (the same ports commands
// use), so a whole session can be played in Node with fake ports.
//
//   const world = KIT.world.create({ project, save, ports })
//   await world.enterMap('town', 5, 6, 'down')
//   world.update(1/60); world.interact(0)
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const E = KIT.entities;
  const I = KIT.interpreter;
  const C = KIT.conditions;
  const W = KIT.world = KIT.world || {};

  const SLOT_EVENTS = { interact: 'interact', step: 'step', touch: 'touch', enter: 'enter', tick: 'tick', init: 'init' };

  /** create({ project, save, ports, rng, events }) -> world */
  W.create = function (opts) {
    const project = opts.project;
    const save = opts.save;
    const ports = opts.ports || {};
    const events = opts.events || KIT.events('world');
    const rng = opts.rng || KIT.rng(save.seed || 1);

    const world = {
      project, save, events, rng, ports,
      map: null, entities: [], heroes: [], companion: null,
      viewport: Object.assign({ w: 16, h: 12 }, (project.settings && project.settings.viewport) || {}),   // live tiles on screen; the renderer updates it, the project is not touched
      activeEntity: null,          // the object whose script is running (ports read it to resolve target 'self')
      activeHero: 0, coop: !!(project.settings && project.settings.coop && project.settings.coop.enabled),
      busy: false,                 // a main-thread script is running: input is locked
      time: 0, systems: [],
      initDone: {},                // 'map:obj' -> true for this visit
      camera: { x: 0, y: 0 },
    };

    // ---- heroes ---------------------------------------------------------------
    function makeHeroes() {
      world.heroes = (project.heroes || []).map((h, i) => {
        const st = (save.heroes || [])[i] || {};
        return E.create({ id: h.id || `p${i + 1}`, kind: 'hero', x: st.x || 0, y: st.y || 0, dir: st.dir || 'down', sprite: h.sprite, speed: E.DEFAULT_SPEED, solid: true });
      });
    }
    makeHeroes();
    world.hero = (i) => world.heroes[i == null ? world.activeHero : i];
    world.heroById = (id) => world.heroes.find(h => h.id === id) || world.heroes[0];
    world.setActiveHero = (i) => { world.activeHero = KIT.clamp(i, 0, world.heroes.length - 1); events.emit('activeHero', { index: world.activeHero }); };

    // ---- map entry -------------------------------------------------------------
    /** Build the entity list for the current map from each object's active page. */
    function buildEntities() {
      const view = world.map;
      const list = [];
      for (const obj of view.objects) {
        if (view.isHidden(obj)) continue;
        const active = view.activePage(obj, world.ctxBase());
        if (!active) continue;
        const page = active.page;
        const pos = view.positionOf(obj);
        const e = E.create({
          id: obj.id, kind: obj.type === 'npc' ? 'npc' : 'look', objectKey: view.objectKey(obj), pageIndex: active.index,
          x: pos.x, y: pos.y, dir: pos.dir || page.dir, sprite: page.sprite, look: (page.props && page.props.look) || null,
          layer: page.layer, through: page.through, dirFix: page.dirFix, stepAnim: page.stepAnim, visible: page.visible,
          solid: page.layer === 'same' && !page.through, behaviour: page.behaviour || { kind: 'none' },
        });
        e.object = obj; e.page = page;
        list.push(e);
      }
      world.entities = list;
      refreshBlockers();
    }
    function refreshBlockers() {
      if (world.map) world.map.setBlockers(world.entities.concat(world.heroes.filter(h => h.visible)));
    }
    world.rebuildEntities = buildEntities;

    /** Re-evaluate every object's active page (after a var/self change) without losing positions. */
    function refreshPages() {
      const view = world.map;
      if (!view) return;
      let changed = false;
      const kept = [];
      for (const obj of view.objects) {
        const existing = world.entities.find(e => e.object === obj);
        if (view.isHidden(obj)) { if (existing) changed = true; continue; }
        const active = view.activePage(obj, world.ctxBase());
        if (!active) { if (existing) changed = true; continue; }
        if (existing && existing.pageIndex === active.index) { kept.push(existing); continue; }
        changed = true;
        const pos = existing ? { x: existing.x, y: existing.y, dir: existing.dir } : view.positionOf(obj);
        const page = active.page;
        const e = E.create({ id: obj.id, kind: obj.type === 'npc' ? 'npc' : 'look', objectKey: view.objectKey(obj), pageIndex: active.index,
          x: pos.x, y: pos.y, dir: pos.dir || page.dir, sprite: page.sprite, look: (page.props && page.props.look) || null,
          layer: page.layer, through: page.through, dirFix: page.dirFix, stepAnim: page.stepAnim, visible: page.visible,
          solid: page.layer === 'same' && !page.through, behaviour: page.behaviour || { kind: 'none' } });
        e.object = obj; e.page = page;
        kept.push(e);
      }
      if (changed) { world.entities = kept; refreshBlockers(); }
    }
    world.refreshPages = refreshPages;

    /** enterMap(id, x, y, dir) -> Promise: swaps the map, places the heroes, runs init/enter slots. */
    world.enterMap = async function (mapId, x, y, dir, opts) {
      const from = world.map ? world.map.id : null;
      if (from) { for (const s of world.systems) if (s.onMapLeave) s.onMapLeave(world); events.emit('mapLeave', { map: from }); }
      world.map = KIT.mapView(project, save, mapId);
      world.initDone = {};
      const places = (opts && opts.heroes) || null;    // restoring a save may put each hero back on its own tile
      world.heroes.forEach((h, i) => {
        const at = places && places[i] ? places[i] : { x, y, dir };
        h.x = at.x; h.y = at.y; h.px = at.x; h.py = at.y; h.dir = at.dir || dir || h.dir; h.mover.moving = false;
      });
      if (world.heroes[1]) { world.heroes[1].data.trail = []; }
      if (world.companion) { world.companion.x = x; world.companion.y = y; world.companion.px = x; world.companion.py = y; world.companion.data.trail = []; }
      buildEntities();
      saveHeroPositions();
      for (const s of world.systems) if (s.onMapEnter) s.onMapEnter(world);
      events.emit('mapEnter', { map: mapId, from });
      if (ports.audio && project.maps[mapId] && project.maps[mapId].music !== undefined) {
        const track = project.maps[mapId].music;
        if (track && world.currentMusic !== track) { world.currentMusic = track; ports.audio.music(track, { fade: 300 }); }
      }
      await runSlotsForMap('init');
      await runSlotsForMap('enter');
      return world.map;
    };

    function saveHeroPositions() {
      save.heroes = world.heroes.map((h, i) => Object.assign({}, (save.heroes || [])[i] || {}, { map: world.map ? world.map.id : null, x: h.x, y: h.y, dir: h.dir }));
    }
    world.saveHeroPositions = saveHeroPositions;

    // ---- scripts ---------------------------------------------------------------
    /** The base ctx for conditions (no object bound). */
    world.ctxBase = () => ({ world, project, save, hero: world.hero() ? world.hero().id : 'p1', coop: world.coop, input: ports.input || { pressed: () => false } });
    /** makeCtx(entity, heroId) -> the RunCtx commands use (§9.1). */
    world.makeCtx = function (entity, heroId) {
      const ctx = {
        project, world, save, rng: world.rng,
        self: entity && entity.objectKey ? entity.objectKey : null,
        hero: heroId || (world.hero() ? world.hero().id : 'p1'),
        entity: entity || null,
        emit(event, payload) { events.emit(event, payload); },
      };
      for (const group of ['io', 'audio', 'screen', 'pictures', 'map', 'game']) ctx[group] = ports[group] || {};
      ctx.input = ports.input || { pressed: () => false };      // the `button` condition kind
      return ctx;
    };

    /** runSlot(entity, slot, heroId) -> Promise. Main-thread slots lock input; `tick` runs in the background. */
    world.runSlot = async function (entity, slot, heroId) {
      const page = entity && entity.page;
      if (!page || !page.on || !Array.isArray(page.on[slot]) || !page.on[slot].length) return null;
      const key = entity.objectKey;
      if (page.once && slot !== 'tick' && slot !== 'init') {
        const st = save.objects && save.objects[key];
        if (st && st.self && st.self.done) return null;
      }
      if (page.needsBoth && !bothHeroesAdjacent(entity)) {
        events.emit('needsBoth', { object: key });
        if (ports.io && ports.io.toast) await ports.io.toast({ text: KIT.strings.get(project, 'needs-both') });
        return null;
      }
      const ctx = world.makeCtx(entity, heroId);
      const background = slot === 'tick';
      const previousActive = world.activeEntity;
      if (!background) {
        if (world.busy) return null;
        world.busy = true;
        world.activeEntity = entity;          // ports resolve target 'self' through this
        if (entity.kind === 'npc' && !entity.dirFix && slot === 'interact') {
          const h = world.heroById(ctx.hero);
          entity.data.resumeDir = entity.dir;
          E.faceToward(entity, h);
        }
      }
      try {
        const r = await I.run(page.on[slot], ctx, { kind: background ? 'background' : 'main', label: `${key}:${slot}`, path: [key, slot] });
        if (page.once && slot !== 'tick' && slot !== 'init') KIT.commands.state.setSelf(ctx, 'done', true, key);
        return r;
      } finally {
        if (!background) {
          world.busy = false;
          world.activeEntity = previousActive;
          if (entity.data.resumeDir) { entity.dir = entity.data.resumeDir; entity.data.resumeDir = null; }
          refreshPages();
        }
      }
    };
    function bothHeroesAdjacent(entity) {
      if (!world.coop || world.heroes.length < 2) return true;
      return world.heroes.every(h => Math.abs(h.x - entity.x) + Math.abs(h.y - entity.y) <= 1);
    }

    async function runSlotsForMap(slot) {
      for (const e of world.entities.slice()) {
        if (slot === 'init') {
          const k = `${world.map.id}:${e.id}`;
          if (world.initDone[k]) continue;
          world.initDone[k] = true;
        }
        await world.runSlot(e, slot, world.hero() ? world.hero().id : 'p1');
      }
    }
    world.runSlotsForMap = runSlotsForMap;

    /** interact(heroIndex) -> Promise<boolean> — the A button. */
    world.interact = async function (heroIndex) {
      if (world.busy) return false;
      const h = world.hero(heroIndex);
      if (!h || h.mover.moving) return false;
      const t = world.map.interactTarget(h.x, h.y, h.dir);
      if (!t) return false;
      const spots = [t.first].concat(t.second ? [t.second] : []);
      for (const spot of spots) {
        const hit = world.entities.find(e => e.x === spot.x && e.y === spot.y && e.page && e.page.on && e.page.on.interact);   // invisible events still react (MV transparency)
        if (hit) { await world.runSlot(hit, 'interact', h.id); return true; }
      }
      // an object under the hero's own feet (a sign mat, an item) may also react
      const under = world.entities.find(e => e.x === h.x && e.y === h.y && e.layer === 'below' && e.page && e.page.on && e.page.on.interact);
      if (under) { await world.runSlot(under, 'interact', h.id); return true; }
      return false;
    };

    /** move(heroIndex, dir, opts) -> Promise<result> — the d-pad. Handles step triggers, connections and warps. */
    world.move = async function (heroIndex, dir, opts) {
      if (world.busy) return { ok: false, reason: 'busy' };
      const h = world.hero(heroIndex);
      if (!h || h.mover.moving) return { ok: false, reason: 'busy' };
      const r = E.tryMove(h, dir, world.map, opts || {});
      if (r.reason === 'connection') {
        const c = r.connection;
        await world.enterMap(c.map, c.x, c.y, dir);
        return r;
      }
      if (!r.ok) { if (ports.audio && ports.audio.play && r.reason !== 'turn') ports.audio.play('bump'); return r; }
      if (world.companion) E.noteLeaderStep(world.companion, h);
      if (world.heroes[1] && heroIndex === world.activeHero && !world.coop) E.noteLeaderStep(world.heroes[1], h);
      refreshBlockers();
      saveHeroPositions();
      save.steps = (save.steps || 0) + 1;
      const flags = world.map.flagsAt(h.x, h.y);
      events.emit('step', { hero: h.id, heroIndex: heroIndex == null ? world.activeHero : heroIndex, x: h.x, y: h.y, map: world.map.id, tile: flags, region: world.map.region(h.x, h.y) });
      await world.stepTriggers(h);
      return r;
    };

    /** Fires `step` slots for whatever the hero landed on, and the built-in behaviour of warp/item objects. */
    world.stepTriggers = async function (h) {
      const hits = world.entities.filter(e => e.x === h.x && e.y === h.y);
      for (const e of hits) {
        const type = e.object && e.object.type;
        if (type === 'warp') { if (await world.doWarp(e, h)) return; }
        else if (type === 'item') await world.doPickup(e, h);
        if (e.page && e.page.on && e.page.on.step) await world.runSlot(e, 'step', h.id);
      }
    };
    /** A `warp` object carries its destination in props.to — no script needed. */
    world.doWarp = async function (e, h) {
      const to = e.page && e.page.props && e.page.props.to;
      if (!to || !to.map || !project.maps[to.map]) return false;
      if (ports.audio && ports.audio.play && e.page.props.sound !== null) ports.audio.play(e.page.props.sound || 'door');
      if (ports.map && ports.map.transfer) await ports.map.transfer({ map: to.map, x: to.x || 0, y: to.y || 0, dir: to.dir || h.dir, fade: e.page.props.fade !== false });
      else await world.enterMap(to.map, to.x || 0, to.y || 0, to.dir || h.dir);
      return true;
    };
    /** An `item` object gives its item once and disappears for good. */
    world.doPickup = async function (e, h) {
      const props = (e.page && e.page.props) || {};
      if (!props.item) return false;
      const st = save.objects && save.objects[e.objectKey];
      if (st && st.self && st.self.done) return false;
      const ctx = world.makeCtx(e, h.id);
      const count = props.count == null ? 1 : props.count;
      KIT.commands.state.give(ctx, props.item, count);
      KIT.commands.state.setSelf(ctx, 'done', true, e.objectKey);
      if (ports.audio && ports.audio.play) ports.audio.play('item');
      if (ports.io && ports.io.toast) await ports.io.toast({ text: KIT.strings.get(project, 'got-item', { count, item: (project.items[props.item] && project.items[props.item].name) || props.item }) });
      save.objects[e.objectKey].hidden = true;
      events.emit('objectStateChanged', { objectKey: e.objectKey });
      return true;
    };

    // ---- systems ---------------------------------------------------------------
    world.systems = (KIT.registry.exists('systems') ? KIT.registry('systems').list() : []).slice().sort((a, b) => (a.order || 50) - (b.order || 50));
    world.update = function (dt) {
      world.time += dt;
      for (const s of world.systems) { try { s.update(world, dt); } catch (e) { (KIT.log || console).error(`[system ${s.id}]`, e); } }
    };

    // Keep pages fresh when the story state changes.
    events.on('varChanged', refreshPages);
    events.on('selfChanged', refreshPages);
    events.on('objectStateChanged', () => { buildEntities(); });

    return world;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// ---- js/kit/systems/index.js ----
// The standard systems (§8.3): they run every tick in `order`. Each is a
// registry entry so a module can add its own (encounters, weather, jobs...).
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const E = KIT.entities;
  const reg = KIT.registry('systems');

  // --- 10 movement: interpolation, arrivals, hero touch checks -------------------
  const routePorts = (world) => ({ hero: world.hero(), rng: world.rng, sound: (id) => world.ports.audio && world.ports.audio.play && world.ports.audio.play(id) });
  reg.add({ id: 'movement', order: 10, update(world, dt) {
    for (const h of world.heroes) { E.update(h, dt); if (h.route) E.updateRoute(h, dt, world.map, routePorts(world)); }
    if (world.companion) E.update(world.companion, dt);
    for (const e of world.entities) {
      const arrived = E.update(e, dt);
      if (e.route) E.updateRoute(e, dt, world.map, routePorts(world));   // routes started by the moveRoute command or a behaviour
      if (arrived && e.kind === 'npc') {
        const hit = world.heroes.find(h => h.x === e.x && h.y === e.y);
        if (hit && e.page && e.page.on && e.page.on.touch && !world.busy) world.runSlot(e, 'touch', hit.id);
      }
    }
  } });

  // --- 20 behaviours: autonomous movement ---------------------------------------
  const bhv = KIT.registry('behaviours');
  bhv.add({ id: 'none', label: 'Stay put', fields: [], update() {} });
  bhv.add({ id: 'look', label: 'Look around', fields: [{ key: 'frequency', type: 'number', min: 1, max: 9, default: 3 }],
    update(e, world, dt) {
      e.data.timer = (e.data.timer || 0) - dt;
      if (e.data.timer > 0) return;
      e.data.timer = 1 + world.rng() * (10 - (e.behaviour.frequency || 3));
      if (!e.dirFix) e.dir = ['up', 'down', 'left', 'right'][world.rng.int(4)];
    } });
  bhv.add({ id: 'wander', label: 'Wander', fields: [{ key: 'radius', type: 'number', min: 1, max: 12, default: 3 }, { key: 'frequency', type: 'number', min: 1, max: 9, default: 3 }],
    update(e, world, dt) {
      if (e.mover.moving) return;
      e.data.timer = (e.data.timer || 0) - dt;
      if (e.data.timer > 0) return;
      e.data.timer = 0.8 + world.rng() * (10 - (e.behaviour.frequency || 3)) * 0.3;
      const radius = e.behaviour.radius == null ? 3 : e.behaviour.radius;
      const dir = ['up', 'down', 'left', 'right'][world.rng.int(4)];
      const d = KIT.delta(dir);
      if (Math.abs(e.home.x - (e.x + d.dx)) > radius || Math.abs(e.home.y - (e.y + d.dy)) > radius) { if (!e.dirFix) e.dir = dir; return; }
      E.tryMove(e, dir, world.map, { ignoreBlocked: true });
    } });
  bhv.add({ id: 'route', label: 'Follow a route', fields: [{ key: 'route', type: 'route', default: [] }, { key: 'repeat', type: 'bool', default: true }],
    update(e, world, dt) {
      if (!e.route && !e.data.routeDone) E.startRoute(e, e.behaviour.route || [], { repeat: e.behaviour.repeat !== false, skipBlocked: true });
      // the movement system steps it
    } });
  bhv.add({ id: 'approach', label: 'Approach the player', fields: [{ key: 'frequency', type: 'number', min: 1, max: 9, default: 5 }],
    update(e, world, dt) {
      if (e.mover.moving) return;
      e.data.timer = (e.data.timer || 0) - dt;
      if (e.data.timer > 0) return;
      e.data.timer = 0.5 + world.rng() * 0.5;

    } });
  reg.add({ id: 'behaviours', order: 20, update(world, dt) {
    if (world.busy) return;
    for (const e of world.entities) {
      const kind = (e.behaviour && e.behaviour.kind) || 'none';
      const def = bhv.get(kind);
      if (def && def.update) { try { def.update(e, world, dt); } catch (err) { (KIT.log || console).error(`[behaviour ${kind}]`, err); } }
    }
  } });

  // --- 30 triggers: tick slots (background threads), throttled per object ---------
  reg.add({ id: 'triggers', order: 30, update(world) {
    for (const e of world.entities) {
      if (!e.page || !e.page.on || !Array.isArray(e.page.on.tick) || !e.page.on.tick.length) continue;
      if (e.data.tickRunning) continue;
      e.data.tickRunning = true;
      Promise.resolve(world.runSlot(e, 'tick', world.hero() ? world.hero().id : 'p1'))
        .catch(err => (KIT.log || console).error('[tick]', err))
        .then(() => { e.data.tickRunning = false; });
    }
  } });

  // --- 40 companions -------------------------------------------------------------
  reg.add({ id: 'companions', order: 40, update(world, dt) {
    const lead = world.hero();
    if (world.companion && lead) E.updateCompanion(world.companion, lead, dt, world.map);
    if (!world.coop && world.heroes[1] && lead && world.heroes[1] !== lead) E.updateCompanion(world.heroes[1], lead, dt, world.map);
  } });

  // --- 50 clock -------------------------------------------------------------------
  reg.add({ id: 'clock', order: 50, update(world, dt) {
    const s = (world.project.settings && world.project.settings.clock) || {};
    if (!s.enabled) return;
    const save = world.save;
    save.clock = save.clock || { day: 1, minutes: 480, lastSeenAt: null };
    const perSecond = s.minutesPerSecond || 0;

  // --- 90 camera -------------------------------------------------------------------
  KIT.camera = {
    /** Centre on an entity, clamped to the map; smaller maps are centred. */
    update(world) {

      if (!view) return world.camera;
      const vp = world.viewport || (world.project.settings && world.project.settings.viewport) || { w: 16, h: 12 };
      const h = world.hero();
      let cx = (h ? h.px : 0) + 0.5 - vp.w / 2;
      let cy = (h ? h.py : 0) + 0.5 - vp.h / 2;
      cx = view.width <= vp.w ? (view.width - vp.w) / 2 : KIT.clamp(cx, 0, view.width - vp.w);

<script>
// ---- js/kit/render/renderer.js ----
// KIT.renderer (§8.5): one canvas, drawn from the world every frame.
//
// The map is slow-moving, so each map keeps offscreen canvases — one per tile
// layer — drawn once at an integer pixel scale and blitted each frame;
// animated tiles are left out of them and painted per frame. Entities are
// sorted by their interpolated `py` so a character lower on the screen covers
// one higher up, the `above` tile layer goes over everybody, and KIT.fx paints
// fade / tint / flash / shake / weather on top.
//
//   const r = KIT.renderer.create({ canvas, project })
//   r.resize(); r.render(world)
//   r.invalidate('town', 4, 7)     // one cell changed (paint, overlay, editor)
//
// Missing art is normal: a tile or sprite with no registered art is drawn as a
// KIT.pixels.silhouette in a colour derived from its id, never as an error.
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const R = KIT.renderer = KIT.renderer || {};

  const LAYERS = ['ground', 'deco', 'above'];
  const ZOOM = { small: 0.8, normal: 1, large: 1.25, auto: 1 };
  const MAX_CACHE_PX = 8192;                   // bigger maps are drawn cell by cell

  const spriteArts = new WeakMap();            // frame.rows -> art object (stable identity = cached canvases)
  const missingArts = new Map();               // id -> silhouette art

  /** A stable colour for a thing with no art, so the same id always looks the same. */
  function colorFor(id, alt) {
    const h = KIT.hash(String(id || 'x')) % 360;
    return hsl(h, alt ? 35 : 55, alt ? 40 : 58);
  }
  function hsl(h, s, l) {
    s /= 100; l /= 100;
    const k = (n) => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const to = (v) => Math.round(v * 255).toString(16).padStart(2, '0');
    return `#${to(f(0))}${to(f(8))}${to(f(4))}`;
  }
  function missingArt(id, w, h, alt) {
    const key = `${id}|${w}x${h}|${alt ? 1 : 0}`;
    let a = missingArts.get(key);
    if (!a) { a = KIT.pixels.silhouette(w, h, colorFor(id, alt)); missingArts.set(key, a); }
    return a;
  }

  /** create({ canvas, project }) -> renderer */
  R.create = function (opts) {
    const canvas = opts.canvas;
    const ctx = canvas.getContext('2d');
    let project = opts.project;
    const TILE = () => ((project.settings && project.settings.tileSize) || 16);

    let dpr = 1, scale = 2, tilePx = 32;        // device pixels per art pixel / per tile
    const caches = new Map();                    // mapId -> { canvases, animated, scale, w, h, cached }
    let recolor = null, recolorKey = '';
    const weatherBits = [];

    const settings = () => (KIT.storage && KIT.storage.settings ? KIT.storage.settings() : {});

    function tileDef(id) { return id == null ? null : (KIT.registry.exists('tiles') ? KIT.registry('tiles').get(id) : null); }
    function tileArt(def) { return KIT.pixels.artOf(def) || def; }
    function tileFrames(def) {
      const a = tileArt(def);
      return a && Array.isArray(a.frames) ? a.frames.length : 1;
    }

    /** The palette remap from settings.palette.remap ({ '#from': '#to' }), rebuilt when it changes. */
    function updateRecolor() {
      const p = (project.settings && project.settings.palette) || {};
      const map = p.remap || {};
      const k = JSON.stringify(map);
      if (k === recolorKey) return;
      recolorKey = k;
      const list = Object.keys(map).map(from => ({ from, to: map[from] }));
      recolor = list.length ? list : null;
      caches.clear();

    // ---- sizing ----------------------------------------------------------------
    /** resize() — match the canvas to its CSS box and choose an integer tile scale. */
    function resize() {
      dpr = Math.max(1, Math.min(3, (root.devicePixelRatio || 1)));
      const cssW = Math.max(64, canvas.clientWidth || canvas.parentNode && canvas.parentNode.clientWidth || 320);
      const cssH = Math.max(64, canvas.clientHeight || 240);
      const zoomName = (settings().zoom && settings().zoom !== 'auto') ? settings().zoom : ((project.settings && project.settings.zoom) || 'auto');
      const zoom = ZOOM[zoomName] || 1;
      const wantCss = (cssW < 600 ? 40 : 48) * zoom;
      const next = Math.max(1, Math.min(8, Math.round(wantCss * dpr / TILE())));
      baseScale = next;
      if (next !== scale) { scale = next; caches.clear(); }

    /** viewTiles() -> how many whole tiles fit on screen right now. */
    function viewTiles() {
      return { w: Math.max(1, Math.ceil(canvas.width / tilePx)), h: Math.max(1, Math.ceil(canvas.height / tilePx)) };
    }

    // ---- per-map layer caches ---------------------------------------------------
    function cacheFor(view) {
      let c = caches.get(view.id);
      if (c && c.scale === scale && c.w === view.width && c.h === view.height) return c;
      c = buildCache(view);
      caches.set(view.id, c);
      return c;
    }
    function buildCache(view) {
      const wpx = view.width * tilePx, hpx = view.height * tilePx;
      const cached = wpx <= MAX_CACHE_PX && hpx <= MAX_CACHE_PX;
      const c = { scale, w: view.width, h: view.height, cached, canvases: {}, animated: [] };
      if (!cached) return c;
      for (const layer of LAYERS) {
        const cv = document.createElement('canvas');
        cv.width = wpx; cv.height = hpx;
        const g = cv.getContext('2d');
        g.imageSmoothingEnabled = false;
        c.canvases[layer] = cv;
      }
      for (let y = 0; y < view.height; y++) for (let x = 0; x < view.width; x++) paintCell(c, view, x, y);
      return c;
    }
    /** Paint one cell into the cached layer canvases (and remember animated cells). */
    function paintCell(c, view, x, y) {
      if (c.animated.length) c.animated = c.animated.filter(a => !(a.x === x && a.y === y));
      for (const layer of LAYERS) {
        const g = c.canvases[layer].getContext('2d');
        g.clearRect(x * tilePx, y * tilePx, tilePx, tilePx);
        const id = view.tileAt(layer, x, y);
        if (id == null) continue;
        const def = tileDef(id);
        if (def && tileFrames(def) > 1) { c.animated.push({ x, y, layer, id }); continue; }
        drawTileTo(g, id, def, x * tilePx, y * tilePx, 0);
      }
    }
    function drawTileTo(g, id, def, dx, dy, frame) {
      if (!def) { KIT.pixels.draw(g, missingArt(id, TILE(), TILE(), true), dx, dy, { scale }); return; }
      KIT.pixels.draw(g, tileArt(def), dx, dy, { scale, frame: frame || 0, recolor });
    }

    /** invalidate(mapId, x, y) — one cell (or the whole map when x is omitted). */
    function invalidate(mapId, x, y) {
      if (mapId == null) { caches.clear(); return; }
      const c = caches.get(mapId);
      if (!c) return;
      if (x == null) { caches.delete(mapId); return; }
      c.dirty = c.dirty || [];
      c.dirty.push({ x, y });
    }

    // ---- entities ---------------------------------------------------------------
    function artForFrame(frame) {
      let a = spriteArts.get(frame.rows);
      if (!a) {
        a = { w: frame.w || 16, h: frame.h || 24, palette: frame.palette || {}, rows: frame.rows };
        spriteArts.set(frame.rows, a);

    /**
     * What to draw for an entity: its sprite frame, else the `look` tile a sign

     * and nothing at all for an event with no look of its own (a trigger).
     */
    function lookOf(e) {
      const frame = KIT.entities.frame(e);

      if (e.look) {

    }

    function drawEntity(e, view, camX, camY) {
      if (e.visible === false || e.opacity === 0) return;
      const look = lookOf(e);
      if (!look) return;
      const art = look.art;
      const dims = KIT.pixels.dims(art);
      const sx = Math.round((e.px - camX) * tilePx + (tilePx - dims.w * scale) / 2);
      const sy = Math.round((e.py - camY) * tilePx + (look.tile ? 0 : tilePx - dims.h * scale));
      const bush = view.flagsAt(Math.round(e.px), Math.round(e.py)).bush;

      if (alpha < 1) ctx.globalAlpha = alpha;
      if (bush) {
        ctx.beginPath();
        ctx.rect(sx - scale, sy, dims.w * scale + scale * 2, Math.max(1, dims.h * scale - 5 * scale));
        ctx.clip();

      ctx.restore();
      if (e.data && e.data.balloon) drawBalloon(e, sx + dims.w * scale / 2, sy);
    }

    const BALLOON_MS = 1200;
    function drawBalloon(e, cx, topY) {
      const b = e.data.balloon;
      const t = (root.performance ? performance.now() : Date.now()) - (b.start || 0);
      if (t > (b.ms || BALLOON_MS)) { e.data.balloon = null; return; }

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#2b2b3a';

      ctx.arcTo(x + w, y + h, x, y + h, r);

        ctx.globalAlpha = p.opacity == null ? 1 : p.opacity;

    }

      const count = Math.round((w.power || 5) * 12);
      const t = (root.performance ? performance.now() : Date.now()) / 1000;
      while (weatherBits.length < count) weatherBits.push({ x: Math.random(), y: Math.random(), s: 0.5 + Math.random() });
      ctx.save();
      if (w.kind === 'fog') {
        ctx.globalAlpha = 0.28 + 0.05 * Math.sin(t / 2);
        ctx.fillStyle = '#dfe6ee';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.strokeStyle = w.kind === 'snow' ? '#ffffff' : '#a8c8ff';
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = 0.7;
        ctx.lineWidth = Math.max(1, scale);
        for (let i = 0; i < count; i++) {
          const b = weatherBits[i];

          const y = ((b.y + t * speed * b.s) % 1) * canvas.height;
          const x = ((b.x + (w.kind === 'snow' ? Math.sin(t + i) * 0.01 : 0)) % 1) * canvas.width;

    function render(world) {

      ctx.save();

      ctx.fillStyle = '#10121a';
      ctx.fillRect(0, 0, W, H);
      const view = world && world.map;
      if (!view) { ctx.restore(); return; }

      if (view.id !== fittedMap) { fitScale(view); fittedMap = view.id; }
      const c = cacheFor(view);
      if (c.dirty && c.cached) { for (const d of c.dirty) paintCell(c, view, d.x, d.y); c.dirty = null; }

      const shake = KIT.fx && KIT.fx.state().shake;
      const camX = world.camera.x - (shake ? shake.x / tilePx : 0);
      const camY = world.camera.y - (shake ? shake.y / tilePx : 0);
      const ox = -Math.round(camX * tilePx), oy = -Math.round(camY * tilePx);
      const time = world.time != null ? world.time * 1000 : (root.performance ? performance.now() : 0);

      // tile layers (cached) — ground and deco under the characters
      blit(c, view, 'ground', ox, oy);
      blit(c, view, 'deco', ox, oy);
      drawAnimated(c, view, ox, oy, time, ['ground', 'deco']);

      // characters
      const all = world.entities.concat(world.heroes.filter(h => h.visible !== false));
      if (world.companion) all.push(world.companion);
      const below = [], same = [], above = [];
      for (const e of all) (e.layer === 'below' ? below : e.layer === 'above' ? above : same).push(e);
      const byY = (a, b) => (a.py - b.py) || (a.y - b.y);
      below.sort(byY); same.sort(byY); above.sort(byY);
      for (const e of below) drawEntity(e, view, camX, camY);
      for (const e of same) drawEntity(e, view, camX, camY);

      // the `above` tile layer covers characters (treetops, roofs, bridges)
      blit(c, view, 'above', ox, oy);
      drawAnimated(c, view, ox, oy, time, ['above']);
      for (const e of above) drawEntity(e, view, camX, camY);

      drawPictures();
      drawOverlays(world);
      ctx.restore();
    }

    function blit(c, view, layer, ox, oy) {
      if (c.cached) { ctx.drawImage(c.canvases[layer], ox, oy); return; }
      // Uncached (very large map): draw only the visible cells.
      const vt = viewTiles();
      const x0 = Math.max(0, Math.floor(-ox / tilePx)), y0 = Math.max(0, Math.floor(-oy / tilePx));
      for (let y = y0; y < Math.min(view.height, y0 + vt.h + 1); y++) {
        for (let x = x0; x < Math.min(view.width, x0 + vt.w + 1); x++) {
          const id = view.tileAt(layer, x, y);
          if (id == null) continue;
          drawTileTo(ctx, id, tileDef(id), ox + x * tilePx, oy + y * tilePx, 0);
        }
      }
    }

// ---- js/kit/scenes/dialogue.js ----
// The message scenes: dialogue (Show Text), choice, nameEntry, inputNumber,
// scrollText, chapter and toast. They are DOM overlays over the canvas (§12),
// so text is real text — selectable, scalable, and readable on a phone.
//
// Everything a message can contain comes from KIT.text: the wrap/paginate pass
// uses the real font metrics of the box, and the typewriter walks the spans so
// {pause}, {wait}, {fast}, {color:…}, {icon:…} and {shake} all work.
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const UI = KIT.ui;
  const scenes = KIT.registry('scenes');

  const SPEEDS = { slow: 22, normal: 48, fast: 96, instant: 0 };
  const LINES_PER_PAGE = 3;

  function settings() { return (KIT.storage && KIT.storage.settings) ? KIT.storage.settings() : {}; }
  function instant() { return !!(KIT.fx && KIT.fx.instant) || settings().textSpeed === 'instant'; }

    if (instant()) return 0;
    return SPEEDS[settings().textSpeed] == null ? SPEEDS.normal : SPEEDS[settings().textSpeed];
  }

  /** A measuring context that uses the element's real font, so wrapping matches what you see. */
  let measureCtx = null;

    if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
    const cs = getComputedStyle(el);
    measureCtx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const letter = parseFloat(cs.letterSpacing) || 0;
    return (s) => measureCtx.measureText(s).width + letter * s.length;
  }

  /** The dialogue box markup, built once and reused. */
  function dialogueBox() {
    const host = UI.el('dialogue');
    if (!host) return null;
    if (!host.firstChild) {
      host.innerHTML = '';
      const box = UI.make('div.kit-box');
      box.appendChild(UI.make('div.kit-facebox'));
      const wrap = UI.make('div.kit-textwrap');
      wrap.appendChild(UI.make('div.kit-name'));
      wrap.appendChild(UI.make('div.kit-text'));
      box.appendChild(wrap);
      box.appendChild(UI.make('div.kit-next', { text: '▼' }));
      host.appendChild(box);
    }
    return {
      host,
      box: host.querySelector('.kit-box'),
      face: host.querySelector('.kit-facebox'),
      name: host.querySelector('.kit-name'),
      text: host.querySelector('.kit-text'),
      next: host.querySelector('.kit-next'),
    };
  }

  function faceArt(id) {
    if (!id) return null;
    for (const regName of ['faces', 'sprites', 'icons']) {
      if (!KIT.registry.exists(regName)) continue;
      const def = KIT.registry(regName).get(id);
      if (!def) continue;
      const art = KIT.pixels.artOf(def);
      if (art) return art;
      if (def.frames && def.frames.down) return { w: def.w || 16, h: def.h || 24, palette: def.palette, rows: def.frames.down[0] };

    id: 'dialogue', name: 'Message',

        units = []; unitIndex = 0; charIndex = 0; acc = 0; complete = false; waiting = false; speed = 1; pauseLeft = 0;

            if (span.type === 'text') {

              if (span.size === 'big') el.classList.add('is-big');

              lineEl.appendChild(el);

          ui.face.hidden = !p.face;

            if (pageIndex < pages.length - 1) { pageIndex++; buildPage(pages[pageIndex]); return true; }
            this.finish(true);
            return true;
          }
          if (ev.key === 'b') { if (!complete || waiting) { waiting = false; revealAll(); } return true; }
          return true;
        },
      };
    },
  });

  // ---- choice ---------------------------------------------------------------------
  scenes.add({
    id: 'choice', name: 'Choices',
    create() {
      let host = null, index = 0, options = [];
      return {
        id: 'choice', transparent: true,
        enter(params) {

          this._cancel = p.cancel || 'none';
        },
        exit() { if (host) { host.hidden = true; UI.clear(host); } if (this._off) this._off(); },
        input(ev) {
          if (ev.key === 'up' || ev.key === 'left') { index = (index - 1 + options.length) % options.length; UI.select(this._list, index); KIT.audio.play('blip'); return true; }
          if (ev.key === 'down' || ev.key === 'right') { index = (index + 1) % options.length; UI.select(this._list, index); KIT.audio.play('blip'); return true; }
          if (ev.key === 'a') { this._pick.call(this); return true; }
          if (ev.key === 'b' || ev.key === 'menu') {
            if (this._cancel === 'none') { KIT.audio.play('back'); return true; }
            KIT.audio.play('back');
            this.finish(-1);
            return true;
          }
          return true;
        },
      };
    },
  });

  // ---- a small modal panel shared by nameEntry and inputNumber ----------------------
  function modalPanel(title) {
    const host = UI.el('choice');
    UI.clear(host);
    host.hidden = false;
    const panel = UI.make('div.kit-panel.kit-modal');
    if (title) panel.appendChild(UI.make('div.kit-prompt', { text: title }));
    host.appendChild(panel);
    return { host, panel };
  }

  scenes.add({
    id: 'nameEntry', name: 'Name entry',
    create() {
      return {
        id: 'nameEntry', transparent: true,
        enter(params) {
          const p = params || {};
          const m = modalPanel(p.prompt || 'What is your name?');
          this._host = m.host;
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'kit-input';
          input.maxLength = p.maxLength || 8;
          input.value = p.current || '';
          input.setAttribute('data-role', 'name-entry');
          input.setAttribute('aria-label', p.prompt || 'Name');
          m.panel.appendChild(input);
          const row = UI.make('div.kit-row');
          row.appendChild(UI.button('cancel', KIT.strings.get(null, 'cancel')));
          row.appendChild(UI.button('ok', KIT.strings.get(null, 'ok'), 'is-primary'));
          m.panel.appendChild(row);
          const done = (ok) => this.finish(ok ? (input.value.trim() || p.current || null) : null);
          this._off = UI.onAction(m.host, (a) => done(a === 'ok'));
          input.addEventListener('keydown', (e) => {
            e.stopPropagation();
            if (e.key === 'Enter') done(true);
            if (e.key === 'Escape') done(false);
          });
          setTimeout(() => { try { input.focus(); input.select(); } catch (e) { /* ignore */ } }, 0);
        },
        exit() { if (this._host) { this._host.hidden = true; UI.clear(this._host); } if (this._off) this._off(); },
        input(ev) { if (ev.key === 'b') this.finish(null); return true; },
      };
    },
  });

  scenes.add({
    id: 'inputNumber', name: 'Input number',
    create() {
      return {
        id: 'inputNumber', transparent: true,
        enter(params) {
          const p = params || {};
          const max = Math.pow(10, p.digits || 3) - 1;
          const m = modalPanel(p.prompt || 'Enter a number');
          this._host = m.host;
          const input = document.createElement('input');
          input.type = 'number';
          input.className = 'kit-input';
          input.min = '0'; input.max = String(max);
          input.value = String(Math.min(max, p.current || 0));
          input.setAttribute('data-role', 'number-entry');
          m.panel.appendChild(input);
          const row = UI.make('div.kit-row');
          row.appendChild(UI.button('cancel', KIT.strings.get(null, 'cancel')));
          row.appendChild(UI.button('ok', KIT.strings.get(null, 'ok'), 'is-primary'));
          m.panel.appendChild(row);
          const done = (ok) => this.finish(ok ? Math.max(0, Math.min(max, Number(input.value) || 0)) : null);
          this._off = UI.onAction(m.host, (a) => done(a === 'ok'));
          input.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); });
          setTimeout(() => { try { input.focus(); input.select(); } catch (e) { /* ignore */ } }, 0);
        },
        exit() { if (this._host) { this._host.hidden = true; UI.clear(this._host); } if (this._off) this._off(); },
        input(ev) { if (ev.key === 'b') this.finish(null); return true; },
      };
    },
  });

  // ---- scrolling text ---------------------------------------------------------------
  scenes.add({
    id: 'scrollText', name: 'Scrolling text',
    create() {
      let y = 0, speed = 1, host = null, inner = null, fast = false;
      return {
        id: 'scrollText', transparent: true,
        enter(params) {
          const p = params || {};
          host = UI.el('dialogue');
          host.hidden = false;
          host.setAttribute('data-bg', 'dim');
          host.classList.add('is-scroll');
          UI.clear(host);
          inner = UI.make('div.kit-scroll');
          inner.textContent = KIT.text.plain(p.text || '', {});
          host.appendChild(inner);
          y = host.clientHeight;
          speed = (p.speed || 2) * 18;
          fast = false;
          this._noFast = !!p.noFast;
          inner.style.transform = `translateY(${y}px)`;
        },
        exit() { if (host) { host.hidden = true; host.classList.remove('is-scroll'); UI.clear(host); host.removeAttribute('data-bg'); } },
        update(dt) {
          if (!inner) return;
          y -= dt * speed * (fast ? 3 : 1) * (KIT.fx.instant ? 8 : 1);
          inner.style.transform = `translateY(${y}px)`;
          if (y < -inner.offsetHeight - 8) this.finish(true);
        },
        input(ev) { if ((ev.key === 'a' || ev.key === 'b') && !this._noFast) fast = true; return true; },
      };
    },
  });

  // ---- chapter card --------------------------------------------------------------------
  scenes.add({
    id: 'chapter', name: 'Chapter card',
    create() {
      let left = 0, host = null;
      return {
        id: 'chapter', transparent: true,
        enter(params) {
          const p = params || {};
          host = UI.el('chapter');
          if (!host) { this.finish(); return; }
          UI.clear(host);
          host.hidden = false;
          host.classList.add('is-in');
          const card = UI.make('div.kit-card');
          card.appendChild(UI.make('div.kit-chapter-title', { text: KIT.text.plain(p.title || '', {}) }));
          if (p.subtitle) card.appendChild(UI.make('div.kit-chapter-sub', { text: KIT.text.plain(p.subtitle, {}) }));
          host.appendChild(card);
          left = (KIT.fx && KIT.fx.instant) ? 80 : (p.ms == null ? 2000 : p.ms);
        },
        exit() { if (host) { host.hidden = true; host.classList.remove('is-in'); UI.clear(host); } },
        update(dt) { left -= dt * 1000; if (left <= 0) this.finish(true); },
        input(ev) { if (ev.key === 'a' || ev.key === 'b') this.finish(true); return true; },
      };
    },
  });

  // ---- toast ------------------------------------------------------------------------
  // A toast does not take input: it shows, the script carries on after a beat,
  // and the element fades away on its own.
  let toastTimer = null;
  KIT.toast = function (text, ms) {
    const host = UI.el('toast');
    if (!host) return Promise.resolve();
    UI.clear(host);
    host.appendChild(UI.make('div.kit-toast-pill', { text: KIT.text.plain(text || '', {}) }));
    host.hidden = false;
    host.classList.add('is-in');
    if (toastTimer) clearTimeout(toastTimer);
    const life = (KIT.fx && KIT.fx.instant) ? 200 : (ms || 1600);
    toastTimer = setTimeout(() => { host.classList.remove('is-in'); host.hidden = true; }, life);
    return new Promise(res => setTimeout(res, Math.min(life, (KIT.fx && KIT.fx.instant) ? 10 : 550)));
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// ---- js/kit/scenes/menu.js ----
// The pause menu, the settings list, the save-slot list and the debug panel.
//
// The pause menu is built from the `menus` registry, so a module (or the
// author) adds an entry with `KIT.registry('menus').add({ id, label, order,
// open(game) })` and it appears in the right place with no core edits.
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const UI = KIT.ui;
  const scenes = KIT.registry('scenes');
  const menus = KIT.registry('menus');

  const TEXT_SPEEDS = ['slow', 'normal', 'fast', 'instant'];
  const ZOOMS = ['auto', 'small', 'normal', 'large'];

  function settings() { return KIT.storage.settings(); }
  function save(patch) { return KIT.storage.saveSettings(patch); }

  /** A list panel inside #pause-menu: rows of { label, value, action, disabled }. */
  function panel(title, rows, opts) {
    const host = UI.el('pause-menu');
    UI.clear(host);
    host.hidden = false;
    const box = UI.make('div.kit-panel.kit-pause');
    if (title) box.appendChild(UI.make('div.kit-panel-title', { text: title }));
    const list = UI.make('div.kit-menu-list');
    rows.forEach((r, i) => {
      const b = UI.make('button.kit-uibtn.kit-menu-item', {});
      b.type = 'button';
      b.setAttribute('data-action', r.action || ('row-' + i));
      b.setAttribute('data-index', String(i));
      if (r.disabled) b.disabled = true;
      b.appendChild(UI.make('span.kit-item-label', { text: r.label }));
      if (r.value != null) b.appendChild(UI.make('span.kit-item-value', { text: String(r.value) }));
      if (r.note) b.appendChild(UI.make('span.kit-item-note', { text: r.note }));
      list.appendChild(b);
    });
    box.appendChild(list);
    if (opts && opts.hint) box.appendChild(UI.make('p.kit-hint', { text: opts.hint }));
    host.appendChild(box);
    return { host, list };
  }

  /** One scene drives every list: pause, settings and save just supply rows. */
  scenes.add({
    id: 'menu', name: 'Menu',
    create() {
      let mode = 'pause', rows = [], index = 0, ui = null, game = null;

      const build = function (self) {
        if (mode === 'settings') rows = settingRows();
        else if (mode === 'save') rows = self._saveRows || [{ label: 'Loading…', disabled: true }];
        else rows = pauseRows();
        ui = panel(titleFor(), rows, { hint: KIT.input.isTouch() ? 'Tap a line · ☰ closes' : 'Arrows · Z chooses · X closes' });
        index = Math.min(index, Math.max(0, rows.length - 1));
        UI.select(ui.list, index);
        if (self._off) self._off();
        self._off = UI.onAction(ui.host, (action, el) => {
          index = Number(el.getAttribute('data-index')) || 0;
          activate.call(self);
        });
      };

      function titleFor() {
        if (mode === 'settings') return KIT.strings.get(game && game.project, 'settings');
        if (mode === 'save') return KIT.strings.get(game && game.project, 'save');
        return 'Paused';
      }

      function pauseRows() {
        const out = [{ label: 'Keep playing', action: 'close' }];
        for (const def of menus.list().slice().sort((a, b) => (a.order || 50) - (b.order || 50))) {
          if (typeof def.when === 'function' && !def.when(game)) continue;
          out.push({ label: typeof def.label === 'function' ? def.label(game) : (def.label || def.name || def.id), action: 'menu:' + def.id, value: typeof def.value === 'function' ? def.value(game) : undefined });
        }
        return out;
      }

      function settingRows() {
        const s = settings();
        return [
          { label: 'Text speed', value: s.textSpeed, action: 'cycle:textSpeed' },
          { label: 'Zoom', value: s.zoom, action: 'cycle:zoom' },
          { label: 'Sound', value: s.sound ? 'on' : 'off', action: 'toggle:sound' },
          { label: 'Music', value: s.music ? 'on' : 'off', action: 'toggle:music' },
          { label: 'Motion', value: s.reduceMotion ? 'reduced' : 'normal', action: 'toggle:reduceMotion' },
          { label: 'Back', action: 'back' },
        ];
      }

      function nudge(action, dir) {
        const s = settings();
        if (action === 'cycle:textSpeed') {
          const i = (TEXT_SPEEDS.indexOf(s.textSpeed) + (dir || 1) + TEXT_SPEEDS.length) % TEXT_SPEEDS.length;
          save({ textSpeed: TEXT_SPEEDS[i] });
        } else if (action === 'cycle:zoom') {
          const i = (ZOOMS.indexOf(s.zoom) + (dir || 1) + ZOOMS.length) % ZOOMS.length;
          save({ zoom: ZOOMS[i] });
          if (KIT.game && KIT.game.resize) KIT.game.resize();
        } else if (action === 'toggle:sound') { save({ sound: !s.sound }); KIT.audio.setEnabled(!s.sound); }
        else if (action === 'toggle:music') { save({ music: !s.music }); KIT.audio.setMusic(!s.music); if (!s.music && KIT.game && KIT.game.world) KIT.audio.music(KIT.game.world.currentMusic || null); }
        else if (action === 'toggle:reduceMotion') save({ reduceMotion: !s.reduceMotion });
        else return false;
        return true;
      }

      async function activate() {
        const row = rows[index];
        if (!row || row.disabled) return;
        const action = row.action || '';
        KIT.audio.play('select');
        if (action === 'close') { this.finish('close'); return; }
        if (action === 'back') { mode = 'pause'; index = 0; build(this); return; }
        if (action.startsWith('cycle:') || action.startsWith('toggle:')) { nudge(action, 1); build(this); return; }
        if (action.startsWith('slot:')) {
          const slot = action.slice(5);
          const ok = await game.save(slot);
          await KIT.toast(KIT.strings.get(game.project, ok ? 'saved' : 'save-failed'));
          if (ok) KIT.audio.play('save');
          mode = 'pause'; index = 0; build(this);
          return;
        }
        if (action.startsWith('menu:')) {
          const def = menus.get(action.slice(5));
          if (!def) return;
          if (def.id === 'settings') { mode = 'settings'; index = 0; build(this); return; }
          if (def.id === 'save') {
            this._saveRows = await saveRows(game);
            mode = 'save'; index = 0; build(this);
            return;
          }
          const result = await def.open(game, this);
          if (result === 'close') { this.finish('close'); return; }
          build(this);
        }
      }

      async function saveRows(g) {
        const list = await KIT.storage.listGames();
        return list.map(s => ({
          label: s.slot === 'autosave' ? 'Autosave' : 'Slot ' + s.slot,
          value: s.exists ? when(s.savedAt) : 'empty',
          note: s.exists && s.map ? s.map : '',
          action: 'slot:' + s.slot,
          disabled: s.slot === 'autosave',
        })).concat([{ label: 'Back', action: 'back' }]);
      }
      function when(iso) {
        if (!iso) return '';
        try { const d = new Date(iso); return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
        catch (e) { return iso.slice(0, 16).replace('T', ' '); }
      }

      return {
        id: 'menu', transparent: true, pausesWorld: true,
        enter(params) {
          game = (params && params.game) || KIT.game;
          mode = (params && params.mode) || 'pause';
          index = 0;
          this._saveRows = null;
          build(this);
        },
        exit() { const host = UI.el('pause-menu'); if (host) { host.hidden = true; UI.clear(host); } if (this._off) this._off(); },
        input(ev) {
          if (ev.key === 'up') { index = (index - 1 + rows.length) % rows.length; UI.select(ui.list, index); KIT.audio.play('blip'); return true; }
          if (ev.key === 'down') { index = (index + 1) % rows.length; UI.select(ui.list, index); KIT.audio.play('blip'); return true; }
          if (ev.key === 'left' || ev.key === 'right') {
            const row = rows[index];
            if (row && nudge(row.action, ev.key === 'left' ? -1 : 1)) build(this);
            return true;
          }
          if (ev.key === 'a') { activate.call(this); return true; }
          if (ev.key === 'b' || ev.key === 'menu') {
            KIT.audio.play('back');
            if (mode !== 'pause') { mode = 'pause'; index = 0; build(this); return true; }
            this.finish('close');
            return true;
          }
          return true;
        },
      };
    },
  });

  // ---- the standard pause-menu entries -------------------------------------------
  menus.addAll([
    { id: 'save', label: 'Save', order: 20, open() { return null; } },
    { id: 'coop', label: 'Two players', order: 30,
      value: (game) => (game && game.world && game.world.coop ? 'on' : 'off'),
      open(game) { game.setCoop(!(game.world && game.world.coop)); return null; } },
    { id: 'settings', label: 'Settings', order: 40, open() { return null; } },
    { id: 'debug', label: 'Debug', order: 55,
      when: (game) => !!(game && game.flags && game.flags.debug),
      async open(game) { await KIT.scenes.run('debug', { game }); return null; } },
    { id: 'creator', label: 'Creator Mode', order: 60,
      async open(game) {
        if (KIT.editor && typeof KIT.editor.open === 'function') { KIT.editor.open(game); return 'close'; }
        await KIT.toast('Creator Mode is not in this build yet.');
        return null;
      } },
    { id: 'quit', label: 'Quit to title', order: 80,
      async open(game) {
        const i = await KIT.scenes.run('choice', {
          prompt: 'Quit to the title screen?',
          options: [{ text: KIT.strings.get(game.project, 'yes'), index: 0 }, { text: KIT.strings.get(game.project, 'no'), index: 1 }],
          cancel: 'last',
        });
        if (i === 0) { game.toTitle(); return 'close'; }
        return null;
      } },
  ]);

  // ---- debug panel -------------------------------------------------------------------
  scenes.add({
    id: 'debug', name: 'Debug',
    create() {
      let host = null, timer = 0;
      function body(game) {
        const w = game && game.world;
        const lines = [];
        if (w) {
          const h = w.hero();
          lines.push(`map ${w.map ? w.map.id : '—'}  hero ${h ? `${h.x},${h.y} ${h.dir}` : '—'}  busy ${w.busy}`);
          lines.push(`scenes ${KIT.scenes.ids().join(' › ')}`);
          lines.push(`threads ${KIT.interpreter.threads().map(t => `${t.label || t.id}:${t.status}`).join(', ') || 'none'}`);
          const vars = (w.save && w.save.vars) || {};
          lines.push('vars ' + (Object.keys(vars).map(k => `${k}=${JSON.stringify(vars[k])}`).join('  ') || 'none'));
          const inv = (w.save && w.save.inventory) || {};
          lines.push('bag ' + (Object.keys(inv).map(k => `${k}×${inv[k]}`).join('  ') || 'empty'));
        }
        lines.push(`storage ${JSON.stringify(KIT.storage.info())}`);
        return lines.join('\n');
      }
      return {
        id: 'debug', transparent: true, pausesWorld: false,
        enter(params) {
          const game = (params && params.game) || KIT.game;
          host = UI.el('pause-menu');
          UI.clear(host);
          host.hidden = false;
          const box = UI.make('div.kit-panel.kit-debug');
          box.appendChild(UI.make('div.kit-panel-title', { text: 'Debug' }));
          const pre = UI.make('pre.kit-debug-body', { text: body(game) });
          box.appendChild(pre);
          const row = UI.make('div.kit-row');
          row.appendChild(UI.button('close', 'Close', 'is-primary'));
          box.appendChild(row);
          host.appendChild(box);
          this._pre = pre; this._game = game;
          this._off = UI.onAction(host, () => this.finish(true));
        },
        exit() { if (host) { host.hidden = true; UI.clear(host); } if (this._off) this._off(); },
        update(dt) { timer += dt; if (timer > 0.25) { timer = 0; if (this._pre) this._pre.textContent = body(this._game); } },
        input(ev) { if (ev.key === 'b' || ev.key === 'menu' || ev.key === 'a') this.finish(true); return true; },
      };
    },
  });

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// ---- js/kit/scenes/title.js ----
// The title scene: the project's own title and pitch, New Game / Continue /
// Settings. Continue only lights up when there is a save for this world.
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const UI = KIT.ui;
  const scenes = KIT.registry('scenes');

  scenes.add({
    id: 'title', name: 'Title',
    create() {
      let host = null, items = [], index = 0;

      function refresh() { UI.select(host.querySelector('.kit-menu-list'), index); }

      return {
        id: 'title', transparent: false,
        enter(params) {
          const project = (params && params.project) || (KIT.game && KIT.game.project) || {};
          const meta = project.meta || {};
          host = UI.el('screen-title');
          if (!host) { this.finish('new-game'); return; }
          UI.clear(host);
          host.hidden = false;

          const inner = UI.make('div.kit-title-inner');
          inner.appendChild(UI.make('h1.kit-title', { text: meta.title || 'Our Adventure' }));
          if (meta.subtitle) inner.appendChild(UI.make('p.kit-subtitle', { text: meta.subtitle }));

          const list = UI.make('div.kit-menu-list');
          items = [
            { action: 'new-game', label: KIT.strings.get(project, 'new-game') },
            { action: 'continue', label: KIT.strings.get(project, 'continue'), disabled: true },
            { action: 'settings', label: KIT.strings.get(project, 'settings') },
          ];
          items.forEach((it, i) => {
            const b = UI.make('button.kit-uibtn.kit-menu-item', { text: it.label });
            b.type = 'button';
            b.setAttribute('data-action', it.action);
            b.setAttribute('data-index', String(i));
            if (it.disabled) b.disabled = true;
            list.appendChild(b);
          });
          inner.appendChild(list);
          if (meta.pitch) inner.appendChild(UI.make('p.kit-pitch', { text: meta.pitch }));
          inner.appendChild(UI.make('p.kit-hint', { text: KIT.input.isTouch() ? 'Tap to choose' : 'Arrows to choose · Z to confirm' }));
          host.appendChild(inner);
          index = 0;
          refresh();

          // Light up Continue when a save turns up.
          Promise.resolve(KIT.storage.listGames()).then((saves) => {
            const any = (saves || []).some(s => s.exists);
            const btn = list.querySelector('[data-action="continue"]');
            if (btn && any) { btn.disabled = false; items[1].disabled = false; index = 1; refresh(); }
          }).catch(() => {});

          this._off = UI.onAction(host, (action, el) => {
            if (el.disabled) return;
            index = Number(el.getAttribute('data-index')) || 0;
            this.choose(action);
          });
          KIT.audio.music('title', { fade: 400 });
        },
        exit() { if (host) { host.hidden = true; UI.clear(host); } if (this._off) this._off(); },
        choose(action) {
          KIT.audio.play('select');
          if (action === 'settings') { KIT.scenes.run('menu', { mode: 'settings' }); return; }
          this.finish(action);
        },
        input(ev) {
          const step = (d) => {
            for (let n = 0; n < items.length; n++) {
              index = (index + d + items.length) % items.length;
              if (!items[index].disabled) break;
            }
            KIT.audio.play('blip');
            refresh();
          };
          if (ev.key === 'up' || ev.key === 'left') step(-1);
          else if (ev.key === 'down' || ev.key === 'right') step(1);
          else if (ev.key === 'a' || ev.key === 'menu') this.choose(items[index].action);
          return true;
        },
      };
    },
  });

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// ---- js/kit/scenes/map.js ----
// The map scene: the one you play in. It owns nothing — the world updates in
// the game loop and the renderer draws every frame — it only turns held
// buttons into world.move()/world.interact() calls.
//
// Walking rules (§8.5): a direction held for less than KIT.input.TAP_MS only
// turns the hero (that is how you talk to something beside you without
// stepping), anything longer walks, and holding keeps walking.
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const scenes = KIT.registry('scenes');
  const DIRS = ['up', 'down', 'left', 'right'];

  scenes.add({
    id: 'map', name: 'Map',
    create(params) {
      const game = (params && params.game) || KIT.game;

      /** Which hero this player drives: in co-op each pad has its own, otherwise everyone drives the leader. */
      function heroIndexFor(world, player) {
        if (!world.coop) return world.activeHero;
        return Math.min(world.heroes.length - 1, player - 1);
      }

      /** The inactive co-op hero stays on screen: a step that would leave the view is refused. */
      function leashed(world, hero, dir) {
        if (!world.coop || hero === world.hero()) return false;
        const r = KIT.game && KIT.game.renderer ? KIT.game.renderer.viewTiles() : { w: 16, h: 12 };
        const d = KIT.delta(dir);
        const nx = hero.x + d.dx, ny = hero.y + d.dy;
        const cam = world.camera;
        return nx < cam.x || ny < cam.y || nx > cam.x + r.w - 1 || ny > cam.y + r.h - 1;
      }

      // Per player: the direction we turned to when this press started. While
      // that press is younger than TAP_MS the hero only turns — that is how you
      // face something beside you without stepping onto it.
      const turned = [null, null];

      function poll(world) {
        if (!world || !world.map || world.busy) return;
        const players = KIT.input.players();
        for (let player = 1; player <= players; player++) {
          const state = KIT.input.state(player);
          const dir = DIRS.find(d => state[d]);
          if (!dir) { turned[player - 1] = null; continue; }
          const i = heroIndexFor(world, player);
          const hero = world.hero(i);
          if (!hero || hero.mover.moving) continue;
          if (hero.dir !== dir) { KIT.entities.tryMove(hero, dir, world.map, { turnOnly: true }); turned[player - 1] = dir; }
          if (turned[player - 1] === dir && KIT.input.heldMs(dir, player) < KIT.input.TAP_MS) continue;
          if (leashed(world, hero, dir)) continue;
          Promise.resolve(world.move(i, dir)).catch(e => (KIT.log || console).error('[map] move', e));
        }
      }

      /** A tap too short for the poll to see (a touch pad tap) still turns the hero. */
      function turnOnPress(world, ev) {
        const i = heroIndexFor(world, ev.player);
        const hero = world.hero(i);
        if (!hero || hero.mover.moving) return;
        if (hero.dir !== ev.key) { KIT.entities.tryMove(hero, ev.key, world.map, { turnOnly: true }); turned[ev.player - 1] = ev.key; }
        else turned[ev.player - 1] = null;
      }

      return {
        id: 'map', transparent: false,
        enter() { const host = KIT.ui.el('game-canvas'); if (host) host.setAttribute('data-scene', 'map'); },
        update(dt, isTop) {
          const world = game && game.world;
          if (!isTop || !world) return;
          poll(world);
        },
        input(ev) {
          const world = game && game.world;
          if (!world) return true;
          if (DIRS.includes(ev.key)) { if (!world.busy) turnOnPress(world, ev); return true; }
          if (ev.key === 'a') {
            const i = world.coop ? Math.min(world.heroes.length - 1, ev.player - 1) : world.activeHero;
            Promise.resolve(world.interact(i)).catch(e => (KIT.log || console).error('[map] interact', e));
            return true;
          }
          if (ev.key === 'menu') { game.openMenu(); return true; }
          if (ev.key === 'swap') { game.swapHero(); return true; }
          return true;
        },
      };
    },
  });
