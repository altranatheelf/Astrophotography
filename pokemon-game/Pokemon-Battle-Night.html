<script>
// ---- js/kit/world/tiles.js ----
// KIT.tiles — tile flags, edge passage and autotile baking (all pure).
// Contract: docs/ARCHITECTURE.md §5 (autotiles/terrains), §6.2 (tile entry).
//
// Autotiles follow LDtk's auto-layer semantics, adapted to named tile ids:
//   * `map.layers.terrain` is the IntGrid: 0 = "no terrain" (hand-painted cell),
//     any other int is a terrain id from `project.terrains`.
//   * A rule group is evaluated top-down per cell; a matching rule paints its
//     tile and, when `breakOnMatch` is true, stops the group for that cell.
//   * Pattern cells (size×size, row-major, centred on the cell):
//       0            ignore
//       +v           the neighbour must BE terrain v
//       -v           the neighbour must NOT be terrain v
//       1000001      any terrain (not 0)      -1000001   empty (terrain 0)
//   * `flip:'x'|'y'|'xy'` also tries the pattern mirrored horizontally /
//     vertically / both. A mirrored match paints `tilesX` / `tilesY` /
//     `tilesXY` when the rule provides them, otherwise `tiles` (named tiles
//     cannot be flipped as pixels, so the author names the mirrored tile).
//   * `modulo:{ x, y, ox, oy }` — the rule only applies where
//     ((cx - ox) mod x) == 0 and ((cy - oy) mod y) == 0.
//   * `outOfBounds:null` — a pattern cell that falls outside the map never
//     matches, so edge/corner rules do not fire along the map border and a path
//     continues seamlessly into the neighbouring map; `outOfBounds:v` — cells
//     outside the map count as terrain v (set it to the surrounding terrain to
//     get edges along the border).
//   * `chance` (0..1) and `mode:'single'` picks (random by per-cell rng);
//     `mode:'stamp'` treats `tiles` as a size×size block painted around the cell.
//   * `terrains[].base` is painted on the ground layer when no rule paints it.
//   * Deco results: a deco cell is only rewritten when a rule paints it or when
//     the tile currently there is one some deco rule can paint ("owned" by the
//     autotiles); hand-placed deco (trees, signs) survives a re-bake.
//   Per-cell randomness: KIT.rng(KIT.hash(seed, groupId, x, y)) — so bakes are
//   deterministic and local (a cell's result depends only on its neighbourhood).
//
// @typedef {{ id:string, name?:string, active?:boolean, terrain?:number, layer?:'ground'|'deco', rules:AutoRule[] }} AutoGroup
// @typedef {{ size:number, pattern:number[], tiles:(string|null)[], tilesX?:string[], tilesY?:string[], tilesXY?:string[],
//             mode?:'single'|'stamp', chance?:number, breakOnMatch?:boolean, flip?:'none'|'x'|'y'|'xy',
//             outOfBounds?:number|null, modulo?:{x:number,y:number,ox:number,oy:number}, layer?:'ground'|'deco', active?:boolean }} AutoRule
// @typedef {{ id:number, name:string, color:string, base:string|null }} Terrain
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const T = KIT.tiles = KIT.tiles || {};

  const ANY = 1000001, EMPTY = -1000001;
  T.ANY = ANY; T.EMPTY = EMPTY;

  const DIR_KEY = { n: 'n', s: 's', e: 'e', w: 'w', up: 'n', down: 's', right: 'e', left: 'w', north: 'n', south: 's', east: 'e', west: 'w' };

  /** Defaults every tile has (a missing/unknown tile is walkable ground). */
  T.DEFAULTS = Object.freeze({ solid: false, passage: Object.freeze({ n: true, s: true, e: true, w: true }), bush: false, counter: false, ledge: null, warpLook: false, encounter: false, terrainTag: 0, probability: 1, animMs: 500 });

  function registry() { return KIT.registry.exists('tiles') ? KIT.registry('tiles') : null; }
  T.def = function (tileOrId) {
    if (tileOrId && typeof tileOrId === 'object') return tileOrId;
    const r = registry();
    return r && typeof tileOrId === 'string' ? (r.get(tileOrId) || null) : null;
  };

  /**
   * flags(tileOrId) -> { id, exists, solid, passage:{n,s,e,w}, bush, counter, ledge, warpLook, encounter, terrainTag, probability, animMs, animated }
   * Registry flags merged over the defaults. Unknown ids are walkable with exists:false.
   */
  T.flags = function (tileOrId) {
    const d = T.def(tileOrId);
    const out = Object.assign({ id: d ? d.id : (typeof tileOrId === 'string' ? tileOrId : null), exists: !!d }, T.DEFAULTS);
    if (d) {
      for (const k of Object.keys(T.DEFAULTS)) if (d[k] != null && k !== 'passage') out[k] = d[k];
      out.passage = Object.assign({}, T.DEFAULTS.passage, d.passage || {});
      out.animated = Array.isArray(d.frames) ? d.frames.length > 1 : Array.isArray(d.art && d.art.frames) && d.art.frames.length > 1;
    } else out.animated = false;
    return out;
  };

  /** passage(tileOrId, dir) -> can an entity cross this tile's `dir` edge? dir: n|s|e|w or up|down|left|right. Solid tiles never pass. */
  T.passage = function (tileOrId, dir) {
    const f = T.flags(tileOrId);
    if (f.solid) return false;
    const k = DIR_KEY[dir];
    if (!k) return true;
    return f.passage[k] !== false;
  };

  /** frameAt(tileOrId, tMs) -> index of the animation frame to draw at time t (animMs per frame). */
  T.frameAt = function (tileOrId, t) {
    const d = T.def(tileOrId);
    const frames = d && (Array.isArray(d.frames) ? d.frames : (d.art && d.art.frames));
    if (!frames || frames.length < 2) return 0;
    const ms = Math.max(50, Number(d.animMs) || 500);
    return Math.floor((t || 0) / ms) % frames.length;
  };

  // ---- autotiles ----------------------------------------------------------

  const mod = (a, n) => ((a % n) + n) % n;

  /** Largest neighbourhood radius (floor(size/2)) over the active rules of an autotile set; 0 when there are none. */
  T.ruleRadius = function (set) {
    let r = 0;
    for (const g of (set && set.groups) || []) {
      if (g.active === false) continue;
      for (const rule of g.rules || []) if (rule.active !== false) r = Math.max(r, Math.floor((rule.size || 1) / 2));
    }
    return r;
  };

  /** Every tile id some rule of `set` can paint on `layer`. */
  T.ownedTiles = function (set, layer) {
    const out = new Set();
    for (const g of (set && set.groups) || []) {
      const gl = g.layer || 'ground';
      for (const rule of g.rules || []) {
        if ((rule.layer || gl) !== layer) continue;
        for (const list of [rule.tiles, rule.tilesX, rule.tilesY, rule.tilesXY]) for (const id of list || []) if (typeof id === 'string') out.add(id);
      }
    }
    return out;
  };

  function mirrorPattern(pattern, size, fx, fy) {
    const out = new Array(size * size);
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const sx = fx ? size - 1 - x : x, sy = fy ? size - 1 - y : y;
      out[y * size + x] = pattern[sy * size + sx];
    }
    return out;
  }

  /** Does `pattern` (size×size) match the terrain around (cx, cy)? */
  function matches(pattern, size, terrain, width, height, cx, cy, outOfBounds) {
    const half = Math.floor(size / 2);
    for (let i = 0; i < size * size; i++) {
      const p = pattern[i];
      if (!p) continue;
      const x = cx + (i % size) - half, y = cy + Math.floor(i / size) - half;
      let v;
      if (x < 0 || y < 0 || x >= width || y >= height) {
        if (outOfBounds == null) return false;
        v = outOfBounds;
      } else v = terrain[y * width + x] || 0;
      if (p === ANY) { if (v === 0) return false; }
      else if (p === EMPTY) { if (v !== 0) return false; }
      else if (p > 0) { if (v !== p) return false; }
      else if (v === -p) return false;
    }
    return true;
  }

  /** The variants of a rule to try, in order: base, then mirrored per `flip`. Computed once per rule per bake. */
  function variants(rule) {
    const size = rule.size || 1;
    const pattern = rule.pattern || [];
    const list = [{ pattern, tiles: rule.tiles || [] }];
    const flip = rule.flip || 'none';
    if (flip === 'x' || flip === 'xy') list.push({ pattern: mirrorPattern(pattern, size, true, false), tiles: rule.tilesX || rule.tiles || [] });
    if (flip === 'y' || flip === 'xy') list.push({ pattern: mirrorPattern(pattern, size, false, true), tiles: rule.tilesY || rule.tiles || [] });
    if (flip === 'xy') list.push({ pattern: mirrorPattern(pattern, size, true, true), tiles: rule.tilesXY || rule.tiles || [] });
    return list;
  }

  /**
   * bake(map, project, { around:{x,y}, radius, seed, set }) -> { ground, deco, changed:[index] }
   * Pure: returns NEW ground/deco arrays for `map`; `changed` lists the indexes that differ from the
   * map's current layers. With `around` + `radius` only that square is re-evaluated (the rest is copied).
   * `set` names the autotile set in project.autotiles (default 'default'); `seed` defaults to the map id.
   */
  T.bake = function (map, project, opts) {
    opts = opts || {};
    const width = map.width | 0, height = map.height | 0, n = width * height;
    const layers = map.layers || {};
    const terrain = layers.terrain || [];
    const ground = (layers.ground || []).slice(0, n);
    const deco = (layers.deco || []).slice(0, n);
    while (ground.length < n) ground.push(null);
    while (deco.length < n) deco.push(null);
    const changed = [];
    const setId = opts.set || (map.props && map.props.autotiles) || 'default';
    const set = project && project.autotiles && project.autotiles[setId];
    if (!set) return { ground, deco, changed };
    const seed = opts.seed != null ? opts.seed : (map.id || 'map');
    const terrains = new Map();
    for (const t of (project.terrains || [])) terrains.set(t.id, t);
    const groups = (set.groups || []).filter(g => g.active !== false).map(g => ({
      id: g.id, layer: g.layer || 'ground',
      rules: (g.rules || []).filter(r => r.active !== false).map(r => ({ rule: r, variants: variants(r) })),
    }));
    const ownedDeco = T.ownedTiles(set, 'deco');

    let x0 = 0, y0 = 0, x1 = width - 1, y1 = height - 1;
    if (opts.around) {
      const r = opts.radius != null ? opts.radius : T.ruleRadius(set);
      x0 = Math.max(0, opts.around.x - r); y0 = Math.max(0, opts.around.y - r);
      x1 = Math.min(width - 1, opts.around.x + r); y1 = Math.min(height - 1, opts.around.y + r);
    }

    const stampGround = [], stampDeco = [];   // [{ index, id }] from stamp rules: applied after the pass (they win over neighbours' results)
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const i = y * width + x;
      const tv = terrain[i] || 0;
      let paintedGround = null, paintedDeco = null;   // { id } once a rule painted (id may be null = clear)
      for (const g of groups) {
        const rng = KIT.rng(KIT.hash(seed, g.id, x, y));
        for (const { rule, variants: vs } of g.rules) {
          const layer = rule.layer || g.layer;
          const m = rule.modulo;
          if (m && ((m.x > 1 && mod(x - (m.ox || 0), m.x) !== 0) || (m.y > 1 && mod(y - (m.oy || 0), m.y) !== 0))) continue;
          const size = rule.size || 1;
          let hit = null;
          for (const v of vs) { if (matches(v.pattern, size, terrain, width, height, x, y, rule.outOfBounds == null ? null : rule.outOfBounds)) { hit = v; break; } }
          if (!hit) continue;
          const chance = rule.chance == null ? 1 : rule.chance;
          if (chance < 1 && !(rng() < chance)) continue;
          if ((rule.mode || 'single') === 'stamp') {
            const half = Math.floor(size / 2);
            const target = layer === 'deco' ? stampDeco : stampGround;
            hit.tiles.forEach((id, k) => {
              if (id === undefined) return;
              const sx = x + (k % size) - half, sy = y + Math.floor(k / size) - half;
              if (sx < 0 || sy < 0 || sx >= width || sy >= height) return;
              target.push({ index: sy * width + sx, id });
            });
          } else {
            let id = null;
            if (hit.tiles.length === 1) id = hit.tiles[0];
            else if (hit.tiles.length > 1) id = hit.tiles[rng.int(hit.tiles.length)];
            if (layer === 'deco') { if (!paintedDeco) paintedDeco = { id }; }
            else if (!paintedGround) paintedGround = { id };
          }
          if (rule.breakOnMatch !== false) break;
        }
      }
      // ground: rule result, else the terrain base (only on terrain cells), else untouched
      if (paintedGround) ground[i] = paintedGround.id;
      else if (tv !== 0) { const t = terrains.get(tv); if (t && t.base) ground[i] = t.base; }
      // deco: rule result, else clear only tiles the autotiles own
      if (paintedDeco) deco[i] = paintedDeco.id;
      else if (deco[i] != null && ownedDeco.has(deco[i])) deco[i] = null;
    }
    for (const s of stampGround) ground[s.index] = s.id;
    for (const s of stampDeco) deco[s.index] = s.id;
    const og = layers.ground || [], od = layers.deco || [];
    for (let i = 0; i < n; i++) {
      const g0 = og[i] === undefined ? null : og[i], d0 = od[i] === undefined ? null : od[i];
      if (g0 !== ground[i] || d0 !== deco[i]) changed.push(i);
    }
    return { ground, deco, changed };
  };

  /**
   * rulesFromTemplate({ groupId, terrain, tiles:{ center, n, s, e, w, ne, nw, se, sw, innerNE, innerNW, innerSE, innerSW }, against, layer })
   * -> AutoGroup. The "wizard": one rule per provided tile, most specific first (inner corners,
   * corners, edges, centre). `against` = a terrain id the edges face (default 'any' = any other terrain).
   */
  T.rulesFromTemplate = function (opts) {
    const t = opts.terrain;
    const tiles = opts.tiles || {};
    const OUT = (opts.against == null || opts.against === 'any') ? -t : opts.against;
    // pattern index: 0 nw 1 n 2 ne 3 w 4 c 5 e 6 sw 7 s 8 se
    const P = (spec) => { const p = [0, 0, 0, 0, t, 0, 0, 0, 0]; for (const k of Object.keys(spec)) p[k] = spec[k]; return p; };
    const order = [
      ['innerNE', P({ 1: t, 5: t, 2: OUT })], ['innerNW', P({ 1: t, 3: t, 0: OUT })],
      ['innerSE', P({ 7: t, 5: t, 8: OUT })], ['innerSW', P({ 7: t, 3: t, 6: OUT })],
      ['ne', P({ 1: OUT, 5: OUT })], ['nw', P({ 1: OUT, 3: OUT })], ['se', P({ 7: OUT, 5: OUT })], ['sw', P({ 7: OUT, 3: OUT })],
      ['n', P({ 1: OUT })], ['s', P({ 7: OUT })], ['e', P({ 5: OUT })], ['w', P({ 3: OUT })],
      ['center', P({})],
    ];
    const rules = [];
    for (const [key, pattern] of order) {
      if (tiles[key] == null) continue;
      rules.push({ size: 3, pattern, tiles: [tiles[key]], mode: 'single', chance: 1, breakOnMatch: true, flip: 'none', outOfBounds: null, modulo: { x: 1, y: 1, ox: 0, oy: 0 }, note: key });
    }
    return { id: opts.groupId || `terrain-${t}`, name: opts.name || `Terrain ${t}`, active: true, terrain: t, layer: opts.layer || 'ground', rules };
  };

  /**
   * remapGroup(group, fromTerrain, toTerrain, tileMap, newId?) -> a new group for another terrain:
   * pattern values ±fromTerrain become ±toTerrain and tile ids are looked up in tileMap (missing ids are kept).
   */
  T.remapGroup = function (group, fromTerrain, toTerrain, tileMap, newId) {
    const g = KIT.deepClone(group);
    g.id = newId || `${group.id}-${toTerrain}`;
    if (g.terrain === fromTerrain) g.terrain = toTerrain;
    if (g.name) g.name = `${g.name} (${toTerrain})`;
    const map = tileMap || {};
    const remapTiles = (list) => list ? list.map(id => (typeof id === 'string' && map[id] != null ? map[id] : id)) : list;
    for (const r of g.rules || []) {
      r.pattern = (r.pattern || []).map(v => (v === fromTerrain ? toTerrain : v === -fromTerrain ? -toTerrain : v));
      if (r.outOfBounds === fromTerrain) r.outOfBounds = toTerrain;
      r.tiles = remapTiles(r.tiles); r.tilesX = remapTiles(r.tilesX); r.tilesY = remapTiles(r.tilesY); r.tilesXY = remapTiles(r.tilesXY);
      for (const k of ['tilesX', 'tilesY', 'tilesXY']) if (r[k] === undefined) delete r[k];
    }
    return g;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

// ---- js/kit/script/text.js ----
// Text: templating ({p1}, {var:coins}), text codes ({pause}, {color:red}…),
// word wrap and pagination. Pure: no DOM, no timers. The dialogue scene feeds
// the spans to the renderer; the editor uses render() for its live preview.
// Also here: KIT.strings (the Terms table) and KIT.script.values, the tiny
// value lexer shared by the condition and screenplay text formats.
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const T = KIT.text = KIT.text || {};

  /**
   * @typedef {Object} TextCtx  What templating reads. Plain data; tests pass one directly,
   *   the runtime builds it from an interpreter ctx with KIT.text.contextFrom(ctx).
   * @property {Array<{id:string,name:string}>} [heroes]  ordered heroes, index 0 = p1
   * @property {string|number} [hero]   the triggering hero: id ('p1') or index; default the first hero
   * @property {Object<string,*>} [vars]   game variables by name
   * @property {Object<string,*>} [self]   the current object's self state
   * @property {Object<string,{name?:string}>} [items]  project.items (id -> { name })
   * @property {Object<string,*>} [args]   call arguments, read by {arg:name}
   */
  /**
   * @typedef {Object} TextSpan   a run of characters with one style
   * @property {'text'} type
   * @property {string} text
   * @property {string} [color]   from {color:x}
   * @property {string} [size]    from {size:big}
   */
  /**
   * @typedef {{type:'pause', ms:number|null}|{type:'wait'}|{type:'speed', mode:'fast'|'instant'}|{type:'icon', id:string}|{type:'break'}|{type:'shake'}} CodeSpan
   *   pause: ms null = the scene's default pause. wait: wait for the player mid-message.
   *   speed: change the typewriter speed from here on. break: forced line break (\n). shake: shake the box.
   */
  /** @typedef {TextSpan|CodeSpan} Span */
  /**
   * @typedef {Object} TextLayout
   * @property {number} [width]      box width in the unit measure() returns (default Infinity: no wrapping)
   * @property {function(string):number} [measure]  text width; default = character count (monospace)
   * @property {number} [iconWidth]  width of an {icon}; default measure('MM')
   * @property {number} [lines]      lines per page (default 3)
   */

  const has = (o, k) => o !== null && o !== undefined && Object.prototype.hasOwnProperty.call(o, k);

  // ---- context ---------------------------------------------------------------

  function heroIndex(ctx, hero) {
    const heroes = ctx.heroes || [];
    if (typeof hero === 'number') return hero;
    if (hero && typeof hero === 'object') hero = hero.id;

    return undefined;
  }
  const itemName = (ctx, id) => { const it = ctx && ctx.project && ctx.project.items && ctx.project.items[id]; return it && it.name ? it.name : id; };
  const fmtValue = (v) => (typeof v === 'string' ? JSON.stringify(v) : String(v));
  const opField = (def) => ({ key: 'op', type: 'enum', options: OPS, default: def || '==', label: 'Compare' });
  const targetField = (def) => ({ key: 'target', type: 'string', default: def, target: true, doc: "self, hero, p1, p2 or obj:<id>" });

  // ---- baseline kinds ---------------------------------------------------------

  reg.addAll([
    {
      id: 'var', label: 'Variable', group: 'Progress', doc: 'Compare a game variable with a value or another variable.',
      fields: [
        { key: 'name', type: 'ref:var', nullable: false, label: 'Variable' }, opField('=='),
        { key: 'value', type: 'scalar', default: 0 },
        { key: 'var', type: 'ref:var', label: 'Or variable', doc: 'When set, compare with this variable instead of the value' },
      ],
      test(c, ctx) { return C.compare(C.getVar(ctx, c.name), c.op, c.var ? C.getVar(ctx, c.var) : c.value); },
      describe(c) { return `${c.name} ${SYM[c.op] || c.op || '='} ${c.var ? c.var : fmtValue(c.value)}`; },
    },
    {
      id: 'self', label: 'Self state', group: 'Progress', doc: "Compare one of this object's self state keys.",
      fields: [{ key: 'key', type: 'string', min: 1 }, opField('=='), { key: 'value', type: 'scalar', default: true }],
      test(c, ctx) { return C.compare(C.getSelf(ctx, c.key), c.op, c.value); },
      describe(c) { return `self.${c.key} ${SYM[c.op] || c.op || '='} ${fmtValue(c.value)}`; },
    },
    {
      id: 'item', label: 'Item', group: 'Party', doc: 'How many of an item the party holds.',
      fields: [{ key: 'id', type: 'ref:item', nullable: false, label: 'Item' }, opField('>='), { key: 'count', type: 'number', integer: true, min: 0, default: 1 }],
      test(c, ctx) { return C.compare(C.count(ctx, c.id), c.op || '>=', c.count == null ? 1 : c.count); },
      describe(c, ctx) {
        const name = itemName(ctx, c.id), op = c.op || '>=', n = c.count == null ? 1 : c.count;
        if (op === '>=' && n === 1) return `has ${name}`;
        if ((op === '<' && n === 1) || (op === '==' && n === 0)) return `no ${name}`;
        return `${name} × ${SYM[op] || op} ${n}`;
      },
    },
    {
      id: 'facing', label: 'Facing', group: 'Map', doc: 'A character faces a direction.',
      fields: [targetField('self'), { key: 'dir', type: 'direction', default: 'down' }],
      test(c, ctx) { return C.target(ctx, c.target).dir === c.dir; },
      describe(c) { return `${C.targetLabel(c.target)} faces ${c.dir}`; },
    },
    {
      id: 'button', label: 'Button', group: 'Input', doc: 'A button is held by the triggering player.',
      fields: [{ key: 'key', type: 'string', default: 'A', doc: 'A, B, up, down, left, right, menu' }],
      test(c, ctx) { return !!(ctx && ctx.input && typeof ctx.input.pressed === 'function' && ctx.input.pressed(c.key, C.heroId(ctx))); },
      describe(c) { return `${c.key} pressed`; },
    },
    {
      id: 'timer', label: 'Timer', group: 'Progress', doc: 'The timer is running and its remaining seconds compare so.',
      fields: [opField('<='), { key: 'seconds', type: 'number', min: 0, default: 0 }],
      test(c, ctx) { const t = save(ctx).timer || {}; return !!t.running && C.compare(Number(t.secondsLeft) || 0, c.op || '<=', c.seconds || 0); },
      describe(c) { return `timer ${SYM[c.op] || c.op || '≤'} ${c.seconds || 0}s`; },
    },
    {
      id: 'region', label: 'Region', group: 'Map', doc: 'A character stands in a region.',
      fields: [{ key: 'id', type: 'region', default: 1 }, targetField('hero')],
      test(c, ctx) { const t = C.target(ctx, c.target); return t.x != null && regionAt(ctx.world && ctx.world.map, t.x, t.y) === c.id; },
      describe(c) { return `${C.targetLabel(c.target)} in region ${c.id}`; },
    },
    {
      id: 'tile', label: 'Tile', group: 'Map', doc: 'The tile on a layer at a position (default: under the hero).',
      fields: [{ key: 'layer', type: 'enum', options: ['ground', 'deco', 'above'], default: 'ground' }, { key: 'id', type: 'ref:tile', nullable: false, label: 'Tile' }, { key: 'at', type: 'position', optional: true, nullable: true, display: 'point' }],
      test(c, ctx) {
        const p = c.at || C.target(ctx, 'hero');
        return p.x != null && tileAt(ctx.world && ctx.world.map, c.layer || 'ground', p.x, p.y) === c.id;
      },
      describe(c) { return `${c.layer || 'ground'} ${c.at ? `at ${c.at.x},${c.at.y}` : 'under the hero'} is ${c.id}`; },
    },
    {
      id: 'meta', label: 'Meta', group: 'Progress', doc: 'Compare a meta value (survives New Game: runs, endingsSeen…).',
      fields: [{ key: 'key', type: 'string', min: 1 }, opField('>='), { key: 'value', type: 'scalar', default: 1 }],
      test(c, ctx) { return C.compare(C.meta(ctx)[c.key], c.op, c.value); },
      describe(c) { return `meta.${c.key} ${SYM[c.op] || c.op || '='} ${fmtValue(c.value)}`; },
    },
    {
      id: 'clock', label: 'Time of day', group: 'World', doc: 'In-game minute of the day is within from..to (wraps past midnight).',
      fields: [{ key: 'from', type: 'number', integer: true, min: 0, max: 1439, default: 0 }, { key: 'to', type: 'number', integer: true, min: 0, max: 1439, default: 1439 }],
      test(c, ctx) {
        const m = ((Number((save(ctx).clock || {}).minutes) || 0) % 1440 + 1440) % 1440;
        const from = c.from || 0, to = c.to == null ? 1439 : c.to;
        return from <= to ? (m >= from && m <= to) : (m >= from || m <= to);
      },
      describe(c) { const hm = (n) => `${String(Math.floor((n || 0) / 60)).padStart(2, '0')}:${String((n || 0) % 60).padStart(2, '0')}`; return `between ${hm(c.from)} and ${hm(c.to == null ? 1439 : c.to)}`; },
    },
    {
      id: 'coop', label: 'Co-op', group: 'Input', doc: 'Two players are active.',
      fields: [],
      test(c, ctx) {
        if (ctx && ctx.coop !== undefined) return !!ctx.coop;
        const s = ctx && ctx.project && ctx.project.settings && ctx.project.settings.coop;
        return !!(s && s.enabled);
      },
      describe() { return 'co-op'; },
    },
    {
      id: 'all', label: 'All of', group: 'Logic', doc: 'Every listed condition passes.',
      fields: [{ key: 'of', type: 'list', of: { type: 'condition' }, default: [] }],
      test(c, ctx) { return (c.of || []).every(x => C.test(x, ctx)); },
      describe(c, ctx) { return (c.of || []).map(x => wrapDesc(x, ctx)).join(' and ') || 'always'; },
    },
    {
      id: 'any', label: 'Any of', group: 'Logic', doc: 'At least one listed condition passes.',
      fields: [{ key: 'of', type: 'list', of: { type: 'condition' }, default: [] }],
      test(c, ctx) { return (c.of || []).some(x => C.test(x, ctx)); },
      describe(c, ctx) { return (c.of || []).map(x => wrapDesc(x, ctx)).join(' or ') || 'never'; },
    },
    {
      id: 'not', label: 'Not', group: 'Logic', doc: 'The condition fails.',
      fields: [{ key: 'of', type: 'condition' }],
      test(c, ctx) { return !C.test(c.of, ctx); },
      describe(c, ctx) { return `not ${wrapDesc(c.of, ctx)}`; },
    },
  ]);
  const wrapDesc = (c, ctx) => (c && (c.kind === 'all' || c.kind === 'any') && (c.of || []).length > 1 ? `(${C.describe(c, ctx)})` : C.describe(c, ctx));

  // ---- API -------------------------------------------------------------------

  const warned = new Set();
  /** test(cond, ctx) -> boolean. null/undefined = true. Unknown kinds are false (warned once). */
  C.test = function (cond, ctx) {
    if (cond === null || cond === undefined) return true;
    if (!KIT.isObject(cond) || typeof cond.kind !== 'string') return false;
    const def = reg.get(cond.kind);
    if (!def || typeof def.test !== 'function') {
      if (!warned.has(cond.kind)) { warned.add(cond.kind); (KIT.log || console).warn(`[conditions] unknown kind '${cond.kind}'`); }
      return false;
    }
    return !!def.test(cond, ctx || {});
  };
  /** describe(cond, ctx) -> short human text: 'chapter ≥ 2 and has Berry'. */
  C.describe = function (cond, ctx) {
    if (cond === null || cond === undefined) return 'always';
    if (!KIT.isObject(cond) || typeof cond.kind !== 'string') return '(invalid)';
    const def = reg.get(cond.kind);
    if (!def) return `(unknown: ${cond.kind})`;
    if (typeof def.describe === 'function') return def.describe(cond, ctx || {});
    return def.label || cond.kind;
  };
  /** withDefaults(fields, value) -> a copy where missing keys take their defaults, except defaults that are null (so 'required' still reports). */
  C.withDefaults = function (fields, value) {
    const filled = S.fill(fields || [], value);
    for (const k of Object.keys(filled)) if (!has(value, k) && filled[k] === null) delete filled[k];
    return filled;
  };
  /** normalize(cond) -> a copy with the kind's defaults filled (nested too). */
  C.normalize = function (cond) {
    if (cond === null || cond === undefined) return null;
    const def = KIT.isObject(cond) && reg.get(cond.kind);
    return def ? S.fill(def.fields || [], cond) : cond;
  };
  /** validate(cond, ctx) -> [{ path, message, code }] */
  C.validate = function (cond, ctx) { return S.validateValue({ key: 'when', type: 'condition' }, cond, ctx); };
  /** refs(cond, ctx) -> [{ kind, id, path, access:'read' }] */
  C.refs = function (cond, ctx) { const out = []; S._refsField({ key: 'when', type: 'condition' }, cond, ctx || {}, [], out); return out; };

  // ---- schema: 'scalar' (string | number | bool | null) and the rich 'condition' type ----

  S.defineType('scalar', {
    validate(f, v, ctx, path, errors) {
      if (v !== null && typeof v !== 'string' && typeof v !== 'number' && typeof v !== 'boolean') errors.push({ path: path.slice(), message: 'must be text, a number or true/false', code: 'type' });
      else if (typeof v === 'number' && !Number.isFinite(v)) errors.push({ path: path.slice(), message: 'must be a finite number', code: 'type' });
    },
    default(f) { return f.default !== undefined ? f.default : null; },
  });

  S.defineType('condition', {
    validate(f, v, ctx, path, errors) {
      if (v === null || v === undefined) return;
      if (!KIT.isObject(v) || typeof v.kind !== 'string') return errors.push({ path: path.slice(), message: 'must be a condition or empty', code: 'type' });
      const def = reg.get(v.kind);
      if (!def) return errors.push({ path: path.slice(), message: `unknown condition kind '${v.kind}'`, code: 'unknown' });
      S._validateFields(def.fields || [], C.withDefaults(def.fields, v), ctx || {}, path, errors);
    },
    default() { return null; },
    refs(f, v, ctx, path, out) {
      if (!KIT.isObject(v)) return;
      const def = reg.get(v.kind);
      if (!def) return;
      S._refsFields(def.fields || [], v, ctx || {}, path, out);
      for (const fld of S.fields(def.fields || [])) if (fld.target) C.targetRefs(v[fld.key], path.concat(fld.key), out);
    },
    fill(f, v) { return C.normalize(v); },
  });

  // ---- text format (lossless; used by Screenplay) ----------------------------
  // expr := or ; or := and ('or' and)* ; and := not ('and' not)* ; not := 'not' not | primary
  // primary := '(' expr ')' | 'always' | 'never' | {json} | ident op value | kind '(' key=value, ... ')'
  // ident := name (var) | self.key | item.id | meta.key ; value := number | true | false | "text" | word | var:name

  const wrapText = (c) => (c && (c.kind === 'all' || c.kind === 'any') && (c.of || []).length > 1 ? `(${C.toText(c)})` : C.toText(c));
  const word = (s) => typeof s === 'string' && V.WORD.test(s) && !['and', 'or', 'not', 'always', 'never', 'true', 'false', 'null'].includes(s);
  const valText = (v) => V.format(v, { bare: V.WORD });

  /** toText(cond) -> string. Kinds without sugar use `kind(key=value, …)`; anything else falls back to JSON. */
  C.toText = function (cond) {
    if (cond === null || cond === undefined) return 'always';
    if (!KIT.isObject(cond) || typeof cond.kind !== 'string') return JSON.stringify(cond);
    const c = cond, k = c.kind;
    if (k === 'var' && word(c.name) && (c.var == null || word(c.var))) return `${c.name} ${c.op || '=='} ${c.var ? 'var:' + c.var : valText(c.value)}`;
    if (k === 'self' && word(c.key)) return `self.${c.key} ${c.op || '=='} ${valText(c.value)}`;
    if (k === 'item' && word(c.id)) return `item.${c.id} ${c.op || '>='} ${valText(c.count == null ? 1 : c.count)}`;
    if (k === 'meta' && word(c.key)) return `meta.${c.key} ${c.op || '=='} ${valText(c.value)}`;
    if (k === 'all' || k === 'any') {
      const parts = (c.of || []);
      if (!parts.length) return `${k}()`;
      if (parts.length === 1) return `${k}(${C.toText(parts[0])})`;
      return parts.map(wrapText).join(k === 'all' ? ' and ' : ' or ');
    }
    if (k === 'not') return `not ${wrapText(c.of)}`;
    const def = reg.get(k);
    if (def) {
      const fields = S.fields(def.fields || []);
      const simple = fields.every(f => f.type !== 'condition' && !(f.type === 'list' && f.of && f.of.type === 'condition'));
      const extra = Object.keys(c).filter(key => key !== 'kind' && !fields.some(f => f.key === key));
      if (simple && !extra.length && /^[a-z][\w-]*$/i.test(k)) {
        const args = fields.filter(f => c[f.key] !== undefined).map(f => `${f.key}=${V.format(c[f.key], { bare: V.WORD })}`);
        return `${k}(${args.join(', ')})`;
      }
    }
    return JSON.stringify(c);
  };

  function lex(str) {
    const toks = [];
    let i = 0;
    const s = String(str);
    while (i < s.length) {
      const c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (c === '(' || c === ')' || c === ',') { toks.push({ t: c, i }); i++; continue; }
      const op = /^(==|!=|<=|>=|<|>|=)/.exec(s.slice(i));
      if (op) { toks.push({ t: 'op', v: op[1] === '=' ? '==' : op[1], i }); i += op[1].length; continue; }
      if (c === '"' || c === '{' || c === '[') {
        const r = V.scan(s, i, ',)');
        if (!r || r.error) throw new Error(`condition: bad value at ${i}`);
        toks.push({ t: 'value', v: r.value, i, raw: r.raw }); i = r.end; continue;
      }
      const m = /^-?\d+(\.\d+)?(?![\w.-])/.exec(s.slice(i));
      if (m) { toks.push({ t: 'value', v: Number(m[0]), i, raw: m[0] }); i += m[0].length; continue; }
      const w = /^[^\s(),=<>!"]+/.exec(s.slice(i));
      if (!w) throw new Error(`condition: unexpected '${c}' at ${i}`);
      toks.push({ t: 'word', v: w[0], i }); i += w[0].length;
    }
    return toks;
  }

  /** parseText(str) -> Condition | null ('always'). Throws Error('condition: …') on bad input. */
  C.parseText = function (str) {
    const toks = lex(str == null ? '' : str);
    let p = 0;
    const peek = () => toks[p];
    const next = () => toks[p++];
    const expect = (t) => { const k = next(); if (!k || k.t !== t) throw new Error(`condition: expected '${t}'${k ? ` at ${k.i}` : ' at end'}`); return k; };
    const isWord = (w) => peek() && peek().t === 'word' && peek().v === w;
    function value() {
      const k = next();
      if (!k) throw new Error('condition: expected a value at end');
      if (k.t === 'value') return { value: k.v };
      if (k.t === 'word') {
        if (k.v.startsWith('var:')) return { var: k.v.slice(4) };
        return { value: V.parseBare(k.v) };
      }
      throw new Error(`condition: expected a value at ${k.i}`);
    }
    function primary() {
      const k = next();
      if (!k) throw new Error('condition: unexpected end');
      if (k.t === '(') { const e = or(); expect(')'); return e; }
      if (k.t === 'value' && KIT.isObject(k.v)) return k.v;      // raw JSON condition
      if (k.t !== 'word') throw new Error(`condition: unexpected '${k.raw || k.v || k.t}' at ${k.i}`);
      if (k.v === 'always') return null;
      if (k.v === 'never') return { kind: 'any', of: [] };
      if (peek() && peek().t === '(') {
        next();
        if (k.v === 'all' || k.v === 'any') {                    // all(a, b) / any()
          const of = [];
          while (peek() && peek().t !== ')') { of.push(or()); if (peek() && peek().t === ',') next(); }
          expect(')');
          return { kind: k.v, of };
        }
        const c = { kind: k.v };                                  // kind(key=value, …)
        while (peek() && peek().t !== ')') {
          const key = expect('word').v;
          const eq = expect('op'); if (eq.v !== '==') throw new Error(`condition: expected '=' at ${eq.i}`);
          const v = value(); if (v.var !== undefined) throw new Error(`condition: var: is not allowed here`);
          c[key] = v.value;
          if (peek() && peek().t === ',') next();
        }
        expect(')');
        return C.normalize(c);
      }
      const opTok = expect('op');
      const v = value();
      if (k.v.startsWith('self.')) { if (v.var !== undefined) throw new Error('condition: self cannot compare to a var'); return { kind: 'self', key: k.v.slice(5), op: opTok.v, value: v.value }; }
      if (k.v.startsWith('item.')) { if (typeof v.value !== 'number') throw new Error('condition: item count must be a number'); return { kind: 'item', id: k.v.slice(5), op: opTok.v, count: v.value }; }
      if (k.v.startsWith('meta.')) { if (v.var !== undefined) throw new Error('condition: meta cannot compare to a var'); return { kind: 'meta', key: k.v.slice(5), op: opTok.v, value: v.value }; }
      const out = { kind: 'var', name: k.v, op: opTok.v, value: v.var !== undefined ? 0 : v.value, var: v.var !== undefined ? v.var : null };
      return out;
    }
    function notExpr() { if (isWord('not')) { next(); return { kind: 'not', of: notExpr() }; } return primary(); }
    function and() { const parts = [notExpr()]; while (isWord('and')) { next(); parts.push(notExpr()); } return parts.length === 1 ? parts[0] : { kind: 'all', of: parts }; }
    function or() { const parts = [and()]; while (isWord('or')) { next(); parts.push(and()); } return parts.length === 1 ? parts[0] : { kind: 'any', of: parts }; }
    if (!toks.length) return null;
    const result = or();
    if (p < toks.length) throw new Error(`condition: unexpected '${toks[p].raw || toks[p].v || toks[p].t}' at ${toks[p].i}`);
    return C.normalize(result);
  };
  /** tryParseText(str) -> Condition | null | undefined (undefined = parse error). */
  C.tryParseText = function (str) { try { return C.parseText(str); } catch (e) { return undefined; } };

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// ---- js/kit/script/commands.js ----
// Commands: the 'commands' registry, every baseline command (§9.2) as a
// definition { fields, run(ctx, cmd), summary, text sugar }, the rich 'script'
// schema type, the generic `@id key=value` line form shared with Screenplay,
// and the kit's default Terms (strings). run() touches the world ONLY through
// the ports on ctx (documented below); the runtime implements them, tests fake them.
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const S = KIT.schema;
  const V = KIT.script.values;
  const T = KIT.text;
  const C = KIT.conditions;
  const CMD = KIT.commands = KIT.commands || {};
  const reg = KIT.registry('commands');
  // Workaround (core issue): registries.js validates every id against a lowercase-only pattern, but §9.2 names
  // commands in camelCase (setVar, inputNumber, moveRoute…). Widen the pattern on this registry's definition schema.
  for (const f of reg.opts.fields || []) if (f.key === 'id' && f.pattern) f.pattern = '^[a-zA-Z0-9][a-zA-Z0-9-_.:]*$';

  // ---- the ctx port contract -------------------------------------------------
  /**
   * @typedef {Object} RunCtx  What a command's run(ctx, cmd) may use. The interpreter builds it; the runtime (Phase 2) implements the ports.
   * @property {Object} project                 the project (read-only)
   * @property {Object} world                   { save, map, entities, events } — commands read/write `save` directly (vars, inventory, objects, timer, heroes[i].name) and emit events for every change
   * @property {string|null} self               the current object's save key ('town:mom') or null
   * @property {string} hero                    the triggering hero id ('p1' | 'p2')
   * @property {Object} [thread]                { id, background, cancelled, ... } (§9.6)
   * @property {function} rng                   KIT.rng — every random decision
   * @property {Object<string,*>} [args]        call arguments ({arg:name})
   * @property {function(string, Object)} emit  emit(event, payload) on the world bus: varChanged, selfChanged, itemChanged, objectStateChanged, timerChanged, heroRenamed, heal, debug
   * @property {RunIo} io
   * @property {RunAudio} audio
   * @property {RunScreen} screen
   * @property {RunPictures} pictures
   * @property {RunMap} map
   * @property {RunGame} game
   */
  /**
   * @typedef {Object} RunIo  main-thread scenes; all return promises
   * @property {function({who:string, face:string|null, text:string, position:string, bg:string, raw:string}):Promise} say
   * @property {function({prompt:string, options:Array<{text:string, index:number}>, cancel:string}):Promise<number>} choice  resolves the chosen option index (into the given list) or -1 on cancel
   * @property {function({hero:string, prompt:string, maxLength:number, current:string}):Promise<string|null>} nameEntry
   * @property {function({prompt:string, digits:number, current:number}):Promise<number|null>} inputNumber
   * @property {function({text:string}):Promise} toast
   * @property {function({title:string, subtitle:string, ms:number}):Promise} chapter
   * @property {function({text:string, speed:number, noFast:boolean}):Promise} scrollText
   * @property {function(number):Promise} wait   wait(ms)
   */
  /**
   * @typedef {Object} RunAudio
   * @property {function(string, {volume:number}):Promise} play        a sound effect
   * @property {function(string|null, {fade:number, volume:number}):Promise} music   start (or null = stop) the music
   * @property {function(string):Promise} stop     stop('sound' | 'music')
   * @property {function():Promise} save           remember the current music
   * @property {function():Promise} replay         resume the remembered music
   * @property {function(string):Promise} jingle   play a short piece, then resume the music
   */
  /**
   * @typedef {Object} RunScreen
   * @property {function({ms:number, color:string}):Promise} fadeOut
   * @property {function({ms:number}):Promise} fadeIn
   * @property {function({color:string, amount:number, ms:number}):Promise} tint
   * @property {function({color:string, ms:number}):Promise} flash
   * @property {function({power:number, ms:number}):Promise} shake
   * @property {function({kind:string, power:number, ms:number}):Promise} weather
   */
  /**
   * @typedef {Object} RunPictures
   * @property {function({id:string, image:string, x:number, y:number, anchor:string, opacity:number}):Promise} show
   * @property {function({id:string, x:number, y:number, opacity:number, ms:number, wait:boolean}):Promise} move
   * @property {function({id:string}):Promise} erase
   */
  /**
   * @typedef {Object} RunMap   `target` is 'self' | 'hero' | 'p1' | 'p2' | 'obj:<id>'
   * @property {function({map:string, x:number, y:number, dir:string, fade:boolean}):Promise} transfer
   * @property {function({target:string, x:number, y:number, swap:string|null}):Promise} setLocation
   * @property {function({target:string, steps:string[], wait:boolean, skipBlocked:boolean, repeat:boolean}):Promise} moveRoute
   * @property {function({dx:number, dy:number, speed:number}):Promise} scrollMap
   * @property {function({target:string, on:boolean}):Promise} transparency
   * @property {function({target:string, id:string}):Promise} animation
   * @property {function({target:string, kind:string, wait:boolean}):Promise} balloon
   * @property {function({target:string, persistent:boolean}):Promise} erase
   * @property {function({on:boolean}):Promise} follow
   */
  /**
   * @typedef {Object} RunGame
   * @property {function():Promise} menu
   * @property {function({slot:string}):Promise<boolean>} save
   * @property {function():Promise} title
   * @property {function({hero:string}):Promise} heal
   * @property {function({text:string}):void} debug
   */
  /**
   * @typedef {Object} ControlSignal  What flow commands return for the interpreter (other commands return undefined).
   *   { kind:'block', body:Command[], loop?:true }   run the nested list (again and again when loop)
   *   { kind:'break' } | { kind:'jump', label } | { kind:'exit' } | { kind:'call', script, args }
   */
  /** @typedef {Object} Command  { t, disabled?, ...fields of the command }; { t:'raw', line } is a line Screenplay could not parse. */

  // ---- helpers ---------------------------------------------------------------

  const has = (o, k) => o !== null && o !== undefined && Object.prototype.hasOwnProperty.call(o, k);
  const save = (ctx) => { const w = ctx.world || (ctx.world = {}); return w.save || (w.save = {}); };
  const emit = (ctx, event, payload) => {
    if (typeof ctx.emit === 'function') ctx.emit(event, payload);
    else if (ctx.world && ctx.world.events && typeof ctx.world.events.emit === 'function') ctx.world.events.emit(event, payload);
  };
  const port = (ctx, group, name) => {
    const g = ctx[group];
    if (!g || typeof g[name] !== 'function') throw new Error(`commands: ctx.${group}.${name} is not available`);
    return (...args) => g[name](...args);
  };
  const strings = (ctx, key, vars) => KIT.strings.get(ctx.project, key, vars);
  const itemName = (ctx, id) => { const it = ctx && ctx.project && ctx.project.items && ctx.project.items[id]; return it && it.name ? it.name : String(id); };
  const plain = (str, ctx) => T.plain(str, ctx);
  const short = (s, n) => { s = String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); return s.length > (n || 40) ? s.slice(0, (n || 40) - 1) + '…' : s; };
  const targetField = (def) => ({ key: 'target', type: 'string', default: def, target: true, doc: 'self, hero, p1, p2 or obj:<id>' });
  const heroField = (def, opts) => ({ key: 'hero', type: 'enum', options: opts || ['hero', 'p1', 'p2'], default: def || 'hero' });
  const heroIdFor = (ctx, sel) => (!sel || sel === 'hero' ? C.heroId(ctx) : sel);

  /** State helpers (shared with the interpreter and systems): every write emits its event. */
  const STATE = CMD.state = {
    getVar: (ctx, name) => C.getVar(ctx, name),
    setVar(ctx, name, value) {
      const s = save(ctx); s.vars = s.vars || {};
      const old = s.vars[name];
      s.vars[name] = value;
      emit(ctx, 'varChanged', { name, old, value });
      return value;
    },
    getSelf: (ctx, key, objectKey) => C.getSelf(ctx, key, objectKey),
    setSelf(ctx, key, value, objectKey) {
      const k = objectKey || ctx.self;
      if (!k) throw new Error('commands: setSelf needs a current object (ctx.self)');
      const s = save(ctx); s.objects = s.objects || {};
      const o = s.objects[k] || (s.objects[k] = { self: {} });
      o.self = o.self || {};
      const old = o.self[key];
      o.self[key] = value;
      emit(ctx, 'selfChanged', { objectKey: k, key, old, value });
      return value;
    },
    count: (ctx, id) => C.count(ctx, id),
    give(ctx, id, delta) {
      const s = save(ctx); s.inventory = s.inventory || {};
      const before = Number(s.inventory[id]) || 0;
      const after = Math.max(0, before + delta);
      if (after === 0) delete s.inventory[id]; else s.inventory[id] = after;
      emit(ctx, 'itemChanged', { id, delta: after - before, count: after });
      return after;
    },
    heroName(ctx, heroId) {
      const i = C.heroIndex(ctx, heroId);
      const s = save(ctx);
      const h = (s.heroes || [])[i];
      if (h && h.name != null) return h.name;
      const p = ((ctx.project && ctx.project.heroes) || [])[i];
      return p ? p.name : heroId;
    },
    setHeroName(ctx, heroId, name) {
      const i = C.heroIndex(ctx, heroId);
      const s = save(ctx); s.heroes = s.heroes || [];
      while (s.heroes.length <= i) s.heroes.push({});
      const old = s.heroes[i].name;
      s.heroes[i].name = name;
      emit(ctx, 'heroRenamed', { hero: heroId, old, name });
      return name;
    },
  };

  // ---- default Terms -----------------------------------------------------------
  // The keys commands read. project.js registers the shared table; only missing keys are added here (no replace warnings in either load order).
  const STRINGS = KIT.registry('strings');
  for (const d of [
    { id: 'got-item', default: 'Got {count} {item}!', doc: 'give with notify' },
    { id: 'lost-item', default: 'Lost {count} {item}.', doc: 'take with notify' },
    { id: 'save-prompt', default: 'Save your progress?' },
    { id: 'saved', default: 'Saved.' },
    { id: 'save-failed', default: 'Could not save.' },
    { id: 'yes', default: 'Yes' }, { id: 'no', default: 'No' }, { id: 'ok', default: 'OK' }, { id: 'cancel', default: 'Cancel' }, { id: 'continue', default: 'Continue' },
    { id: 'name-prompt', default: 'What is your name?' },
    { id: 'number-prompt', default: 'Enter a number' },
    { id: 'timer-up', default: 'Time is up!' },
  ]) if (!STRINGS.has(d.id)) STRINGS.add(d);

  // ---- line-form helpers (sugar) ----------------------------------------------

  const ESC = (s) => String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n');
  const UNESC = (s) => String(s).replace(/\\(.)/g, (m, c) => (c === 'n' ? '\n' : c));
  const ESCQ = (s) => ESC(s).replace(/"/g, '\\"');
  /** Non-default keys of cmd (in field order) as `key=value` text; `skip` keys are omitted. */
  function pairsOf(def, cmd, skip) {
    const keys = keysFor(def, cmd).filter(k => !skip.includes(k));
    return keys.map(k => `${k}=${V.format(cmd[k])}`).join(' ');
  }
  /** '(a=1, b=x)' style option group. */
  const parenPairs = (def, cmd, keys) => { const ks = keysFor(def, cmd).filter(k => keys.includes(k)); return ks.length ? `(${ks.map(k => `${k}=${V.format(cmd[k])}`).join(', ')})` : ''; };
  const parseParens = (s) => { const o = {}; for (const tk of V.tokenize(s || '', { separators: ',' })) if (tk.key) o[tk.key] = tk.value; return o; };

  /** positional(def, keys) -> text sugar `@id v1 v2 … key=value` for the listed keys in order (only leading ones that are set). */
  function positional(id, keys) {
    return {
      toLine(cmd) {
        const def = reg.get(cmd.t);
        const words = [];
        for (const k of keys) { if (cmd[k] === undefined || cmd[k] === null) break; words.push(V.format(cmd[k])); }
        const used = keys.slice(0, words.length);
        const rest = pairsOf(def, cmd, used);
        return `@${id}${words.length ? ' ' + words.join(' ') : ''}${rest ? ' ' + rest : ''}`;
      },
      fromLine(line) {
        const m = new RegExp(`^@${id}(?:\\s+(.*))?$`).exec(line.trim());
        if (!m) return null;
        const cmd = { t: id };
        let pos = 0;
        for (const tk of V.tokenize(m[1] || '')) {
          if (tk.key) cmd[tk.key] = tk.value;
          else { if (pos >= keys.length) return null; cmd[keys[pos++]] = tk.value; }

        return cmd;

    };
  }

  const SAY_LINE = /^([^\s@?#":\-\[][^:(\n]*?)\s*(?:\(([^)]*)\))?:\s?(.*)$/;
  const SAY_WHO = /^[^\s@?#":\-\[][^:(\n]*$/;
  const NARRATION_LINE = /^"((?:[^"\\]|\\.)*)"\s*(?:\(([^)]*)\))?\s*$/;
  const sayOpts = (cmd) => { const o = {}; if (cmd.face) o.face = cmd.face; if (cmd.position && cmd.position !== 'bottom') o.at = cmd.position; if (cmd.bg && cmd.bg !== 'window') o.bg = cmd.bg; return Object.keys(o).map(k => `${k}=${V.format(o[k])}`).join(', '); };
  const sayFromOpts = (cmd, opts) => { if (opts.face !== undefined) cmd.face = opts.face; if (opts.at !== undefined) cmd.position = opts.at; if (opts.bg !== undefined) cmd.bg = opts.bg; return cmd; };

  const ROUTE_STEPS = 'up down left right randomStep towardHero awayHero face:<dir> faceHero turnRandom jump:dx,dy wait:ms sprite:<id> speed:n through:on|off visible:on|off sound:<id> dirFix:on|off stepAnim:on|off';

  const defs = [];

  // Message

    async run(ctx, cmd) {

    },
    summary(cmd) { return `${cmd.who ? cmd.who + ': ' : ''}${short(T.strip(cmd.text), 60)}`; },
    text: {
      toLine(cmd) {

      },
      fromLine(line) {
        let m = NARRATION_LINE.exec(line);
        if (m) return sayFromOpts({ t: 'say', who: '', text: UNESC(m[1]) }, parseParens(m[2]));
        m = SAY_LINE.exec(line);

  defs.push({
    id: 'choice', label: 'Show Choices', mv: 'Show Choices', group: 'Message', icon: 'list', background: false, blocking: true, control: true, editor: { favourite: true },
    fields: [
      { key: 'prompt', type: 'text', default: '' },

      { key: 'cancel', type: 'enum', options: ['none', 'last', 'skip'], default: 'none', doc: 'B button: none = cannot cancel, last = picks the last option, skip = picks nothing' },
    ],
    async run(ctx, cmd) {
      const visible = [];
      (cmd.options || []).forEach((o, index) => { if (C.test(o.when, ctx)) visible.push({ text: T.substitute(o.text || '', ctx), index }); });
      if (!visible.length) return undefined;
      let i = await port(ctx, 'io', 'choice')({ prompt: T.substitute(cmd.prompt || '', ctx), options: visible, cancel: cmd.cancel || 'none' });

    },
    summary(cmd) { return `Choice: ${short(T.strip(cmd.prompt), 30) || '…'} [${(cmd.options || []).map(o => short(o.text, 12)).join(' / ')}]`; },
    text: {
      toLine(cmd) { const p = parenPairs(reg.get('choice'), cmd, ['cancel']); return `?${cmd.prompt ? ' ' + ESC(cmd.prompt) : ''}${p ? ' ' + p : ''}`; },
      fromLine(line) {
        const m = /^\?(?:\s(.*))?$/.exec(line);
        if (!m) return null;

        const pm = /\s*\(([^()]*)\)\s*$/.exec(prompt);
        if (pm) { const o = parseParens(pm[1]); if (has(o, 'cancel')) { cmd.cancel = o.cancel; prompt = prompt.slice(0, pm.index); } }

      },
    },
  });
  /** Choice option lines: `- text` | `- text [when: cond]`. Screenplay uses these for the nested `- ` lines. */
  CMD.option = {
    toLine(opt) { return `- ${ESC(opt.text)}${opt.when ? ` [when: ${C.toText(opt.when)}]` : ''}`; },
    fromLine(line) {
      const m = /^-(?: (.*)|)$/.exec(line);
      if (!m) return null;
      let text = m[1] || '', when = null;
      const wm = /\s*\[when:\s*(.*)\]\s*$/.exec(text);
      if (wm) { when = C.parseText(wm[1]); text = text.slice(0, wm.index); }
      return { text: UNESC(text), when, then: [] };
    },
  };
  defs.push({
    id: 'inputNumber', label: 'Input Number', mv: 'Input Number', group: 'Message', icon: 'keypad', background: false, blocking: true,
    fields: [{ key: 'var', type: 'ref:var', nullable: false, access: 'write', label: 'Variable' }, { key: 'digits', type: 'number', integer: true, min: 1, max: 8, default: 3 }, { key: 'prompt', type: 'text', default: '' }],
    async run(ctx, cmd) {
      const n = await port(ctx, 'io', 'inputNumber')({ prompt: T.substitute(cmd.prompt || strings(ctx, 'number-prompt'), ctx), digits: cmd.digits || 3, current: Number(STATE.getVar(ctx, cmd.var)) || 0 });
      if (typeof n === 'number' && Number.isFinite(n)) STATE.setVar(ctx, cmd.var, n);
    },
    summary(cmd) { return `Input number → ${cmd.var}`; },
  });
  defs.push({
    id: 'scrollText', label: 'Show Scrolling Text', mv: 'Show Scrolling Text', group: 'Message', icon: 'scroll', background: false, blocking: true,
    fields: [{ key: 'text', type: 'text', default: '' }, { key: 'speed', type: 'number', min: 1, max: 8, default: 2 }, { key: 'noFast', type: 'bool', default: false, label: 'No fast forward' }],
    async run(ctx, cmd) { await port(ctx, 'io', 'scrollText')({ text: T.substitute(cmd.text || '', ctx), speed: cmd.speed || 2, noFast: !!cmd.noFast }); },
    summary(cmd) { return `Scroll: ${short(T.strip(cmd.text), 50)}`; },
  });

  // Progression
  const VAR_OPS = ['set', 'add', 'sub', 'mul', 'div', 'mod', 'random', 'copyVar'];
  const OP_SYM = { set: '=', add: '+=', sub: '-=', mul: '*=', div: '/=', mod: '%=' };
  const SYM_OP = { '=': 'set', '+=': 'add', '-=': 'sub', '*=': 'mul', '/=': 'div', '%=': 'mod' };
  function applyOp(op, cur, v) {
    const n = Number(cur) || 0, m = Number(v) || 0;
    switch (op) {
      case 'add': return n + m;
      case 'sub': return n - m;
      case 'mul': return n * m;
      case 'div': return m === 0 ? n : n / m;
      case 'mod': return m === 0 ? n : n % m;
      default: return v;
    }
  }
  defs.push({
    id: 'setVar', label: 'Control Variables', mv: 'Control Variables', group: 'Progression', icon: 'var', blocking: false, editor: { favourite: true },
    fields: [
      { key: 'name', type: 'ref:var', nullable: false, access: 'write', label: 'Variable' },
      { key: 'op', type: 'enum', options: VAR_OPS, default: 'set' },
      { key: 'value', type: 'scalar', default: 0, when: { field: 'op', in: ['set', 'add', 'sub', 'mul', 'div', 'mod'] } },
      { key: 'var', type: 'ref:var', label: 'From variable', when: { field: 'op', eq: 'copyVar' } },
      { key: 'min', type: 'number', integer: true, default: 1, when: { field: 'op', eq: 'random' } },
      { key: 'max', type: 'number', integer: true, default: 6, when: { field: 'op', eq: 'random' } },
    ],
    async run(ctx, cmd) {
      const op = cmd.op || 'set';
      let v;
      if (op === 'random') { const lo = Math.min(cmd.min, cmd.max), hi = Math.max(cmd.min, cmd.max); v = ctx.rng ? ctx.rng.range(lo, hi) : lo; }
      else if (op === 'copyVar') v = STATE.getVar(ctx, cmd.var);
      else v = applyOp(op, STATE.getVar(ctx, cmd.name), cmd.value);
      STATE.setVar(ctx, cmd.name, v === undefined ? null : v);
    },
    summary(cmd) {
      const op = cmd.op || 'set';
      if (op === 'random') return `${cmd.name} = random ${cmd.min}…${cmd.max}`;
      if (op === 'copyVar') return `${cmd.name} = {var:${cmd.var}}`;
      return `${cmd.name} ${OP_SYM[op]} ${V.format(cmd.value)}`;
    },
    text: {
      toLine(cmd) {
        const op = cmd.op || 'set';
        if (!V.WORD.test(cmd.name || '')) return null;
        if (op === 'random') return `@set ${cmd.name} = random(${Number(cmd.min) || 0}, ${Number(cmd.max) || 0})`;
        if (op === 'copyVar') return `@set ${cmd.name} = var:${cmd.var}`;
        return `@set ${cmd.name} ${OP_SYM[op]} ${V.format(cmd.value, { bare: V.WORD })}`;
      },
      fromLine(line) {
        const m = /^@set\s+(\S+)\s*(=|\+=|-=|\*=|\/=|%=)\s*(.*)$/.exec(line.trim());
        if (!m) return null;
        const cmd = { t: 'setVar', name: m[1], op: SYM_OP[m[2]] };
        const rest = m[3].trim();
        const rm = /^random\(\s*(-?\d+)\s*,\s*(-?\d+)\s*\)$/.exec(rest);
        if (rm && cmd.op === 'set') { cmd.op = 'random'; cmd.min = Number(rm[1]); cmd.max = Number(rm[2]); return cmd; }
        const vm = /^var:(\S+)$/.exec(rest);
        if (vm && cmd.op === 'set') { cmd.op = 'copyVar'; cmd.var = vm[1]; return cmd; }
        const sc = V.scan(rest, 0, '');
        cmd.value = sc && sc.end >= rest.length ? sc.value : rest;
        return cmd;
      },
    },
  });
  defs.push({
    id: 'setSelf', label: 'Self State', mv: 'Control Self Switch', group: 'Progression', icon: 'self', blocking: false, editor: { favourite: true },
    fields: [
      { key: 'key', type: 'string', min: 1, default: 'done' },
      { key: 'op', type: 'enum', options: ['set', 'add', 'sub', 'toggle'], default: 'set' },
      { key: 'value', type: 'scalar', default: true, when: { field: 'op', in: ['set', 'add', 'sub'] } },
    ],
    async run(ctx, cmd) {
      const op = cmd.op || 'set';
      const cur = STATE.getSelf(ctx, cmd.key);
      const v = op === 'toggle' ? !cur : applyOp(op, cur, cmd.value);
      STATE.setSelf(ctx, cmd.key, v);
    },
    summary(cmd) { const op = cmd.op || 'set'; return op === 'toggle' ? `self.${cmd.key} toggle` : `self.${cmd.key} ${OP_SYM[op]} ${V.format(cmd.value)}`; },
    text: {
      toLine(cmd) {
        const op = cmd.op || 'set';
        if (!V.WORD.test(cmd.key || '')) return null;
        if (op === 'toggle') return `@self ${cmd.key} toggle`;
        return `@self ${cmd.key} ${OP_SYM[op]} ${V.format(cmd.value, { bare: V.WORD })}`;
      },
      fromLine(line) {
        let m = /^@self\s+(\S+)\s+toggle$/.exec(line.trim());
        if (m) return { t: 'setSelf', key: m[1], op: 'toggle' };
        m = /^@self\s+(\S+)\s*(=|\+=|-=)\s*(.*)$/.exec(line.trim());
        if (!m) return null;
        const rest = m[3].trim();
        const sc = V.scan(rest, 0, '');
        return { t: 'setSelf', key: m[1], op: SYM_OP[m[2]], value: sc && sc.end >= rest.length ? sc.value : rest };
      },
    },
  });
  defs.push({
    id: 'timer', label: 'Control Timer', mv: 'Control Timer', group: 'Progression', icon: 'timer', blocking: false,
    fields: [{ key: 'op', type: 'enum', options: ['start', 'stop'], default: 'start' }, { key: 'seconds', type: 'number', min: 0, default: 60, when: { field: 'op', eq: 'start' } }],
    async run(ctx, cmd) {
      const s = save(ctx);
      s.timer = cmd.op === 'stop' ? { running: false, secondsLeft: 0 } : { running: true, secondsLeft: Number(cmd.seconds) || 0 };
      emit(ctx, 'timerChanged', Object.assign({}, s.timer));
    },
    summary(cmd) { return cmd.op === 'stop' ? 'Stop timer' : `Start timer ${cmd.seconds}s`; },
  });

  // Flow
  defs.push({
    id: 'if', label: 'Conditional Branch', mv: 'Conditional Branch', group: 'Flow', icon: 'branch', blocking: false, control: true, editor: { favourite: true },
    fields: [{ key: 'when', type: 'condition' }, { key: 'then', type: 'script' }, { key: 'else', type: 'script' }],
    async run(ctx, cmd) { return { kind: 'block', body: (C.test(cmd.when, ctx) ? cmd.then : cmd.else) || [] }; },
    summary(cmd, ctx) { return `If ${C.describe(cmd.when, ctx)}`; },
    text: {
      elseLine: '@else', endLine: '@end',
      toLine(cmd) { return cmd.when ? `@if when: ${C.toText(cmd.when)}` : '@if'; },
      fromLine(line) {
        const m = /^@if(?:\s+(?:when:\s*)?(.*))?$/.exec(line.trim());
        if (!m) return null;
        return { t: 'if', when: m[1] ? C.parseText(m[1]) : null, then: [], else: [] };
      },
    },
  });
  defs.push({
    id: 'loop', label: 'Loop', mv: 'Loop', group: 'Flow', icon: 'loop', blocking: false, control: true,
    fields: [{ key: 'body', type: 'script' }],
    async run(ctx, cmd) { return { kind: 'block', body: cmd.body || [], loop: true }; },
    summary() { return 'Loop'; },
    text: { endLine: '@end' },
  });

  // ---- structure helpers -----------------------------------------------------

  /** blockFields(def) -> keys holding nested command lists directly ('then', 'else', 'body') or via option groups ('options'). */
  CMD.blockFields = function (def) {
    const out = [];
    for (const f of S.fields((def && def.fields) || [])) {
      if (f.type === 'script') out.push(f.key);
      else if (f.type === 'list' && f.of && f.of.type === 'group' && (f.of.fields || []).some(g => g.type === 'script')) out.push(f.key);
    }

  /** nested(cmd) -> [{ key, path, list }] every nested command list of cmd with its path relative to cmd. */
  CMD.nested = function (cmd) {
    const def = reg.get(cmd && cmd.t);
    const out = [];
    if (!def) return out;
    for (const f of S.fields(def.fields || [])) {
      if (f.type === 'script' && Array.isArray(cmd[f.key])) out.push({ key: f.key, path: [f.key], list: cmd[f.key] });
      else if (f.type === 'list' && f.of && f.of.type === 'group' && Array.isArray(cmd[f.key])) {
        const scriptKeys = (f.of.fields || []).filter(g => g.type === 'script').map(g => g.key);
        cmd[f.key].forEach((item, i) => { for (const k of scriptKeys) if (item && Array.isArray(item[k])) out.push({ key: f.key, path: [f.key, i, k], list: item[k] }); });

  CMD.walk = function (cmds, fn, path) {
    path = path || [];
    (cmds || []).forEach((cmd, i) => {
      const p = path.concat(i);

      for (const n of CMD.nested(cmd)) CMD.walk(n.list, fn, p.concat(n.path));

  CMD.normalize = function (cmd) {

  /** Keys of cmd worth writing: fields (in order) whose value differs from the default, then extra keys (sorted). Never 't'. */
  function keysFor(def, cmd) {
    const out = [];

      if (cmd[f.key] === null && (f.nullable || f.optional)) continue;
      if (!S.visible(f, cmd)) continue;

  }
  CMD.keysFor = keysFor;

  // ---- line form -------------------------------------------------------------

  /** genericToLine(cmd) -> '@id key=value …' (nested block lists are left to Screenplay's indentation). */
  CMD.genericToLine = function (cmd) {
    const def = reg.get(cmd.t);
    const pairs = keysFor(def, cmd).map(k => `${k}=${V.format(cmd[k])}`);
    return `@${cmd.t}${pairs.length ? ' ' + pairs.join(' ') : ''}`;

  /** genericFromLine(line) -> cmd | null. Only `key=value` pairs are accepted (positional words make it null). */

    const m = /^@([A-Za-z_][\w-]*)(?:\s+(.*))?$/.exec(String(line).trim());
    if (!m) return null;

  };

  CMD.reservedLines = ['@else', '@end'];
  /** toLine(cmd) -> the canonical Screenplay line: the command's sugar when it can express the command, else the generic form. A disabled command always uses the generic form (`disabled=true`). */
  CMD.toLine = function (cmd) {
    if (!KIT.isObject(cmd)) return '';
    if (cmd.t === 'raw') return String(cmd.line == null ? '' : cmd.line);
    const def = reg.get(cmd.t);
    if (!cmd.disabled && def && def.text && typeof def.text.toLine === 'function') {
      const line = def.text.toLine(cmd);

    }

  /** fromLine(line) -> normalized cmd | null. Tries every command's sugar, then the generic form. Nested lists come back empty. */
  CMD.fromLine = function (line) {

    if (!s.trim() || CMD.reservedLines.includes(s.trim())) return null;
    for (const def of reg.list()) {

      try { cmd = def.text.fromLine(s); } catch (e) { cmd = null; }
      if (cmd) return CMD.normalize(cmd);
    }
    const g = CMD.genericFromLine(s);

  };

  // ---- summaries, validation, refs, execution -------------------------------

  /** summary(cmd, ctx) -> one line for the command card. */
  CMD.summary = function (cmd, ctx) {
    if (!KIT.isObject(cmd)) return '';
    if (cmd.t === 'raw') return `Unparsed: ${short(cmd.line, 50)}`;
    const def = reg.get(cmd.t);
    let s;
    if (!def) s = `Unknown command '${cmd.t}'`;

    else s = def.label || cmd.t;
    return cmd.disabled ? `(off) ${s}` : s;
  };
  /**
   * validateScript(cmds, ctx) -> [{ path, message, code }]. ctx: { project, map, background:true for tick/parallel threads }.
   */
  CMD.validateScript = function (cmds, ctx) { return S.validateValue({ key: 'script', type: 'script' }, cmds, ctx); };
  /** refs(cmds, ctx) -> [{ kind, id, path, access:'read'|'write' }] */
  CMD.refs = function (cmds, ctx) { const out = []; S._refsField({ key: 'script', type: 'script' }, cmds, ctx || {}, [], out); return out; };
  /** exec(ctx, cmd) -> Promise<ControlSignal|undefined>: skips disabled/raw/unknown commands (unknown ones warn once). */
  const warned = new Set();
  CMD.exec = async function (ctx, cmd) {
    if (!KIT.isObject(cmd) || cmd.disabled || cmd.t === 'raw') return undefined;
    const def = reg.get(cmd.t);
    if (!def || typeof def.run !== 'function') {
      if (!warned.has(cmd.t)) { warned.add(cmd.t); (KIT.log || console).warn(`[commands] unknown command '${cmd.t}' skipped`); }

    if (ctx && ctx.thread && ctx.thread.background && def.background === false) throw new Error(`commands: '${cmd.t}' cannot run on a background thread`);

  CMD.list = () => reg.list();
  CMD.ids = () => reg.ids();

  // ---- schema: the rich 'script' type ---------------------------------------
  S.defineType('script', {
    validate(f, v, ctx, path, errors) {
      if (!Array.isArray(v)) return errors.push({ path: path.slice(), message: 'must be a list of commands', code: 'type' });
      v.forEach((c, i) => {
        const p = path.concat(i);
        if (!KIT.isObject(c) || typeof c.t !== 'string') return errors.push({ path: p, message: 'each command needs a type (t)', code: 'type' });
        if (c.t === 'raw') { if (typeof c.line !== 'string') errors.push({ path: p.concat('line'), message: 'a raw line needs text', code: 'type' }); return; }
        const def = reg.get(c.t);
        if (!def) return errors.push({ path: p, message: `unknown command '${c.t}'`, code: 'unknown' });
        if (ctx && ctx.background && def.background === false) errors.push({ path: p, message: `'${c.t}' cannot run on a background (tick/parallel) thread`, code: 'background' });
        if (has(c, 'disabled') && typeof c.disabled !== 'boolean') errors.push({ path: p.concat('disabled'), message: 'must be true or false', code: 'type' });

      });
    },
    default() { return []; },
    refs(f, v, ctx, path, out) {
      if (!Array.isArray(v)) return;
      v.forEach((c, i) => {
        const def = KIT.isObject(c) && reg.get(c.t);

        const p = path.concat(i);
        S._refsFields(def.fields || [], c, ctx || {}, p, out);
        for (const fld of S.fields(def.fields || [])) if (fld.target) C.targetRefs(c[fld.key], p.concat(fld.key), out);

    fill(f, v) { return Array.isArray(v) ? v.map(CMD.normalize) : v; },

<script>
// ---- js/kit/script/screenplay.js ----
// Screenplay: the plain-text view of a script (§9.5). Lossless by
// construction — the JSON command list is the truth, this is a rendering of
// it that parses back to the same list. Anything that cannot be parsed becomes
// { t:'raw', line } (never dropped) and is reported as a problem.
//
//   KIT.screenplay.serialize(commands) -> text
//   KIT.screenplay.parse(text) -> { commands, problems:[{ line, message, raw }] }
//   KIT.screenplay.serializeDocument(sections) / parseDocument(text)   (":: id [tags] when: …" sections)
(function (root) {
  const KIT = root.KIT = root.KIT || {};
  const CMD = KIT.commands;
  const C = KIT.conditions;
  const V = KIT.script.values;
  const reg = KIT.registry('commands');
  const SP = KIT.screenplay = KIT.screenplay || {};

  SP.INDENT = '    ';
  const pad = (level) => SP.INDENT.repeat(level);
  const OPTION = /^-(?: |$)/;
  const isEnd = (s) => s === '@end';
  const isElse = (s) => s === '@else';

  /** How a command lays out its nested lists: 'if' | 'choice' | { body: key } | 'inline' | null */
  SP.layout = function (cmd) {
    if (!KIT.isObject(cmd)) return null;
    if (cmd.t === 'if') return 'if';
    if (cmd.t === 'choice') return 'choice';
    const def = reg.get(cmd.t);
    if (!def) return null;
    const blocks = CMD.blockFields(def);
    if (!blocks.length) return null;
    const fields = KIT.schema.fields(def.fields || []);
    if (blocks.length === 1) {
      const f = fields.find(x => x.key === blocks[0]);
      if (f && f.type === 'script' && def.text && def.text.endLine) return { body: f.key };
    }
    return 'inline';
  };

  // ---- serialize ---------------------------------------------------------------
  function commandLine(cmd) {
    const layout = SP.layout(cmd);
    if (layout === 'inline') {
      // Generic form plus the nested lists as JSON pairs (keysFor skips block fields).
      const def = reg.get(cmd.t);
      const blocks = CMD.blockFields(def);
      const base = CMD.genericToLine(cmd);
      const pairs = blocks.filter(k => cmd[k] !== undefined).map(k => `${k}=${JSON.stringify(cmd[k])}`);
      return pairs.length ? `${base} ${pairs.join(' ')}` : base;
    }
    return CMD.toLine(cmd);
  }
  function writeList(cmds, level, out) {
    for (const cmd of cmds || []) {
      if (!KIT.isObject(cmd)) { out.push(pad(level) + JSON.stringify(cmd)); continue; }
      if (cmd.t === 'raw') { out.push(pad(level) + String(cmd.line == null ? '' : cmd.line).replace(/\r?\n/g, ' ')); continue; }
      const layout = SP.layout(cmd);
      out.push(pad(level) + commandLine(cmd));
      if (layout === 'if') {
        writeList(cmd.then, level + 1, out);
        if (Array.isArray(cmd.else) && cmd.else.length) { out.push(pad(level) + '@else'); writeList(cmd.else, level + 1, out); }
        out.push(pad(level) + '@end');
      } else if (layout === 'choice') {
        for (const opt of cmd.options || []) {
          out.push(pad(level) + CMD.option.toLine(opt));
          writeList(opt.then, level + 1, out);
        }
      } else if (layout && layout.body) {
        writeList(cmd[layout.body], level + 1, out);
        out.push(pad(level) + '@end');
      }
    }
  }
  /** serialize(commands, level=0) -> canonical text (no trailing newline). */
  SP.serialize = function (cmds, level) {
    const out = [];
    writeList(cmds || [], level || 0, out);
    return out.join('\n');
  };

  // ---- parse --------------------------------------------------------------------
  function indentOf(raw) {
    let n = 0;
    for (const ch of raw) { if (ch === ' ') n++; else if (ch === '\t') n += 4; else break; }
    return n;
  }
  /** parse(text) -> { commands, problems } */
  SP.parse = function (text) {
    const problems = [];
    const items = [];
    String(text == null ? '' : text).split(/\r?\n/).forEach((raw, i) => {
      const body = raw.trim();
      if (!body) return;
      const spaces = indentOf(raw);
      if (spaces % 4 !== 0) problems.push({ line: i + 1, message: 'indentation should be a multiple of 4 spaces', raw });
      items.push({ n: i + 1, raw, body, level: Math.floor(spaces / 4) });
    });
    let pos = 0;
    const peek = () => items[pos];
    const problem = (it, message) => problems.push({ line: it.n, message, raw: it.raw });
    const rawCmd = (it) => ({ t: 'raw', line: it.body });
    const atLevel = (level, pred) => { const it = peek(); return !!it && it.level === level && pred(it.body); };

    function parseList(level) {
      const cmds = [];
      while (pos < items.length) {
        const it = peek();
        if (it.level < level) break;
        if (it.level > level) { problem(it, 'unexpected indentation'); cmds.push(rawCmd(it)); pos++; continue; }
        if (isEnd(it.body) || isElse(it.body)) { problem(it, `stray ${it.body}`); cmds.push(rawCmd(it)); pos++; continue; }
        if (OPTION.test(it.body)) { problem(it, 'a choice option (- …) outside a choice'); cmds.push(rawCmd(it)); pos++; continue; }
        let cmd = null;
        try { cmd = CMD.fromLine(it.body); } catch (e) { cmd = null; problem(it, e && e.message ? e.message : 'could not read this line'); }
        if (!cmd) { if (!problems.some(p => p.line === it.n)) problem(it, 'could not read this line'); cmds.push(rawCmd(it)); pos++; continue; }
        pos++;
        const layout = SP.layout(cmd);
        if (layout === 'if') {
          cmd.then = parseList(level + 1);
          if (atLevel(level, isElse)) { pos++; cmd.else = parseList(level + 1); }
          else cmd.else = Array.isArray(cmd.else) ? cmd.else : [];
          if (atLevel(level, isEnd)) pos++; else problem(it, `missing @end for the @if on line ${it.n}`);
        } else if (layout === 'choice') {
          cmd.options = [];
          while (atLevel(level, (b) => OPTION.test(b))) {
            const optItem = peek();
            let opt = null;
            try { opt = CMD.option.fromLine(optItem.body); } catch (e) { problem(optItem, e && e.message ? e.message : 'bad option'); }
            pos++;
            if (!opt) { opt = { text: optItem.body.replace(OPTION, ''), when: null, then: [] }; }
            opt.then = parseList(level + 1);
            cmd.options.push(opt);
          }
          if (!cmd.options.length) problem(it, 'a choice needs at least one - option');
        } else if (layout && layout.body) {
          cmd[layout.body] = parseList(level + 1);
          if (atLevel(level, isEnd)) pos++; else problem(it, `missing @end for @${cmd.t} on line ${it.n}`);
        }
        cmds.push(CMD.normalize(cmd));
      }
      return cmds;
    }
    const commands = parseList(0);
    return { commands, problems };
  };

  // ---- documents (many scripts in one text) ---------------------------------------
  const HEADER = /^::\s+(\S+)(?:\s+\[([^\]]*)\])?(?:\s+when:\s*(.*?))?\s*$/;
  const TRIGGERS = ['call', 'auto', 'parallel'];
  /** section: { id, trigger:'call'|'auto'|'parallel', tags:[], when:Condition|null, commands } */
  SP.serializeDocument = function (sections) {
    return (sections || []).map(sec => {
      const tags = [];
      if (sec.trigger && sec.trigger !== 'call') tags.push(sec.trigger);
      for (const t of sec.tags || []) if (!tags.includes(t)) tags.push(t);
      let head = `:: ${sec.id}`;
      if (tags.length) head += ` [${tags.join(' ')}]`;
      if (sec.when) head += ` when: ${C.toText(sec.when)}`;
      const body = SP.serialize(sec.commands || []);
      return body ? `${head}\n${body}` : head;
    }).join('\n\n');
  };
  /** parseDocument(text) -> { sections:[{ id, trigger, tags, when, commands, line }], problems } (lines before the first header go to a section with id null when non-empty). */
  SP.parseDocument = function (text) {
    const lines = String(text == null ? '' : text).split(/\r?\n/);
    const problems = [];
    const sections = [];
    let cur = { id: null, trigger: 'call', tags: [], when: null, lines: [], line: 1 };
    lines.forEach((raw, i) => {
      const m = HEADER.exec(raw);
      if (m) {
        if (cur.id !== null || cur.lines.some(l => l.trim())) sections.push(cur);
        const tags = (m[2] || '').split(/\s+/).filter(Boolean);
        const trigger = tags.find(t => TRIGGERS.includes(t)) || 'call';
        let when = null;
        if (m[3] != null && m[3] !== '') {
          try { when = C.parseText(m[3]); } catch (e) { problems.push({ line: i + 1, message: `bad when: ${e.message}`, raw }); }
        }
        cur = { id: m[1], trigger, tags: tags.filter(t => !TRIGGERS.includes(t)), when, lines: [], line: i + 1 };
      } else cur.lines.push(raw);
    });
    if (cur.id !== null || cur.lines.some(l => l.trim())) sections.push(cur);
    for (const sec of sections) {
      const r = SP.parse(sec.lines.join('\n'));
      sec.commands = r.commands;
      for (const p of r.problems) problems.push({ line: p.line + sec.line, message: p.message, raw: p.raw, section: sec.id });
      delete sec.lines;
    }
    return { sections, problems };
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = KIT;
})(typeof window !== 'undefined' ? window : globalThis);
